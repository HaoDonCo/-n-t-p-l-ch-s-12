<script id="fallback-data" type="application/json">{"schemaVersion":2,"updatedAt":"2026-11-17","exams":[{"id":"SU-TONGHOP-1","subject":"history","title":"Tổng hợp Lịch sử 12 · Bài 1–5","description":"Ngân hàng từ đề cương 5 bài: 128 câu nhiều lựa chọn và 21 câu đúng/sai. Luyện đến khi đúng.","mode":"mastery","minutes":0,"mc":[{"q":"Nội dung nào sau đây là một trong những hoạt động nổi bật của Hiệp hội các quốc gia Đông Nam Á (ASEAN) trong giai đoạn 1967 – 1976?","options":["Phản đối Trật tự thế giới hai cực I-an-ta, ủng hộ xu thế đa cực.","Tập trung vào hợp tác trên lĩnh vực chính trị — an ninh.","Tích cực ủng hộ việc đấu tranh chống Mỹ xâm lược Việt Nam.","Tham gia vào giải quyết căng thẳng trên bán đảo Triều Tiên."],"key":"B"},{"q":"Tiêu diệt tận gốc chủ nghĩa phát xít Đức và chủ nghĩa quân phiệt Nhật Bản là một trong những nội dung của hội nghị nào?","options":["I-an-ta.","Pôt-xđam.","Tê-hê-ran.","Xan Phran-xi-xcô."],"key":"A"},{"q":"Một trong những thách thức về kinh tế mà Cộng đồng ASEAN phải đối mặt trong quá trình xây dựng và phát triển là","options":["sự đa dạng về chế độ chính trị.","những vấn đề lịch sử sâu xa.","chênh lệch trình độ phát triển.","sự xung đột lãnh thổ, biên giới."],"key":"C"},{"q":"Sự sụp đổ của chế độ xã hội chủ nghĩa ở Đông Âu và Liên Xô (1989 – 1991) đã tạo cho Mỹ lợi thế nào sau đây?","options":["Chi phối được các nước tư bản đồng minh đi theo Mỹ.","Tận dụng cơ hội để thiết lập trật tự giới đơn cực.","Đẩy mạnh việc triển khai chiến lược đa phương hoá.","Thực hiện thành công mục tiêu chiến lược toàn cầu."],"key":"B"},{"q":"Đâu không phải là một trong những trụ cột của Cộng đồng ASEAN?","options":["Cộng đồng Chính trị - An ninh.","Cộng đồng An ninh - Quốc phòng.","Cộng đồng Kinh tế.","Cộng đồng Văn hóa - Xã hội."],"key":"B"},{"q":"Đầu năm 1945, đâu là vấn đề cấp bách đặt ra cho các nước Đồng minh chống phát xít?","options":["Phân chia lại thuộc địa của các nước.","Tổ chức lại thế giới sau chiến tranh.","Thiết lập trật tự thế giới mới hai cực.","Phục hồi và phát triển kinh tế thế giới."],"key":"B"},{"q":"Nội dung nào sau đây không phải xu thế phát triển của thế giới sau Chiến tranh lạnh?","options":["Quốc tế hoá - toàn cầu hoá.","Đối thoại, hợp tác cùng phát triển.","Lấy phát triển kinh tế làm trung tâm.","Đa quốc gia, đa bản sắc văn hoá."],"key":"D"},{"q":"“Xây dựng một ASEAN lấy con người làm trung tâm và có trách nhiệm xã hội, nhằm xây dựng tình đoàn kết và thống nhất bền lâu giữa các quốc gia và dân tộc ASEAN bằng cách tạo dựng bản sắc chung, xây dựng một xã hội chia sẻ, đùm bọc, hoà thuận và rộng mở” là một trong những mục tiêu của","options":["Cộng đồng Kinh tế ASEAN.","Cộng đồng Văn hoá - Xã hội ASEAN.","Cộng đồng Hợp tác - Chia sẻ ASEAN.","Cộng đồng Chính trị - An ninh ASEAN."],"key":"B"},{"q":"Việt Nam gia nhập ASEAN vào thời gian nào sau đây?","options":["Năm 1995.","Năm 1996.","Năm 1997.","Năm 1998."],"key":"A"},{"q":"Năm 1997, hai quốc gia nào sau đây trở thành thành viên thứ 8,9 của ASEAN?","options":["Bru-nây và Việt Nam.","Thái Lan và Mi-an-ma.","Cam-pu-chia và Lào.","Lào và Mi-an-ma."],"key":"D"},{"q":"Những quyết định của Hội nghị Ianta trở thành khuôn khổ của trật tự thế giới mới","options":["Trật tự Vécxay - Oasinhtơn","Trật tự đa cực","Trật tự đơn cực","Trật tự 2 cực Ianta."],"key":"D"},{"q":"Sau khi thành lập, Cộng đồng ASEAN sẽ gặp phải một trong những thách thức nào sau đây trong quá trình hoạt động?","options":["Có khoảng cách địa lí giữa hai nhóm nước lục địa và hải đảo.","Nhiều nước vẫn chưa tham gia các diễn đàn lớn trên thế giới.","Chưa có chiến lược mở rộng quan hệ hợp tác ngoài khu vực.","Sự đa dạng chế độ chính trị và đường lối chiến lược ở mỗi nước."],"key":"D"},{"q":"Một trong những thành viên sáng lập Hiệp hội các quốc gia Đông Nam Á (ASEAN) là","options":["Mi-an-ma.","Lào.","Thái Lan.","Cam-pu-chia."],"key":"C"},{"q":"Trong giai đoạn từ năm 1945 đến đầu những năm 70 của thế kỉ XX, Trật tự thế giới hai cực I-an-ta có biểu hiện nào sau đây?","options":["Từ đối kháng chuyển sang đối đầu giữa hai hệ thống xã hội đối lập.","Xác lập và phát triển nhanh với sự đối đầu diễn ra trên nhiều lĩnh vực.","Phát triển mạnh và dẫn tới các cuộc chiến tranh cục bộ giữa Liên Xô – Mỹ.","Từ đối đầu căng thẳng chuyển sang hoà dịu và hoà hoãn Đông Tây."],"key":"B"},{"q":"Từ sau khi Chiến tranh lạnh kết thúc (1991), thế giới phát triển theo một trong những xu thế nào sau đây?","options":["Đa cực, nhiều trung tâm.","Thoả hiệp để ổn định toàn cầu.","Lấy chính trị làm nền tảng.","Hạn chế phổ biến vũ khí hạt nhân."],"key":"A"},{"q":"Những quyết định của Hội nghị I-an-ta cùng sự thoả thuận của Liên Xô, Mỹ và Anh ở Hội nghị Pốt-xđam (1945) đã trở thành khuôn khổ của một trật tự thế giới mới, vì","options":["các nước tham chiến được hưởng nhiều quyền lợi sau chiến tranh.","khép lại trật tự thế giới cũ và xác lập trật tự thế giới “hai cực” đối lập.","mở đầu quá trình giải thể chủ nghĩa thực dân mới ở các thuộc địa.","đã phân chia xong phạm vi ảnh hưởng giữa các nước thắng trận."],"key":"D"},{"q":"Nội dung nào sau đây là xu thế phát triển của thế giới sau Chiến tranh lạnh được nhân dân các nước hi vọng, mong muốn trở thành hiện thực?","options":["Đa cực, đa phe trong đối ngoại quốc tế.","Hoà bình, ổn định để cùng phát triển.","Liên kết và hội nhập giữa các nước lớn.","Phát triển kinh tế, quân sự là trung tâm."],"key":"B"},{"q":"ASEAN chính thức khẳng định ý tưởng thành lập Cộng đồng ASEAN tại Hội nghị nào sau đây?","options":["Hội nghị cấp cao ASEAN lần thứ 13 tại Xin-ga-po (2007).","Hội nghị cấp cao ASEAN lần thứ nhất tại In-đô-nê-xi-a (1976).","Hội nghị cấp cao ASEAN không chính thức ở Ma-lai-xi-a (1997).","Hội nghị cấp cao ASEAN lần thứ 16 tại Hà Nội (2010)."],"key":"C"},{"q":"Nhằm duy trì hoà bình và an ninh thế giới sau chiến tranh, Hội nghị I-an-ta (2-1945) có quyết định quan trọng nào sau đây?","options":["Thành lập Ban Thư kí Liên hợp quốc.","Thành lập tổ chức Liên hợp quốc.","Thành lập tổ chức Hội Quốc liên.","Duy trì và mở rộng Hội Quốc liên."],"key":"B"},{"q":"Kế hoạch Mác-san (1947) của Mỹ và Hội đồng tương trợ kinh tế (SEV) do Liên Xô và các nước Đông Âu thành lập (1949) là một trong những biểu hiện về sự đổi đầu của hai cực thế giới I-an-ta trên lĩnh vực","options":["quân sự.","văn hoá.","pháp lí.","kinh tế."],"key":"D"},{"q":"Nhân tố nào sau đây đóng vai trò quyết định để các cường quốc tham gia xác lập trật tự thế giới mới sau Chiến tranh lạnh?","options":["Sức mạnh tổng hợp của quốc gia, trong đó kinh tế vẫn là trụ cột.","Là 1 trong 5 cường quốc của Hội đồng Bảo an Liên hợp quốc.","Sự ra đời và ngày càng mở rộng của các tổ chức liên kết khu vực.","Sức mạnh quân sự của quốc gia với lực lượng quân sự hùng hậu."],"key":"A"},{"q":"Theo quyết định của các cường quốc tại Hội nghị I-an-ta (2-1945), vùng ảnh hưởng của Liên Xô ở châu Á sẽ là","options":["phía bắc vĩ tuyến 38 trên bán đảo Triều Tiên.","phía nam vĩ tuyến 38 trên bán đảo Triều Tiên.","khu vực Tây Á, Nam Á và Đông Nam Á.","khu vực Trung Đông và bán đảo Triều Tiên."],"key":"A"},{"q":"Bước sang thế kỉ XXI, xu thế chung của thế giới là","options":["hòa bình, hợp tác và phát triển.","hoà hoãn và hoà dịu trong quan hệ quốc tế","cùng tồn tại trong hoà bình, các bên cùng có lợi.","hoà nhập nhưng không hoà tan."],"key":"A"},{"q":"Từ cuối tháng 4 đến cuối tháng 6-1945, 50 nước họp tại Xan Phran-xi-xcô (Mỹ) thông qua nội dung nào sau đây?","options":["Hiệp định đình chiến ở Đông Dương.","Kết thúc chiến tranh Triều Tiên.","Xét xử tội phạm chiến tranh thế giới.","Hiến chương Liên hợp quốc."],"key":"D"},{"q":"Một trong những thách thức về kinh tế mà Cộng đồng ASEAN phải đối mặt trong quá trình xây dựng và phát triển là","options":["sự đa dạng về chế độ chính trị.","những vấn đề lịch sử sâu xa.","chênh lệch trình độ phát triển.","sự xung đột lãnh thổ, biên giới."],"key":"C"},{"q":"Ý tưởng về xây dựng Cộng đồng ASEAN được khởi nguồn từ khi","options":["các nước ASEAN kí kết Hiệp ước Ba-li (1976).","thành lập tổ chức ASEAN (1967) tại Thái Lan.","tổ chức ASE "C"},{"q":"Nội dung nào sau đây là bối cảnh lịch sử thành lập ASEAN?","options":["Xu thế khu vực hoá đã xuất hiện và ngày càng phát triển mạnh mẽ.","Nhiều nước Đông Nam Á đã vươn lên trở thành “con rồng” kinh tế.","Xu thế toàn cầu hoá đã xuất hiện và ngày càng phát triển mạnh mẽ.","Liên Xô và các nước đã tuyên bố chấm dứt cuộc Chiến tranh lạnh."],"key":"A"},{"q":"Xây dựng Cộng đồng ASEAN, định hướng cho sự phát triển trong tương lai của ASEAN là một trong những nội dung quan trọng của văn kiện nào sau đây?","options":["Tuyên bố Cua-la Lăm-pơ (1971).","Tuyên bố Băng Cốc (1967).","Hiến chương ASEAN (2007).","Tầm nhìn ASEAN 2020."],"key":"D"},{"q":"Cộng đồng Chính trị - An ninh ASEAN hoạt động dựa trên cơ sở nào sau đây?","options":["Đồng thuận xây dựng một khối phòng thủ chung.","Hạn chế sử dụng vũ lực trong cộng đồng.","Tôn trọng các nguyên tắc cơ bản của ASEAN.","Thực thi các quyết định dựa trên đa số tán thành."],"key":"C"},{"q":"“Toàn bộ Đông Nam Á sẽ là một cộng đồng ASEAN, nhận thức được các mối liên hệ lịch sử của mình, hiểu rõ di sản văn hoá của mình và gắn bó với nhau bằng một bản sắc chung của khu vực” là một trong những nội dung quan trọng của văn kiện nào sau đây?","options":["Tầm nhìn ASEAN 2020.","Hiệp ước Ba-li.","Tuyên bố về sự hoà hợp ASEAN.","Tuyên bố Băng Cốc."],"key":"A"},{"q":"Trong giai đoạn 1967 – 1976,ASEAN coi trọng vấn đề chính trị – an ninh vì một trong những lí do nào sau đây?","options":["Mỹ bắt đầu có những hành động can thiệp, dính líu vào Đông Dương.","Cuộc Chiến tranh lạnh đã và đang tác động sâu sắc đến nhiều nước.","Xu thế toàn cầu hoá xuất hiện và có những bước phát triển mạnh mẽ.","Việc lập lại hoà bình ở Cam-pu-chia trở thành tâm điểm của khu vực."],"key":"B"},{"q":"Về hoạt động, Cộng đồng Văn hoá - Xã hội ASEAN không có nội dung nào sau đây?","options":["Thúc đẩy hoà bình, hợp tác khu vực.","Phúc lợi và bảo hiểm xã hội.","Bảo đảm môi trường bền vững.","Bảo đảm các quyền công bằng xã hội."],"key":"A"},{"q":"Từ đầu những năm 70 của thế kỉ XX, quan hệ Mỹ – Liên Xô chuyển dần sang hòa dịu, sau đó kết thúc Chiến tranh lạnh (1989) là do","options":["chịu nhiều tốn kém và bị suy giảm thế mạnh về nhiều mặt.","xu thế liên kết khu vực và toàn cầu hoá diễn ra mạnh mẽ.","quá trình mở rộng không ngừng của Liên minh châu Âu (EU).","trật tự nhất siêu, nhiều cường đang trong quá trình mở rộng."],"key":"A"},{"q":"“Xây dựng một môi trường hoà bình và an ninh cho phát triển ở khu vực Đông Nam Á” là một trong những mục tiêu của","options":["Cộng đồng Kinh tế - Tài chính ASEAN.","Cộng đồng Văn hoá - Xã hội ASEAN.","Cộng đồng Văn hoá - Thể thao ASEAN.","Cộng đồng Chính trị - An ninh ASEAN."],"key":"D"},{"q":"Một trật tự thế giới mà ở đó các nước lớn, các trung tâm kinh tế – tài chính lớn như Mỹ, Nhật Bản, Trung Quốc, Ấn Độ, Liên bang Nga, ... có vị thế đối với quan hệ quốc tế được gọi là trật tự","options":["đa cực, nhiều trung tâm.","đơn cực, nhất siêu.","đa phương hoá","tam cường, đa phương."],"key":"A"},{"q":"Quốc gia đứng đầu khối tư bản chủ nghĩa sau Chiến tranh thế giới thứ hai (1945) là","options":["Anh.","Pháp.","Mỹ.","Đức."],"key":"C"},{"q":"Nội dung nào sau đây là một trong những hoạt động nổi bật của Hiệp hội các quốc gia Đông Nam Á (ASEAN) trong giai đoạn 1976 – 1999?","options":["Phát triển số lượng thành viên, từ 5 nước lên 10 nước.","Hợp tác hiệu quả trong hoạt động chống chủ nghĩa khủng bố.","Bước đầu phát triển về cơ cấu tổ chức, nguyên tắc hoạt động.","Các nước tập trung hợp tác trên lĩnh vực chính trị — an ninh."],"key":"A"},{"q":"Năm 1999, quốc gia nào sau đây trở thành thành viên thứ 10 của ASEAN?","options":["Bru-nây.","Mi-an-ma.","Cam-pu-chia.","Lào."],"key":"C"},{"q":"Trong bối cảnh quốc tế đang diễn ra theo nhiều xu thế mới với những diễn biến phức tạp, chủ trương nhất quán của Đảng và Nhà nước Việt Nam là","options":["tham gia liên minh chính trị với Mỹ và các nước phương Tây.","chủ động kết nối các cường quốc để nâng tầm đối tác chiến lược.","hội nhập quốc tế để thu hút vốn đầu tư bên ngoài bằng mọi giá.","chủ động nắm bắt thời cơ, đi tắt đón đầu để vượt qua thách thức."],"key":"D"},{"q":"Một trong những cơ quan chính của Liên hợp quốc được quy định trong Hiến chương Liên hợp quốc (năm 1945) là","options":["Ngân hàng Thế giới.","Quỹ Nhi đồng Liên Hợp quốc.","Hội đồng Bảo an.","Tổ chức Thương mại Thế giới."],"key":"C"},{"q":"Ba nước Đông Dương và Mi-an-ma gia nhập ASEAN trong bối cảnh nào sau đây?","options":["Chủ nghĩa xã hội trở thành hệ thống thế giới.","Bán đảo Triều Tiên được thống nhất trở lại.","Xu thế toàn cầu hoá đang diễn ra mạnh mẽ.","Xu thế hoà hoãn Đông – Tây đang diễn ra."],"key":"C"},{"q":"Nội dung nào sau đây là một trong những trụ cột của Cộng đồng ASEAN?","options":["Cộng đồng Công nghệ ASEAN.","Cộng đồng Quốc phòng ASEAN.","Cộng đồng An ninh ASEAN.","Cộng đồng Kinh tế ASEAN."],"key":"D"},{"q":"Theo thoả thuận của các cường quốc tại Hội nghị I-an-ta (2-1945), địa bàn nào sau đây ở châu Âu sẽ thuộc phạm vi ảnh hưởng của Mỹ?","options":["Béc-lin.","Đông Đức.","Đông Âu.","Tây Âu."],"key":"D"},{"q":"Văn kiện Tầm nhìn ASEAN 2020 đề xuất ý tưởng xây dựng một Cộng đồng ASEAN không có đặc điểm nào sau đây?","options":["Tăng cường hợp tác giữa các nước trong tổ chức và bên ngoài, trọng tâm là hợp tác với EU.","Có nhận thức về các mối quan hệ lịch sử, gắn bó với nhau trong một bản sắc khu vực chung.","Xây dựng lực lượng quân đội khu vực để bảo vệ hoà bình chung cho việc phát triển lâu bền.","Tăng cường ảnh hưởng của Hiệp hội các quốc gia Đông Nam Á ở khu vực và liên khu vực."],"key":"A"},{"q":"Năm 1999, quốc gia nào sau đây được kết nạp, trở thành thành viên thứ 10 của Hiệp hội các quốc gia Đông Nam Á (ASEAN)?","options":["Bru-nây.","Mi-an-ma.","Cam-pu-chia.","Malaixia."],"key":"C"},{"q":"Nội dung nào sau đây là một trong những mục tiêu xây dựng Cộng đồng ASEAN?","options":["Thúc đẩy ASEAN mở rộng hợp tác với bên ngoài.","Tạo điều kiện để ASEAN tập trung hợp tác nội khối.","Đưa tốc độ tăng trưởng của ASEAN cao nhất thế giới.","Đưa ASEAN trở thành một tổ chức nhất thể hoá khu vực."],"key":"A"},{"q":"Quan hệ Mỹ - Liên Xô trong và sau Chiến tranh thế giới thứ hai đã chuyển biến từ","options":["đối đầu sang đối thoại.","đối đầu sang thoả hiệp.","đồng minh sang đối đầu.","đồng minh sang đối tác."],"key":"C"}],"tf":[{"passage":"Trong xu thế đa cực, nhiều trung tâm, Mỹ và Trung Quốc là hai cực có tầm ảnh hưởng lớn đến nền kinh tế thế giới: Mỹ vẫn duy trì vị trí cường quốc số 1 thế giới; từ năm 2010, Trung Quốc đã vượt qua Anh, Pháp, Đức, Nhật Bản để trở thành nền kinh tế thứ hai thể giới. Tuy nhiên, các nước lớn và trung tâm kinh tế, tài chính khác (Nhật Bản, Liên minh châu Âu, Liên bang Nga, Ấn Độ,...) cũng đang nỗ lực vươn lên mạnh mẽ; quốc gia nào cũng muốn khẳng định vị thế, vai trò của mình trong quan hệ quốc tế.","claims":[{"t":"a. Trong trật tự thế giới đa cực, nhiều trung tâm, Mỹ và Trung Quốc là những nước đang có vị thế, ảnh hưởng hàng đầu thế giới.","key":true},{"t":"b. Trật tự thế giới hai cực I-an-ta sụp đổ là nguyên nhân trực tiếp, tạo cơ hội cho Trung Quốc vươn lên trở thành nền kinh tế lớn thứ hai thế giới.","key":false},{"t":"c. Phát huy thành công sức mạnh nội lực là yếu tố quyết định để các nước khẳng định trong xu thế đa cực, nhiều trung tâm.","key":true},{"t":"d. Trong xu thế đa cực và xu thế toàn cầu hoá, các quốc gia có nhiều thời cơ lớn, nhưng lại cũng có không ít thách thức và rào cản.","key":true}]},{"passage":"“Vào thập niên 1980, mối quan hệ nồng ấm giữa Tổng thống Mỹ Ri-gân và nhà lãnh đạo Liên Xô Goóc-ba chớp đã giúp giảm dần tình trạng căng thẳng của CTL. Năm 1987, hai nhà lãnh đạo đã đồng ý huỷ bỏ tên lửa hạt nhân tầm trung. Năm 1989. Goóc-ba chấp cho phép các quốc gia XHCN ở Đông Âu bầu ra chính phủ dân chủ, và đến năm 1991, Liên Xô tan rã thành 15 nước cộng hoà độc lập. Ngày 12-3-1999 Hung-ga-ri, Ba Lan và Cộng hoà Séc gia nhập khối NATO”.\n(King Fisher, Bách khoa thư lịch sử (Nguyễn Đức Tĩnh và Ngô Minh Châu dịch), NXB Thế giới, Hà Nội, 2016, tr.437","claims":[{"t":"a. Trật tự thế giới hai cực I-an-ta bắt đầu bị xói mòn và sụp đổ trong thập niên 1980.","key":false},{"t":"b. Chiến tranh lạnh kết thúc và Trật tự thế giới hai cực I-an-ta sụp đổ bắt nguồn từ những nguyên nhân khác nhau, nhưng yếu tố Mỹ và Liên Xô vẫn là quyết định.","key":true},{"t":"c. Cuộc Chiến tranh lạnh đã kết thúc và Trật tự thế giới hai cực I-an-ta đã sụp đổ, nhưng nhiều di chứng của nó vẫn còn và vẫn đang tiếp diễn ở nhiều nơi trên thế giới.","key":true},{"t":"d. Việc Liên Xô tan rã (1991) đã chính thức chấm dứt cục diện hai cực, hai phe.","key":false}]},{"passage":"[Đối với việc thúc đẩy quá trình phi thực dân hoá trên thế giới, năm 1960] “Đại hội đồng Liên hợp quốc đã thông qua bản Tuyển ngôn về thủ tiêu hoàn toàn chủ nghĩa thực dân, trao trả độc lập cho các quốc gia và dân tộc thuộc địa... Như thế, Tuyên ngôn đã khẳng định các nước thực dân đã vi phạm nguyên tắc quan trọng nhất của luật pháp quốc tế; khẳng định rõ ràng cơ sở pháp lí quốc tế của cuộc đấu tranh giành độc lập của các dân tộc bị áp bức”.\n(Nguyễn Quốc Hùng, Nguyễn Hồng Quân, Liên hợp quốc và Lực lượng gìn giữ hoà bình Liên hợp quốc, NXB Chính trị quốc gia, Hà Nội, 2008, tr.46)","claims":[{"t":"a. Liên hợp quốc đóng vai trò quyết định vào quá trình giải trừ chủ nghĩa thực dân.","key":false},{"t":"b. Việt Nam trở thành biểu tượng thúc đẩy quá trình phi thực dân hoá trên thế giới.","key":true},{"t":"c. Mỹ và các nước phương Tây là những quốc gia dân chủ và tiên tiến, đi tiên phong trong việc ủng hộ thúc đẩy quá trình phi thực dân hoá trên thế giới.","key":false},{"t":"d. Cuộc đấu tranh xóa bỏ thuộc địa do các nước đế quốc lập ra trước Chiến tranh thế thứ hai ở châu Á, châu Phi và Mỹ La-tinh được gọi là quá trình phi thực dân hoá.","key":true}]},{"passage":"“Tháng 3-1947, Tổng thống Mỹ - Tơ-ru-man đã đọc diễn văn trước Quốc hội Mỹ, chính thức đưa ra chủ nghĩa Tơruman. Theo Tơ-ru-man thì các nước Đông Âu vừa mới bị cộng sản thôn tính và những đe dọa tương tự đang diễn ra trên nhiều nước khác ở châu Âu, ở I-ta-li-a, Pháp và cả nước Đức nữa. Vì vậy, Mỹ phải đứng ra đảm nhận sứ mệnh lãnh đạo thế giới tự do, phải giúp đỡ cho các dân tộc trên thế giới chống lại sự đe dọa của chủ nghĩa cộng sản, chống lại sự bành trướng của nước Nga, giúp đỡ bằng mọi biện pháp kinh tế, quân sự. Tổng thống Mỹ Tơ-ru-man đã phát động cuộc chiến tranh lạnh chống Liên Xô và các nước xã hội chủ nghĩa.”\n(Nguyễn Anh Thái, Lịch sử thế giới hiện đại (1917-1995), NXB Giáo dục, tr. 235).","claims":[{"t":"a) Chiến tranh lạnh là cuộc đối đầu trực tiếp giữa Mĩ và các nước trên thế giới.","key":false},{"t":"b) Thông điệp của Tổng thống Mỹ Tơ-ru-man tại Quốc hội Mỹ (1947) được xem là khởi đầu cho cuộc Chiến tranh lạnh.","key":true},{"t":"c) Trong thời kì Chiến tranh lạnh, các cuộc “chiến tranh ủy nhiệm” đã để lại hậu quả nặng nề đối với nhiều quốc gia.","key":true},{"t":"d) Cuộc chiến tranh xâm lược của Pháp và Mĩ ở Việt Nam (1945 – 1975) biến Việt Nam trở thành tâm điểm lớn nhất trong Chiến tranh lạnh.","key":false}]},{"passage":"“Trật tự thế giới mới này được hình thành như thế nào, còn tùy thuộc ở nhiều nhân tố: Sự phát triển về thực lực kinh tế, chính trị, quân sự của các cường quốc Mỹ, Nga, Trung Quốc, Anh, Pháp, Nhật Bản, Đức trong cuộc chạy đua về sức mạnh quốc gia tổng hợp... Sự lớn mạnh của lực lượng cách mạng thế giới (sự thành bại của công cuộc cải cách, đổi mới ở các nước xã hội chủ nghĩa,...); Sự phát triển của cách mạng khoa học – kĩ thuật sẽ còn tiếp tục tạo ra những “đột phá” và biến chuyển trên cục diện thế giới”.\n(Nguyễn Anh Thái (Chủ biên), Lịch sử thế giới hiện đại, NXB Giáo dục Việt Nam, Hà Nội, 2021, tr.424)","claims":[{"t":"a. Đoạn tư liệu là minh chứng cho xu thế đa cực, nhiều trung tâm trong quan hệ quốc tế trong thời gian diễn ra cuộc Chiến tranh lạnh.","key":false},{"t":"b. Trong quan hệ quốc tế, khái niệm đa cực chỉ trạng thái địa – chính trị toàn cầu với ba trung tâm quyền lực chi phối là Mỹ, Liên bang Nga và Trung Quốc.","key":false},{"t":"c. Khái niệm đa cực được dùng chủ yếu để chỉ trật tự thế giới sau Chiến tranh lạnh.","key":true},{"t":"d. Để có thể trở thành một cực trong xu thế đa cực, nhiều trung tâm, các nước phải có chiến lược xây dựng sức mạnh tổng hợp, trong đó sức mạnh kinh tế là trụ cột.","key":true}]},{"passage":"“Toàn bộ Đông Nam Á sẽ là một cộng đồng ASEAN, nhận thức được các mối liên hệ lịch sử của mình, hiểu rõ di sản văn hoá của mình và gắn bó với nhau bằng một bản sắc chung của khu vực”.\n(Nguồn: Cổng Thông tin ASEAN – Việt Nam)","claims":[{"t":"a. Đoạn tư liệu là một phần nội dung được đề cập trong văn kiện Tầm nhìn ASEAN 2020.","key":true},{"t":"b. Việc thành lập Cộng đồng ASEAN đã tăng cường sự hợp tác giữa các nước ASEAN, đưa tổ chức này phát triển lên một nấc thang mới.","key":true},{"t":"c. Cộng đồng ASEAN ra đời không có mối liên hệ với Hiệp hội các quốc gia Đông Nam Á.","key":false},{"t":"d. Sự ra đời của Cộng đồng ASEAN là một trong những biểu hiện của xu thế toàn cầu hoá.","key":true}]},{"passage":"Hiệp ước thân thiện và hợp tác (Hiệp ước Ba-li) được Hiệp hội các quốc gia Đông Nam Á (ASEAN) thông qua tại Ba-li (In-đô-nê-xi-a, tháng 2-1976), đã đặt khuôn khổ cho một nền hoà bình lâu dài ở khu vực, dựa trên cơ sở tôn trọng độc lập, chủ quyền của nhau; không can thiệp vào nội bộ của nhau; giải quyết các tranh chấp trong khu vực bằng biện pháp hoà bình; kêu gọi các nước hợp tác có hiệu quả trên các lĩnh vực nông – công nghiệp, thương mại,... vì lợi ích chung của các nước trong khu vực.","claims":[{"t":"a. Hiệp ước Ba-li (1976) đã xác định được những nguyên tắc cơ bản trong quan hệ giữa các nước trong khu vực Đông Nam Á.","key":true},{"t":"b. Hiệp ước Ba-li đã mở ra một bước phát triển mới của Hiệp hội các quốc gia Đông Nam Á (ASEAN).","key":true},{"t":"c. Nội dung cơ bản của Hiệp ước Ba-li được xây dựng trên nguyên tắc hoạt động của Liên hợp quốc, trong đó coi trọng vấn đề an ninh – chính trị của khu vực Đông Nam Á.","key":true},{"t":"d. Hiệp hội các quốc gia Đông Nam Á (ASEAN) thông qua Hiệp ước Ba-li (1976) với mục tiêu hàng đầu là kết nối và kết nạp các nước trong khu vực vào tổ chức ASEAN.","key":false}]},{"passage":"“Cộng đồng ASEAN sẽ được thành lập gồm ba trụ cột là hợp tác chính trị và an ninh, hợp tác kinh tế và hợp tác văn hoá - xã hội được gắn kết chặt chẽ và cùng tăng cường cho mục đích đảm bảo hoà bình, ổn định lâu dài và cùng thịnh vượng trong khu vực”.\n(Trích: Thỏa ước Ba-li II (2003), Nguồn: Bộ Ngoại giao)","claims":[{"t":"a. Theo nội dung tư liệu, Cộng đồng ASEAN ra đời và hoạt động dựa trên ba trụ cột nhằm tăng cường sự hợp tác, gắn kết giữa các nước trong khu vực.","key":true},{"t":"b. Trong ba trụ cột của Cộng đồng ASEAN, trụ cột về văn hoá – xã hội được các thành viên xác định là quan trọng nhất.","key":false},{"t":"c. Một trong những mục tiêu thành lập Cộng đồng ASEAN là hướng tới duy trì hoà bình ổn định của khu vực Đông Nam Á.","key":true},{"t":"d. Ba trụ cột của Cộng đồng ASEAN được thành lập phản ánh quy luật tất yếu của sự hợp tác giữa các nước trong xu thế hoà hoãn Đông – Tây.","key":false}]},{"passage":"Trong quá trình tìm kiếm sự hợp tác giữa các nước Đông Nam Á đã xuất hiện những tổ chức khu vực và kí các hiệp ước giữa các nước trong khu vực. Tháng 1-1959, Hiệp ước hữu nghị và kinh tế Đông Nam Á (SAFET) bao gồm Ma-lai-xi-a và Phi-lip-pin ra đời. Tháng 7-1961, Hội Đông Nam Á (ASA) gồm Ma-lai-xi-a, Phi-lip-pin và Thái Lan được thành lập. Tháng 8-1963, một tổ chức gồm Ma-lai-xi-a, Phi-lip-pin, In-đô-nê-xi-a (MAPHILINDO) được thành lập. Tuy nhiên, những tổ chức trên đây không tồn tại được lâu do sự bất đồng giữa các nước về vấn đề lãnh thổ và chủ quyền”.\n(Nguyễn Anh Thái (Chủ biên), Lịch sử thế giới hiện đại, NXB Giáo dục, Hà Nội, 1998, tr.358)","claims":[{"t":"a. Ma-lai-xi-a, Phi-lip-pin, Thái Lan, In-đô-nê-xi-a là những quốc gia sớm có ý tưởng về việc thành lập một tổ chức khu vực ở Đông Nam Á.","key":true},{"t":"b. Yếu tố quyết định để thành lập và mở rộng Hiệp hội các quốc gia Đông Nam Á (ASEAN) là các nước phải tôn trọng độc lập, chủ quyền và lãnh thổ của nhau.","key":true},{"t":"c. Các tổ chức tiền thân của Hiệp hội các quốc gia Đông Nam Á (ASEAN) không tồn tại lâu là do không thống nhất được giá cả và thị trường tiêu thụ hàng hoá.","key":false},{"t":"d. Trong bối cảnh khu vực và quốc tế có nhiều biến động, yêu cầu hợp tác để phát triển giữa các nước trong khu vực Đông Nam Á là yêu cầu tất yếu. cùng","key":true}]},{"passage":"“Thúc đẩy sự tăng trưởng kinh tế, tiến bộ xã hội và phát triển văn hoá trong khu vực thông qua những nỗ lực hợp tác chung trên tinh thần bình đẳng và hợp tác nhằm tăng cường cơ sở cho một cộng đồng các nước Đông Nam Á hoà bình và thịnh vượng.\nThúc đẩy hoà bình ổn định khu vực bằng việc tôn trọng pháp lí và nguyên tắc luật pháp trong quan hệ giữa các nước trong khu vực và tuân thủ các nguyên tắc của Hiến chương Liên hợp quốc.\nThúc đẩy sự cộng tác tích cực và giúp đỡ lẫn nhau trong các vấn đề cùng quan tâm trên các lĩnh vực kinh tế, xã hội, văn hoá, khoa học – kĩ thuật và hành chính”.\n(Nguyễn Anh Thái (Chủ biên), Lịch sử thế giới hiện đại, NXB Giáo dục, Hà Nội, 1998, tr.358)","claims":[{"t":"a. Hiệp hội các quốc gia Đông Nam Á (ASEAN) ra đời năm 1967 là một tổ chức liên thiết giữa  minh chính trị – kinh tế của khu vực, nằm trong Cộng đồng ASEAN.","key":false},{"t":"b. Nguyên tắc hoạt động của Hiệp hội các quốc gia Đông Nam Á (ASEAN) có những điểm tương đồng với nguyên tắc hoạt động của Liên hợp quốc.","key":true},{"t":"c. Một trong những mục đích thành lập của Hiệp hội các quốc gia Đông Nam Á (ASEAN) là duy trì hoà bình ổn định của khu vực.","key":true},{"t":"d. Ngay từ khi ra đời, Hiệp hội các quốc gia Đông Nam Á (ASEAN) đã hướng đến xây dựng một cộng đồng vì hoà bình và thịnh vượng.","key":true}]},{"passage":"“Trong lĩnh vực giáo dục và đào tạo, ASEAN khuyến khích phát triển giáo dục suốt đời, sử dụng công nghệ thông tin và truyền thông (ICT) như những phương tiện thúc đẩy nền giáo dục ASEAN và nâng cao nhận thức về ASEAN. Các dự án khác nhau dành cho các cấp học ở phổ thông và đại học cũng cần được thực hiện nhằm phát triển và nâng cao chất lượng nguồn nhân lực cho các nước thành viên, đặc biệt là nguồn nhân lực trẻ, khẳng định vai trò tiên phong của thanh niên trong việc tham gia xây dựng Cộng đồng ASEAN”.\n(Lương Ninh, Đông Nam Á Lịch sử từ nguyên thủy đến ngày nay, NXB Chính trị quốc gia, Hà Nội, 2015, tr.932)","claims":[{"t":"a. . Nguồn nhân lực trẻ đóng vai trò quyết định hàng đầu trong việc tham gia xây dựng Cộng đồng ASEAN.","key":false},{"t":"b. . ASEAN khuyến khích phát triển giáo dục suốt đời nhằm thúc đẩy nền giáo dục ASEAN và nâng cao nhận thức về ASEAN.","key":true},{"t":"c. . Phát triển và nâng cao chất lượng nguồn nhân lực, ngoài việc nâng cao thể chất, về thực chất là phát triển giáo dục, đào tạo.","key":true},{"t":"d. . Phương tiện thúc đẩy nền giáo dục ASEAN là sử dụng công nghệ thông tin và trí tuệ nhân tạo (AI).","key":false}]},{"passage":"“Trước kia, chế độ quân chủ tại Hy Lạp đã nhờ vào sự giúp đỡ của Anh, nhưng sau Chiến tranh thế giới thứ hai, kinh tế của nước Anh hoàn toàn suy kiệt, lo cho mình còn không xong, nên không thể giúp đỡ gì cho chế độ quân chủ ở Hy Lạp nữa.\nVào ngày 12-3-1947, Tổng thống Tơ-ru-man đã đọc một bài diễn văn tại lưỡng viện Quốc hội Mỹ, cho rằng Hy Lạp và Thổ Nhĩ Kỳ nếu bị rơi vào khối xã hội chủ nghĩa, thì cả Trung Đông cũng sẽ rơi theo... sẽ làm cho cả Tây Âu bị ảnh hưởng. Do vậy, ông thuyết phục Quốc hội Mỹ chi viện kinh tế và quân sự cho Hy Lạp và Thổ Nhĩ Kỳ với số tiền 400 triệu đô la. Li luận này về sau được gọi là “Học thuyết Tơ-ru-man””.\n(Vương Kính Chi, Lược sử nước Mỹ (Phong Đảo dịch), NXB Thành phố Hồ Chí Minh, Thành phố Hồ Chí Minh, 2000, tr.145)","claims":[{"t":"a. Chiến tranh lạnh là cuộc đối đầu gay gắt giữa Mỹ và Liên Xô, chỉ diễn ra ở châu Âu.","key":false},{"t":"b. Thông điệp của Tổng thống Mỹ Tơ-ru-man đọc trước Quốc hội Mỹ ngày 12-3-1947 Tin đã khởi đầu cuộc Chiến tranh lạnh chống lại Liên Xô và các nước Đông Âu.","key":true},{"t":"c. Nguồn gốc của sự đối đầu căng thẳng giữa Mỹ và Liên Xô xuất phát từ “vấn đề Hy Lạp và Thổ Nhĩ Kỳ” sau Chiến tranh thế giới thứ hai.","key":false},{"t":"d. Học thuyết Tơ-ru-man phản ánh chính sách đối ngoại của Mỹ sau Chiến tranh thế giới thứ hai, muốn đưa nước Mỹ trở thành bá chủ thế giới.","key":true}]},{"passage":"“Các nguyên tắc hoạt động của Liên hợp quốc bao gồm: Bình đẳng về chủ quyền quốc gia; Tôn trọng toàn vẹn lãnh thổ và độc lập chính trị quốc gia; Từ bỏ đe dọa bằng vũ lực hoặc sử dụng vũ lực trong quan hệ quốc tế; Không can thiệp vào công việc nội bộ các nước; Tôn trọng nghĩa vụ quốc tế và luật pháp quốc tế; Giải quyết các tranh chấp quốc tế bằng biện pháp hòa bình”.\n(Trích SGKLS lớp 12 trang 9 – Bộ KNTN, NXB GDVN năm 2024)","claims":[{"t":"a) Hòa bình là ưu tiên hàng đầu trong giải quyết mâu thuẫn giữa các nước.","key":true},{"t":"b) Cho phép các nước lớn được can thiệp vào các nước nhỏ.","key":false},{"t":"c) Theo nguyên tắc Liên Hợp Quốc, việc sử dụng vũ lực là cần thiết trong quan hệ quốc tế.","key":false},{"t":"d) Tất cả các nước thành viên của Liên hợp quốc phải tuân theo một thể chế nhà nước.","key":false}]},{"passage":"“Bài học của thời kì Chiến tranh lạnh đã chứng tỏ phương thức quan hệ quốc tế lấy đối đầu chính trị - quân sự là chủ yếu không còn phù hợp, phải chịu nhiều tổn thất hoặc thất bại như hai nước Xô – Mỹ và một bị thương, một bị mất. Trong khi đó, phương thức lấy hợp tác và cạnh tranh về kinh tế - chính trị là chính lại thu được nhiều tiến bộ, kết quả như các nước Đức, Nhật và NICs. Sự hưng thịnh hay suy vong của một quốc gia quyết định bởi sức mạnh tổng hợp của quốc gia đó, mà chủ yếu là thực lực kinh tế và khoa học – kĩ thuật”.\n(Vũ Dương Ninh (Chủ biên), Một số chuyên đề lịch sử thế giới, NXB Đại học Quốc gia, Hà Nội, 2001, tr.401)","claims":[{"t":"a. . Trong  thời kì chiến tranh lạnh, Xô – Mỹ lấy đối đầu về chính trị - quân sự là chủ yếu, Đức và Nhật Bản lấy hợp tác và cạnh tranh về kinh tế - chính trị là chủ yếu.","key":true},{"t":"b. . Trong thời kì chiến tranh lạnh và sau thời kì chiến tranh lạnh, nội dung của quan hệ quốc tế có sự điều chỉnh từ lấy yếu tố quân sự sang lấy yếu tố kinh tế là trọng tâm.","key":true},{"t":"c. . Một trong những bài học rút ra từ thời kì chiến tranh lạnh cho tất cả các quốc gia là không nên tập trung vào phát triển quân sự, quốc phòng đất nước.","key":false},{"t":"d. . Kinh tế và khoa học – kĩ thuật là hai yếu tố chủ yếu tạo nên sức mạnh tổng hợp của một quốc gia sau khi chiến tranh lạnh chấm dứt.","key":true}]},{"passage":"Ở Châu Á, chiến tranh Triều Tiên (1950 - 1953), chiến tranh xâm lược Việt Nam của thực dân Pháp (1945 - 1954) và chiến tranh xâm lược Việt Nam của đế quốc Mỹ (1954- 1975), là những cuộc chiến tranh cục bộ tiêu biểu. Ở khu vực Trung Đông, chiến tranh Trung Đông giữa I-xra-en và các nước Ả-rập bất đầu từ năm 1948 và kéo dài trong nhiều năm.\n(Sách giáo khoa Lịch sử 12 – KNTT – tr.15)","claims":[{"t":"a. . Chiến tranh Triều Tiên (1950 -1953) là cuộc chiến tranh cục bộ, có sự can thiệp của Mỹ và Liên Xô.","key":true},{"t":"b. . Chiến tranh xâm lược Việt Nam của thực dân Pháp (1945 - 1954) và của đế quốc Mỹ (1954- 1975) là sản phẩm của chiến tranh lạnh.","key":true},{"t":"c. . Chiến tranh Trung Đông giữa I-xra-en và các nước Ả-rập là cuộc xung đột tôn giáo lớn giữa đạo Thiên chúa với đạo Hồi.","key":false},{"t":"d. . Các cuộc chiến tranh Đông Dương (1945-1954), chiến tranh Triều Tiên(1950-1953) chứng tỏ Châu Á là tâm điểm đối đầu giữa 2 cực Xô - Mỹ.","key":true}]},{"passage":"Tháng 6-1941, tại Luân Đôn (Anh), các nước Đồng minh ra tuyên bố cam kết cùng hợp tác cả trong chiến tranh và hoà bình. Sự kiện này đã đặt cơ sở cho việc hướng tới thành lập Liên hợp quốc. Từ đó, các nước Đồng minh (vai trò lớn nhất thuộc về Liên Xô, Mỹ và Anh) đã tổ chức nhiều cuộc họp ở Tê-hê-ran (I-ran) và Mát-xcơ-va (Liên Xô) để sớm thành lập một tổ chức quốc tế, nhằm thực hiện việc duy trì hoà bình và an ninh thế giới.\nTại Hội nghị I-an-ta (2-1945), Liên Xô, Mỹ và Anh đã thống nhất thành lập tổ chức Liên hợp quốc. Ngày 24-10-1945, với sự phê chuẩn Hiến chương của các thành viên, tổ chức Liên hợp quốc chính thức được thành lập.","claims":[{"t":"a. Quá trình hình thành Liên hợp quốc kéo dài từ năm 1941 đến năm 1945, phù hợp tài với khát vọng được sống trong hoà bình của nhân dân thế giới.","key":true},{"t":"b. Cho đến nay, Liên hợp quốc vẫn là tổ chức liên kết quốc tế lớn nhất hành tinh, có nhiệm vụ hàng đầu là tập trung vào ổn định nền kinh tế toàn cầu.","key":false},{"t":"c. Liên Xô, Mỹ và Anh là những nước có vị thế hàng đầu trong việc đặt cơ sở và tích cực trong quá trình thành lập Liên hợp quốc.","key":true},{"t":"d. Việt Nam là một trong những quốc gia sớm gia nhập Liên hợp quốc, sau khi nước Việt Nam Dân chủ Cộng hoà ra đời (9-1945).","key":false}]},{"passage":"Từ đầu những năm 70 của thế kỉ XX, trên thế giới diễn ra nhiều cuộc gặp gỡ thương lượng của nguyên thủ quốc gia các nước và khu vực: Mỹ và Liên Xô, Mỹ với Trung Quốc, hai miền nước Đức, Đông Âu và Tây Âu,... Tháng 12-1989, trong một cuộc họp không chính thức tại đảo Man-ta (Địa Trung Hải), đại diện hai nhà lãnh đạo cấp cao của Liên Xô (Goóc-ba-chốp) và Mỹ (Bu-sơ) đã chính thức cùng tuyên bố chấm dứt Chiến tranh lạnh.\nSau Chiến tranh lạnh, Liên Xô, Mỹ và các nước đã thỏa thuận giải quyết cuộc xung đột ở nhiều nơi trên thế giới bằng giải pháp hoà bình: ở Áp-ga-ni-xtan, Cam-pu-chia, Tây Nam Phi, ... Nhiều tổ chức liên minh khu vực và châu lục được mở rộng, hoặc thay đổi tên gọi mới, kết nạp thêm thành viên và kết nối liên lục địa (ASEAN, EU, ASEM, APEC, ...).","claims":[{"t":"a. Mặc dù Chiến tranh lạnh vẫn tiếp diễn, nhưng từ đầu những năm 70 của thế kỉ XX, xu thế hoà hoãn Đông – Tây đã diễn ra.","key":false},{"t":"b. Xu thế hoà hoãn Đông – Tây chỉ được diễn ra, bàn luận và quyết định bởi các cuộc  gặp gỡ thương lượng giữa nguyên thủ quốc gia của hai nước Liên Xô và Mỹ.","key":false},{"t":"c. Trong xu thế hoà hoãn Đông – Tây, Việt Nam luôn ủng hộ và đã thành công trong việc kí Hiệp định Pa-ri (1973) và giải quyết “vấn đề Cam-pu-chia” (1991).","key":true},{"t":"d. Chiến tranh lạnh chấm dứt, sau đó là Trật tự thế giới hai cực I-an-ta sụp đổ đã mở ra  chiều hướng và những điều kiện giải quyết quan hệ quốc tế bằng giải pháp hoà bình.","key":true}]},{"passage":"“1. Duy trì hoà bình và an ninh quốc tế, và để đạt được mục đích đó, thi hành những biện pháp tập thể có hiệu quả để phòng ngừa và loại trừ các mối đe dọa hoà bình, cấm mọi hành vi xâm lược và phá hoại hoà bình khác; điều chỉnh hoặc giải quyết các vụ tranh chấp hoặc những tình thế có tính chất quốc tế có thể đưa đến sự phá hoại hoà bình, bằng phương pháp hoà bình theo đúng nguyên tắc của công lý và pháp luật quốc tế;\n2. Phát triển mối quan hệ hữu nghị giữa các dân tộc trên cơ sở tôn trọng nguyên tắc bình đẳng và tự quyết của các dân tộc và áp dụng những biện pháp phù hợp khác để củng cố hoà bình thế giới;\n3. Thực hiện sự hợp tác quốc tế trong việc giải quyết các vấn đề quốc tế về kinh tế, xã hội, văn hoá và nhân đạo và khuyến khích phát triển sự tôn trọng các quyền của con người và các tự do cơ bản cho tất cả mọi người không phân biệt chủng tộc, nam nữ, ngôn ngữ hoặc tôn giáo;\n4. Trở thành trung tâm phối hợp mọi hành động của các dân tộc, nhằm đạt được những mục đích chung nói trên.”\n(Trích: Điều 1, Hiến chương Liên hợp quốc, ngày 24-10-1945)","claims":[{"t":"a) Đoạn tư liệu trên đã phản ánh rõ các mục tiêu và nguyên tắc hoạt động của tổ chức Liên hợp quốc.","key":false},{"t":"b) Trong số các mục tiêu của Liên hợp quốc, duy trì hoà bình và an ninh quốc tế là mục tiêu hàng đầu, được các nước thành viên chú trọng.","key":true},{"t":"c) Mối quan hệ giữa các nước thành viên của Liên hợp quốc được xây dựng chủ yếu dựa trên nền tảng là quyền lợi quốc gia, quyền lợi dân tộc là trên hết.","key":false},{"t":"d) Ngày nay, Liên hợp quốc vẫn tiếp tục thực hiện mục tiêu giải quyết các vụ tranh chấp, xung đột quốc tế bằng biện pháp hoà bình.","key":true}]},{"passage":"“Mọi người sinh ra đều được tự do và bình đẳng về nhân quyền và các quyền. Mọi người đều được tạo hoá ban cho lí trí và lương tâm, và cần phải đối xử với nhau bằng tình anh em”.\n(Trích: Điều 1, Tuyên ngôn Quốc tế Nhân quyền của Liên hợp quốc)","claims":[{"t":"a. Tuyên ngôn Quốc tế Nhân quyền của Liên hợp quốc là tuyên ngôn về các quyền của con người nói chung, không có sự phân biệt nước lớn, nước nhỏ.","key":true},{"t":"b. Theo Điều 1 của Tuyên ngôn Quốc tế Nhân quyền, chỉ các dân tộc trên thế giới sau khi giành được độc lập mới có quyền tự do và bình đẳng.","key":false},{"t":"c. Tuyên ngôn Quốc tế Nhân quyền đã góp phần xây dựng một thế giới công bằng hơn, tạo cơ hội phát triển cho tất cả mọi người ở mọi quốc gia trên thế giới.","key":true},{"t":"d. Trong việc bảo đảm quyền con người, Liên hợp quốc chỉ tập trung bảo vệ quyền phụ nữ và trẻ em ở các nước đang chịu “di chứng” của chủ nghĩa thực dân.","key":false}]},{"passage":"“Không có nội dung nào trong Hiến chương này cho phép Liên hợp quốc can thiệp vào các vấn đề về thực chất thuộc quyền nội bộ của bất kì quốc gia nào hoặc yêu cầu các thành viên đưa những vấn đề đó ra giải quyết theo Hiến chương hiện tại...”.\n(Trích: Điều 2, Hiến chương Liên hợp quốc)","claims":[{"t":"a. Theo tư liệu, nguyên tắc hoạt động của Liên hợp quốc được thể hiện tại Điều 2 của Hiến chương Liên hợp quốc.","key":true},{"t":"b. Hiến chương Liên hợp quốc có nhiều nguyên tắc, trong đó nhấn mạnh việc không can thiệp vào công việc nội bộ của các quốc gia.","key":true},{"t":"c. Một nguyên tắc quan trọng trong quá trình hoạt động của Liên hợp quốc là nếu có tranh chấp quốc tế thì các bên phải giải quyết bằng biện pháp hoà bình.","key":true},{"t":"d. Liên hợp quốc quy định các nước thành viên phải tôn trọng toàn vẹn lãnh thổ và độc lập chính trị của 5 cường quốc (Liên Xô, Mỹ, Anh, Pháp và Trung Quốc).","key":false}]},{"passage":"“Xây dựng một cộng đồng dựa trên các giá trị và chuẩn mực chung; Tạo dựng một khu vực gắn kết, hoà bình và tự cường với trách nhiệm chung đối với an ninh toàn diện; Hướng tới một khu vực năng động và rộng mở với bên ngoài trong một thế giới ngày càng liên kết và tuỳ thuộc”.\n(Nguồn: Cổng Thông tin Việt Nam - ASEAN)","claims":[{"t":"a. Nội dung tư liệu ghi nhận một trong những hoạt động của Cộng đồng Chính trị - An ninh ASEAN.","key":true},{"t":"b. Kế hoạch xây dựng Cộng đồng ASEAN cho thấy sự phù hợp với bối cảnh toàn cầu hoá.","key":true},{"t":"c. Cộng đồng Chính trị - An ninh ASEAN giữ vai trò quyết định trong việc duy trì hoà bình, ổn định lâu dài của khu vực Đông Nam Á.","key":true},{"t":"d. Sự ra đời của Cộng đồng Chính trị - An ninh ASEAN là sáng kiến của ba nước Đông Dương.","key":false}]}],"short":[],"essay":[],"verified":false,"source":"Đề cương người dùng cung cấp; một số đáp án có thể gây tranh luận."},{"id":"VL-1","title":"Đề 1 · Tư duy nhiệt học","desc":"Đề nâng cao: chuyển thể, nhiệt lượng, nội năng, thang nhiệt độ và bài toán công khí.","mc":[{"q":"Trong một chất rắn kết tinh ở nhiệt độ không đổi, mô tả nào phù hợp nhất về các hạt cấu tạo?","options":["Chuyển động hỗn loạn khắp thể tích bình.","Dao động quanh những vị trí cân bằng tương đối cố định.","Đứng yên hoàn toàn tại nút mạng.","Chỉ chuyển động tịnh tiến theo một chiều."],"key":"B"},{"q":"Khi nước tinh khiết đang sôi ở áp suất không đổi, nhiệt lượng cung cấp chủ yếu dùng để","options":["tăng nhiệt độ của nước.","tăng khối lượng riêng của nước.","thực hiện quá trình chuyển thể.","giảm nội năng của nước."],"key":"C"},{"q":"Trường hợp nào làm nội năng của vật tăng chủ yếu nhờ thực hiện công?","options":["Cốc nước nóng nguội trong phòng.","Thìa kim loại ấm lên trong trà nóng.","Không khí trong xi lanh bị nén nhanh.","Tảng băng tan trong nước ấm."],"key":"C"},{"q":"Với quy ước A là công do ngoại lực thực hiện lên hệ, Q là nhiệt lượng hệ nhận, định luật I là","options":["ΔU = A + Q.","ΔU = A − Q.","ΔU = Q − A.","ΔU = −A − Q."],"key":"A"},{"q":"Đơn vị SI của nhiệt dung riêng là","options":["J/kg.","J/(kg·K).","J/K.","J·kg/K."],"key":"B"},{"q":"Biểu thức nhiệt lượng làm nóng vật khối lượng m, nhiệt dung riêng c, tăng ΔT (không chuyển thể) là","options":["Q = mc/ΔT.","Q = mΔT/c.","Q = mcΔT.","Q = cΔT/m."],"key":"C"},{"q":"Nhiệt độ 27 °C tương ứng gần đúng với","options":["246 K.","273 K.","300 K.","327 K."],"key":"C"},{"q":"Mốc 0 K được gọi là","options":["nhiệt độ nước đá đang tan.","nhiệt độ không tuyệt đối.","nhiệt độ sôi của nước.","nhiệt độ phòng tiêu chuẩn."],"key":"B"},{"q":"Nhiệt nóng chảy riêng có đơn vị SI là","options":["J/(kg·K).","kg/J.","J/kg.","J/K."],"key":"C"},{"q":"Trong thí nghiệm xác định nhiệt hóa hơi riêng bằng phương pháp điện, đại lượng nào trực tiếp giúp tính năng lượng điện đã cấp?","options":["Hiệu điện thế, cường độ dòng điện và thời gian.","Chiều cao bình nước và đường kính dây.","Áp suất khí quyển và thể tích phòng.","Nhiệt độ phòng và diện tích mặt bàn."],"key":"A"},{"q":"Khi hai vật khác nhiệt độ tiếp xúc nhiệt với nhau (hệ cô lập), nhiệt tự truyền từ","options":["vật có khối lượng lớn sang vật nhỏ.","vật có nhiệt dung lớn sang vật bé.","vật lạnh sang vật nóng.","vật nóng sang vật lạnh."],"key":"D"},{"q":"Ở đồ thị nhiệt độ theo thời gian của băng đang nóng chảy ở áp suất không đổi, đoạn nằm ngang thể hiện","options":["băng tiếp tục thu nhiệt để chuyển thể.","nhiệt lượng thu vào bằng không.","nhiệt dung riêng của băng bằng không.","băng bị làm lạnh."],"key":"A"}],"tf":[{"passage":"Một khối khí nhận 550 J nhiệt lượng; ngoại lực nén khối khí và thực hiện công 150 J. Quy ước Q > 0 khi hệ nhận nhiệt, A > 0 khi hệ nhận công.","claims":[{"t":"Khối khí nhận nhiệt lượng Q = +550 J.","key":true},{"t":"Công A tác dụng lên khối khí có giá trị âm.","key":false},{"t":"Độ biến thiên nội năng của khối khí là +700 J.","key":true},{"t":"Nếu khối khí được cho giãn nở sinh công 150 J thay vì bị nén (Q vẫn 550 J), ΔU sẽ bằng 400 J.","key":true}]},{"passage":"Đun nóng 0,20 kg nước đá ở 0 °C bằng nguồn gia nhiệt đều. Bỏ qua thất thoát; λ = 3,34×10^5 J/kg; c_nước = 4200 J/(kg·K).","claims":[{"t":"Ở 0 °C, nước đá có thể nhận nhiệt mà chưa tăng nhiệt độ trong quá trình nóng chảy.","key":true},{"t":"Nhiệt lượng để làm tan hoàn toàn 0,20 kg nước đá là 33 400 J.","key":false},{"t":"Nhiệt lượng để đun 0,20 kg nước từ 0 °C đến 20 °C là 16 800 J.","key":true},{"t":"Khi cấp tổng cộng 83 600 J, nước sau khi tan hết đạt đúng 20 °C.","key":true}]}],"short":[{"q":"Một nhiệt kế chỉ 315 K. Nhiệt độ tương ứng gần đúng theo °C là bao nhiêu? (Dùng T = t + 273.)","key":42,"unit":"°C","tol":0.01,"hint":""},{"q":"Cần bao nhiêu kJ để tăng nhiệt độ 0,50 kg nước từ 20 °C lên 60 °C? c = 4200 J/(kg·K).","key":84,"unit":"kJ","tol":0.01,"hint":""},{"q":"Một hệ nhận Q = 260 J và thực hiện công 90 J lên môi trường. ΔU bằng bao nhiêu J?","key":170,"unit":"J","tol":0.01,"hint":""},{"q":"Nhiệt lượng 167 kJ đủ để làm tan bao nhiêu kg nước đá ở 0 °C? λ = 334 kJ/kg.","key":0.5,"unit":"kg","tol":0.001,"hint":""}],"essay":[{"title":"Bài toán 1 – Đun băng thành nước","prompt":"Một khối nước đá 0,30 kg ở −10 °C được đun bằng nguồn nhiệt 210 W, coi hiệu suất truyền nhiệt 100%. Biết c_đá = 2100 J/(kg·K), λ = 334 000 J/kg. Giả sử áp suất không đổi. Trình bày các giai đoạn và lập phương trình nhiệt lượng.","parts":[{"q":"Nhiệt lượng để đưa băng từ −10 °C lên 0 °C bằng bao nhiêu kJ?","key":6.3,"unit":"kJ","points":0.75,"tol":0.02},{"q":"Thời gian từ lúc bắt đầu đến khi tan hoàn toàn (giây)?","key":507.142857,"unit":"s","points":0.75,"tol":1}],"solution":"Q1 = m c_đá Δt = 6300 J; Q2 = mλ = 100200 J; t = (Q1 + Q2)/P = 507,14 s."},{"title":"Bài toán 2 – Nội năng và công của khí","prompt":"Một xilanh có pít-tông diện tích 50 cm². Khí bên trong đẩy pít-tông dịch chuyển 12 cm dưới áp suất không đổi 2,0×10^5 Pa. Trong quá trình này khí nhận Q = 500 J. Bỏ qua ma sát; hãy trình bày biểu thức công và định luật I.","parts":[{"q":"Công do khí thực hiện lên pít-tông (J)?","key":120,"unit":"J","points":0.75,"tol":0.1},{"q":"Độ biến thiên nội năng của khí (J)?","key":380,"unit":"J","points":0.75,"tol":0.1}],"solution":"ΔV = S·s = 0,005·0,12 = 0,0006 m³. Công do khí thực hiện W = pΔV = 120 J; ΔU = Q − W = 380 J."}],"subject":"physics","mode":"exam","minutes":45,"verified":false,"source":"Đề tham khảo biên soạn theo ma trận giữa kì I Vật lí 12, cần giáo viên rà soát đáp án trước khi dùng đánh giá chính thức."},{"id":"VL-2","title":"Đề 2 · Vận dụng tổng hợp","desc":"Đề nâng cao: trao đổi nhiệt, chuyển thể, xử lí tình huống và cân bằng năng lượng.","mc":[{"q":"So với chất rắn, các phân tử trong chất khí thông thường","options":["luôn dao động quanh nút mạng cố định.","cách xa nhau hơn và chuyển động hỗn loạn.","không có thế năng tương tác.","không có động năng chuyển động nhiệt."],"key":"B"},{"q":"Sự bay hơi khác sự sôi ở đặc điểm nào?","options":["Bay hơi chỉ xảy ra tại một nhiệt độ xác định.","Bay hơi chỉ diễn ra trong lòng chất lỏng.","Bay hơi có thể xảy ra trên mặt thoáng ở nhiều nhiệt độ.","Bay hơi không làm thay đổi trạng thái chất."],"key":"C"},{"q":"Một vật nhận nhiệt nhưng nội năng vẫn giảm nếu","options":["vật đồng thời sinh công lớn hơn nhiệt lượng nhận.","vật đồng thời nhận công từ bên ngoài.","vật đặt trong bình cách nhiệt.","nhiệt độ vật luôn tăng."],"key":"A"},{"q":"Theo quy ước công A thực hiện lên khí, trong quá trình khí tự giãn nở đẩy pít-tông thì","options":["A luôn dương.","A bằng độ biến thiên nội năng.","A luôn bằng nhiệt lượng khí nhận.","A âm nếu khí thực hiện công ra ngoài."],"key":"D"},{"q":"Một độ tăng nhiệt độ 5 °C tương ứng với độ tăng theo Kelvin là","options":["278 K.","5 K.","268 K.","0,02 K."],"key":"B"},{"q":"Nước tinh khiết đông đặc ở 0 °C dưới áp suất chuẩn có nhiệt độ theo Kelvin gần bằng","options":["0 K.","100 K.","273 K.","373 K."],"key":"C"},{"q":"Trong quá trình ngưng tụ ở cùng nhiệt độ, hơi nước thường","options":["thu nhiệt nóng chảy.","thu nhiệt hóa hơi.","tỏa nhiệt ra môi trường.","không trao đổi năng lượng."],"key":"C"},{"q":"Nhiệt hóa hơi riêng L của chất lỏng được xác định bằng","options":["Q/m trong quá trình hóa hơi tại nhiệt độ sôi.","mcΔT trong quá trình hóa hơi.","m/Q trong quá trình ngưng tụ.","Q/(mΔT) trong quá trình đun nóng."],"key":"A"},{"q":"Đồ thị t–thời gian khi đun chất tinh khiết có đoạn nghiêng lên, đoạn nằm ngang, rồi lại nghiêng lên. Đoạn giữa thường là","options":["nhiệt độ môi trường giảm.","nhiệt độ chất tăng đều.","sự chuyển thể ở nhiệt độ không đổi.","khối lượng chất tăng."],"key":"C"},{"q":"Để xác định nhiệt dung riêng của nước bằng điện trở nung, đại lượng nào cần đo ngoài m và ΔT?","options":["Chiều dài dây dẫn.","Điện năng cung cấp trong thời gian nung.","Độ ẩm không khí.","Đường kính bình cách nhiệt."],"key":"B"},{"q":"Hai khối có cùng khối lượng và nhận cùng nhiệt lượng, không chuyển thể. Khối nào có nhiệt dung riêng lớn hơn sẽ","options":["tăng nhiệt độ ít hơn.","tăng nhiệt độ nhiều hơn.","có nhiệt độ cuối luôn cao hơn.","luôn chuyển sang thể khí."],"key":"A"},{"q":"Trong hệ nhiệt kế lý tưởng, 0 °C và 100 °C (áp suất chuẩn) được sử dụng làm mốc của thang","options":["Kelvin tuyệt đối.","Fahrenheit.","Celsius.","Réaumur trong mọi hệ thống SI."],"key":"C"}],"tf":[{"passage":"Một bình cách nhiệt chứa 0,25 kg nước ở 80 °C trộn với 0,35 kg nước ở 20 °C. Coi không có thất thoát và c của hai phần nước như nhau.","claims":[{"t":"Khi cân bằng, nhiệt độ cuối nằm giữa 20 °C và 80 °C.","key":true},{"t":"Nhiệt độ cân bằng bằng đúng 50 °C.","key":false},{"t":"Nhiệt độ cân bằng là 45 °C.","key":true},{"t":"Phần nước nóng tỏa nhiệt bằng phần nước lạnh thu nhiệt.","key":true}]},{"passage":"Một lượng nước 0,10 kg ở 100 °C được chuyển hoàn toàn thành hơi nước cũng ở 100 °C. L = 2,26×10^6 J/kg. Sau đó xét ngưng tụ cùng khối lượng hơi ở 100 °C.","claims":[{"t":"Nhiệt độ nước không đổi trong quá trình hóa hơi ở áp suất không đổi.","key":true},{"t":"Nhiệt lượng hóa hơi bằng 22,6 kJ.","key":false},{"t":"Nhiệt lượng hóa hơi bằng 226 kJ.","key":true},{"t":"Khi ngưng tụ toàn bộ, hơi tỏa ra khoảng 226 kJ nhiệt lượng.","key":true}]}],"short":[{"q":"Độ tăng nhiệt độ của một vật từ 285 K lên 318 K bằng bao nhiêu °C?","key":33,"unit":"°C","tol":0.01,"hint":""},{"q":"Khối lượng nước 0,40 kg được làm nóng từ 25 °C lên 50 °C. Tính nhiệt lượng cần (kJ), c = 4200 J/(kg·K).","key":42,"unit":"kJ","tol":0.01,"hint":""},{"q":"Một khối khí thực hiện công 180 J và nội năng tăng 75 J. Khí đã nhận bao nhiêu J nhiệt lượng?","key":255,"unit":"J","tol":0.01,"hint":""},{"q":"Đun bay hơi hoàn toàn 0,15 kg nước đang sôi. Tính nhiệt lượng hóa hơi (kJ), L = 2260 kJ/kg.","key":339,"unit":"kJ","tol":0.01,"hint":""}],"essay":[{"title":"Bài toán 1 – Trộn nước và nước đá","prompt":"Bình cách nhiệt chứa 0,40 kg nước ở 50 °C, thả vào 0,10 kg nước đá ở 0 °C. Cho c_nước = 4200 J/(kg·K), λ = 334 000 J/kg. Bỏ qua nhiệt dung bình. Chứng minh đá tan hết rồi tính nhiệt độ cân bằng.","parts":[{"q":"Nhiệt lượng cần để làm tan hết 0,10 kg đá (kJ)?","key":33.4,"unit":"kJ","points":0.75,"tol":0.02},{"q":"Nhiệt độ cân bằng sau khi tan hết (°C)?","key":24.095238,"unit":"°C","points":0.75,"tol":0.2}],"solution":"Nước nóng nếu hạ tới 0 °C có thể tỏa 84 kJ > 33,4 kJ nên đá tan hết. 0,4·4200·(50−t) = 33400 + 0,1·4200·t, suy ra t ≈ 24,10 °C."},{"title":"Bài toán 2 – Khí chuyển trạng thái","prompt":"Một khí nhận 720 J nhiệt lượng trong khi pít-tông bị khí đẩy đi 8 cm. Tiết diện pít-tông 75 cm², áp suất khí không đổi 1,5×10^5 Pa, bỏ qua ma sát. Trình bày cách đổi đơn vị và áp dụng định luật I.","parts":[{"q":"Công do khí thực hiện (J)?","key":90,"unit":"J","points":0.75,"tol":0.1},{"q":"Độ tăng nội năng khí (J)?","key":630,"unit":"J","points":0.75,"tol":0.1}],"solution":"S = 75 cm² = 0,0075 m², ΔV = 0,0075·0,08 = 0,0006 m³; W = pΔV = 90 J; ΔU = Q − W = 630 J."}],"subject":"physics","mode":"exam","minutes":45,"verified":false,"source":"Đề tham khảo biên soạn theo ma trận giữa kì I Vật lí 12, cần giáo viên rà soát đáp án trước khi dùng đánh giá chính thức."},{"id":"HH12-GK1-2026-DE1","subject":"chemistry","title":"Hóa 12 · Giữa kì I – Đề phân hóa 9–10","description":"Đề mới dựa sát đặc tả THPT Tiểu La 2026–2027: ester–lipid, chất giặt rửa, carbohydrate, amine, amino acid và peptide. Các câu vận dụng gắn thực tiễn; cần tự kiểm chứng và xem lời giải sau nộp.","mode":"exam","minutes":45,"verified":false,"source":"Đặc tả THPT Tiểu La 2026–2027 (2 trang); tác giả biên soạn mới, có tự kiểm tra số học. Không phải đề chính thức.","mc":[{"q":"Câu 1 (Ester – lipid, nhận biết). Một mẫu dung môi thực phẩm có phân tử CH₃COOCH₃. Chất này thuộc loại hợp chất nào?","options":["Carboxylic acid.","Ester.","Alcohol đa chức.","Amine."],"key":"B","explain":"CH₃COOCH₃ có nhóm chức –COO– nối hai gốc hydrocarbon, là methyl ethanoate (methyl acetate)."},{"q":"Câu 2 (Chất giặt rửa, nhận biết). Trong các công thức sau, thành phần nào là muối của acid béo, có thể là thành phần chính của xà phòng?","options":["C₁₇H₃₅COONa.","CH₃COONa.","C₁₂H₂₅SO₃Na.","C₂H₅OH."],"key":"A","explain":"C₁₇H₃₅COONa là sodium stearate, muối sodium của acid béo mạch dài. C₁₂H₂₅SO₃Na là một chất hoạt động bề mặt tổng hợp."},{"q":"Câu 3 (Carbohydrate, nhận biết). Người ta thấy fructose có nhiều trong mật ong và quả chín. Fructose thuộc nhóm nào?","options":["Polysaccharide.","Disaccharide.","Monosaccharide.","Lipid."],"key":"C","explain":"Fructose là monosaccharide có công thức phân tử C₆H₁₂O₆."},{"q":"Câu 4 (Saccharose – maltose, nhận biết). Một nhãn thực phẩm ghi sucrose (saccharose). Nhận định nào đúng?","options":["Sucrose là monosaccharide.","Sucrose là disaccharide.","Sucrose là polysaccharide.","Sucrose là amino acid."],"key":"B","explain":"Sucrose là disaccharide, cấu tạo từ một đơn vị glucose và một đơn vị fructose."},{"q":"Câu 5 (Tinh bột – cellulose, nhận biết). Trong thân cây, thành phần polysaccharide có vai trò chính tạo độ bền của thành tế bào là","options":["Glucose.","Cellulose.","Sucrose.","Maltose."],"key":"B","explain":"Cellulose là thành phần cấu trúc quan trọng của thành tế bào thực vật; tinh bột là chất dự trữ."},{"q":"Câu 6 (Amine, nhận biết). Hợp chất nào dưới đây là amine bậc một?","options":["(CH₃)₃N.","CH₃NHCH₃.","CH₃CH₂NH₂.","CH₃CONH₂."],"key":"C","explain":"CH₃CH₂NH₂ có một gốc hydrocarbon liên kết với N, là ethylamine (ethanamine), amine bậc một."},{"q":"Câu 7 (Amine, nhận biết). Khi so sánh những amine thường gặp ở điều kiện thường, phát biểu nào đúng về aniline (C₆H₅NH₂)?","options":["Aniline là khí không màu tan vô hạn trong nước.","Aniline là chất lỏng, ít tan trong nước.","Aniline có tính acid mạnh như HCl.","Aniline là hydrocarbon không chứa nitrogen."],"key":"B","explain":"Aniline là chất lỏng ở điều kiện thường, ít tan trong nước và là base yếu."},{"q":"Câu 8 (Amino acid – peptide, nhận biết). Chất nào sau đây là α-amino acid thông dụng, có cả nhóm –NH₂ và –COOH?","options":["CH₃COOCH₃.","H₂NCH₂COOH.","CH₃NH₂.","C₂H₅OH."],"key":"B","explain":"H₂NCH₂COOH là glycine, α-amino acid đơn giản nhất."},{"q":"Câu 9 (Ester – lipid, thông hiểu). Một loại hương liệu chứa CH₃CH₂COOCH₃. Tên ester theo danh pháp thông dụng dạng alkyl alkanoate là","options":["Methyl propanoate.","Ethyl ethanoate.","Propyl methanoate.","Methyl ethanoate."],"key":"A","explain":"Gốc alcohol là methyl (–OCH₃), phần acid là propanoate (CH₃CH₂COO–)."},{"q":"Câu 10 (Xà phòng – chất giặt rửa, thông hiểu). Một gia đình dùng nước giếng có nhiều ion Ca²⁺, Mg²⁺; xà phòng tạo cặn và giảm hiệu quả. Giải thích hợp lí nhất là","options":["Ion Ca²⁺ làm các phân tử nước mất hoàn toàn tính phân cực.","Muối của acid béo có thể tạo kết tủa ít tan với Ca²⁺, Mg²⁺.","Glycerol phân hủy thành khí trong nước cứng.","Muối sulfonate của chất giặt rửa tổng hợp luôn kết tủa mạnh với Ca²⁺."],"key":"B","explain":"Các ion kim loại kiềm thổ tạo muối carboxylate mạch dài ít tan, làm giảm lượng chất hoạt động bề mặt còn hòa tan."},{"q":"Câu 11 (Saccharose – maltose, thông hiểu). Để giải thích tính không khử của sucrose so với maltose, nhận định nào đúng?","options":["Sucrose không chứa nguyên tử oxygen.","Trong sucrose, hai carbon anomeric đều tham gia liên kết glycoside; maltose còn carbon anomeric tự do.","Maltose là monosaccharide, sucrose là polysaccharide.","Sucrose không thể bị thủy phân."],"key":"B","explain":"Sucrose không có nhóm hemiacetal/hemiketal tự do để mở vòng thành dạng có tính khử; maltose còn một đầu khử."},{"q":"Câu 12 (Ứng dụng saccharose – maltose, vận dụng). Trong công nghệ bánh mì, enzyme có thể thủy phân maltose thành các đường đơn, sau đó men sử dụng để tạo khí giúp bột nở. Một phân tử maltose khi thủy phân hoàn toàn cho","options":["1 phân tử glucose và 1 phân tử fructose.","2 phân tử fructose.","2 phân tử glucose.","1 phân tử glucose và 1 phân tử galactose."],"key":"C","explain":"Maltose gồm hai đơn vị glucose; thủy phân hoàn toàn cho 2 phân tử glucose."}],"tf":[{"passage":"Tại một phòng kiểm nghiệm thực phẩm, hai mẫu được ghi nhãn glucose và fructose. Để nhận diện nhóm carbohydrate, người phân tích quan sát các tính chất hóa học của chúng và so sánh công thức phân tử. Xét các nhận định sau:","claims":[{"t":"a) Glucose và fructose đều có công thức phân tử C₆H₁₂O₆.","key":true,"explain":"Cùng công thức phân tử, khác cấu trúc."},{"t":"b) Trong môi trường kiềm của thuốc thử Tollens, cả glucose và fructose đều có thể cho phản ứng tráng bạc.","key":true,"explain":"Glucose có dạng mạch hở aldehyde; fructose có thể chuyển hóa qua trung gian enediol trong kiềm, tạo chất khử."},{"t":"c) Trong dạng mạch hở, fructose chứa nhóm –CHO giống glucose.","key":false,"explain":"Fructose dạng mạch hở là ketose, có nhóm >C=O, không phải aldehyde."},{"t":"d) Dung dịch glucose có thể hòa tan Cu(OH)₂ trong điều kiện thường tạo dung dịch xanh lam do có nhiều nhóm –OH kề nhau.","key":true,"explain":"Tính chất đặc trưng của polyol có nhiều nhóm hydroxyl kề nhau."}]},{"passage":"Một nhóm học sinh tìm hiểu tính chất amino acid trong dung dịch. Glycine có công thức H₂NCH₂COOH, điểm đẳng điện xấp xỉ pI = 6,0. Xét sự dịch chuyển của glycine trong điện trường khi thay đổi pH.","claims":[{"t":"a) Glycine là amino acid có cả nhóm amine và nhóm carboxyl.","key":true,"explain":"Công thức H₂NCH₂COOH."},{"t":"b) Hai phân tử glycine có thể liên kết tạo dipeptide chứa một liên kết peptide.","key":true,"explain":"Dipeptide được tạo bởi hai amino acid có một liên kết –CO–NH–."},{"t":"c) Ở pH = 2 (nhỏ hơn pI), glycine chủ yếu mang điện âm và chuyển về điện cực dương.","key":false,"explain":"pH thấp hơn pI, dạng mang điện dương chiếm ưu thế, chuyển về điện cực âm."},{"t":"d) Ở pH = 11 (lớn hơn pI), glycine chủ yếu mang điện âm và chuyển về điện cực dương.","key":true,"explain":"pH cao hơn pI, amino acid có xu hướng mang điện âm."}]}],"short":[{"q":"Câu 1 (Vận dụng ester – lipid). Trong mô hình xà phòng hóa 0,080 mol tristearin (một triglyceride), cần bao nhiêu gam NaOH để phản ứng vừa đủ? Cho M(NaOH) = 40 g/mol.","key":9.6,"unit":"g","tol":0.01,"hint":"Mỗi mol triglyceride phản ứng với 3 mol NaOH: m = 3 × 0,080 × 40 = 9,6 g."},{"q":"Câu 2 (Nhận biết xà phòng). Trong danh sách C₁₇H₃₅COONa; C₁₂H₂₅SO₃Na; CH₃COONa; C₁₅H₃₁COOK, có bao nhiêu chất là muối sodium/potassium của acid béo mạch dài (thành phần xà phòng)?","key":2,"unit":"chất","tol":0.01,"hint":"C₁₇H₃₅COONa và C₁₅H₃₁COOK là muối carboxylate mạch dài; các chất còn lại không thuộc nhóm này."},{"q":"Câu 3 (Glucose, thông hiểu). Trong phép phân tích mẫu đường khử, giả sử 0,090 mol glucose tham gia phản ứng tráng bạc hoàn toàn. Khối lượng Ag tối đa thu được là bao nhiêu gam? Lấy M(Ag) = 108 g/mol.","key":19.44,"unit":"g","tol":0.02,"hint":"1 mol glucose khử được 2 mol Ag. mAg = 0,090 × 2 × 108 = 19,44 g."},{"q":"Câu 4 (Saccharose, nhận biết cấu trúc). Nếu 34,2 g sucrose thủy phân hoàn toàn, tổng khối lượng glucose và fructose thu được là bao nhiêu gam? Giả sử không có hao hụt; M(sucrose) = 342 g/mol.","key":36,"unit":"g","tol":0.02,"hint":"C₁₂H₂₂O₁₁ + H₂O → C₆H₁₂O₆ + C₆H₁₂O₆. n = 0,10 mol, n sản phẩm tổng = 0,20 mol; m = 36 g."}],"essay":[{"title":"Câu 1 – Mô hình sản xuất xà phòng từ chất béo (1,0 điểm)","prompt":"Trong bài toán lí thuyết về xà phòng hóa, một cơ sở xử lí 35,6 g tristearin tinh khiết bằng lượng vừa đủ NaOH, coi phản ứng đạt hiệu suất 100%. Cho M(tristearin) = 890 g/mol; M(NaOH) = 40 g/mol; M(sodium stearate) = 306 g/mol. Mỗi phân tử tristearin tạo 3 phân tử sodium stearate. Chỉ nhập các đáp số ở phần dưới.","parts":[{"q":"a) Khối lượng NaOH phản ứng vừa đủ (g)?","key":4.8,"unit":"g","points":0.5,"tol":0.02},{"q":"b) Khối lượng sodium stearate thu được (g)?","key":36.72,"unit":"g","points":0.5,"tol":0.02}],"solution":"n(tristearin)=35,6/890=0,04 mol; n(NaOH)=0,12 mol → m=4,8 g; n(C₁₇H₃₅COONa)=0,12 mol → m=36,72 g."},{"title":"Câu 2 – Cấu trúc cellulose trong sợi thực vật (1,0 điểm)","prompt":"Một mẫu sợi chứa 8,10 g cellulose tinh khiết, có mắt xích lặp lại (C₆H₁₀O₅), M = 162 g/mol. Về mặt cấu tạo, mỗi mắt xích có 3 nhóm hydroxyl tự do, là cơ sở để cellulose có thể tạo các dẫn xuất ester trong hóa học vật liệu. Chỉ xét số mol mắt xích và nhóm –OH, không xét quy trình điều chế dẫn xuất.","parts":[{"q":"a) Số mol mắt xích cellulose trong mẫu (mol)?","key":0.05,"unit":"mol","points":0.5,"tol":0.001},{"q":"b) Số mol nhóm –OH của toàn bộ mẫu (mol)?","key":0.15,"unit":"mol","points":0.5,"tol":0.001}],"solution":"n mắt xích = 8,10/162 = 0,05 mol; mỗi mắt xích có 3 nhóm OH nên n(OH) = 3 × 0,05 = 0,15 mol. Đây là bài đếm nhóm chức lý thuyết, không phải hướng dẫn thực hiện phản ứng."},{"title":"Câu 3 – Danh pháp và tính base của amine (1,0 điểm)","prompt":"Trong học phần hợp chất chứa nitrogen, xem xét các amine no, đơn chức, mạch hở, và phản ứng acid–base của methylamine với HCl theo tỉ lệ mol 1:1. Cho M(CH₃NH₂)=31 g/mol, M(CH₃NH₃Cl)=67,5 g/mol.","parts":[{"q":"a) Có bao nhiêu đồng phân cấu tạo amine bậc một ứng với công thức phân tử C₃H₉N?","key":2,"unit":"đồng phân","points":0.5,"tol":0.01},{"q":"b) Khi 6,20 g methylamine phản ứng hết với HCl, khối lượng muối CH₃NH₃Cl thu được (g)?","key":13.5,"unit":"g","points":0.5,"tol":0.02}],"solution":"a) Propan-1-amine và propan-2-amine là 2 amine bậc một. b) n(CH₃NH₂)=6,20/31=0,20 mol; CH₃NH₂ + HCl → CH₃NH₃Cl; m muối=0,20×67,5=13,5 g."}]},{"id":"TIN12-GK1-B1-B6","subject":"informatics","title":"Tin học 12 · Tổng hợp Bài 1–6 (45 ABCD + 12 Đ/S)","description":"Đề luyện từ tài liệu THPT Tiểu La: AI, thiết bị mạng, TCP/IP, IPv4/MAC, chia sẻ tài nguyên và văn hóa số. Đáp án do thầy đối chiếu kiến thức; một số diễn đạt tuyệt đối trong tài liệu có ghi chú khi xem lại.","mode":"exam","minutes":90,"verified":false,"source":"Bộ tài liệu ôn tập Tin học 12, Bài 1–6 do học sinh cung cấp (2026)","mc":[{"q":"Khái niệm Trí tuệ nhân tạo (AI) được hiểu là khả năng nào của máy tính hoặc hệ thống?","options":["Tự động bật mở nguồn khi có người bước đến gần.","Thực hiện các công việc mang tính trí tuệ của con người như đọc chữ, hiểu tiếng nói, suy luận, giải quyết vấn đề.","Luyện tập thể thao và thay thế hoàn toàn hoạt động thể chất của con người.","Tính toán các phép tính số học với tốc độ cực nhanh theo chương trình cố định."],"key":"B","originalNumber":1,"source":"Đề cương Tin học 12 Bài 1–6 (tài liệu học sinh cung cấp)"},{"q":"Đặc trưng nào sau đây KHÔNG phải là đặc trưng cơ bản của hệ thống Trí tuệ nhân tạo?","options":["Khả năng học (Learning capacity).","Khả năng nhận thức thông qua cảm biến và hình ảnh.","Khả năng duy trì hoạt động vĩnh cửu không cần năng lượng.","Khả năng hiểu ngôn ngữ tự nhiên (NLP)."],"key":"C","originalNumber":2,"source":"Đề cương Tin học 12 Bài 1–6 (tài liệu học sinh cung cấp)"},{"q":"Khả năng tự điều chỉnh hành vi và cải thiện hiệu suất xử lý dựa trên dữ liệu mới thu thập được gọi là đặc trưng gì của AI?","options":["Khả năng học.","Khả năng suy luận.","Khả năng nhận thức.","Khả năng vận động cơ học."],"key":"A","originalNumber":3,"source":"Đề cương Tin học 12 Bài 1–6 (tài liệu học sinh cung cấp)"},{"q":"Hệ thống AI nhận biết vật thể xung quanh thông qua camera, cảm biến radar trên xe tự lái biểu hiện đặc trưng nào?","options":["Khả năng xử lý ngôn ngữ.","Khả năng nhận thức (Perception).","Khả năng tính toán đại số.","Khả năng lưu trữ dữ liệu."],"key":"B","originalNumber":4,"sourc iểu sau về khái niệm và đặc trưng cơ bản của Trí tuệ nhân tạo (AI):","claims":[{"t":"AI là khả năng của máy tính có thể thực hiện các công việc mang tính trí tuệ con người như suy luận, nhận thức, học tập.","key":true},{"t":"Đặc trưng khả năng học của AI cho phép hệ thống tự điều chỉnh và thông minh hơn khi tiếp nhận thêm dữ liệu mới.","key":true},{"t":"AI hiện nay đã có cảm xúc, tình yêu thương và khả năng tự nhận thức độc lập hoàn toàn như con người.","key":false},{"t":"Xử lý ngôn ngữ tự nhiên (NLP) giúp máy tính hiểu, dịch thuật và giao tiếp bằng ngôn ngữ con người.","key":true}],"originalNumber":1},{"passage":"Xét sự phân loại AI và các công nghệ AI hiện đại:","claims":[{"t":"AI hẹp (Narrow AI) là các hệ thống AI được thiết kế để giải quyết một hoặc một nhóm bài toán cụ thể.","key":true},{"t":"ChatGPT, Google Translate và xe tự lái Tesla thuộc nhóm Trí tuệ nhân tạo hẹp (Narrow AI).","key":true},{"t":"Trí tuệ nhân tạo tổng quát (General AI) là các hệ thống đã phổ biến trong đời sống thực tế hiện nay.","key":false},{"t":"Generative AI (AI sinh) có khả năng tạo ra nội dung mới như văn bản, hình ảnh, mã nguồn dựa trên dữ liệu học.","key":true}],"originalNumber":2},{"passage":"Cho các nhận định về ứng dụng và cảnh báo nguy cơ do AI mang lại:","claims":[{"t":"Trong Y tế, hệ thống AI như IBM Watson hỗ trợ bác sĩ chẩn đoán bệnh chính xác và nhanh chóng hơn.","key":true},{"t":"Trong Nông nghiệp, AI kết hợp cảm biến giúp tối ưu hóa lượng nước tưới và phân bón dựa trên độ ẩm đất.","key":true},{"t":"Sự phát triển của AI hoàn toàn không gây ra nguy cơ mất an toàn thông tin hay thất nghiệp cho con người.","key":false},{"t":"Cần xây dựng các hành lang pháp lý và chuẩn mực đạo đức để quản lý việc phát triển và ứng dụng AI.","key":true}],"originalNumber":3},{"passage":"Một trường học trang bị hệ thống mạng LAN cho các phòng máy tính. Xét chức năng thiết bị mạng:","claims":[{"t":"Hub và Switch đều dùng để kết nối các máy tính thành một mạng LAN cục bộ.","key":true},{"t":"Khi nhận dữ liệu, Hub phát tán (broadcast) tín hiệu ra tất cả các cổng, dễ gây xung đột tín hiệu.","key":true},{"t":"Switch đọc địa chỉ MAC để gửi dữ liệu trực tiếp đến đúng cổng máy nhận, giúp tối ưu băng thông.","key":true},{"t":"Người ta khuyến khích dùng Hub thay thế cho Switch trong các thiết kế mạng LAN hiện đại.","key":false}],"originalNumber":4},{"passage":"Xét chức năng của các thiết bị Router, Modem và WAP trong kết nối mạng Internet:","claims":[{"t":"Modem thực hiện chuyển đổi tín hiệu số (digital) của máy tính thành tín hiệu tương tự (analog) và ngược lại.","key":true},{"t":"Router có chức năng định tuyến, chuyển tiếp các gói dữ liệu giữa các mạng LAN khác nhau hoặc ra Internet.","key":true},{"t":"Thiết bị WAP (Wireless Access Point) cho phép các thiết bị di động kết nối không dây vào mạng LAN.","key":true},{"t":"Router Wi-Fi gia đình chỉ thực hiện duy nhất chức năng phát sóng không dây, không có chức năng định tuyến.","key":false}],"originalNumber":5},{"passage":"Khi xây dựng mô hình mạng gia đình gồm Modem cáp quang, Router Wi-Fi, Laptop, Máy tính bàn và Điện thoại:","claims":[{"t":"Máy tính bàn có thể kết nối với Router Wi-Fi thông qua dây cáp mạng cắm vào cổng RJ45.","key":true},{"t":"Laptop và Điện thoại thông minh kết nối vào mạng thông qua sóng Wi-Fi do WAP/Router Wi-Fi phát ra.","key":true},{"t":"Nếu rút nguồn điện của Modem cáp quang, các máy tính vẫn có thể truy cập các trang web trên Internet bình thường.","key":false},{"t":"Router Wi-Fi gia đình thường tích hợp sẵn bộ chuyển mạch Switch nhiều cổng và điểm truy cập không dây WAP.","key":true}],"originalNumber":6},{"passage":"Xét khái niệm địa chỉ IP và địa chỉ MAC trong mạng máy tính:","claims":[{"t":"Địa chỉ IP là địa chỉ logic có thể thay đổi tùy thuộc vào vị trí mạng mà thiết bị kết nối vào.","key":true},{"t":"Địa chỉ MAC là địa chỉ vật lý duy nhất được gán cố định cho card mạng từ khi sản xuất.","key":true,"explain":"Trong sách phổ thông MAC thường được mô tả là địa chỉ phần cứng; có thể có địa chỉ MAC ngẫu nhiên/đổi ở cấp hệ điều hành."},{"t":"Địa chỉ IPv4 chuẩn gồm 32 bit, thường viết dưới dạng 4 số thập phân phân tách bởi dấu chấm.","key":true},{"t":"Địa chỉ MAC gồm 32 bit và được viết hoàn toàn bằng các số nhị phân 0 và 1.","key":false}],"originalNumber":7},{"passage":"Xét hoạt động của bộ giao thức truyền thông TCP/IP trên Internet:","claims":[{"t":"Bộ giao thức TCP/IP là chuẩn truyền thông làm nền tảng cho mạng Internet toàn cầu.","key":true},{"t":"Giao thức IP chịu trách nhiệm chia nhỏ tệp dữ liệu và kiểm tra lỗi gói tin ở máy nhận.","key":false},{"t":"Giao thức TCP chịu trách nhiệm đảm bảo truyền dữ liệu tin cậy, đóng gói và đánh số thứ tự các gói tin.","key":true},{"t":"Khi gói tin di chuyển qua các Router, địa chỉ IP nguồn và IP đích trong header gói tin vẫn giữ nguyên.","key":true,"explain":"Đúng trong mô hình định tuyến IP thuần, nhưng không đúng tuyệt đối trong mạng dùng NAT."}],"originalNumber":8},{"passage":"Một máy tính có địa chỉ IPv4 nhị phân: 11000000.10101000.00000001.00001010:","claims":[{"t":"Byte đầu tiên 11000000 chuyển sang số thập phân có giá trị là 192.","key":true},{"t":"Byte thứ hai 10101000 chuyển sang số thập phân có giá trị là 168.","key":true},{"t":"Địa chỉ IP trên khi viết dưới dạng thập phân chấm (dot-decimal) là 192.168.1.10.","key":true},{"t":"Hai máy tính khác nhau cùng kết nối chung một mạng LAN có thể đặt trùng địa chỉ IP này mà không bị xung đột.","key":false}],"originalNumber":9},{"passage":"Xét quy trình và điều kiện chia sẻ thư mục trong mạng LAN Windows:","claims":[{"t":"Để chia sẻ thư mục, máy tính chia sẻ phải bật tính năng Network Discovery và File Sharing.","key":true},{"t":"Quyền \"Read\" cho phép người dùng từ máy khác xem và tải tệp về, nhưng không được sửa hay xóa tệp gốc.","key":true},{"t":"Quyền \"Full Control\" cho phép người dùng từ máy khác có toàn quyền chỉnh sửa, tạo mới và xóa tệp trong thư mục.","key":true},{"t":"Sau khi chia sẻ, bất kỳ ai trên Internet ở bất kỳ đâu trên thế giới cũng tự động truy cập được thư mục đó mà không cần mạng LAN.","key":false}],"originalNumber":10},{"passage":"Xét việc chia sẻ máy in trong phòng máy tính trường học:","claims":[{"t":"Máy in nối trực tiếp vào máy tính A qua cổng USB có thể được chia sẻ cho các máy tính B, C trong cùng mạng LAN.","key":true},{"t":"Khi máy tính A tắt nguồn hoàn toàn, máy tính B vẫn có thể điều khiển máy in đó ra lệnh in bình thường.","key":false},{"t":"Các máy tính B, C muốn in nhờ cần phải cài đặt trình điều khiển (Driver) máy in tương thích.","key":true},{"t":"Chia sẻ máy in giúp tiết kiệm chi phí đầu tư thiết bị cho trường học.","key":true}],"originalNumber":11},{"passage":"Cho các nhận định về văn hóa ứng xử và tuân thủ pháp luật trên không gian mạng:","claims":[{"t":"Mọi thông tin đăng tải trên mạng xã hội đều chính xác 100% và có thể tự do sao chép không cần kiểm chứng.","key":false},{"t":"Tôn trọng quan điểm cá nhân và sử dụng ngôn từ hòa nhã là biểu hiện của văn hóa ứng xử nhân văn.","key":true},{"t":"Tự ý lấy ảnh cá nhân của người khác để cắt ghép chế giễu trên mạng là hành vi vi phạm đạo đức và riêng tư.","key":true},{"t":"Khi sử dụng tài liệu từ Internet vào sản phẩm học tập, việc ghi rõ nguồn trích dẫn là tuân thủ Luật Sở hữu trí tuệ.","key":true}],"originalNumber":12}],"short":[],"essay":[],"sectionPoints":{"mc":6,"tf":4,"short":0,"essay":0}},{"id":"TH12-GK1-FORESTRY","subject":"forestry","title":"Công nghệ 12 (Lâm nghiệp) · Thi thử giữa kì I","description":"Sát ma trận THPT Tiểu La: 12 ABCD (3 điểm) + 4 Đúng/Sai (4 điểm). Phần tự luận 3 điểm được tách thành tài liệu ôn riêng. Điểm trên web là điểm TRẮC NGHIỆM quy đổi về thang 10 từ 7 điểm khách quan, không phải điểm toàn bài chính thức.","mode":"exam","minutes":45,"verified":false,"source":"Ma trận + nội dung ôn Công nghệ 12 THPT Tiểu La 2026–2027; câu mới do HaoEdu biên soạn, tham khảo hình thức đề từ thư viện học liệu và đề trường khác.","mc":[{"topic":6,"q":"Hành vi nào không phù hợp với khai thác rừng bền vững?","options":["Giữ lại khu vực bảo tồn và hành lang sinh thái.","Khai thác theo kế hoạch được phép, gắn với tái sinh và phục hồi.","Theo dõi tác động đến đất và nguồn nước.","Khai thác trái phép cây gỗ quý trong rừng tự nhiên."],"key":"D","level":"Nhận biết","explain":"Đáp án phù hợp: Khai thác trái phép cây gỗ quý trong rừng tự nhiên. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":3,"q":"Một trường học trồng cây bóng mát mới. Để tăng tỉ lệ sống trong vài tuần đầu, nhóm học sinh nên","options":["tưới hợp lí, cố định cây nếu cần và theo dõi tình trạng cây.","bỏ qua việc kiểm tra sau trồng.","đào lại bộ rễ mỗi ngày để quan sát.","tưới ngập liên tục dù đất đã úng."],"key":"A","level":"Vận dụng","explain":"Đáp án phù hợp: tưới hợp lí, cố định cây nếu cần và theo dõi tình trạng cây. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":5,"q":"Một địa phương thường có mưa ổn định đầu mùa và nắng gay gắt kéo dài về sau. Thời vụ trồng cây rừng phù hợp nhất thường là","options":["đầu mùa mưa khi đất đủ ẩm, tránh ngập úng kéo dài.","đỉnh mùa khô khi đất thiếu nước nghiêm trọng.","bất kì ngày nào, không cần xét thời tiết.","ngay giữa đợt bão lớn."],"key":"A","level":"Vận dụng","explain":"Đáp án phù hợp: đầu mùa mưa khi đất đủ ẩm, tránh ngập úng kéo dài. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":3,"q":"Tại một khu trồng cây non, cỏ dại mọc dày và cạnh tranh nước, dinh dưỡng. Việc ưu tiên nên làm là","options":["chặt bỏ cây non để cây cỏ phát triển.","bón thêm thuốc diệt cỏ tùy ý không theo hướng dẫn.","ngừng tưới trong mùa khô.","làm cỏ quanh gốc kết hợp kiểm tra độ ẩm và tình trạng cây."],"key":"D","level":"Vận dụng","explain":"Đáp án phù hợp: làm cỏ quanh gốc kết hợp kiểm tra độ ẩm và tình trạng cây. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":4,"q":"Sinh trưởng của cây rừng được hiểu là","options":["sự biến mất của mô sống.","chỉ là quá trình ra hoa kết quả.","việc cây đổi tên loài.","sự tăng về kích thước và khối lượng của cây theo thời gian."],"key":"D","level":"Nhận biết","explain":"Đáp án phù hợp: sự tăng về kích thước và khối lượng của cây theo thời gian. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":4,"q":"Phát triển của cây rừng bao gồm","options":["những biến đổi về chất, hình thành và hoàn thiện cơ quan qua các giai đoạn sống.","chỉ hiện tượng rụng lá do gió mạnh.","chỉ sự tăng đường kính thân.","chỉ sự thay đổi vị trí địa lí."],"key":"A","level":"Nhận biết","explain":"Đáp án phù hợp: những biến đổi về chất, hình thành và hoàn thiện cơ quan qua các giai đoạn sống. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":3,"q":"Chăm sóc rừng sau khi trồng thường bao gồm hoạt động nào?","options":["Làm cỏ, vun xới, bón phân phù hợp và kiểm tra sâu bệnh.","Phủ kín mọi cây non bằng vật liệu không xuyên sáng.","Chỉ chặt toàn bộ cây mới trồng.","Ngừng theo dõi cây trong nhiều năm."],"key":"A","level":"Nhận biết","explain":"Đáp án phù hợp: Làm cỏ, vun xới, bón phân phù hợp và kiểm tra sâu bệnh. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":3,"q":"Nhiệm vụ quan trọng của trồng rừng trên đất trống, đồi núi trọc là","options":["khôi phục độ che phủ thực vật, bảo vệ đất và tạo nguồn lâm sản phù hợp.","tăng tốc xói mòn đất.","ngăn cây rừng phát triển rễ.","loại bỏ hoàn toàn hệ động vật."],"key":"A","level":"Nhận biết","explain":"Đáp án phù hợp: khôi phục độ che phủ thực vật, bảo vệ đất và tạo nguồn lâm sản phù hợp. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":5,"q":"Ưu thế thường gặp của trồng rừng bằng cây con so với gieo hạt trực tiếp là","options":["không cần vận chuyển cây giống.","có thể chủ động chọn cây giống đủ tiêu chuẩn và tăng khả năng thiết lập ban đầu trong điều kiện phù hợp.","luôn có chi phí thấp hơn trong mọi hoàn cảnh.","không bao giờ cần chăm sóc sau trồng."],"key":"B","level":"Thông hiểu","explain":"Đáp án phù hợp: có thể chủ động chọn cây giống đủ tiêu chuẩn và tăng khả năng thiết lập ban đầu trong điều kiện phù hợp. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":4,"q":"Cây non mới trồng có bộ rễ chưa phát triển tốt. Biện pháp kĩ thuật phù hợp là","options":["tỉa cành quá mạnh khi cây đang yếu.","giữ ẩm vừa đủ, hạn chế cỏ cạnh tranh và bảo vệ cây khỏi tác động bất lợi.","không kiểm tra độ ẩm trong mùa khô.","khai thác ngay cây non để có gỗ."],"key":"B","level":"Vận dụng","explain":"Đáp án phù hợp: giữ ẩm vừa đủ, hạn chế cỏ cạnh tranh và bảo vệ cây khỏi tác động bất lợi. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":6,"q":"Đối tượng nào có trách nhiệm tham gia bảo vệ rừng?","options":["Cơ quan quản lí, chủ rừng, tổ chức và cộng đồng theo trách nhiệm pháp luật.","Chỉ người kinh doanh đồ gỗ.","Chỉ riêng kiểm lâm.","Chỉ người sống sát rừng."],"key":"A","level":"Nhận biết","explain":"Đáp án phù hợp: Cơ quan quản lí, chủ rừng, tổ chức và cộng đồng theo trách nhiệm pháp luật. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":6,"q":"Bảo vệ và khai thác tài nguyên rừng bền vững nhằm","options":["duy trì chức năng sinh thái và giá trị kinh tế - xã hội của rừng về lâu dài.","loại bỏ mọi hoạt động sinh kế hợp pháp.","chuyển toàn bộ rừng phòng hộ thành khu công nghiệp.","tối đa hóa lượng gỗ lấy trong một năm bất chấp khả năng phục hồi."],"key":"A","level":"Nhận biết","explain":"Đáp án phù hợp: duy trì chức năng sinh thái và giá trị kinh tế - xã hội của rừng về lâu dài. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."}],"tf":[{"topic":1,"passage":"Một huyện miền núi cần lựa chọn giải pháp giảm xói mòn đất và phát triển sinh kế từ rừng."
