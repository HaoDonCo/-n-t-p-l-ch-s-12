ều kiện và quy trình lâm nghiệp phù hợp trong tài liệu ôn tập."},{"t":"Phát triển chỉ là tăng chiều cao, không bao gồm hình thành cơ quan sinh sản.","key":false,"explain":"Đối chiếu nhận định với vai trò, điều kiện và quy trình lâm nghiệp phù hợp trong tài liệu ôn tập."},{"t":"Có thể điều chỉnh chăm sóc theo từng giai đoạn sinh trưởng và phát triển.","key":true,"explain":"Đối chiếu nhận định với vai trò, điều kiện và quy trình lâm nghiệp phù hợp trong tài liệu ôn tập."},{"t":"Mọi cây cùng loài đều luôn ra hoa ở đúng một thời điểm bất kể môi trường.","key":false,"explain":"Đối chiếu nhận định với vai trò, điều kiện và quy trình lâm nghiệp phù hợp trong tài liệu ôn tập."}],"explain":""},{"topic":5,"passage":"Một đội lâm nghiệp lựa chọn giữa gieo hạt trực tiếp và trồng cây con có bầu để phủ xanh đất trống.","claims":[{"t":"Cả hai phương pháp đều có điều kiện áp dụng và ưu nhược điểm riêng.","key":true,"explain":"Đối chiếu nhận định với vai trò, điều kiện và quy trình lâm nghiệp phù hợp trong tài liệu ôn tập."},{"t":"Trồng cây con có bầu giúp chủ động lựa chọn cây giống đủ tiêu chuẩn.","key":true,"explain":"Đối chiếu nhận định với vai trò, điều kiện và quy trình lâm nghiệp phù hợp trong tài liệu ôn tập."},{"t":"Không cần tính đến mùa mưa hay điều kiện đất khi xác định thời vụ trồng.","key":false,"explain":"Đối chiếu nhận định với vai trò, điều kiện và quy trình lâm nghiệp phù hợp trong tài liệu ôn tập."},{"t":"Sau trồng, cần kiểm tra độ ẩm và tình trạng cây để chăm sóc phù hợp.","key":true,"explain":"Đối chiếu nhận định với vai trò, điều kiện và quy trình lâm nghiệp phù hợp trong tài liệu ôn tập."}],"explain":""}],"short":[],"essay":[],"sectionPoints":{"mc":3,"tf":4,"short":0,"essay":0}},{"id":"TH12-GK1-FORESTRY-TRAINING","subject":"forestry","title":"Luyện lâm nghiệp Bài 1–6 · Ngân hàng 36 ABCD + 8 Đ/S","description":"Ngân hàng tự biên soạn mở rộng, có câu thực tế về rừng phòng hộ, cháy rừng, trồng cây, sinh trưởng, khai thác bền vững. Chọn đúng mới chuyển câu; đây là nội dung luyện tập, không phải đề chính thức.","mode":"mastery","minutes":0,"verified":false,"source":"Bám nội dung ôn THPT Tiểu La + tham khảo phong cách câu hỏi Công nghệ 12 công bố công khai","mc":[{"topic":1,"q":"Một khu rừng đầu nguồn có vai trò nào quan trọng nhất đối với khu dân cư ở hạ lưu?","options":["Điều tiết dòng chảy, giảm xói mòn và nguy cơ lũ.","Tăng độ mặn của sông.","Làm nước mưa bốc hơi hoàn toàn.","Ngăn mọi hiện tượng thời tiết cực đoan."],"key":"A","level":"Nhận biết","explain":"Đáp án phù hợp: Điều tiết dòng chảy, giảm xói mòn và nguy cơ lũ. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":1,"q":"Sản phẩm nào sau đây có thể được khai thác từ hoạt động lâm nghiệp theo hướng bền vững?","options":["Gỗ, tre, nhựa thông và một số lâm sản ngoài gỗ.","Xi măng từ nhà máy.","Dầu thô khai thác ngoài khơi.","Quặng sắt từ mỏ lộ thiên."],"key":"A","level":"Nhận biết","explain":"Đáp án phù hợp: Gỗ, tre, nhựa thông và một số lâm sản ngoài gỗ. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":1,"q":"Tại vùng ven biển thường bị gió mạnh và cát bay, loại rừng nào cần ưu tiên bảo vệ?","options":["Rừng trồng thay bằng bãi đỗ xe.","Rừng phòng hộ chắn gió, chắn cát.","Rừng trồng chỉ nhằm lấy gỗ ngắn ngày.","Rừng ở khu vực không chịu tác động của gió."],"key":"B","level":"Thông hiểu","explain":"Đáp án phù hợp: Rừng phòng hộ chắn gió, chắn cát. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":1,"q":"Một xã muốn phát triển du lịch sinh thái nhưng vẫn bảo tồn các loài quý hiếm. Biện pháp hợp lí nhất là","options":["mở đường vào mọi vùng lõi để tăng lượng khách.","quy hoạch tuyến tham quan có kiểm soát, giám sát tác động và bảo vệ sinh cảnh.","cho phép du khách tự mang động vật rừng về làm quà.","chặt bớt cây lâu năm để tạo không gian rộng."],"key":"B","level":"Vận dụng","explain":"Đáp án phù hợp: quy hoạch tuyến tham quan có kiểm soát, giám sát tác động và bảo vệ sinh cảnh. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":1,"q":"Rừng góp phần ứng phó với biến đổi khí hậu chủ yếu bằng cơ chế nào?","options":["Phân hủy toàn bộ CO₂ của khí quyển ngay lập tức.","Làm biến mất nhu cầu sử dụng nhiên liệu hóa thạch.","Hấp thụ và tích lũy một phần CO₂ trong sinh khối và đất.","Biến mọi khí thải thành khí oxygen."],"key":"C","level":"Thông hiểu","explain":"Đáp án phù hợp: Hấp thụ và tích lũy một phần CO₂ trong sinh khối và đất. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":1,"q":"Lớp học tổ chức hoạt động phục hồi một khoảng đất trống gần suối. Chỉ số nào phù hợp nhất để theo dõi hiệu quả sau hai năm?","options":["Số lượt đi dã ngoại mỗi tháng.","Số lượng biển quảng cáo bên đường.","Tỉ lệ cây bản địa sống, độ che phủ thực vật và mức độ xói mòn đất.","Số lượng ảnh chụp đăng mạng xã hội."],"key":"C","level":"Vận dụng","explain":"Đáp án phù hợp: Tỉ lệ cây bản địa sống, độ che phủ thực vật và mức độ xói mòn đất. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":2,"q":"Hoạt động nào thuộc nhóm hoạt động lâm nghiệp cơ bản?","options":["Khoan thăm dò dầu khí dưới biển.","Chỉ sản xuất thiết bị y tế.","Chỉ kinh doanh đồ điện gia dụng.","Bảo vệ, phát triển, khai thác và chế biến lâm sản theo quy định."],"key":"D","level":"Nhận biết","explain":"Đáp án phù hợp: Bảo vệ, phát triển, khai thác và chế biến lâm sản theo quy định. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":2,"q":"Nguyên nhân nào có thể trực tiếp gây suy thoái tài nguyên rừng ở khu vực miền núi?","options":["Đặt biển cảnh báo nguy cơ cháy.","Tăng cường tuần tra rừng.","Trồng bổ sung cây bản địa.","Khai thác gỗ trái phép và chuyển đổi đất rừng thiếu kiểm soát."],"key":"D","level":"Thông hiểu","explain":"Đáp án phù hợp: Khai thác gỗ trái phép và chuyển đổi đất rừng thiếu kiểm soát. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":2,"q":"Sau một mùa khô, nhiều vụ cháy xảy ra gần khu vực đốt thực bì làm nương. Biện pháp phù hợp nhất là","options":["chỉ ghi nhận thiệt hại sau khi cháy.","thiết lập đường băng cản lửa, kiểm soát nguồn lửa và cảnh báo sớm.","đốt nhiều hơn để triệt tiêu nguy cơ cháy.","ngừng mọi hoạt động giáo dục cộng đồng."],"key":"B","level":"Vận dụng","explain":"Đáp án phù hợp: thiết lập đường băng cản lửa, kiểm soát nguồn lửa và cảnh báo sớm. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":2,"q":"Khi phát hiện dấu hiệu khai thác gỗ trái phép, người dân nên","options":["báo cho cơ quan chức năng hoặc lực lượng bảo vệ rừng, cung cấp thông tin an toàn.","đối đầu trực tiếp với nhóm nghi vi phạm.","mang dụng cụ đến tự thu giữ toàn bộ gỗ.","đăng thông tin chưa kiểm chứng kèm địa chỉ cá nhân lên mạng."],"key":"A","level":"Vận dụng","explain":"Đáp án phù hợp: báo cho cơ quan chức năng hoặc lực lượng bảo vệ rừng, cung cấp thông tin an toàn. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":2,"q":"Để giảm suy thoái rừng do chăn thả tự do và xâm lấn đất, địa phương nên ưu tiên","options":["chỉ trồng một loài cây không quan tâm điều kiện sinh thái.","loại bỏ mọi hoạt động giám sát.","cho phép chuyển đổi toàn bộ đất rừng ngay.","xác định ranh giới, quy hoạch sử dụng đất và phối hợp cộng đồng quản lí."],"key":"D","level":"Thông hiểu","explain":"Đáp án phù hợp: xác định ranh giới, quy hoạch sử dụng đất và phối hợp cộng đồng quản lí. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":2,"q":"Vì sao việc trồng lại rừng không thể lập tức thay thế đầy đủ rừng tự nhiên đã mất?","options":["Vì cây trồng không quang hợp.","Vì cấu trúc hệ sinh thái, đa dạng loài và đất rừng cần thời gian dài để phục hồi.","Vì rừng tự nhiên không có giá trị sinh thái.","Vì rừng trồng không bao giờ có giá trị kinh tế."],"key":"B","level":"Vận dụng","explain":"Đáp án phù hợp: Vì cấu trúc hệ sinh thái, đa dạng loài và đất rừng cần thời gian dài để phục hồi. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":3,"q":"Nhiệm vụ quan trọng của trồng rừng trên đất trống, đồi núi trọc là","options":["khôi phục độ che phủ thực vật, bảo vệ đất và tạo nguồn lâm sản phù hợp.","tăng tốc xói mòn đất.","ngăn cây rừng phát triển rễ.","loại bỏ hoàn toàn hệ động vật."],"key":"A","level":"Nhận biết","explain":"Đáp án phù hợp: khôi phục độ che phủ thực vật, bảo vệ đất và tạo nguồn lâm sản phù hợp. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":3,"q":"Chăm sóc rừng sau khi trồng thường bao gồm hoạt động nào?","options":["Làm cỏ, vun xới, bón phân phù hợp và kiểm tra sâu bệnh.","Phủ kín mọi cây non bằng vật liệu không xuyên sáng.","Chỉ chặt toàn bộ cây mới trồng.","Ngừng theo dõi cây trong nhiều năm."],"key":"A","level":"Nhận biết","explain":"Đáp án phù hợp: Làm cỏ, vun xới, bón phân phù hợp và kiểm tra sâu bệnh. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":3,"q":"Tại một khu trồng cây non, cỏ dại mọc dày và cạnh tranh nước, dinh dưỡng. Việc ưu tiên nên làm là","options":["chặt bỏ cây non để cây cỏ phát triển.","bón thêm thuốc diệt cỏ tùy ý không theo hướng dẫn.","ngừng tưới trong mùa khô.","làm cỏ quanh gốc kết hợp kiểm tra độ ẩm và tình trạng cây."],"key":"D","level":"Vận dụng","explain":"Đáp án phù hợp: làm cỏ quanh gốc kết hợp kiểm tra độ ẩm và tình trạng cây. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":3,"q":"Một trường học trồng cây bóng mát mới. Để tăng tỉ lệ sống trong vài tuần đầu, nhóm học sinh nên","options":["tưới hợp lí, cố định cây nếu cần và theo dõi tình trạng cây.","bỏ qua việc kiểm tra sau trồng.","đào lại bộ rễ mỗi ngày để quan sát.","tưới ngập liên tục dù đất đã úng."],"key":"A","level":"Vận dụng","explain":"Đáp án phù hợp: tưới hợp lí, cố định cây nếu cần và theo dõi tình trạng cây. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":3,"q":"Mục tiêu của việc trồng rừng phòng hộ ven biển là gì?","options":["Tăng độ mặn của nước ngọt.","Góp phần chắn gió, hạn chế cát bay, bảo vệ vùng ven bờ.","Tạo diện tích đất trống lớn.","Đẩy nhanh xói lở để mở rộng bờ biển."],"key":"B","level":"Nhận biết","explain":"Đáp án phù hợp: Góp phần chắn gió, hạn chế cát bay, bảo vệ vùng ven bờ. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":3,"q":"Vì sao cần kiểm tra tỉ lệ cây sống và trồng dặm sau đợt trồng rừng?","options":["Vì tất cả cây trồng ban đầu đều phải thay bằng cây mới.","Để loại bỏ tác dụng giữ đất của rừng.","Để bù những vị trí cây chết, giúp duy trì mật độ thích hợp.","Để làm giảm diện tích rừng đã phục hồi."],"key":"C","level":"Thông hiểu","explain":"Đáp án phù hợp: Để bù những vị trí cây chết, giúp duy trì mật độ thích hợp. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":4,"q":"Sinh trưởng của cây rừng được hiểu là","options":["sự biến mất của mô sống.","chỉ là quá trình ra hoa kết quả.","việc cây đổi tên loài.","sự tăng về kích thước và khối lượng của cây theo thời gian."],"key":"D","level":"Nhận biết","explain":"Đáp án phù hợp: sự tăng về kích thước và khối lượng của cây theo thời gian. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":4,"q":"Phát triển của cây rừng bao gồm","options":["những biến đổi về chất, hình thành và hoàn thiện cơ quan qua các giai đoạn sống.","chỉ hiện tượng rụng lá do gió mạnh.","chỉ sự tăng đường kính thân.","chỉ sự thay đổi vị trí địa lí."],"key":"A","level":"Nhận biết","explain":"Đáp án phù hợp: những biến đổi về chất, hình thành và hoàn thiện cơ quan qua các giai đoạn sống. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":4,"q":"Cây non mới trồng có bộ rễ chưa phát triển tốt. Biện pháp kĩ thuật phù hợp là","options":["tỉa cành quá mạnh khi cây đang yếu.","giữ ẩm vừa đủ, hạn chế cỏ cạnh tranh và bảo vệ cây khỏi tác động bất lợi.","không kiểm tra độ ẩm trong mùa khô.","khai thác ngay cây non để có gỗ."],"key":"B","level":"Vận dụng","explain":"Đáp án phù hợp: giữ ẩm vừa đủ, hạn chế cỏ cạnh tranh và bảo vệ cây khỏi tác động bất lợi. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":4,"q":"Ở giai đoạn cây rừng phát triển mạnh chiều cao và đường kính, chăm sóc hợp lí thường nhằm","options":["làm đất bị nén chặt hơn.","loại bỏ mọi vi sinh vật có ích.","ngăn tuyệt đối hoạt động quang hợp.","giảm cạnh tranh ánh sáng, nước và dinh dưỡng giữa các cây."],"key":"D","level":"Thông hiểu","explain":"Đáp án phù hợp: giảm cạnh tranh ánh sáng, nước và dinh dưỡng giữa các cây. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":4,"q":"Dấu hiệu nào thường liên quan rõ nhất đến giai đoạn cây rừng bước vào sinh sản?","options":["Hình thành hoa, quả hoặc hạt tùy loài.","Cây không còn quá trình trao đổi chất.","Mầm chưa xuất hiện.","Bộ rễ mới chỉ có một tế bào."],"key":"A","level":"Nhận biết","explain":"Đáp án phù hợp: Hình thành hoa, quả hoặc hạt tùy loài. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":4,"q":"Một lô rừng trồng đang tăng trưởng mạnh nhưng mật độ quá dày khiến cây còi cọc. Phương án nên xem xét là","options":["tưới thêm nước mà không cần khảo sát.","tỉa thưa có kế hoạch theo loài, tuổi và mục tiêu kinh doanh.","chỉ tăng mật độ thêm nữa.","đốt toàn bộ lớp thảm mục."],"key":"B","level":"Vận dụng","explain":"Đáp án phù hợp: tỉa thưa có kế hoạch theo loài, tuổi và mục tiêu kinh doanh. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":5,"q":"Ưu thế thường gặp của trồng rừng bằng cây con so với gieo hạt trực tiếp là","options":["không cần vận chuyển cây giống.","có thể chủ động chọn cây giống đủ tiêu chuẩn và tăng khả năng thiết lập ban đầu trong điều kiện phù hợp.","luôn có chi phí thấp hơn trong mọi hoàn cảnh.","không bao giờ cần chăm sóc sau trồng."],"key":"B","level":"Thông hiểu","explain":"Đáp án phù hợp: có thể chủ động chọn cây giống đủ tiêu chuẩn và tăng khả năng thiết lập ban đầu trong điều kiện phù hợp. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":5,"q":"Gieo hạt trực tiếp thường phù hợp hơn khi","options":["hạt đủ sức nảy mầm, điều kiện đất và ẩm thích hợp, có biện pháp bảo vệ hạt.","đất quá khô và hạt không thể nảy mầm.","mục tiêu là không cần quan tâm tới cỏ dại hay sâu hại.","loài cây chỉ có thể nhân giống bằng giâm cành."],"key":"A","level":"Thông hiểu","explain":"Đáp án phù hợp: hạt đủ sức nảy mầm, điều kiện đất và ẩm thích hợp, có biện pháp bảo vệ hạt. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":5,"q":"Một địa phương thường có mưa ổn định đầu mùa và nắng gay gắt kéo dài về sau. Thời vụ trồng cây rừng phù hợp nhất thường là","options":["đầu mùa mưa khi đất đủ ẩm, tránh ngập úng kéo dài.","đỉnh mùa khô khi đất thiếu nước nghiêm trọng.","bất kì ngày nào, không cần xét thời tiết.","ngay giữa đợt bão lớn."],"key":"A","level":"Vận dụng","explain":"Đáp án phù hợp: đầu mùa mưa khi đất đủ ẩm, tránh ngập úng kéo dài. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":5,"q":"Khi trồng cây con có bầu đất, thao tác nào phù hợp để hạn chế tổn thương rễ?","options":["để nguyên lớp nhựa bầu không phân hủy trong mọi trường hợp.","chặt hết rễ trước khi trồng.","Tháo hoặc rạch bỏ vỏ bầu theo hướng dẫn, giữ bầu đất ổn định và lấp đất vừa kín gốc.","giật mạnh rễ ra khỏi bầu rồi phơi nắng."],"key":"C","level":"Vận dụng","explain":"Đáp án phù hợp: Tháo hoặc rạch bỏ vỏ bầu theo hướng dẫn, giữ bầu đất ổn định và lấp đất vừa kín gốc. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":5,"q":"Vì sao không nên áp dụng một lịch tưới giống nhau cho mọi khu rừng trồng?","options":["Vì tưới luôn gây hại cho cây.","Vì mọi loài đều không hấp thụ nước.","Vì nhu cầu nước còn phụ thuộc loài cây, thời tiết, đất và giai đoạn phát triển.","Vì rễ cây không chịu ảnh hưởng bởi đất."],"key":"C","level":"Thông hiểu","explain":"Đáp án phù hợp: Vì nhu cầu nước còn phụ thuộc loài cây, thời tiết, đất và giai đoạn phát triển. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":5,"q":"Ở vùng đất dốc dễ xói mòn, bố trí hố trồng và biện pháp giữ đất nên","options":["dồn đất mùn xuống một điểm không theo quy hoạch.","tạo rãnh thẳng dốc để nước chảy nhanh nhất.","theo đường đồng mức và kết hợp che phủ thích hợp khi có thể.","loại bỏ toàn bộ thực bì rồi để đất trống dài ngày."],"key":"C","level":"Vận dụng","explain":"Đáp án phù hợp: theo đường đồng mức và kết hợp che phủ thích hợp khi có thể. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":6,"q":"Bảo vệ và khai thác tài nguyên rừng bền vững nhằm","options":["duy trì chức năng sinh thái và giá trị kinh tế - xã hội của rừng về lâu dài.","loại bỏ mọi hoạt động sinh kế hợp pháp.","chuyển toàn bộ rừng phòng hộ thành khu công nghiệp.","tối đa hóa lượng gỗ lấy trong một năm bất chấp khả năng phục hồi."],"key":"A","level":"Nhận biết","explain":"Đáp án phù hợp: duy trì chức năng sinh thái và giá trị kinh tế - xã hội của rừng về lâu dài. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":6,"q":"Đối tượng nào có trách nhiệm tham gia bảo vệ rừng?","options":["Cơ quan quản lí, chủ rừng, tổ chức và cộng đồng theo trách nhiệm pháp luật.","Chỉ người kinh doanh đồ gỗ.","Chỉ riêng kiểm lâm.","Chỉ người sống sát rừng."],"key":"A","level":"Nhận biết","explain":"Đáp án phù hợp: Cơ quan quản lí, chủ rừng, tổ chức và cộng đồng theo trách nhiệm pháp luật. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":6,"q":"Hành vi nào không phù hợp với khai thác rừng bền vững?","options":["Giữ lại khu vực bảo tồn và hành lang sinh thái.","Khai thác theo kế hoạch được phép, gắn với tái sinh và phục hồi.","Theo dõi tác động đến đất và nguồn nước.","Khai thác trái phép cây gỗ quý trong rừng tự nhiên."],"key":"D","level":"Nhận biết","explain":"Đáp án phù hợp: Khai thác trái phép cây gỗ quý trong rừng tự nhiên. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":6,"q":"Một đơn vị sản xuất muốn chứng minh gỗ có nguồn gốc hợp pháp. Họ nên","options":["xóa thông tin lô gỗ khi giao hàng.","chỉ dựa vào lời quảng cáo không kiểm chứng.","lưu hồ sơ nguồn gốc, tuân thủ quy định khai thác và truy xuất chuỗi cung ứng.","mua gỗ không rõ nguồn gốc nếu giá rẻ."],"key":"C","level":"Thông hiểu","explain":"Đáp án phù hợp: lưu hồ sơ nguồn gốc, tuân thủ quy định khai thác và truy xuất chuỗi cung ứng. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":6,"q":"Một khu rừng có nhiều loài thú quý hiếm nhưng xuất hiện bẫy động vật trái phép. Ưu tiên phù hợp là","options":["đăng vị trí chính xác của động vật quý hiếm lên mạng.","cho phép săn bắt vì khu vực vẫn còn cây xanh.","ghi nhận, thông báo cho lực lượng bảo vệ rừng và tăng giám sát sinh cảnh.","khuyến khích mọi người tự đi tháo bẫy ở nơi nguy hiểm."],"key":"C","level":"Vận dụng","explain":"Đáp án phù hợp: ghi nhận, thông báo cho lực lượng bảo vệ rừng và tăng giám sát sinh cảnh. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":6,"q":"Sau khai thác gỗ rừng trồng đúng quy định, biện pháp nào giúp duy trì sản xuất lâu dài?","options":["Tăng khai thác tại khu vực cấm.","Để trống đất vô thời hạn.","Tổ chức tái trồng hoặc phục hồi phù hợp, bảo vệ đất và nguồn nước.","Đốt hết thảm thực vật và bỏ mặc đất."],"key":"C","level":"Thông hiểu","explain":"Đáp án phù hợp: Tổ chức tái trồng hoặc phục hồi phù hợp, bảo vệ đất và nguồn nước. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."}],"tf":[{"topic":1,"passage":"Một huyện miền núi cần lựa chọn giải pháp giảm xói mòn đất và phát triển sinh kế từ rừng.","claims":[{"t":"Rừng đầu nguồn có thể góp phần điều tiết dòng chảy và hạn chế xói mòn.","key":true,"explain":"Đối chiếu nhận định với vai trò, điều kiện và quy trình lâm nghiệp phù hợp trong tài liệu ôn tập."},{"t":"Sản phẩm lâm nghiệp chỉ bao gồm gỗ, không có lâm sản ngoài gỗ.","key":false,"explain":"Đối chiếu nhận định với vai trò, điều kiện và quy trình lâm nghiệp phù hợp trong tài liệu ôn tập."},{"t":"Giữ rừng bản địa có ý nghĩa đối với bảo tồn đa dạng sinh học.","key":true,"explain":"Đối chiếu nhận định với vai trò, điều kiện và quy trình lâm nghiệp phù hợp trong tài liệu ôn tập."},{"t":"Muốn phát triển du lịch sinh thái thì phải chặt bỏ rừng để tăng diện tích bãi xe.","key":false,"explain":"Đối chiếu nhận định với vai trò, điều kiện và quy trình lâm nghiệp phù hợp trong tài liệu ôn tập."}],"explain":""},{"topic":2,"passage":"Sau nhiều năm, khu rừng gần một xã bị giảm độ che phủ do xâm lấn đất và khai thác trái phép.","claims":[{"t":"Chuyển đổi đất rừng không kiểm soát có thể làm suy thoái tài nguyên rừng.","key":true,"explain":"Đối chiếu nhận định với vai trò, điều kiện và quy trình lâm nghiệp phù hợp trong tài liệu ôn tập."},{"t":"Cần kết hợp quy hoạch đất, tuần tra và tuyên truyền cộng đồng.","key":true,"explain":"Đối chiếu nhận định với vai trò, điều kiện và quy trình lâm nghiệp phù hợp trong tài liệu ôn tập."},{"t":"Mọi khu vực suy thoái đều có thể phục hồi ngay lập tức trong một tuần.","key":false,"explain":"Đối chiếu nhận định với vai trò, điều kiện và quy trình lâm nghiệp phù hợp  lan rộng trong mùa khô.","claims":[{"t":"Kiểm soát nguồn lửa và cảnh báo nguy cơ cháy là biện pháp phòng ngừa phù hợp.","key":true,"explain":"Đối chiếu nhận định với vai trò, điều kiện và quy trình lâm nghiệp phù hợp trong tài liệu ôn tập."},{"t":"Đường băng cản lửa là một trong những biện pháp giảm khả năng cháy lan.","key":true,"explain":"Đối chiếu nhận định với vai trò, điều kiện và quy trình lâm nghiệp phù hợp trong tài liệu ôn tập."},{"t":"Đốt thêm thực bì bất kể thời tiết luôn là phương pháp chữa cháy an toàn nhất.","key":false,"explain":"Đối chiếu nhận định với vai trò, điều kiện và quy trình lâm nghiệp phù hợp trong tài liệu ôn tập."},{"t":"Có thể phối hợp cơ quan chức năng và chủ rừng trong công tác phòng cháy.","key":true,"explain":"Đối chiếu nhận định với vai trò, điều kiện và quy trình lâm nghiệp phù hợp trong tài liệu ôn tập."}],"explain":""},{"topic":5,"passage":"Khu vực trồng keo trên đất dốc có gió mạnh và mùa mưa rõ rệt.","claims":[{"t":"Cần lựa chọn thời vụ trồng phù hợp điều kiện thời tiết và độ ẩm đất.","key":true,"explain":"Đối chiếu nhận định với vai trò, điều kiện và quy trình lâm nghiệp phù hợp trong tài liệu ôn tập."},{"t":"Trên đất dốc, mọi biện pháp che phủ chống xói mòn đều không cần thiết.","key":false,"explain":"Đối chiếu nhận định với vai trò, điều kiện và quy trình lâm nghiệp phù hợp trong tài liệu ôn tập."},{"t":"Trồng theo thiết kế và kiểm tra cây giống giúp nâng cao hiệu quả trồng rừng.","key":true,"explain":"Đối chiếu nhận định với vai trò, điều kiện và quy trình lâm nghiệp phù hợp trong tài liệu ôn tập."},{"t":"Mật độ trồng hoàn toàn không liên quan tới mục tiêu kinh doanh hoặc đặc điểm loài.","key":false,"explain":"Đối chiếu nhận định với vai trò, điều kiện và quy trình lâm nghiệp phù hợp trong tài liệu ôn tập."}],"explain":""}],"short":[],"essay":[]},{"id":"GDQP12-GKI-MASTERY","pairGroupId":"GDQP12-GKI","subject":"gdqp","title":"GDQPAN 12 · Kiểm tra Giữa kì I (Đề 1 · Làm đúng qua câu + Học thuộc Tự luận)","description":"Đề 1 (Chế độ Luyện từng câu): Xuất hiện từng câu một, làm đúng mới qua câu tiếp theo (12 câu ABCD + 4 câu Đúng/Sai từ đề chính thức) kèm phần Học thuộc 3 câu Tự luận chi tiết.","source":"Đề kiểm tra Giữa kì I GDQPAN 12 & SGK Kết nối tri thức","mode":"mastery","minutes":0,"active":true,"draft":false,"verified":false,"sectionPoints":{"mc":3,"tf":4,"short":0,"essay":0},"mc":[{"q":"Câu 1. Tập đoàn nào đã phát động chiến tranh xâm lược Việt Nam vào ngày 30-4-1977?","options":["Tập đoàn Khmer Đỏ.","Tập đoàn Pol Pot – Ieng Sary.","Chính quyền Lon Nol.","Lực lượng Mặt trận Đoàn kết dân tộc cứu nước Cam-pu-chia."],"key":"B","explain":"Theo SGK Giáo dục quốc phòng và an ninh 12 (Bài 1, trang 5 – 6): Cuộc chiến tranh bảo vệ biên giới Tây Nam nhằm chống lại cuộc chiến tranh xâm lược do tập đoàn Pol Pot – Ieng Sary (Pôn Pốt – Iêng Xa-ry) gây ra; từ ngày 30/4/1977 chúng đẩy hoạt động chống phá trên đất liền lên một nấc thang mới, xâm phạm nhiều vùng lãnh thổ Việt Nam từ Hà Tiên đến Tây Ninh."},{"q":"Câu 2. Cuộc chiến đấu bảo vệ biên giới phía Bắc của Tổ quốc đã diễn ra vào khoảng thời gian nào?","options":["Từ tháng 4 đến tháng 5 năm 1975.","Từ tháng 12 năm 1978 đến tháng 1 năm 1979.","Từ tháng 2 năm 1979 đến năm 1989.","Từ tháng 3 năm 1988 đến năm 1989."],"key":"C","explain":"Sáng ngày 17/2/1979, cuộc chiến đấu bảo vệ biên giới phía Bắc bắt đầu diễn ra dọc tuyến biên giới từ Móng Cái (Quảng Ninh) đến Phong Thổ (Lai Châu) và kéo dài trên một số điểm biên giới (như mặt trận Vị Xuyên - Hà Tuyên) đến năm 1989."},{"q":"Câu 3. Tinh thần nào của nhân dân Việt Nam được khẳng định là nguồn sức mạnh to lớn, đập tan mọi âm mưu chống phá trong chiến tranh bảo vệ biên giới Tây Nam của Tổ quốc?","options":["Tinh thần độc lập, tự chủ và đoàn kết quốc tế trong sáng.","Tinh thần cảnh giác và kiên quyết phòng ngự.","Ý chí độc lập, tự chủ và tinh thần đại đoàn kết dân tộc.","Ý chí quyết thắng và sức mạnh của bộ đội chủ lực."],"key":"A","explain":"Theo SGK GDQPAN 12 (Bài 1, trang 6): Chiến thắng trong cuộc chiến tranh bảo vệ biên giới Tây Nam khẳng định đường lối độc lập, tự chủ đúng đắn của Đảng và tinh thần quốc tế trong sáng, thuỷ chung giữa nhân dân hai nước Việt Nam – Campuchia."},{"q":"Câu 4. Vì sao đấu tranh bảo vệ chủ quyền biển, đảo Việt Nam trong giai đoạn cách mạng mới luôn được Đảng ta xác định là nhiệm vụ thường xuyên, lâu dài và đặc biệt quan trọng?","options":["Vì biển, đảo Việt Nam có nguồn tài nguyên phong phú và là cửa ngõ giao thương quốc tế quan trọng.","Vì các thế lực thù địch đang tìm cách chia cắt và chiếm đoạt biển, đảo nước ta.","Vì biển, đảo có vị trí chiến lược đặc biệt quan trọng trong sự nghiệp xây dựng và bảo vệ Tổ quốc.","Vì việc bảo vệ chủ quyền biển, đảo là minh chứng cho tinh thần yêu nước và dân tộc của nhân dân."],"key":"C","explain":"Biển, đảo Việt Nam có vị trí chiến lược đặc biệt quan trọng cả về kinh tế - xã hội, quốc phòng và an ninh trong sự nghiệp xây dựng và bảo vệ Tổ quốc."},{"q":"Câu 5. Đối tượng tuyển sinh vào các trường Quân đội nhân dân phải có độ tuổi bao nhiêu nếu là quân nhân tại ngũ hoặc đã xuất ngũ và công dân hoàn thành nghĩa vụ tham gia Công an nhân dân?","options":["Không quá 20 tuổi.","Không quá 22 tuổi.","Không quá 23 tuổi.","Không quá 24 tuổi."],"key":"C","explain":"Theo SGK GDQPAN 12 (Bài 3, trang 23): Tiêu chuẩn về độ tuổi (tính đến năm dự tuyển): Thanh niên ngoài quân đội không quá 21 tuổi; quân nhân tại ngũ hoặc đã xuất ngũ và công dân hoàn thành nghĩa vụ tham gia công an nhân dân không quá 23 tuổi."},{"q":"Câu 6. Lực lượng nào sau đây có chức năng quản lí nhà nước về an ninh, trật tự, an toàn xã hội?","options":["Bộ đội Biên phòng.","Hải quân nhân dân.","Công an nhân dân.","Dân quân tự vệ."],"key":"C","explain":"Theo SGK GDQPAN 12 (Bài 2, trang 16): Công an nhân dân (Bộ Công an) có chức năng tham mưu với Đảng, Nhà nước và thực hiện quản lí nhà nước về bảo vệ an ninh quốc gia, bảo đảm trật tự, an toàn xã hội."},{"q":"Câu 7 (VD). Là học sinh trung học phổ thông, hành động nào sau đây thể hiện trách nhiệm trực tiếp và cụ thể nhất đối với sự nghiệp bảo vệ Tổ quốc hiện nay?","options":["Nghiên cứu sâu về các học thuyết quân sự của Việt Nam qua các thời kì.","Liên hệ, tìm hiểu và đăng kí sơ tuyển vào các trường Quân đội, Công an.","Tham gia các hoạt động thiện nguyện để giúp đỡ các gia đình quân nhân có hoàn cảnh khó khăn.","Thường xuyên theo dõi tin tức về tình hình biển, đảo để cập nhật thông tin chính xác."],"key":"B","explain":"Đối với học sinh lớp 12, việc chủ động tìm hiểu và đăng kí sơ tuyển vào các trường Quân đội, Công an (hoặc đăng kí nghĩa vụ quân sự khi đủ tuổi) là hành động trực tiếp, thiết thực gắn với nội dung định hướng nghề nghiệp quân sự, công an (Bài 3)."},{"q":"Câu 8. Phương án nào sau đây điền đúng từ hoặc cụm từ còn thiếu vào chỗ trống: \"Thắng lợi của cuộc đấu tranh bảo vệ chủ quyền biển, đảo Việt Nam là kết quả của sự chỉ đạo sáng suốt của Đảng Cộng sản Việt Nam, sự nỗ lực và phát huy sức mạnh tổng hợp của cả hệ thống chính trị, trong đó, Quân đội nhân dân Việt Nam, đặc biệt là Hải quân nhân dân Việt Nam đã trở thành ................... trong bảo vệ chủ quyền biển, đảo.\"","options":["ngọn cờ đầu","lực lượng nòng cốt","công cụ sắc bén","lực lượng chính"],"key":"B","explain":"Quân đội nhân dân Việt Nam, đặc biệt là Quân chủng Hải quân nhân dân Việt Nam là lực lượng nòng cốt trong sự nghiệp bảo vệ chủ quyền biển, đảo của Tổ quốc."},{"q":"Câu 9. Phương án nào sau đây điền đúng từ hoặc cụm từ còn thiếu vào chỗ trống: \"Hệ thống tổ chức của Công an nhân dân Việt Nam gồm có Bộ Công an; Công an cấp tỉnh; Công an cấp xã và ................... theo quy định của pháp luật.\"","options":["các phòng nghiệp vụ chuyên biệt.","các đơn vị lực lượng thường trực khác.","các cơ quan, đơn vị thuộc Công an nhân dân.","các tổng cục, cục nghiệp vụ."],"key":"B","explain":"Theo Luật Công an nhân dân và SGK Bài 2 (trang 16): Hệ thống tổ chức của Công an nhân dân gồm Bộ Công an, Công an tỉnh/thành phố, Công an huyện/quận, Công an xã/phường/thị trấn và các đơn vị/đồn, trạm độc lập bố trí tại địa bàn cần thiết theo quy định."},{"q":"Câu 10. Phương án nào sau đây điền đúng từ hoặc cụm từ còn thiếu vào chỗ trống: \"Mối quan hệ phối hợp giữa Quân đội nhân dân và Công an nhân dân được thực hiện trên nguyên tắc đặt dưới sự lãnh đạo trực tiếp, tuyệt đối về mọi mặt của ...................., sự thống lĩnh của Chủ tịch nước, sự quản lí thống nhất của Chính phủ.\"","options":["Bộ Quốc phòng.","Bộ Công an.","Đảng Cộng sản Việt Nam.","Quốc hội nước Cộng hoà xã hội chủ nghĩa Việt Nam."],"key":"C","explain":"Nguyên tắc hiến định và xuyên suốt: Lực lượng vũ trang nhân dân (Quân đội nhân dân và Công an nhân dân) đặt dưới sự lãnh đạo tuyệt đối, trực tiếp về mọi mặt của Đảng Cộng sản Việt Nam, sự thống lĩnh của Chủ tịch nước và sự quản lí thống nhất của Chính phủ."},{"q":"Câu 11. Phương án nào sau đây điền đúng từ hoặc cụm từ còn thiếu vào chỗ trống: \"Trong công tác tuyển sinh vào các trường Quân đội, quân nhân tại ngũ muốn dự tuyển thì cần có thêm điều kiện về thời gian phục vụ tại ngũ và kết quả xếp loại công tác trong những năm phục vụ tại ngũ theo quy định của ....................\"","options":["Bộ Giáo dục và Đào tạo.","Bộ Công an.","Bộ Tư pháp.","Bộ Quốc phòng."],"key":"D","explain":"Theo SGK GDQPAN 12 (Bài 3, trang 23): Các trường Quân đội thực hiện tuyển sinh quân sự theo quy định của Bộ Quốc phòng (hạ sĩ quan, binh sĩ phục vụ tại ngũ đủ 12 tháng trở lên tính đến tháng 4 năm tuyển sinh...)."},{"q":"Câu 12 (VD). Phương án nào sau đây điền đúng từ hoặc cụm từ còn thiếu vào chỗ trống: \"Ngoài các tiêu chuẩn chung về độ tuổi, sức khỏe, văn hóa, thí sinh dự tuyển vào các trường Công an nhân dân cần phải có đủ tiêu chuẩn về phẩm chất chính trị, phẩm chất đạo đức, có khả năng giữ bình tĩnh, nhanh nhẹn, .................... và những phẩm chất khác theo yêu cầu của từng hệ lực lượng nghiệp vụ.\"","options":["khả năng chịu đựng áp lực cao.","khả năng thích ứng nhanh.","trung thành, tận tụy.","có trí nhớ tốt, tư duy logic."],"key":"D","explain":"Theo yêu cầu đặc thù tuyển sinh vào các trường Công an nhân dân: thí sinh cần có khả năng giữ bình tĩnh, nhanh nhẹn, có trí nhớ tốt, tư duy logic và những phẩm chất khác theo yêu cầu của từng hệ lực lượng nghiệp vụ."}],"tf":[{"passage":"Câu 13. Tình huống: Trong giờ thảo luận về Bài 1 (Bảo vệ Tổ quốc Việt Nam XHCN sau năm 1975), bạn Mai khẳng định rằng \"Âm mưu và thủ đoạn của các thế lực thù địch sau năm 1975 chủ yếu chỉ nhằm vào việc gây mất ổn định chính trị ở Việt Nam\". Dựa vào tình huống trên, em hãy cho biết các nhận định sau là đúng hay sai:","claims":[{"t":"Các thế lực thù địch vẫn không từ bỏ âm mưu và thủ đoạn chống phá Việt Nam trên các lĩnh vực chính trị, kinh tế, văn hóa, xã hội, quốc phòng, an ninh.","key":true},{"t":"Mục tiêu chủ yếu của chiến lược \"diễn biến hòa bình\" mà các thế lực thù địch thực hiện nhằm xóa bỏ vai trò lãnh đạo của Đảng Cộng sản Việt Nam và lật đổ chế độ xã hội chủ nghĩa.","key":true},{"t":"Việt Nam thực hiện chiến tranh bảo vệ biên giới Tây Nam và cùng quân dân Cam-pu-chia chiến thắng chế độ diệt chủng là để đáp lại hành động gây chiến và bảo vệ độc lập dân tộc.","key":true},{"t":"Là học sinh, việc tập trung học tập, rèn luyện để trở thành công dân tốt đã là đủ, không cần thiết phải đấu tranh chống lại các luận điệu xuyên tạc lịch sử của kẻ thù.","key":false}]},{"passage":"Câu 14. Tình huống: Một tiểu đoàn trưởng Quân đội nhân dân và một trưởng công an cấp xã đang bàn bạc về kế hoạch phối hợp giữa hai lực lượng trong việc đảm bảo an ninh, trật tự địa phương. Dựa vào tình huống trên, em hãy cho biết các nhận định sau là đúng hay sai:","claims":[{"t":"Quân đội nhân dân Việt Nam có chức năng chiến đấu, lao động sản xuất và công tác.","key":true},{"t":"Công an nhân dân Việt Nam có chức năng tham gia phòng, chống thiên tai, dịch bệnh, tìm kiếm, cứu hộ, cứu nạn.","key":true},{"t":"Mối quan hệ phối hợp giữa Quân đội nhân dân và Công an nhân dân được thực hiện trên nguyên tắc tự nguyện, dân chủ, bình đẳng, cùng có lợi.","key":false},{"t":"Để đảm bảo an ninh, trật tự, lực lượng Quân đội chỉ cần tập trung vào huấn luyện chiến đấu, còn việc nắm tình hình xã hội hoàn toàn thuộc về Công an.","key":false}]},{"passage":"Câu 15. Tình huống: Trong buổi tư vấn hướng nghiệp, một sĩ quan quân đội giải thích về vai trò và nhiệm vụ của Quân đội nhân dân Việt Nam trong tình hình mới. Dựa vào tình huống trên, em hãy cho biết các nhận định sau là đúng hay sai:","claims":[{"t":"Tổ chức của Quân đội nhân dân Việt Nam gồm Bộ Quốc phòng; các cơ quan, đơn vị trực thuộc Bộ Quốc phòng; cơ quan quân sự địa phương.","key":true},{"t":"Một trong những nhiệm vụ của Quân đội nhân dân là xây dựng lực lượng vũ trang nhân dân vững mạnh về chính trị, tư tưởng và tổ chức.","key":true},{"t":"Quân đội nhân dân và Công an nhân dân có vai trò quan trọng như nhau trong việc tham mưu cho Đảng và Nhà nước về quốc phòng, an ninh.","key":true},{"t":"Trong thời bình, vai trò của Quân đội nhân dân chủ yếu là lao động sản xuất, còn nhiệm vụ chiến đấu chỉ là thứ yếu.","key":false}]},{"passage":"Câu 16. Tình huống: Trường THPT đang tổ chức tư vấn chuyên sâu về các ngành học trong khối trường Quân đội và Công an, trong đó có phần giải thích về tiêu chuẩn sơ tuyển. Dựa vào tình huống trên, em hãy cho biết các nhận định sau là đúng hay sai:","claims":[{"t":"Tất cả thí sinh dự tuyển vào các trường Quân đội và Công an đều phải tham gia sơ tuyển.","key":true},{"t":"Các phương thức tuyển sinh vào trường Quân đội, Công an gồm: thi tuyển, xét tuyển và kết hợp giữa thi tuyển và xét tuyển.","key":true},{"t":"Yêu cầu thí sinh trúng tuyển vào trường Công an phải có phẩm chất đạo đức tốt nhằm đảm bảo tính chính trị và sự trung thành tuyệt đối của lực lượng Công an.","key":true},{"t":"Để đáp ứng yêu cầu sơ tuyển về sức khoẻ, thí sinh chỉ cần có chiều cao và cân nặng đạt chuẩn, không cần quan tâm đến các tiêu chuẩn khác như thị lực hoặc năng khiếu.","key":false}]}],"short":[],"essay":[],"studyEssays":[{"title":"Câu 17 (1,0 điểm): Hãy giải thích vì sao cuộc chiến đấu bảo vệ biên giới phía Bắc của Tổ quốc là một cuộc chiến đấu tự vệ chính nghĩa?","prompt":"Hãy trình bày lập luận giải thích vì sao cuộc chiến đấu bảo vệ biên giới phía Bắc của Tổ quốc (từ tháng 2/1979) là một cuộc chiến đấu tự vệ chính nghĩa của quân và dân Việt Nam.","answerHtml":"\u003cul style=\"margin:0;padding-left:20px;line-height:1.65\">\n\u003cli>\u003cstrong>Nguyên nhân bắt nguồn từ hành động xâm phạm chủ quyền lãnh thổ Việt Nam:\u003c/strong> Sáng ngày 17/2/1979, chính quyền Trung Quốc huy động lực lượng lớn mở cuộc tiến công quy mô lớn dọc tuyến biên giới phía Bắc nước ta từ Móng Cái (Quảng Ninh) đến Phong Thổ (Lai Châu), gây tổn thất nặng nề về người và tài sản cho nhân dân ta (SGK trang 7–8).\u003c/li>\n\u003cli>\u003cstrong>Mục đích chiến đấu là bảo vệ độc lập, chủ quyền và toàn vẹn lãnh thổ:\u003c/strong> Trước hành động xâm lược đó, ngày 5/3/1979 Chủ tịch nước Tôn Đức Thắng kí Sắc lệnh Tổng động viên; quân và dân ta đứng lên chiến đấu hoàn toàn nhằm thực hiện \u003cstrong>quyền tự vệ chính đáng\u003c/strong> của một quốc gia độc lập, bảo vệ từng tấc đất thiêng liêng của Tổ quốc và tính mạng của nhân dân.\u003c/li>\n\u003cli>\u003cstrong>Thể hiện truyền thống nhân đạo, khát vọng hoà bình:\u003c/strong> Khi đối phương tuyên bố rút quân (5/3/1979), lực lượng vũ trang và nhân dân ta ở biên giới phía Bắc đã ngừng mọi hoạt động tiến công quân sự để đối phương rút toàn bộ lực lượng về nước (đến 18/3/1979), thể hiện thiện chí hoà bình, nhân đạo và mong muốn khôi phục quan hệ hữu nghị giữa nhân dân hai nước (SGK trang 8).\u003c/li>\n\u003c/ul>"},{"title":"Câu 18 (1,0 điểm): Phân tích chức năng và nhiệm vụ của Quân đội nhân dân Việt Nam, từ đó làm rõ vì sao chức năng chiến đấu luôn là chức năng cơ bản, quan trọng nhất của Quân đội nhân dân trong mọi tình huống.","prompt":"Phân tích 3 chức năng và nhiệm vụ của Quân đội nhân dân Việt Nam; giải thích vì sao chức năng \"Đội quân chiến đấu\" luôn là chức năng cơ bản, quan trọng nhất trong mọi tình huống.","answerHtml":"\u003cul style=\"margin:0;padding-left:20px;line-height:1.65\">\n\u003cli>\u003cstrong>Ba chức năng của Quân đội nhân dân Việt Nam:\u003c/strong> Quân đội nhân dân Việt Nam có 3 chức năng cơ bản là \u003cstrong>đội quân chiến đấu\u003c/strong>, \u003cstrong>đội quân công tác\u003c/strong> và \u003cstrong>đội quân lao động sản xuất\u003c/strong>.\u003c/li>\n\u003cli>\u003cstrong>Nhiệm vụ chính của Quân đội nhân dân Việt Nam:\u003c/strong> Luôn sẵn sàng chiến đấu và chiến đấu bảo vệ vững chắc độc lập, chủ quyền, thống nhất, toàn vẹn lãnh thổ của Tổ quốc; bảo vệ Đảng, Nhà nước, nhân dân và chế độ XHCN; tham mưu công tác quân sự, quốc phòng; tuyên truyền vận động nhân dân và tham gia phát triển kinh tế – xã hội, cứu hộ cứu nạn (SGK Bài 2, trang 12–13).\u003c/li>\n\u003cli>\u003cstrong>Vì sao chức năng chiến đấu luôn là chức năng cơ bản, quan trọng nhất trong mọi tình huống:\u003c/strong>\n  \u003cul style=\"margin-top:6px;padding-left:20px\">\n    \u003cli>Bản chất và mục đích ra đời cốt lõi của Quân đội là lực lượng vũ trang nòng cốt để \u003cstrong>đánh thắng mọi kẻ thù xâm lược\u003c/strong>, giữ vững độc lập, chủ quyền quốc gia.\u003c/li>\n    \u003cli>Trong thời bình, các thế lực thù địch vẫn không ngừng chống phá bằng chiến lược \"diễn biến hoà bình\", bạo loạn lật đổ và xâm phạm chủ quyền biển, đảo; do đó Quân đội phải luôn lấy \u003cstrong>huấn luyện, sẵn sàng chiến đấu và chiến đấu thắng lợi\u003c/strong> làm nhiệm vụ trung tâm, thường xuyên hàng đầu để không bị động, bất ngờ trong mọi tình huống.\u003c/li>\n  \u003c/ul>\n\u003c/li>\n\u003c/ul>"},{"title":"Câu 19 (1,0 điểm): Là học sinh lớp 12, em hãy trình bày những quyền lợi và nghĩa vụ mà em sẽ được hưởng khi trúng tuyển vào các trường Quân đội hoặc Công an nhân dân, đồng thời đề xuất hai hành động cụ thể mà em cần chuẩn bị ngay từ bây giờ để đáp ứng yêu cầu sơ tuyển.","prompt":"Trình bày quyền lợi và nghĩa vụ của học viên khi trúng tuyển vào các trường Quân đội, Công an nhân dân (theo Bài 3 SGK trang 21–22) và nêu 2 hành động chuẩn bị cụ thể của bản thân ngay từ lớp 12.","answerHtml":"\u003cul style=\"margin:0;padding-left:20px;line-height:1.65\">\n\u003cli>\u003cstrong>Quyền lợi của học viên khi trúng tuyển (SGK trang 21–22):\u003c/strong>\n  \u003cul style=\"margin-top:4px;padding-left:20px\">\n    \u003cli>Được bảo đảm đầy đủ các chế độ, tiêu chuẩn về \u003cstrong>ăn, ở, mặc, phụ cấp hằng tháng, không phải đóng học phí\u003c/strong>; được trang bị đầy đủ cơ sở vật chất, đồ dùng phục vụ học tập.\u003c/li>\n    \u003cli>\u003cstrong>Thân nhân của học viên\u003c/strong> (bố mẹ đẻ, bố mẹ nuôi hợp pháp) nếu chưa có bảo hiểm y tế sẽ được nhà trường đăng kí mua bảo hiểm y tế ngay khi vào học; học viên được nghỉ cuối tuần, nghỉ lễ, nghỉ hè, nghỉ Tết và hưởng chế độ khen thưởng khi đạt thành tích xuất sắc, giỏi.\u003c/li>\n    \u003cli>Khi tốt nghiệp được \u003cstrong>cấp văn bằng tốt nghiệp\u003c/strong> thuộc hệ thống văn bằng quốc gia; được Bộ Quốc phòng, Bộ Công an \u003cstrong>phong quân hàm sĩ quan và phân công công tác\u003c/strong>.\u003c/li>\n  \u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Nghĩa vụ của học viên (SGK trang 22):\u003c/strong> Phải nghiêm chỉnh chấp hành chủ trương, chính sách của Đảng, pháp luật của Nhà nước, kỉ luật của Quân đội, Công an và quy định của nhà trường; khi ra trường sẵn sàng nhận và hoàn thành nhiệm vụ theo sự phân công của Bộ Quốc phòng, Bộ Công an.\u003c/li>\n\u003cli>\u003cstrong>Hai hành động cụ thể cần chuẩn bị ngay từ bây giờ (lớp 12):\u003c/strong>\n  \u003cul style=\"margin-top:4px;padding-left:20px\">\n    \u003cli>\u003cem>Hành động 1 (Về văn hoá &amp; phẩm chất chính trị, đạo đức):\u003c/em> Chăm chỉ học tập các môn văn hoá thuộc tổ hợp xét tuyển để đạt học lực từ khá, giỏi trở lên; chấp hành nghiêm nội quy nhà trường, pháp luật và giữ gìn lí lịch, đạo đức trong sáng.\u003c/li>\n    \u003cli>\u003cem>Hành động 2 (Về thể lực, sức khoẻ &amp; thủ tục hồ sơ):\u003c/em> Rèn luyện thể dục thể thao hằng ngày, bảo vệ thị lực để đảm bảo tiêu chuẩn sức khoẻ, chiều cao, cân nặng; chủ động theo dõi thông báo và nộp hồ sơ đăng kí sơ tuyển đúng hạn tại Ban Tuyển sinh quân sự hoặc Công an cấp huyện/quận nơi thường trú.\u003c/li>\n  \u003c/ul>\n\u003c/li>\n\u003c/ul>"}]},{"id":"GDQP12-GKI-EXAM","pairGroupId":"GDQP12-GKI","subject":"gdqp","title":"GDQPAN 12 · Kiểm tra Giữa kì I (Đề 2 · Nộp chấm 1 lần + Học thuộc Tự luận)","description":"Đề 2 (Chế độ Thi toàn bài 45 phút): Làm toàn bộ 12 câu ABCD (3,0đ) + 4 câu Đúng/Sai (4,0đ) rồi nộp chấm 1 lần, kèm tab Học thuộc & Đáp án chuẩn 3 câu Tự luận (Câu 17, 18, 19 - 3,0đ).","source":"Đề kiểm tra Giữa kì I GDQPAN 12 & SGK Kết nối tri thức","mode":"exam","minutes":45,"active":true,"draft":false,"verified":false,"sectionPoints":{"mc":3,"tf":4,"short":0,"essay":0},"mc":[{"q":"Câu 1. Tập đoàn nào đã phát động chiến tranh xâm lược Việt Nam vào ngày 30-4-1977?","options":["Tập đoàn Khmer Đỏ.","Tập đoàn Pol Pot – Ieng Sary.","Chính quyền Lon Nol.","Lực lượng Mặt trận Đoàn kết dân tộc cứu nước Cam-pu-chia."],"key":"B","explain":"Theo SGK Giáo dục quốc phòng và an ninh 12 (Bài 1, trang 5 – 6): Cuộc chiến tranh bảo vệ biên giới Tây Nam nhằm chống lại cuộc chiến tranh xâm lược do tập đoàn Pol Pot – Ieng Sary (Pôn Pốt – Iêng Xa-ry) gây ra; từ ngày 30/4/1977 chúng đẩy hoạt động chống phá trên đất liền lên một nấc thang mới, xâm phạm nhiều vùng lãnh thổ Việt Nam từ Hà Tiên đến Tây Ninh."},{"q":"Câu 2. Cuộc chiến đấu bảo vệ biên giới phía Bắc của Tổ quốc đã diễn ra vào khoảng thời gian nào?","options":["Từ tháng 4 đến tháng 5 năm 1975.","Từ tháng 12 năm 1978 đến tháng 1 năm 1979.","Từ tháng 2 năm 1979 đến năm 1989.","Từ tháng 3 năm 1988 đến năm 1989."],"key":"C","explain":"Sáng ngày 17/2/1979, cuộc chiến đấu bảo vệ biên giới phía Bắc bắt đầu diễn ra dọc tuyến biên giới từ Móng Cái (Quảng Ninh) đến Phong Thổ (Lai Châu) và kéo dài trên một số điểm biên giới (như mặt trận Vị Xuyên - Hà Tuyên) đến năm 1989."},{"q":"Câu 3. Tinh thần nào của nhân dân Việt Nam được khẳng định là nguồn sức mạnh to lớn, đập tan mọi âm mưu chống phá trong chiến tranh bảo vệ biên giới Tây Nam của Tổ quốc?","options":["Tinh thần độc lập, tự chủ và đoàn kết quốc tế trong sáng.","Tinh thần cảnh giác và kiên quyết phòng ngự.","Ý chí độc lập, tự chủ và tinh thần đại đoàn kết dân tộc.","Ý chí quyết thắng và sức mạnh của bộ đội chủ lực."],"key":"A","explain":"Theo SGK GDQPAN 12 (Bài 1, trang 6): Chiến thắng trong cuộc chiến tranh bảo vệ biên giới Tây Nam khẳng định đường lối độc lập, tự chủ đúng đắn của Đảng và tinh thần quốc tế trong sáng, thuỷ chung giữa nhân dân hai nước Việt Nam – Campuchia."},{"q":"Câu 4. Vì sao đấu tranh bảo vệ chủ quyền biển, đảo Việt Nam trong giai đoạn cách mạng mới luôn được Đảng ta xác định là nhiệm vụ thường xuyên, lâu dài và đặc biệt quan trọng?","options":["Vì biển, đảo Việt Nam có nguồn tài nguyên phong phú và là cửa ngõ giao thương quốc tế quan trọng.","Vì các thế lực thù địch đang tìm cách chia cắt và chiếm đoạt biển, đảo nước ta.","Vì biển, đảo có vị trí chiến lược đặc biệt quan trọng trong sự nghiệp xây dựng và bảo vệ Tổ quốc.","Vì việc bảo vệ chủ quyền biển, đảo là minh chứng cho tinh thần yêu nước và dân tộc của nhân dân."],"key":"C","explain":"Biển, đảo Việt Nam có vị trí chiến lược đặc biệt quan trọng cả về kinh tế - xã hội, quốc phòng và an ninh trong sự nghiệp xây dựng và bảo vệ Tổ quốc."},{"q":"Câu 5. Đối tượng tuyển sinh vào các trường Quân đội nhân dân phải có độ tuổi bao nhiêu nếu là quân nhân tại ngũ hoặc đã xuất ngũ và công dân hoàn thành nghĩa vụ tham gia Công an nhân dân?","options":["Không quá 20 tuổi.","Không quá 22 tuổi.","Không quá 23 tuổi.","Không quá 24 tuổi."],"key":"C","explain":"Theo SGK GDQPAN 12 (Bài 3, trang 23): Tiêu chuẩn về độ tuổi (tính đến năm dự tuyển): Thanh niên ngoài quân đội không quá 21 tuổi; quân nhân tại ngũ hoặc đã xuất ngũ và công dân hoàn thành nghĩa vụ tham gia công an nhân dân không quá 23 tuổi."},{"q":"Câu 6. Lực lượng nào sau đây có chức năng quản lí nhà nước về an ninh, trật tự, an toàn xã hội?","options":["Bộ đội Biên phòng.","Hải quân nhân dân.","Công an nhân dân.","Dân quân tự vệ."],"key":"C","explain":"Theo SGK GDQPAN 12 (Bài 2, trang 16): Công an nhân dân (Bộ Công an) có chức năng tham mưu với Đảng, Nhà nước và thực hiện quản lí nhà nước về bảo vệ an ninh quốc gia, bảo đảm trật tự, an toàn xã hội."},{"q":"Câu 7 (VD). Là học sinh trung học phổ thông, hành động nào sau đây thể hiện trách nhiệm trực tiếp và cụ thể nhất đối với sự nghiệp bảo vệ Tổ quốc hiện nay?","options":["Nghiên cứu sâu về các học thuyết quân sự của Việt Nam qua các thời kì.","Liên hệ, tìm hiểu và đăng kí sơ tuyển vào các trường Quân đội, Công an.","Tham gia các hoạt động thiện nguyện để giúp đỡ các gia đình quân nhân có hoàn cảnh khó khăn.","Thường xuyên theo dõi tin tức về tình hình biển, đảo để cập nhật thông tin chính xác."],"key":"B","explain":"Đối với học sinh lớp 12, việc chủ động tìm hiểu và đăng kí sơ tuyển vào các trường Quân đội, Công an (hoặc đăng kí nghĩa vụ quân sự khi đủ tuổi) là hành động trực tiếp, thiết thực gắn với nội dung định hướng nghề nghiệp quân sự, công an (Bài 3)."},{"q":"Câu 8. Phương án nào sau đây điền đúng từ hoặc cụm từ còn thiếu vào chỗ trống: \"Thắng lợi của cuộc đấu tranh bảo vệ chủ quyền biển, đảo Việt Nam là kết quả của sự chỉ đạo sáng suốt của Đảng Cộng sản Việt Nam, sự nỗ lực và phát huy sức mạnh tổng hợp của cả hệ thống chính trị, trong đó, Quân đội nhân dân Việt Nam, đặc biệt là Hải quân nhân dân Việt Nam đã trở thành ................... trong bảo vệ chủ quyền biển, đảo.\"","options":["ngọn cờ đầu","lực lượng nòng cốt","công cụ sắc bén","lực lượng chính"],"key":"B","explain":"Quân đội nhân dân Việt Nam, đặc biệt là Quân chủng Hải quân nhân dân Việt Nam là lực lượng nòng cốt trong sự nghiệp bảo vệ chủ quyền biển, đảo của Tổ quốc."},{"q":"Câu 9. Phương án nào sau đây điền đúng từ hoặc cụm từ còn thiếu vào chỗ trống: \"Hệ thống tổ chức của Công an nhân dân Việt Nam gồm có Bộ Công an; Công an cấp tỉnh; Công an cấp xã và ................... theo quy định của pháp luật.\"","options":["các phòng nghiệp vụ chuyên biệt.","các đơn vị lực lượng thường trực khác.","các cơ quan, đơn vị thuộc Công an nhân dân.","các tổng cục, cục nghiệp vụ."],"key":"B","explain":"Theo Luật Công an nhân dân và SGK Bài 2 (trang 16): Hệ thống tổ chức của Công an nhân dân gồm Bộ Công an, Công an tỉnh/thành phố, Công an huyện/quận, Công an xã/phường/thị trấn và các đơn vị/đồn, trạm độc lập bố trí tại địa bàn cần thiết theo quy định."},{"q":"Câu 10. Phương án nào sau đây điền đúng từ hoặc cụm từ còn thiếu vào chỗ trống: \"Mối quan hệ phối hợp giữa Quân đội nhân dân và Công an nhân dân được thực hiện trên nguyên tắc đặt dưới sự lãnh đạo trực tiếp, tuyệt đối về mọi mặt của ...................., sự thống lĩnh của Chủ tịch nước, sự quản lí thống nhất của Chính phủ.\"","options":["Bộ Quốc phòng.","Bộ Công an.","Đảng Cộng sản Việt Nam.","Quốc hội nước Cộng hoà xã hội chủ nghĩa Việt Nam."],"key":"C","explain":"Nguyên tắc hiến định và xuyên suốt: Lực lượng vũ trang nhân dân (Quân đội nhân dân và Công an nhân dân) đặt dưới sự lãnh đạo tuyệt đối, trực tiếp về mọi mặt của Đảng Cộng sản Việt Nam, sự thống lĩnh của Chủ tịch nước và sự quản lí thống nhất của Chính phủ."},{"q":"Câu 11. Phương án nào sau đây điền đúng từ hoặc cụm từ còn thiếu vào chỗ trống: \"Trong công tác tuyển sinh vào các trường Quân đội, quân nhân tại ngũ muốn dự tuyển thì cần có thêm điều kiện về thời gian phục vụ tại ngũ và kết quả xếp loại công tác trong những năm phục vụ tại ngũ theo quy định của ....................\"","options":["Bộ Giáo dục và Đào tạo.","Bộ Công an.","Bộ Tư pháp.","Bộ Quốc phòng."],"key":"D","explain":"Theo SGK GDQPAN 12 (Bài 3, trang 23): Các trường Quân đội thực hiện tuyển sinh quân sự theo quy định của Bộ Quốc phòng (hạ sĩ quan, binh sĩ phục vụ tại ngũ đủ 12 tháng trở lên tính đến tháng 4 năm tuyển sinh...)."},{"q":"Câu 12 (VD). Phương án nào sau đây điền đúng từ hoặc cụm từ còn thiếu vào chỗ trống: \"Ngoài các tiêu chuẩn chung về độ tuổi, sức khỏe, văn hóa, thí sinh dự tuyển vào các trường Công an nhân dân cần phải có đủ tiêu chuẩn về phẩm chất chính trị, phẩm chất đạo đức, có khả năng giữ bình tĩnh, nhanh nhẹn, .................... và những phẩm chất khác theo yêu cầu của từng hệ lực lượng nghiệp vụ.\"","options":["khả năng chịu đựng áp lực cao.","khả năng thích ứng nhanh.","trung thành, tận tụy.","có trí nhớ tốt, tư duy logic."],"key":"D","explain":"Theo yêu cầu đặc thù tuyển sinh vào các trường Công an nhân dân: thí sinh cần có khả năng giữ bình tĩnh, nhanh nhẹn, có trí nhớ tốt, tư duy logic và những phẩm chất khác theo yêu cầu của từng hệ lực lượng nghiệp vụ."}],"tf":[{"passage":"Câu 13. Tình huống: Trong giờ thảo luận về Bài 1 (Bảo vệ Tổ quốc Việt Nam XHCN sau năm 1975), bạn Mai khẳng định rằng \"Âm mưu và thủ đoạn của các thế lực thù địch sau năm 1975 chủ yếu chỉ nhằm vào việc gây mất ổn định chính trị ở Việt Nam\". Dựa vào tình huống trên, em hãy cho biết các nhận định sau là đúng hay sai:","claims":[{"t":"Các thế lực thù địch vẫn không từ bỏ âm mưu và thủ đoạn chống phá Việt Nam trên các lĩnh vực chính trị, kinh tế, văn hóa, xã hội, quốc phòng, an ninh.","key":true},{"t":"Mục tiêu chủ yếu của chiến lược \"diễn biến hòa bình\" mà các thế lực thù địch thực hiện nhằm xóa bỏ vai trò lãnh đạo của Đảng Cộng sản Việt Nam và lật đổ chế độ xã hội chủ nghĩa.","key":true},{"t":"Việt Nam thực hiện chiến tranh bảo vệ biên giới Tây Nam và cùng quân dân Cam-pu-chia chiến thắng chế độ diệt chủng là để đáp lại hành động gây chiến và bảo vệ độc lập dân tộc.","key":true},{"t":"Là học sinh, việc tập trung học tập, rèn luyện để trở thành công dân tốt đã là đủ, không cần thiết phải đấu tranh chống lại các luận điệu xuyên tạc lịch sử của kẻ thù.","key":false}]},{"passage":"Câu 14. Tình huống: Một tiểu đoàn trưởng Quân đội nhân dân và một trưởng công an cấp xã đang bàn bạc về kế hoạch phối hợp giữa hai lực lượng trong việc đảm bảo an ninh, trật tự địa phương. Dựa vào tình huống trên, em hãy cho biết các nhận định sau là đúng hay sai:","claims":[{"t":"Quân đội nhân dân Việt Nam có chức năng chiến đấu, lao động sản xuất và công tác.","key":true},{"t":"Công an nhân dân Việt Nam có chức năng tham gia phòng, chống thiên tai, dịch bệnh, tìm kiếm, cứu hộ, cứu nạn.","key":true},{"t":"Mối quan hệ phối hợp giữa Quân đội nhân dân và Công an nhân dân được thực hiện trên nguyên tắc tự nguyện, dân chủ, bình đẳng, cùng có lợi.","key":false},{"t":"Để đảm bảo an ninh, trật tự, lực lượng Quân đội chỉ cần tập trung vào huấn luyện chiến đấu, còn việc nắm tình hình xã hội hoàn toàn thuộc về Công an.","key":false}]},{"passage":"Câu 15. Tình huống: Trong buổi tư vấn hướng nghiệp, một sĩ quan quân đội giải thích về vai trò và nhiệm vụ của Quân đội nhân dân Việt Nam trong tình hình mới. Dựa vào tình huống trên, em hãy cho biết các nhận định sau là đúng hay sai:","claims":[{"t":"Tổ chức của Quân đội nhân dân Việt Nam gồm Bộ Quốc phòng; các cơ quan, đơn vị trực thuộc Bộ Quốc phòng; cơ quan quân sự địa phương.","key":true},{"t":"Một trong những nhiệm vụ của Quân đội nhân dân là xây dựng lực lượng vũ trang nhân dân vững mạnh về chính trị, tư tưởng và tổ chức.","key":true},{"t":"Quân đội nhân dân và Công an nhân dân có vai trò quan trọng như nhau trong việc tham mưu cho Đảng và Nhà nước về quốc phòng, an ninh.","key":true},{"t":"Trong thời bình, vai trò của Quân đội nhân dân chủ yếu là lao động sản xuất, còn nhiệm vụ chiến đấu chỉ là thứ yếu.","key":false}]},{"passage":"Câu 16. Tình huống: Trường THPT đang tổ chức tư vấn chuyên sâu về các ngành học trong khối trường Quân đội và Công an, trong đó có phần giải thích về tiêu chuẩn sơ tuyển. Dựa vào tình huống trên, em hãy cho biết các nhận định sau là đúng hay sai:","claims":[{"t":"Tất cả thí sinh dự tuyển vào các trường Quân đội và Công an đều phải tham gia sơ tuyển.","key":true},{"t":"Các phương thức tuyển sinh vào trường Quân đội, Công an gồm: thi tuyển, xét tuyển và kết hợp giữa thi tuyển và xét tuyển.","key":true},{"t":"Yêu cầu thí sinh trúng tuyển vào trường Công an phải có phẩm chất đạo đức tốt nhằm đảm bảo tính chính trị và sự trung thành tuyệt đối của lực lượng Công an.","key":true},{"t":"Để đáp ứng yêu cầu sơ tuyển về sức khoẻ, thí sinh chỉ cần có chiều cao và cân nặng đạt chuẩn, không cần quan tâm đến các tiêu chuẩn khác như thị lực hoặc năng khiếu.","key":false}]}],"short":[],"essay":[],"studyEssays":[{"title":"Câu 17 (1,0 điểm): Hãy giải thích vì sao cuộc chiến đấu bảo vệ biên giới phía Bắc của Tổ quốc là một cuộc chiến đấu tự vệ chính nghĩa?","prompt":"Hãy trình bày lập luận giải thích vì sao cuộc chiến đấu bảo vệ biên giới phía Bắc của Tổ quốc (từ tháng 2/1979) là một cuộc chiến đấu tự vệ chính nghĩa của quân và dân Việt Nam.","answerHtml":"\u003cul style=\"margin:0;padding-left:20px;line-height:1.65\">\n\u003cli>\u003cstrong>Nguyên nhân bắt nguồn từ hành động xâm phạm chủ quyền lãnh thổ Việt Nam:\u003c/strong> Sáng ngày 17/2/1979, chính quyền Trung Quốc huy động lực lượng lớn mở cuộc tiến công quy mô lớn dọc tuyến biên giới phía Bắc nước ta từ Móng Cái (Quảng Ninh) đến Phong Thổ (Lai Châu), gây tổn thất nặng nề về người và tài sản cho nhân dân ta (SGK trang 7–8).\u003c/li>\n\u003cli>\u003cstrong>Mục đích chiến đấu là bảo vệ độc lập, chủ quyền và toàn vẹn lãnh thổ:\u003c/strong> Trước hành động xâm lược đó, ngày 5/3/1979 Chủ tịch nước Tôn Đức Thắng kí Sắc lệnh Tổng động viên; quân và dân ta đứng lên chiến đấu hoàn toàn nhằm thực hiện \u003cstrong>quyền tự vệ chính đáng\u003c/strong> của một quốc gia độc lập, bảo vệ từng tấc đất thiêng liêng của Tổ quốc và tính mạng của nhân dân.\u003c/li>\n\u003cli>\u003cstrong>Thể hiện truyền thống nhân đạo, khát vọng hoà bình:\u003c/strong> Khi đối phương tuyên bố rút quân (5/3/1979), lực lượng vũ trang và nhân dân ta ở biên giới phía Bắc đã ngừng mọi hoạt động tiến công quân sự để đối phương rút toàn bộ lực lượng về nước (đến 18/3/1979), thể hiện thiện chí hoà bình, nhân đạo và mong muốn khôi phục quan hệ hữu nghị giữa nhân dân hai nước (SGK trang 8).\u003c/li>\n\u003c/ul>"},{"title":"Câu 18 (1,0 điểm): Phân tích chức năng và nhiệm vụ của Quân đội nhân dân Việt Nam, từ đó làm rõ vì sao chức năng chiến đấu luôn là chức năng cơ bản, quan trọng nhất của Quân đội nhân dân trong mọi tình huống.","prompt":"Phân tích 3 chức năng và nhiệm vụ của Quân đội nhân dân Việt Nam; giải thích vì sao chức năng \"Đội quân chiến đấu\" luôn là chức năng cơ bản, quan trọng nhất trong mọi tình huống.","answerHtml":"\u003cul style=\"margin:0;padding-left:20px;line-height:1.65\">\n\u003cli>\u003cstrong>Ba chức năng của Quân đội nhân dân Việt Nam:\u003c/strong> Quân đội nhân dân Việt Nam có 3 chức năng cơ bản là \u003cstrong>đội quân chiến đấu\u003c/strong>, \u003cstrong>đội quân công tác\u003c/strong> và \u003cstrong>đội quân lao động sản xuất\u003c/strong>.\u003c/li>\n\u003cli>\u003cstrong>Nhiệm vụ chính của Quân đội nhân dân Việt Nam:\u003c/strong> Luôn sẵn sàng chiến đấu và chiến đấu bảo vệ vững chắc độc lập, chủ quyền, thống nhất, toàn vẹn lãnh thổ của Tổ quốc; bảo vệ Đảng, Nhà nước, nhân dân và chế độ XHCN; tham mưu công tác quân sự, quốc phòng; tuyên truyền vận động nhân dân và tham gia phát triển kinh tế – xã hội, cứu hộ cứu nạn (SGK Bài 2, trang 12–13).\u003c/li>\n\u003cli>\u003cstrong>Vì sao chức năng chiến đấu luôn là chức năng cơ bản, quan trọng nhất trong mọi tình huống:\u003c/strong>\n  \u003cul style=\"margin-top:6px;padding-left:20px\">\n    \u003cli>Bản chất và mục đích ra đời cốt lõi của Quân đội là lực lượng vũ trang nòng cốt để \u003cstrong>đánh thắng mọi kẻ thù xâm lược\u003c/strong>, giữ vững độc lập, chủ quyền quốc gia.\u003c/li>\n    \u003cli>Trong thời bình, các thế lực thù địch vẫn không ngừng chống phá bằng chiến lược \"diễn biến hoà bình\", bạo loạn lật đổ và xâm phạm chủ quyền biển, đảo; do đó Quân đội phải luôn lấy \u003cstrong>huấn luyện, sẵn sàng chiến đấu và chiến đấu thắng lợi\u003c/strong> làm nhiệm vụ trung tâm, thường xuyên hàng đầu để không bị động, bất ngờ trong mọi tình huống.\u003c/li>\n  \u003c/ul>\n\u003c/li>\n\u003c/ul>"},{"title":"Câu 19 (1,0 điểm): Là học sinh lớp 12, em hãy trình bày những quyền lợi và nghĩa vụ mà em sẽ được hưởng khi trúng tuyển vào các trường Quân đội hoặc Công an nhân dân, đồng thời đề xuất hai hành động cụ thể mà em cần chuẩn bị ngay từ bây giờ để đáp ứng yêu cầu sơ tuyển.","prompt":"Trình bày quyền lợi và nghĩa vụ của học viên khi trúng tuyển vào các trường Quân đội, Công an nhân dân (theo Bài 3 SGK trang 21–22) và nêu 2 hành động chuẩn bị cụ thể của bản thân ngay từ lớp 12.","answerHtml":"\u003cul style=\"margin:0;padding-left:20px;line-height:1.65\">\n\u003cli>\u003cstrong>Quyền lợi của học viên khi trúng tuyển (SGK trang 21–22):\u003c/strong>\n  \u003cul style=\"margin-top:4px;padding-left:20px\">\n    \u003cli>Được bảo đảm đầy đủ các chế độ, tiêu chuẩn về \u003cstrong>ăn, ở, mặc, phụ cấp hằng tháng, không phải đóng học phí\u003c/strong>; được trang bị đầy đủ cơ sở vật chất, đồ dùng phục vụ học tập.\u003c/li>\n    \u003cli>\u003cstrong>Thân nhân của học viên\u003c/strong> (bố mẹ đẻ, bố mẹ nuôi hợp pháp) nếu chưa có bảo hiểm y tế sẽ được nhà trường đăng kí mua bảo hiểm y tế ngay khi vào học; học viên được nghỉ cuối tuần, nghỉ lễ, nghỉ hè, nghỉ Tết và hưởng chế độ khen thưởng khi đạt thành tích xuất sắc, giỏi.\u003c/li>\n    \u003cli>Khi tốt nghiệp được \u003cstrong>cấp văn bằng tốt nghiệp\u003c/strong> thuộc hệ thống văn bằng quốc gia; được Bộ Quốc phòng, Bộ Công an \u003cstrong>phong quân hàm sĩ quan và phân công công tác\u003c/strong>.\u003c/li>\n  \u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Nghĩa vụ của học viên (SGK trang 22):\u003c/strong> Phải nghiêm chỉnh chấp hành chủ trương, chính sách của Đảng, pháp luật của Nhà nước, kỉ luật của Quân đội, Công an và quy định của nhà trường; khi ra trường sẵn sàng nhận và hoàn thành nhiệm vụ theo sự phân công của Bộ Quốc phòng, Bộ Công an.\u003c/li>\n\u003cli>\u003cstrong>Hai hành động cụ thể cần chuẩn bị ngay từ bây giờ (lớp 12):\u003c/strong>\n  \u003cul style=\"margin-top:4px;padding-left:20px\">\n    \u003cli>\u003cem>Hành động 1 (Về văn hoá &amp; phẩm chất chính trị, đạo đức):\u003c/em> Chăm chỉ học tập các môn văn hoá thuộc tổ hợp xét tuyển để đạt học lực từ khá, giỏi trở lên; chấp hành nghiêm nội quy nhà trường, pháp luật và giữ gìn lí lịch, đạo đức trong sáng.\u003c/li>\n    \u003cli>\u003cem>Hành động 2 (Về thể lực, sức khoẻ &amp; thủ tục hồ sơ):\u003c/em> Rèn luyện thể dục thể thao hằng ngày, bảo vệ thị lực để đảm bảo tiêu chuẩn sức khoẻ, chiều cao, cân nặng; chủ động theo dõi thông báo và nộp hồ sơ đăng kí sơ tuyển đúng hạn tại Ban Tuyển sinh quân sự hoặc Công an cấp huyện/quận nơi thường trú.\u003c/li>\n  \u003c/ul>\n\u003c/li>\n\u003c/ul>"}]},{"id":"CD-VL12-BAI4-MASTERY","pairGroupId":"CD-VL12-BAI4","subject":"physics","title":"Chuyên đề Vật lí 12 · Bài 4: Chỉnh lưu dòng điện xoay chiều (Đề 1 · Làm đúng qua câu)","description":"Đề 1 (Chế độ Luyện từng câu): Xuất hiện từng câu một, làm đúng mới được chuyển sang câu tiếp theo. Biên soạn sát nội dung Bài 4: Diode bán dẫn & Mạch chỉnh lưu.","source":"Tự động tạo cặp 2 đề từ Bài thuyết trình Bài 4","mode":"mastery","minutes":0,"active":true,"draft":false,"verified":false,"sectionPoints":{"mc":6,"tf":4,"short":0,"essay":0},"mc":[{"q":"Khi mắc Diode bán dẫn phân cực thuận vào mạch điện một chiều, dòng điện thuận chạy qua Diode theo chiều nào?","options":["Từ cực Anode (A) sang cực Cathode (K).","Từ cực Cathode (K) sang cực Anode (A).","Chạy qua lại tự do theo cả hai chiều.","Không có dòng điện chạy qua ở cả hai chiều."],"key":"A","explain":"Khi phân cực thuận (Anode nối cực dương, Cathode nối cực âm), Diode dẫn điện theo chiều từ Anode (A) sang Cathode (K)."},{"q":"Trong bán dẫn loại p (nối với cực Anode của Diode), hạt tải điện cơ bản (đa số) là hạt nào?","options":["Lỗ trống mang điện tích dương (+).","Electron tự do mang điện tích âm (-).","Ion dương nằm cố định ở nút mạng.","Photon không mang điện tích."],"key":"A","explain":"Bán dẫn loại p (Positive) chứa mật độ cao các lỗ trống mang điện tích dương (+), còn bán dẫn loại n chứa hạt đa số là electron (-)."},{"q":"Trên thân của một Diode bán dẫn thực tế, vòng sơn màu bạc hoặc xám ở một đầu dùng để đánh dấu cực nào?","options":["Cực Cathode (K).","Cực Anode (A).","Cực trung hòa điện.","Điểm nối đất của mạch."],"key":"A","explain":"Theo Hình 4.1 SGK, vòng bạc trên thân Diode thực tế tương ứng với vạch chắn ngang của kí hiệu mạch, đánh dấu cực Cathode (K)."},{"q":"Điều gì xảy ra khi mắc Diode bán dẫn phân cực ngược (cực dương nguồn nối với K, cực âm nguồn nối với A) nối tiếp với bóng đèn?","options":["Dòng điện ngược cực nhỏ (I_ng ≈ 0), bóng đèn không sáng.","Bóng đèn sáng rực rỡ hơn khi mắc phân cực thuận.","Bóng đèn sáng nhấp nháy với tần số 50 Hz.","Điện áp trên bóng đèn tăng gấp đôi điện áp nguồn."],"key":"A","explain":"Khi phân cực ngược, vùng nghèo tại lớp chuyển tiếp p-n mở rộng ngăn dòng điện, cường độ dòng ngược xấp xỉ bằng 0 nên đèn tắt."},{"q":"Đường đặc trưng Vôn - Ampe (I - U) của Diode bán dẫn có tính chất nào sau đây?","options":["Là đường cong phi tuyến và bất đối xứng giữa nhánh thuận với nhánh ngược.","Là đường thẳng đi qua gốc tọa độ tuân theo định luật Ohm.","Là đường parabol đối xứng qua trục tung.","Là đường nằm ngang song song với trục điện áp U."],"key":"A","explain":"Do tính dẫn điện một chiều, nhánh thuận tăng vọt theo hàm mũ khi U > U_mở (≈ 0,6 V với Diode Silic), còn nhánh ngược I_ng ≈ 0."},{"q":"Trong thí nghiệm khảo sát đường đặc trưng I - U của Diode (Hình 4.4 và 4.5 SGK), điện trở R_0 = 10 Ω mắc nối tiếp với Diode có vai trò gì?","options":["Hạn chế cường độ dòng điện cực đại để bảo vệ Diode không bị cháy hỏng.","Tăng hiệu điện thế của nguồn điện một chiều từ 7 V lên 14 V.","Biến đổi dòng điện một chiều thành dòng điện xoay chiều.","Làm phẳng độ gợn sóng của dòng điện xoay chiều."],"key":"A","explain":"Khi phân cực thuận vượt ngưỡng 0,6 V, dòng qua Diode tăng rất nhanh nên cần mắc nối tiếp R_0 = 10 Ω để hạn dòng bảo vệ Diode."},{"q":"Trong mạch chỉnh lưu nửa chu kì sử dụng 1 Diode bán dẫn, dạng điện áp đầu ra u_R trên tải tiêu thụ R có đặc điểm gì?","options":["Chỉ giữ lại các nửa chu kì dương, các nửa chu kì âm bị chặn (u_R = 0).","Các nửa chu kì âm được lật ngược lên thành nửa chu kì dương liên tiếp.","Giữ nguyên cả nửa chu kì dương và nửa chu kì âm như nguồn xoay chiều.","Là điện áp một chiều phẳng tuyệt đối không có gợn sóng."],"key":"A","explain":"Mạch chỉnh lưu 1 Diode chỉ cho dòng đi qua ở nửa chu kì dương và khóa hoàn toàn ở nửa chu kì âm nên dòng điện ra bị ngắt quãng."},{"q":"Trong mạch cầu chỉnh lưu cả chu kì gồm 4 Diode (D_1, D_2, D_3, D_4), ở mỗi nửa chu kì của điện áp xoay chiều đầu vào có mấy Diode cùng dẫn điện?","options":["Có 2 Diode đối diện nhau cùng phân cực thuận và dẫn điện.","Chỉ có duy nhất 1 Diode dẫn điện.","Cả 4 Diode cùng dẫn điện đồng thời.","Có 3 Diode dẫn điện và 1 Diode khóa."],"key":"A","explain":"Nửa chu kì đầu cặp D_1 và D_3 phân cực thuận dẫn điện; nửa chu kì sau cặp D_2 và D_4 phân cực thuận dẫn điện."},{"q":"Nếu điện áp xoay chiều đầu vào có tần số f = 50 Hz thì sau khi đi qua mạch cầu chỉnh lưu 4 Diode (chỉnh lưu cả chu kì), tần số nhấp nháy f' của xung một chiều đầu ra trên tải R là:","options":["100 Hz.","50 Hz.","25 Hz.","200 Hz."],"key":"A","explain":"Trong 1 chu kì của dòng xoay chiều đầu vào (T = 0,02 s), mạch cầu tạo ra 2 đỉnh xung dương giống nhau trên tải R nên f' = 2f = 100 Hz."},{"q":"Để làm phẳng điện áp một chiều nhấp nháy ở đầu ra của mạch chỉnh lưu trong các bộ sạc điện thoại (Adapter), người ta mắc thêm linh kiện nào?","options":["Tụ điện có điện dung C lớn mắc song song với tải tiêu thụ R.","Điện trở có giá trị rất lớn mắc nối tiếp với tải tiêu thụ R.","Một bóng đèn sợi đốt mắc nối tiếp với nguồn xoay chiều.","Một công tắc cơ học đóng ngắt bằng tay."],"key":"A","explain":"Tụ điện C mắc song song với tải R sẽ nạp điện khi điện áp xung tăng lên đỉnh và phóng điện nuôi tải R khi điện áp xung giảm xuống."}],"tf":[{"passage":"Cho mạch chỉnh lưu dòng điện xoay chiều biến đổi điện áp xoay chiều u = U_0 cos(100πt) (V) thành điện áp một chiều cấp cho điện trở tải R. Xét tính đúng/sai của các nhận định sau:","claims":[{"t":"Tần số của dòng điện xoay chiều đầu vào là f = 50 Hz.","key":true},{"t":"Nếu dùng mạch chỉnh lưu nửa chu kì (1 Diode), trong mỗi nửa chu kì âm dòng điện qua tải R có chiều ngược lại so với nửa chu kì dương.","key":false},{"t":"Nếu dùng mạch cầu 4 Diode (chỉnh lưu cả chu kì), dòng điện chạy qua tải R trong cả hai nửa chu kì luôn giữ nguyên một chiều duy nhất.","key":true},{"t":"Tần số xung một chiều nhấp nháy sau mạch cầu 4 Diode là f' = 100 Hz, gấp đôi tần số của mạch chỉnh lưu nửa chu kì.","key":true}]},{"passage":"Một nhóm học sinh tiến hành thí nghiệm khảo sát đường đặc trưng Vôn - Ampe của Diode bán dẫn Silic (điện áp mở khoảng 0,6 V) với nguồn một chiều U_v = 7 V, điện trở bảo vệ R_0 = 10 Ω và biến trở R.","claims":[{"t":"Khi mắc phân cực thuận và điều chỉnh U_thuận \u003c 0,4 V, cường độ dòng điện thuận qua Diode còn rất nhỏ.","key":true},{"t":"Khi U_thuận vượt qua ngưỡng 0,6 V - 0,7 V, cường độ dòng điện thuận I_th tăng vọt rất nhanh theo hàm mũ.","key":true},{"t":"Đường đặc trưng I - U của Diode bán dẫn là một đoạn thẳng tuyến tính tuân theo định luật Ohm ở mọi giá trị điện áp.","key":false},{"t":"Khi đảo chiều Diode sang mắc phân cực ngược từ 0 V đến -5 V, số chỉ của miliampe kế gần như bằng 0.","key":true}]}],"short":[],"essay":[]},{"id":"CD-VL12-BAI4-EXAM","pairGroupId":"CD-VL12-BAI4","subject":"physics","title":"Chuyên đề Vật lí 12 · Bài 4: Chỉnh lưu dòng điện xoay chiều (Đề 2 · Nộp chấm 1 lần)","description":"Đề 2 (Chế độ Thi toàn bài): Hiển thị toàn bộ câu hỏi (ABCD, Đúng/Sai, Trả lời ngắn, Tự luận), làm xong nộp bài và chấm điểm 1 lần.","source":"Tự động tạo cặp 2 đề từ Bài thuyết trình Bài 4","mode":"exam","minutes":45,"active":true,"draft":false,"verified":false,"sectionPoints":{"mc":3,"tf":2,"short":2,"essay":3},"mc":[{"q":"Khi mắc Diode bán dẫn phân cực thuận vào mạch điện một chiều, dòng điện thuận chạy qua Diode theo chiều nào?",
