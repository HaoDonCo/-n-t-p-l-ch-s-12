iểu sau về khái niệm và đặc trưng cơ bản của Trí tuệ nhân tạo (AI):","claims":[{"t":"AI là khả năng của máy tính có thể thực hiện các công việc mang tính trí tuệ con người như suy luận, nhận thức, học tập.","key":true},{"t":"Đặc trưng khả năng học của AI cho phép hệ thống tự điều chỉnh và thông minh hơn khi tiếp nhận thêm dữ liệu mới.","key":true},{"t":"AI hiện nay đã có cảm xúc, tình yêu thương và khả năng tự nhận thức độc lập hoàn toàn như con người.","key":false},{"t":"Xử lý ngôn ngữ tự nhiên (NLP) giúp máy tính hiểu, dịch thuật và giao tiếp bằng ngôn ngữ con người.","key":true}],"originalNumber":1},{"passage":"Xét sự phân loại AI và các công nghệ AI hiện đại:","claims":[{"t":"AI hẹp (Narrow AI) là các hệ thống AI được thiết kế để giải quyết một hoặc một nhóm bài toán cụ thể.","key":true},{"t":"ChatGPT, Google Translate và xe tự lái Tesla thuộc nhóm Trí tuệ nhân tạo hẹp (Narrow AI).","key":true},{"t":"Trí tuệ nhân tạo tổng quát (General AI) là các hệ thống đã phổ biến trong đời sống thực tế hiện nay.","key":false},{"t":"Generative AI (AI sinh) có khả năng tạo ra nội dung mới như văn bản, hình ảnh, mã nguồn dựa trên dữ liệu học.","key":true}],"originalNumber":2},{"passage":"Cho các nhận định về ứng dụng và cảnh báo nguy cơ do AI mang lại:","claims":[{"t":"Trong Y tế, hệ thống AI như IBM Watson hỗ trợ bác sĩ chẩn đoán bệnh chính xác và nhanh chóng hơn.","key":true},{"t":"Trong Nông nghiệp, AI kết hợp cảm biến giúp tối ưu hóa lượng nước tưới và phân bón dựa trên độ ẩm đất.","key":true},{"t":"Sự phát triển của AI hoàn toàn không gây ra nguy cơ mất an toàn thông tin hay thất nghiệp cho con người.","key":false},{"t":"Cần xây dựng các hành lang pháp lý và chuẩn mực đạo đức để quản lý việc phát triển và ứng dụng AI.","key":true}],"originalNumber":3},{"passage":"Một trường học trang bị hệ thống mạng LAN cho các phòng máy tính. Xét chức năng thiết bị mạng:","claims":[{"t":"Hub và Switch đều dùng để kết nối các máy tính thành một mạng LAN cục bộ.","key":true},{"t":"Khi nhận dữ liệu, Hub phát tán (broadcast) tín hiệu ra tất cả các cổng, dễ gây xung đột tín hiệu.","key":true},{"t":"Switch đọc địa chỉ MAC để gửi dữ liệu trực tiếp đến đúng cổng máy nhận, giúp tối ưu băng thông.","key":true},{"t":"Người ta khuyến khích dùng Hub thay thế cho Switch trong các thiết kế mạng LAN hiện đại.","key":false}],"originalNumber":4},{"passage":"Xét chức năng của các thiết bị Router, Modem và WAP trong kết nối mạng Internet:","claims":[{"t":"Modem thực hiện chuyển đổi tín hiệu số (digital) của máy tính thành tín hiệu tương tự (analog) và ngược lại.","key":true},{"t":"Router có chức năng định tuyến, chuyển tiếp các gói dữ liệu giữa các mạng LAN khác nhau hoặc ra Internet.","key":true},{"t":"Thiết bị WAP (Wireless Access Point) cho phép các thiết bị di động kết nối không dây vào mạng LAN.","key":true},{"t":"Router Wi-Fi gia đình chỉ thực hiện duy nhất chức năng phát sóng không dây, không có chức năng định tuyến.","key":false}],"originalNumber":5},{"passage":"Khi xây dựng mô hình mạng gia đình gồm Modem cáp quang, Router Wi-Fi, Laptop, Máy tính bàn và Điện thoại:","claims":[{"t":"Máy tính bàn có thể kết nối với Router Wi-Fi thông qua dây cáp mạng cắm vào cổng RJ45.","key":true},{"t":"Laptop và Điện thoại thông minh kết nối vào mạng thông qua sóng Wi-Fi do WAP/Router Wi-Fi phát ra.","key":true},{"t":"Nếu rút nguồn điện của Modem cáp quang, các máy tính vẫn có thể truy cập các trang web trên Internet bình thường.","key":false},{"t":"Router Wi-Fi gia đình thường tích hợp sẵn bộ chuyển mạch Switch nhiều cổng và điểm truy cập không dây WAP.","key":true}],"originalNumber":6},{"passage":"Xét khái niệm địa chỉ IP và địa chỉ MAC trong mạng máy tính:","claims":[{"t":"Địa chỉ IP là địa chỉ logic có thể thay đổi tùy thuộc vào vị trí mạng mà thiết bị kết nối vào.","key":true},{"t":"Địa chỉ MAC là địa chỉ vật lý duy nhất được gán cố định cho card mạng từ khi sản xuất.","key":true,"explain":"Trong sách phổ thông MAC thường được mô tả là địa chỉ phần cứng; có thể có địa chỉ MAC ngẫu nhiên/đổi ở cấp hệ điều hành."},{"t":"Địa chỉ IPv4 chuẩn gồm 32 bit, thường viết dưới dạng 4 số thập phân phân tách bởi dấu chấm.","key":true},{"t":"Địa chỉ MAC gồm 32 bit và được viết hoàn toàn bằng các số nhị phân 0 và 1.","key":false}],"originalNumber":7},{"passage":"Xét hoạt động của bộ giao thức truyền thông TCP/IP trên Internet:","claims":[{"t":"Bộ giao thức TCP/IP là chuẩn truyền thông làm nền tảng cho mạng Internet toàn cầu.","key":true},{"t":"Giao thức IP chịu trách nhiệm chia nhỏ tệp dữ liệu và kiểm tra lỗi gói tin ở máy nhận.","key":false},{"t":"Giao thức TCP chịu trách nhiệm đảm bảo truyền dữ liệu tin cậy, đóng gói và đánh số thứ tự các gói tin.","key":true},{"t":"Khi gói tin di chuyển qua các Router, địa chỉ IP nguồn và IP đích trong header gói tin vẫn giữ nguyên.","key":true,"explain":"Đúng trong mô hình định tuyến IP thuần, nhưng không đúng tuyệt đối trong mạng dùng NAT."}],"originalNumber":8},{"passage":"Một máy tính có địa chỉ IPv4 nhị phân: 11000000.10101000.00000001.00001010:","claims":[{"t":"Byte đầu tiên 11000000 chuyển sang số thập phân có giá trị là 192.","key":true},{"t":"Byte thứ hai 10101000 chuyển sang số thập phân có giá trị là 168.","key":true},{"t":"Địa chỉ IP trên khi viết dưới dạng thập phân chấm (dot-decimal) là 192.168.1.10.","key":true},{"t":"Hai máy tính khác nhau cùng kết nối chung một mạng LAN có thể đặt trùng địa chỉ IP này mà không bị xung đột.","key":false}],"originalNumber":9},{"passage":"Xét quy trình và điều kiện chia sẻ thư mục trong mạng LAN Windows:","claims":[{"t":"Để chia sẻ thư mục, máy tính chia sẻ phải bật tính năng Network Discovery và File Sharing.","key":true},{"t":"Quyền \"Read\" cho phép người dùng từ máy khác xem và tải tệp về, nhưng không được sửa hay xóa tệp gốc.","key":true},{"t":"Quyền \"Full Control\" cho phép người dùng từ máy khác có toàn quyền chỉnh sửa, tạo mới và xóa tệp trong thư mục.","key":true},{"t":"Sau khi chia sẻ, bất kỳ ai trên Internet ở bất kỳ đâu trên thế giới cũng tự động truy cập được thư mục đó mà không cần mạng LAN.","key":false}],"originalNumber":10},{"passage":"Xét việc chia sẻ máy in trong phòng máy tính trường học:","claims":[{"t":"Máy in nối trực tiếp vào máy tính A qua cổng USB có thể được chia sẻ cho các máy tính B, C trong cùng mạng LAN.","key":true},{"t":"Khi máy tính A tắt nguồn hoàn toàn, máy tính B vẫn có thể điều khiển máy in đó ra lệnh in bình thường.","key":false},{"t":"Các máy tính B, C muốn in nhờ cần phải cài đặt trình điều khiển (Driver) máy in tương thích.","key":true},{"t":"Chia sẻ máy in giúp tiết kiệm chi phí đầu tư thiết bị cho trường học.","key":true}],"originalNumber":11},{"passage":"Cho các nhận định về văn hóa ứng xử và tuân thủ pháp luật trên không gian mạng:","claims":[{"t":"Mọi thông tin đăng tải trên mạng xã hội đều chính xác 100% và có thể tự do sao chép không cần kiểm chứng.","key":false},{"t":"Tôn trọng quan điểm cá nhân và sử dụng ngôn từ hòa nhã là biểu hiện của văn hóa ứng xử nhân văn.","key":true},{"t":"Tự ý lấy ảnh cá nhân của người khác để cắt ghép chế giễu trên mạng là hành vi vi phạm đạo đức và riêng tư.","key":true},{"t":"Khi sử dụng tài liệu từ Internet vào sản phẩm học tập, việc ghi rõ nguồn trích dẫn là tuân thủ Luật Sở hữu trí tuệ.","key":true}],"originalNumber":12}],"short":[],"essay":[],"sectionPoints":{"mc":6,"tf":4,"short":0,"essay":0}},{"id":"TH12-GK1-FORESTRY","subject":"forestry","title":"Công nghệ 12 (Lâm nghiệp) · Thi thử giữa kì I","description":"Sát ma trận THPT Tiểu La: 12 ABCD (3 điểm) + 4 Đúng/Sai (4 điểm). Phần tự luận 3 điểm được tách thành tài liệu ôn riêng. Điểm trên web là điểm TRẮC NGHIỆM quy đổi về thang 10 từ 7 điểm khách quan, không phải điểm toàn bài chính thức.","mode":"exam","minutes":45,"verified":false,"source":"Ma trận + nội dung ôn Công nghệ 12 THPT Tiểu La 2026–2027; câu mới do HaoEdu biên soạn, tham khảo hình thức đề từ thư viện học liệu và đề trường khác.","mc":[{"topic":6,"q":"Hành vi nào không phù hợp với khai thác rừng bền vững?","options":["Giữ lại khu vực bảo tồn và hành lang sinh thái.","Khai thác theo kế hoạch được phép, gắn với tái sinh và phục hồi.","Theo dõi tác động đến đất và nguồn nước.","Khai thác trái phép cây gỗ quý trong rừng tự nhiên."],"key":"D","level":"Nhận biết","explain":"Đáp án phù hợp: Khai thác trái phép cây gỗ quý trong rừng tự nhiên. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":3,"q":"Một trường học trồng cây bóng mát mới. Để tăng tỉ lệ sống trong vài tuần đầu, nhóm học sinh nên","options":["tưới hợp lí, cố định cây nếu cần và theo dõi tình trạng cây.","bỏ qua việc kiểm tra sau trồng.","đào lại bộ rễ mỗi ngày để quan sát.","tưới ngập liên tục dù đất đã úng."],"key":"A","level":"Vận dụng","explain":"Đáp án phù hợp: tưới hợp lí, cố định cây nếu cần và theo dõi tình trạng cây. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":5,"q":"Một địa phương thường có mưa ổn định đầu mùa và nắng gay gắt kéo dài về sau. Thời vụ trồng cây rừng phù hợp nhất thường là","options":["đầu mùa mưa khi đất đủ ẩm, tránh ngập úng kéo dài.","đỉnh mùa khô khi đất thiếu nước nghiêm trọng.","bất kì ngày nào, không cần xét thời tiết.","ngay giữa đợt bão lớn."],"key":"A","level":"Vận dụng","explain":"Đáp án phù hợp: đầu mùa mưa khi đất đủ ẩm, tránh ngập úng kéo dài. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":3,"q":"Tại một khu trồng cây non, cỏ dại mọc dày và cạnh tranh nước, dinh dưỡng. Việc ưu tiên nên làm là","options":["chặt bỏ cây non để cây cỏ phát triển.","bón thêm thuốc diệt cỏ tùy ý không theo hướng dẫn.","ngừng tưới trong mùa khô.","làm cỏ quanh gốc kết hợp kiểm tra độ ẩm và tình trạng cây."],"key":"D","level":"Vận dụng","explain":"Đáp án phù hợp: làm cỏ quanh gốc kết hợp kiểm tra độ ẩm và tình trạng cây. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":4,"q":"Sinh trưởng của cây rừng được hiểu là","options":["sự biến mất của mô sống.","chỉ là quá trình ra hoa kết quả.","việc cây đổi tên loài.","sự tăng về kích thước và khối lượng của cây theo thời gian."],"key":"D","level":"Nhận biết","explain":"Đáp án phù hợp: sự tăng về kích thước và khối lượng của cây theo thời gian. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":4,"q":"Phát triển của cây rừng bao gồm","options":["những biến đổi về chất, hình thành và hoàn thiện cơ quan qua các giai đoạn sống.","chỉ hiện tượng rụng lá do gió mạnh.","chỉ sự tăng đường kính thân.","chỉ sự thay đổi vị trí địa lí."],"key":"A","level":"Nhận biết","explain":"Đáp án phù hợp: những biến đổi về chất, hình thành và hoàn thiện cơ quan qua các giai đoạn sống. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":3,"q":"Chăm sóc rừng sau khi trồng thường bao gồm hoạt động nào?","options":["Làm cỏ, vun xới, bón phân phù hợp và kiểm tra sâu bệnh.","Phủ kín mọi cây non bằng vật liệu không xuyên sáng.","Chỉ chặt toàn bộ cây mới trồng.","Ngừng theo dõi cây trong nhiều năm."],"key":"A","level":"Nhận biết","explain":"Đáp án phù hợp: Làm cỏ, vun xới, bón phân phù hợp và kiểm tra sâu bệnh. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":3,"q":"Nhiệm vụ quan trọng của trồng rừng trên đất trống, đồi núi trọc là","options":["khôi phục độ che phủ thực vật, bảo vệ đất và tạo nguồn lâm sản phù hợp.","tăng tốc xói mòn đất.","ngăn cây rừng phát triển rễ.","loại bỏ hoàn toàn hệ động vật."],"key":"A","level":"Nhận biết","explain":"Đáp án phù hợp: khôi phục độ che phủ thực vật, bảo vệ đất và tạo nguồn lâm sản phù hợp. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":5,"q":"Ưu thế thường gặp của trồng rừng bằng cây con so với gieo hạt trực tiếp là","options":["không cần vận chuyển cây giống.","có thể chủ động chọn cây giống đủ tiêu chuẩn và tăng khả năng thiết lập ban đầu trong điều kiện phù hợp.","luôn có chi phí thấp hơn trong mọi hoàn cảnh.","không bao giờ cần chăm sóc sau trồng."],"key":"B","level":"Thông hiểu","explain":"Đáp án phù hợp: có thể chủ động chọn cây giống đủ tiêu chuẩn và tăng khả năng thiết lập ban đầu trong điều kiện phù hợp. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":4,"q":"Cây non mới trồng có bộ rễ chưa phát triển tốt. Biện pháp kĩ thuật phù hợp là","options":["tỉa cành quá mạnh khi cây đang yếu.","giữ ẩm vừa đủ, hạn chế cỏ cạnh tranh và bảo vệ cây khỏi tác động bất lợi.","không kiểm tra độ ẩm trong mùa khô.","khai thác ngay cây non để có gỗ."],"key":"B","level":"Vận dụng","explain":"Đáp án phù hợp: giữ ẩm vừa đủ, hạn chế cỏ cạnh tranh và bảo vệ cây khỏi tác động bất lợi. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":6,"q":"Đối tượng nào có trách nhiệm tham gia bảo vệ rừng?","options":["Cơ quan quản lí, chủ rừng, tổ chức và cộng đồng theo trách nhiệm pháp luật.","Chỉ người kinh doanh đồ gỗ.","Chỉ riêng kiểm lâm.","Chỉ người sống sát rừng."],"key":"A","level":"Nhận biết","explain":"Đáp án phù hợp: Cơ quan quản lí, chủ rừng, tổ chức và cộng đồng theo trách nhiệm pháp luật. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":6,"q":"Bảo vệ và khai thác tài nguyên rừng bền vững nhằm","options":["duy trì chức năng sinh thái và giá trị kinh tế - xã hội của rừng về lâu dài.","loại bỏ mọi hoạt động sinh kế hợp pháp.","chuyển toàn bộ rừng phòng hộ thành khu công nghiệp.","tối đa hóa lượng gỗ lấy trong một năm bất chấp khả năng phục hồi."],"key":"A","level":"Nhận biết","explain":"Đáp án phù hợp: duy trì chức năng sinh thái và giá trị kinh tế - xã hội của rừng về lâu dài. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."}],"tf":[{"topic":1,"passage":"Một huyện miền núi cần lựa chọn giải pháp giảm xói mòn đất và phát triển sinh kế từ rừng." ều kiện và quy trình lâm nghiệp phù hợp trong tài liệu ôn tập."},{"t":"Phát triển chỉ là tăng chiều cao, không bao gồm hình thành cơ quan sinh sản.","key":false,"explain":"Đối chiếu nhận định với vai trò, điều kiện và quy trình lâm nghiệp phù hợp trong tài liệu ôn tập."},{"t":"Có thể điều chỉnh chăm sóc theo từng giai đoạn sinh trưởng và phát triển.","key":true,"explain":"Đối chiếu nhận định với vai trò, điều kiện và quy trình lâm nghiệp phù hợp trong tài liệu ôn tập."},{"t":"Mọi cây cùng loài đều luôn ra hoa ở đúng một thời điểm bất kể môi trường.","key":false,"explain":"Đối chiếu nhận định với vai trò, điều kiện và quy trình lâm nghiệp phù hợp trong tài liệu ôn tập."}],"explain":""},{"topic":5,"passage":"Một đội lâm nghiệp lựa chọn giữa gieo hạt trực tiếp và trồng cây con có bầu để phủ xanh đất trống.","claims":[{"t":"Cả hai phương pháp đều có điều kiện áp dụng và ưu nhược điểm riêng.","key":true,"explain":"Đối chiếu nhận định với vai trò, điều kiện và quy trình lâm nghiệp phù hợp trong tài liệu ôn tập."},{"t":"Trồng cây con có bầu giúp chủ động lựa chọn cây giống đủ tiêu chuẩn.","key":true,"explain":"Đối chiếu nhận định với vai trò, điều kiện và quy trình lâm nghiệp phù hợp trong tài liệu ôn tập."},{"t":"Không cần tính đến mùa mưa hay điều kiện đất khi xác định thời vụ trồng.","key":false,"explain":"Đối chiếu nhận định với vai trò, điều kiện và quy trình lâm nghiệp phù hợp trong tài liệu ôn tập."},{"t":"Sau trồng, cần kiểm tra độ ẩm và tình trạng cây để chăm sóc phù hợp.","key":true,"explain":"Đối chiếu nhận định với vai trò, điều kiện và quy trình lâm nghiệp phù hợp trong tài liệu ôn tập."}],"explain":""}],"short":[],"essay":[],"sectionPoints":{"mc":3,"tf":4,"short":0,"essay":0}},{"id":"TH12-GK1-FORESTRY-TRAINING","subject":"forestry","title":"Luyện lâm nghiệp Bài 1–6 · Ngân hàng 36 ABCD + 8 Đ/S","description":"Ngân hàng tự biên soạn mở rộng, có câu thực tế về rừng phòng hộ, cháy rừng, trồng cây, sinh trưởng, khai thác bền vững. Chọn đúng mới chuyển câu; đây là nội dung luyện tập, không phải đề chính thức.","mode":"mastery","minutes":0,"verified":false,"source":"Bám nội dung ôn THPT Tiểu La + tham khảo phong cách câu hỏi Công nghệ 12 công bố công khai","mc":[{"topic":1,"q":"Một khu rừng đầu nguồn có vai trò nào quan trọng nhất đối với khu dân cư ở hạ lưu?","options":["Điều tiết dòng chảy, giảm xói mòn và nguy cơ lũ.","Tăng độ mặn của sông.","Làm nước mưa bốc hơi hoàn toàn.","Ngăn mọi hiện tượng thời tiết cực đoan."],"key":"A","level":"Nhận biết","explain":"Đáp án phù hợp: Điều tiết dòng chảy, giảm xói mòn và nguy cơ lũ. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":1,"q":"Sản phẩm nào sau đây có thể được khai thác từ hoạt động lâm nghiệp theo hướng bền vững?","options":["Gỗ, tre, nhựa thông và một số lâm sản ngoài gỗ.","Xi măng từ nhà máy.","Dầu thô khai thác ngoài khơi.","Quặng sắt từ mỏ lộ thiên."],"key":"A","level":"Nhận biết","explain":"Đáp án phù hợp: Gỗ, tre, nhựa thông và một số lâm sản ngoài gỗ. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":1,"q":"Tại vùng ven biển thường bị gió mạnh và cát bay, loại rừng nào cần ưu tiên bảo vệ?","options":["Rừng trồng thay bằng bãi đỗ xe.","Rừng phòng hộ chắn gió, chắn cát.","Rừng trồng chỉ nhằm lấy gỗ ngắn ngày.","Rừng ở khu vực không chịu tác động của gió."],"key":"B","level":"Thông hiểu","explain":"Đáp án phù hợp: Rừng phòng hộ chắn gió, chắn cát. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":1,"q":"Một xã muốn phát triển du lịch sinh thái nhưng vẫn bảo tồn các loài quý hiếm. Biện pháp hợp lí nhất là","options":["mở đường vào mọi vùng lõi để tăng lượng khách.","quy hoạch tuyến tham quan có kiểm soát, giám sát tác động và bảo vệ sinh cảnh.","cho phép du khách tự mang động vật rừng về làm quà.","chặt bớt cây lâu năm để tạo không gian rộng."],"key":"B","level":"Vận dụng","explain":"Đáp án phù hợp: quy hoạch tuyến tham quan có kiểm soát, giám sát tác động và bảo vệ sinh cảnh. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":1,"q":"Rừng góp phần ứng phó với biến đổi khí hậu chủ yếu bằng cơ chế nào?","options":["Phân hủy toàn bộ CO₂ của khí quyển ngay lập tức.","Làm biến mất nhu cầu sử dụng nhiên liệu hóa thạch.","Hấp thụ và tích lũy một phần CO₂ trong sinh khối và đất.","Biến mọi khí thải thành khí oxygen."],"key":"C","level":"Thông hiểu","explain":"Đáp án phù hợp: Hấp thụ và tích lũy một phần CO₂ trong sinh khối và đất. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":1,"q":"Lớp học tổ chức hoạt động phục hồi một khoảng đất trống gần suối. Chỉ số nào phù hợp nhất để theo dõi hiệu quả sau hai năm?","options":["Số lượt đi dã ngoại mỗi tháng.","Số lượng biển quảng cáo bên đường.","Tỉ lệ cây bản địa sống, độ che phủ thực vật và mức độ xói mòn đất.","Số lượng ảnh chụp đăng mạng xã hội."],"key":"C","level":"Vận dụng","explain":"Đáp án phù hợp: Tỉ lệ cây bản địa sống, độ che phủ thực vật và mức độ xói mòn đất. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":2,"q":"Hoạt động nào thuộc nhóm hoạt động lâm nghiệp cơ bản?","options":["Khoan thăm dò dầu khí dưới biển.","Chỉ sản xuất thiết bị y tế.","Chỉ kinh doanh đồ điện gia dụng.","Bảo vệ, phát triển, khai thác và chế biến lâm sản theo quy định."],"key":"D","level":"Nhận biết","explain":"Đáp án phù hợp: Bảo vệ, phát triển, khai thác và chế biến lâm sản theo quy định. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":2,"q":"Nguyên nhân nào có thể trực tiếp gây suy thoái tài nguyên rừng ở khu vực miền núi?","options":["Đặt biển cảnh báo nguy cơ cháy.","Tăng cường tuần tra rừng.","Trồng bổ sung cây bản địa.","Khai thác gỗ trái phép và chuyển đổi đất rừng thiếu kiểm soát."],"key":"D","level":"Thông hiểu","explain":"Đáp án phù hợp: Khai thác gỗ trái phép và chuyển đổi đất rừng thiếu kiểm soát. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":2,"q":"Sau một mùa khô, nhiều vụ cháy xảy ra gần khu vực đốt thực bì làm nương. Biện pháp phù hợp nhất là","options":["chỉ ghi nhận thiệt hại sau khi cháy.","thiết lập đường băng cản lửa, kiểm soát nguồn lửa và cảnh báo sớm.","đốt nhiều hơn để triệt tiêu nguy cơ cháy.","ngừng mọi hoạt động giáo dục cộng đồng."],"key":"B","level":"Vận dụng","explain":"Đáp án phù hợp: thiết lập đường băng cản lửa, kiểm soát nguồn lửa và cảnh báo sớm. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":2,"q":"Khi phát hiện dấu hiệu khai thác gỗ trái phép, người dân nên","options":["báo cho cơ quan chức năng hoặc lực lượng bảo vệ rừng, cung cấp thông tin an toàn.","đối đầu trực tiếp với nhóm nghi vi phạm.","mang dụng cụ đến tự thu giữ toàn bộ gỗ.","đăng thông tin chưa kiểm chứng kèm địa chỉ cá nhân lên mạng."],"key":"A","level":"Vận dụng","explain":"Đáp án phù hợp: báo cho cơ quan chức năng hoặc lực lượng bảo vệ rừng, cung cấp thông tin an toàn. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":2,"q":"Để giảm suy thoái rừng do chăn thả tự do và xâm lấn đất, địa phương nên ưu tiên","options":["chỉ trồng một loài cây không quan tâm điều kiện sinh thái.","loại bỏ mọi hoạt động giám sát.","cho phép chuyển đổi toàn bộ đất rừng ngay.","xác định ranh giới, quy hoạch sử dụng đất và phối hợp cộng đồng quản lí."],"key":"D","level":"Thông hiểu","explain":"Đáp án phù hợp: xác định ranh giới, quy hoạch sử dụng đất và phối hợp cộng đồng quản lí. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":2,"q":"Vì sao việc trồng lại rừng không thể lập tức thay thế đầy đủ rừng tự nhiên đã mất?","options":["Vì cây trồng không quang hợp.","Vì cấu trúc hệ sinh thái, đa dạng loài và đất rừng cần thời gian dài để phục hồi.","Vì rừng tự nhiên không có giá trị sinh thái.","Vì rừng trồng không bao giờ có giá trị kinh tế."],"key":"B","level":"Vận dụng","explain":"Đáp án phù hợp: Vì cấu trúc hệ sinh thái, đa dạng loài và đất rừng cần thời gian dài để phục hồi. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":3,"q":"Nhiệm vụ quan trọng của trồng rừng trên đất trống, đồi núi trọc là","options":["khôi phục độ che phủ thực vật, bảo vệ đất và tạo nguồn lâm sản phù hợp.","tăng tốc xói mòn đất.","ngăn cây rừng phát triển rễ.","loại bỏ hoàn toàn hệ động vật."],"key":"A","level":"Nhận biết","explain":"Đáp án phù hợp: khôi phục độ che phủ thực vật, bảo vệ đất và tạo nguồn lâm sản phù hợp. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":3,"q":"Chăm sóc rừng sau khi trồng thường bao gồm hoạt động nào?","options":["Làm cỏ, vun xới, bón phân phù hợp và kiểm tra sâu bệnh.","Phủ kín mọi cây non bằng vật liệu không xuyên sáng.","Chỉ chặt toàn bộ cây mới trồng.","Ngừng theo dõi cây trong nhiều năm."],"key":"A","level":"Nhận biết","explain":"Đáp án phù hợp: Làm cỏ, vun xới, bón phân phù hợp và kiểm tra sâu bệnh. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":3,"q":"Tại một khu trồng cây non, cỏ dại mọc dày và cạnh tranh nước, dinh dưỡng. Việc ưu tiên nên làm là","options":["chặt bỏ cây non để cây cỏ phát triển.","bón thêm thuốc diệt cỏ tùy ý không theo hướng dẫn.","ngừng tưới trong mùa khô.","làm cỏ quanh gốc kết hợp kiểm tra độ ẩm và tình trạng cây."],"key":"D","level":"Vận dụng","explain":"Đáp án phù hợp: làm cỏ quanh gốc kết hợp kiểm tra độ ẩm và tình trạng cây. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":3,"q":"Một trường học trồng cây bóng mát mới. Để tăng tỉ lệ sống trong vài tuần đầu, nhóm học sinh nên","options":["tưới hợp lí, cố định cây nếu cần và theo dõi tình trạng cây.","bỏ qua việc kiểm tra sau trồng.","đào lại bộ rễ mỗi ngày để quan sát.","tưới ngập liên tục dù đất đã úng."],"key":"A","level":"Vận dụng","explain":"Đáp án phù hợp: tưới hợp lí, cố định cây nếu cần và theo dõi tình trạng cây. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":3,"q":"Mục tiêu của việc trồng rừng phòng hộ ven biển là gì?","options":["Tăng độ mặn của nước ngọt.","Góp phần chắn gió, hạn chế cát bay, bảo vệ vùng ven bờ.","Tạo diện tích đất trống lớn.","Đẩy nhanh xói lở để mở rộng bờ biển."],"key":"B","level":"Nhận biết","explain":"Đáp án phù hợp: Góp phần chắn gió, hạn chế cát bay, bảo vệ vùng ven bờ. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":3,"q":"Vì sao cần kiểm tra tỉ lệ cây sống và trồng dặm sau đợt trồng rừng?","options":["Vì tất cả cây trồng ban đầu đều phải thay bằng cây mới.","Để loại bỏ tác dụng giữ đất của rừng.","Để bù những vị trí cây chết, giúp duy trì mật độ thích hợp.","Để làm giảm diện tích rừng đã phục hồi."],"key":"C","level":"Thông hiểu","explain":"Đáp án phù hợp: Để bù những vị trí cây chết, giúp duy trì mật độ thích hợp. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":4,"q":"Sinh trưởng của cây rừng được hiểu là","options":["sự biến mất của mô sống.","chỉ là quá trình ra hoa kết quả.","việc cây đổi tên loài.","sự tăng về kích thước và khối lượng của cây theo thời gian."],"key":"D","level":"Nhận biết","explain":"Đáp án phù hợp: sự tăng về kích thước và khối lượng của cây theo thời gian. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":4,"q":"Phát triển của cây rừng bao gồm","options":["những biến đổi về chất, hình thành và hoàn thiện cơ quan qua các giai đoạn sống.","chỉ hiện tượng rụng lá do gió mạnh.","chỉ sự tăng đường kính thân.","chỉ sự thay đổi vị trí địa lí."],"key":"A","level":"Nhận biết","explain":"Đáp án phù hợp: những biến đổi về chất, hình thành và hoàn thiện cơ quan qua các giai đoạn sống. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":4,"q":"Cây non mới trồng có bộ rễ chưa phát triển tốt. Biện pháp kĩ thuật phù hợp là","options":["tỉa cành quá mạnh khi cây đang yếu.","giữ ẩm vừa đủ, hạn chế cỏ cạnh tranh và bảo vệ cây khỏi tác động bất lợi.","không kiểm tra độ ẩm trong mùa khô.","khai thác ngay cây non để có gỗ."],"key":"B","level":"Vận dụng","explain":"Đáp án phù hợp: giữ ẩm vừa đủ, hạn chế cỏ cạnh tranh và bảo vệ cây khỏi tác động bất lợi. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":4,"q":"Ở giai đoạn cây rừng phát triển mạnh chiều cao và đường kính, chăm sóc hợp lí thường nhằm","options":["làm đất bị nén chặt hơn.","loại bỏ mọi vi sinh vật có ích.","ngăn tuyệt đối hoạt động quang hợp.","giảm cạnh tranh ánh sáng, nước và dinh dưỡng giữa các cây."],"key":"D","level":"Thông hiểu","explain":"Đáp án phù hợp: giảm cạnh tranh ánh sáng, nước và dinh dưỡng giữa các cây. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":4,"q":"Dấu hiệu nào thường liên quan rõ nhất đến giai đoạn cây rừng bước vào sinh sản?","options":["Hình thành hoa, quả hoặc hạt tùy loài.","Cây không còn quá trình trao đổi chất.","Mầm chưa xuất hiện.","Bộ rễ mới chỉ có một tế bào."],"key":"A","level":"Nhận biết","explain":"Đáp án phù hợp: Hình thành hoa, quả hoặc hạt tùy loài. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":4,"q":"Một lô rừng trồng đang tăng trưởng mạnh nhưng mật độ quá dày khiến cây còi cọc. Phương án nên xem xét là","options":["tưới thêm nước mà không cần khảo sát.","tỉa thưa có kế hoạch theo loài, tuổi và mục tiêu kinh doanh.","chỉ tăng mật độ thêm nữa.","đốt toàn bộ lớp thảm mục."],"key":"B","level":"Vận dụng","explain":"Đáp án phù hợp: tỉa thưa có kế hoạch theo loài, tuổi và mục tiêu kinh doanh. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":5,"q":"Ưu thế thường gặp của trồng rừng bằng cây con so với gieo hạt trực tiếp là","options":["không cần vận chuyển cây giống.","có thể chủ động chọn cây giống đủ tiêu chuẩn và tăng khả năng thiết lập ban đầu trong điều kiện phù hợp.","luôn có chi phí thấp hơn trong mọi hoàn cảnh.","không bao giờ cần chăm sóc sau trồng."],"key":"B","level":"Thông hiểu","explain":"Đáp án phù hợp: có thể chủ động chọn cây giống đủ tiêu chuẩn và tăng khả năng thiết lập ban đầu trong điều kiện phù hợp. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":5,"q":"Gieo hạt trực tiếp thường phù hợp hơn khi","options":["hạt đủ sức nảy mầm, điều kiện đất và ẩm thích hợp, có biện pháp bảo vệ hạt.","đất quá khô và hạt không thể nảy mầm.","mục tiêu là không cần quan tâm tới cỏ dại hay sâu hại.","loài cây chỉ có thể nhân giống bằng giâm cành."],"key":"A","level":"Thông hiểu","explain":"Đáp án phù hợp: hạt đủ sức nảy mầm, điều kiện đất và ẩm thích hợp, có biện pháp bảo vệ hạt. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":5,"q":"Một địa phương thường có mưa ổn định đầu mùa và nắng gay gắt kéo dài về sau. Thời vụ trồng cây rừng phù hợp nhất thường là","options":["đầu mùa mưa khi đất đủ ẩm, tránh ngập úng kéo dài.","đỉnh mùa khô khi đất thiếu nước nghiêm trọng.","bất kì ngày nào, không cần xét thời tiết.","ngay giữa đợt bão lớn."],"key":"A","level":"Vận dụng","explain":"Đáp án phù hợp: đầu mùa mưa khi đất đủ ẩm, tránh ngập úng kéo dài. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":5,"q":"Khi trồng cây con có bầu đất, thao tác nào phù hợp để hạn chế tổn thương rễ?","options":["để nguyên lớp nhựa bầu không phân hủy trong mọi trường hợp.","chặt hết rễ trước khi trồng.","Tháo hoặc rạch bỏ vỏ bầu theo hướng dẫn, giữ bầu đất ổn định và lấp đất vừa kín gốc.","giật mạnh rễ ra khỏi bầu rồi phơi nắng."],"key":"C","level":"Vận dụng","explain":"Đáp án phù hợp: Tháo hoặc rạch bỏ vỏ bầu theo hướng dẫn, giữ bầu đất ổn định và lấp đất vừa kín gốc. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":5,"q":"Vì sao không nên áp dụng một lịch tưới giống nhau cho mọi khu rừng trồng?","options":["Vì tưới luôn gây hại cho cây.","Vì mọi loài đều không hấp thụ nước.","Vì nhu cầu nước còn phụ thuộc loài cây, thời tiết, đất và giai đoạn phát triển.","Vì rễ cây không chịu ảnh hưởng bởi đất."],"key":"C","level":"Thông hiểu","explain":"Đáp án phù hợp: Vì nhu cầu nước còn phụ thuộc loài cây, thời tiết, đất và giai đoạn phát triển. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":5,"q":"Ở vùng đất dốc dễ xói mòn, bố trí hố trồng và biện pháp giữ đất nên","options":["dồn đất mùn xuống một điểm không theo quy hoạch.","tạo rãnh thẳng dốc để nước chảy nhanh nhất.","theo đường đồng mức và kết hợp che phủ thích hợp khi có thể.","loại bỏ toàn bộ thực bì rồi để đất trống dài ngày."],"key":"C","level":"Vận dụng","explain":"Đáp án phù hợp: theo đường đồng mức và kết hợp che phủ thích hợp khi có thể. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":6,"q":"Bảo vệ và khai thác tài nguyên rừng bền vững nhằm","options":["duy trì chức năng sinh thái và giá trị kinh tế - xã hội của rừng về lâu dài.","loại bỏ mọi hoạt động sinh kế hợp pháp.","chuyển toàn bộ rừng phòng hộ thành khu công nghiệp.","tối đa hóa lượng gỗ lấy trong một năm bất chấp khả năng phục hồi."],"key":"A","level":"Nhận biết","explain":"Đáp án phù hợp: duy trì chức năng sinh thái và giá trị kinh tế - xã hội của rừng về lâu dài. Cần liên hệ với điều kiện sinh thái, mục tiêu trồng hoặc bảo vệ rừng trong tình huống."},{"topic":6,"q":"Đối tượng nào có trách nhiệm tham gia bảo vệ rừng?","options":["Cơ quan quản lí, chủ rừng, tổ chức và cộng đồng theo trách nhiệm pháp luật.","Chỉ người kinh doanh đồ gỗ.","Chỉ riêng kiểm <script>
'use strict';
(()=>{
const root=document.getElementById('app');
const modalHost=document.getElementById('modalHost');
const toastHost=document.getElementById('toastHost');
const K={theme:'ot12-r7-theme',custom:'ot12-r7-exams',hidden:'ot12-r7-hidden',records:'ot12-r7-records',session:'ot12-r7-session'};
const store={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}},del:k=>{try{localStorage.removeItem(k)}catch{}}};

/* HaoEdu V7.1 — soft sound feedback, unlocked only after an explicit user gesture. */
const SOUND_KEY='haoedu-feedback-sound-v1';
const SOUND_VOLUME_KEY='haoedu-feedback-volume-v1';
let soundEnabled=store.get(SOUND_KEY,true),soundVolume=Number(store.get(SOUND_VOLUME_KEY,65));
if(!Number.isFinite(soundVolume))soundVolume=65;
soundVolume=Math.max(0,Math.min(100,soundVolume));
let soundContext=null;
function soundCtx(){
  const C=window.AudioContext||window.webkitAudioContext;
  if(!C)return null;
  try{if(!soundContext)soundContext=new C();return soundContext;}catch{return null;}
}
function gentleTone(ctx,freq,delay,duration,level=0.055,shape='sine'){
  try{
    const at=ctx.currentTime+delay;
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type=shape;o.frequency.setValueAtTime(freq,at);
    const v=Math.max(0.0001,level*(soundVolume/100));
    g.gain.setValueAtTime(0.0001,at);
    g.gain.exponentialRampToValueAtTime(v,at+Math.min(.018,duration/3));
    g.gain.exponentialRampToValueAtTime(0.0001,at+duration);
    o.connect(g);g.connect(ctx.destination);
    o.start(at);o.stop(at+duration+.03);
  }catch(err){console.warn('HaoEdu audio tone error:',err)}
}
function emitSound(ctx,kind){
  if(kind==='tap'){gentleTone(ctx,620,0,.065,.035)}
  else if(kind==='correct'){
    gentleTone(ctx,600,0,.055,.027);
    gentleTone(ctx,784,.07,.17,.060);
    gentleTone(ctx,988,.19,.20,.052);
  }else if(kind==='wrong'){
    gentleTone(ctx,590,0,.055,.024);
    gentleTone(ctx,420,.065,.17,.055);
  }else if(kind==='celebrate'){
    [523.25,659.25,783.99,1046.5].forEach((f,i)=>gentleTone(ctx,f,i*.16,.26,.045,'sine'));
  }
}
function playHaoSound(kind='tap'){
  if(!soundEnabled||soundVolume<=0)return;
  const ctx=soundCtx();if(!ctx)return;
  if(ctx.state==='suspended'){
    ctx.resume().then(()=>emitSound(ctx,kind)).catch(err=>console.warn('HaoEdu audio resume blocked:',err));
  }else emitSound(ctx,kind);
}
function refreshSoundButton(){
  const b=document.getElementById('soundBtn');if(!b)return;
  b.textContent=soundEnabled?'🔊 Âm thanh':'🔇 Tắt tiếng';
  b.setAttribute('aria-pressed',String(soundEnabled));
  b.setAttribute('aria-label',soundEnabled?'Tắt âm thanh phản hồi':'Bật âm thanh phản hồi');
  b.title=soundEnabled?'Nhấn để tắt âm thanh':'Nhấn để bật âm thanh';
  const sl=document.getElementById('soundVolume');if(sl){sl.value=String(soundVolume);sl.disabled=!soundEnabled;}
}

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const sci=s=>esc(s).replace(/([A-Za-zΔλαΩ])_([A-Za-z0-9À-ỹ]+)/g,'$1<sub>$2</sub>').replace(/\^(-?\d+)/g,'<sup>$1</sup>').replace(/\n/g,'<br>');
const cleanClaim=s=>String(s??'').replace(/^\s*[abcd]\s*[).]\s*/i,'');
const fmt=n=>(Math.round(n*100)/100).toLocaleString('vi-VN',{maximumFractionDigits:2});
const clock=n=>`${String(Math.floor(Math.max(0,n)/60)).padStart(2,'0')}:${String(Math.floor(Math.max(0,n)%60)).padStart(2,'0')}`;
const date=s=>new Date(s).toLocaleString('vi-VN',{dateStyle:'short',timeStyle:'short'});
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
// When Shuffle is requested, ensure every group with at least 2 items actually changes order.
const shuffledDifferent=a=>{const b=shuffle(a);if(a.length>1&&b.every((v,i)=>v===a[i]))return [...b.slice(1),b[0]];return b};
const copy=x=>JSON.parse(JSON.stringify(x));
const identityOrder=n=>Array.from({length:n},(_,i)=>i);
function generateVisualOrder(ex){
  return {mc:Object.fromEntries((ex.mc||[]).map((q,i)=>[i,shuffledDifferent(identityOrder((q.options||[]).length))])),
          tf:Object.fromEntries((ex.tf||[]).map((q,i)=>[i,shuffledDifferent(identityOrder((q.claims||[]).length))]))};
}
function mcVisualOrder(i){const ex=getExam(session?.examId);const n=ex?.mc?.[i]?.options?.length||4;const p=session?.visuals?.mc?.[i];return Array.isArray(p)&&p.length===n&&new Set(p).size===n?p:identityOrder(n)}
function tfVisualOrder(i){const ex=getExam(session?.examId);const n=ex?.tf?.[i]?.claims?.length||4;const p=session?.visuals?.tf?.[i];return Array.isArray(p)&&p.length===n&&new Set(p).size===n?p:identityOrder(n)}

// Repair scores saved by earlier versions where points were awarded even for blanks.
// Only exam records with per-question details are migrated; mastery results are untouched.
function repairLegacyScores(){
  let changed=false;
  for(const r of records){
    if(r.mode!=='exam'||!Array.isArray(r.detail)||!r.detail.length||!r.detail.every(d=>Number.isFinite(Number(d.points))))continue;
    let sum=0,count=0;const by={mc:0,tf:0,short:0,essay:0};
    for(const d of r.detail){if(d.correct===true){count++;sum+=Number(d.points);by[d.section]=(by[d.section]||0)+Number(d.points)}}
    const computed=Math.min(10,Math.max(0,Math.round(sum*100)/100));
    if(r.score!==computed||r.correct!==count){r.score=computed;r.correct=count;r.pointsBy=by;r.scoreVersion=2;changed=true}
  }
  if(changed)store.set(K.records,records);
}

function answerMaster(value,claim){const e=getExam(session.examId),o=session.order[session.position],k=o.section==='mc'?`mc-${o.i}`:`tf-${o.i}-${claim}`;if(session.done[k])return;const correct=o.section==='mc'?e.mc[o.i].key===value:e.tf[o.i].claims[claim].key===value;session.tries[k]=(session.tries[k]||0)+1;playHaoSound(correct?'correct':'wrong');if(correct){session.done[k]=true;session.answers[k]=value;session.feedback='Đúng rồi! Tiếp tục nhé.';}else{session.feedback='Chưa đúng. Em chọn lại ở câu này.';}persist();render()}
function numberValid(v){const s=String(v??'').trim().replace(',','.').replace(/\s+/g,'');if(!s)return NaN;const match=s.match(/^([+-]?(?:\d+(?:\.\d+)?|\.\d+))(?:[x×*]10\^?([+-]?\d+))?$/i);if(!match)return NaN;return Number(match[1])*(match[2]?10**Number(match[2]):1)}
function numberCorrect(got,key,tol){const n=numberValid(got),t=Number(key);return Number.isFinite(n)&&Number.isFinite(t)&&Math.abs(n-t)<=Math.max(Number(tol)||0.001,Math.abs(t)*1e-7)}
function scoreExam(e){const base=e.sectionPoints||{mc:3,tf:2,short:2,essay:3};const n={mc:(e.mc||[]).length,tf:(e.tf||[]).reduce((s,q)=>s+(q.claims||[]).length,0),short:(e.short||[]).length,essay:(e.essay||[]).reduce((s,q)=>s+(q.parts||[]).length,0)};const selected=Object.keys(base).filter(k=>n[k]>0),totalBase=selected.reduce((s,k)=>s+base[k],0);const per={};for(const k of selected)per[k]=10*base[k]/totalBase/n[k];let total=0,correct=0,detail=[],pointsBy={mc:0,tf:0,short:0,essay:0};
function add(section,index,sub,title,got,key,yes,explain,meta={}){const p=per[section]||0;if(yes){total+=p;correct++;pointsBy[section]+=p}detail.push({section,index,sub,title,got,key,correct:yes,points:p,explain:explain||'',...meta})}
(e.mc||[]).forEach((q,i)=>{const raw=session.answers[`mc-${i}`];add('mc',i,null,q.q,visualMCLabel(raw,i),visualMCLabel(q.key,i),raw===q.key,q.explain||'',{gotText:q.options?.['ABCD'.indexOf(raw)]||'',keyText:q.options?.['ABCD'.indexOf(q.key)]||''})});
(e.tf||[]).forEach((q,i)=>(q.claims||[]).forEach((c,j)=>add('tf',i,j,`${'abcd'[tfVisualOrder(i).indexOf(j)]}) ${cleanClaim(c.t)}`,session.answers[`tf-${i}-${j}`],c.key,session.answers[`tf-${i}-${j}`]===c.key,c.explain||'')));
(e.short||[]).forEach((q,i)=>add('short',i,null,q.q,session.answers[`short-${i}`],q.key,numberCorrect(session.answers[`short-${i}`],q.key,q.tol),q.hint||''));
(e.essay||[]).forEach((q,i)=>(q.parts||[]).forEach((c,j)=>add('essay',i,j,q.title+' — '+c.q,session.answers[`essay-${i}-${j}`],c.key,numberCorrect(session.answers[`essay-${i}-${j}`],c.key,c.tol),q.solution||'')));
return {score:Math.min(10,Math.max(0,Math.round(total*100)/100)),correct,total:detail.length,detail,pointsBy}}
function scoreMaster(e){const details=[];session.order.forEach(o=>{if(o.section==='mc'){const q=e.mc[o.i],k=`mc-${o.i}`;details.push({section:'mc',title:q.q,got:visualMCLabel(session.answers[k],o.i),key:visualMCLabel(q.key,o.i),gotText:q.options?.['ABCD'.indexOf(session.answers[k])]||'',keyText:q.options?.['ABCD'.indexOf(q.key)]||'',correct:(session.tries[k]||0)===1,explain:'Điểm ghi nhận theo lần chọn đầu tiên.'})}else{const q=e.tf[o.i];q.claims.forEach((c,j)=>{const k=`tf-${o.i}-${j}`;details.push({section:'tf',title:`${'abcd'[tfVisualOrder(o.i).indexOf(j)]}) ${cleanClaim(c.t)}`,got:session.answers[k],key:c.key,correct:(session.tries[k]||0)===1,explain:'Điểm ghi nhận theo lần chọn đầu tiên.'})})}});const correct=details.filter(d=>d.correct).length;return {score:Math.round(1000*correct/Math.max(1,details.length))/100,correct,total:details.length,detail:details,pointsBy:{mc:0,tf:0,short:0,essay:0}}}

t">Nhập đề JSON đã có</button></div></div>`}`}
const exampleExam={id:'HOA-MAU-1',subject:'chemistry',title:'Đề Hóa học ví dụ',description:'Mẫu cấu trúc JSON để biên tập, cần thay thế nội dung trước khi duyệt.',mode:'exam',minutes:45,draft:true,mc:[{q:'Phát biểu nào đúng về số mol?',options:['Một mol chứa 6,022 × 10²³ thực thể.','Một mol luôn có khối lượng 1 g.','Số mol có đơn vị °C.','Một mol chỉ dùng cho chất khí.'],key:'A',explain:'Theo hằng số Avogadro.'}],tf:[{passage:'Xét các nhận định về mol.',claims:[{t:'Mol là đơn vị của lượng chất.',key:true},{t:'Số Avogadro là số hạt trong một mol.',key:true},{t:'Mol chỉ áp dụng cho khí.',key:false},{t:'Một mol bất kì luôn có khối lượng 22,4 g.',key:false}]}],short:[{q:'Số mol của 18 g H₂O, M = 18 g/mol?',key:1,unit:'mol',tol:.01}],essay:[{title:'Bài toán tính nồng độ',prompt:'Một dung dịch có 0,20 mol chất tan trong 0,50 L. Tính nồng độ mol.',parts:[{q:'Nồng độ mol của dung dịch?',key:.4,unit:'mol/L',tol:.01}],solution:'C_M = n/V = 0,20/0,50 = 0,40 mol/L.'}]};
function detailEditor(){if(!editing)return go('editor');const e=editing;root.innerHTML=`<div class="subhero"><div><div class="eyebrow" style="color:var(--brand)">TRÌNH SOẠN ĐỀ</div><h1>Sửa nội dung đề</h1><p>Thay đổi bằng biểu mẫu. Không cần chỉnh mã JSON.</p></div><button class="btn secondary" data-action="cancel-edit">← Danh sách đề</button></div><div class="panel"><div class="formrow"><div class="field"><label>Tên đề</label><input data-editfield="title" value="${esc(e.title)}" maxlength="120"></div><div class="field"><label>Môn học</label><select data-editfield="subject">${Object.entries(labels).map(([k,v])=>`<option value="${k}" ${e.subject===k?'selected':''}>${v}</option>`).join('')}</select></div><div class="field"><label>Chế độ</label><select data-editfield="mode"><option value="exam" ${e.mode==='exam'?'selected':''}>Thi thử · nộp một lần</option><option value="mastery" ${e.mode==='mastery'?'selected':''}>Học đến khi đúng</option></select></div><div class="field"><label>Thời gian (phút; 0 = không giới hạn)</label><input data-editfield="minutes" type="number" min="0" max="240" value="${Number(e.minutes)||0}"></div></div><div class="field" style="margin-top:12px"><label>Mô tả đề</label><textarea data-editfield="description">${esc(e.description||'')}</textarea></div><label class="small" style="display:flex;align-items:center;gap:8px;margin-top:9px"><input id="reviewedExam" type="checkbox" ${e.draft?'':'checked'}> Đã kiểm tra câu hỏi, đơn vị và đáp án; cho phép hiển thị tại máy này</label></div><div class="panel"><div class="section-head" style="margin-top:0"><div><h2>Câu hỏi của đề</h2><div class="muted small">Nhấn Sửa tại từng câu. Có thể thêm hoặc xóa bất cứ phần nào.</div></div></div>${['mc','tf','short','essay'].map(k=>`<section class="edit-list"><h3>${({mc:'I · Trắc nghiệm ABCD',tf:'II · Đúng/Sai',short:'III · Trả lời ngắn',essay:'IV · Tự luận đáp số'})[k]} (${(e[k]||[]).length})</h3>${(e[k]||[]).map((q,i)=>`<div class="edititem"><span class="clamped"><b>${i+1}.</b> ${esc(q.q||q.passage||q.title||'Câu chưa có tiêu đề')}</span><div class="btn-row" style="flex-wrap:nowrap"><button class="btn sm" data-action="edit-question" data-type="${k}" data-index="${i}">Sửa</button><button class="btn sm danger" data-action="remove-question" data-type="${k}" data-index="${i}">Xóa</button></div></div>`).join('')||`<div class="muted small">Chưa có câu hỏi.</div>`}<button class="btn sm secondary" data-action="add-question" data-type="${k}">+ Thêm câu ${({mc:'ABCD',tf:'Đ/S',short:'trả lời ngắn',essay:'tự luận'})[k]}</button></section><hr style="border:0;border-top:1px solid var(--line);margin:20px 0">`).join('')}<div class="btn-row"><button class="btn primary" data-action="save-edit">Lưu đề tại máy</button><button class="btn secondary" data-action="download-edit">↓ Xuất đề JSON</button><button class="btn" data-action="cancel-edit">Hủy</button></div><p class="hint" style="margin-top:12px">Nếu thay đổi đề gốc, bản chỉnh sửa chỉ lưu ở trình duyệt này. Chia sẻ cho cả nhóm bằng tệp JSON đã được duyệt.</p></div>`}
function beginEdit(id){const original=getExam(id);if(!original)return notify('Không tìm thấy đề.');editing=copy(original);editingId=id;go('edit-detail')}
function newExam(){const id='LOCAL-'+Date.now().toString(36);editing={id,subject:'physics',title:'Đề mới chưa đặt tên',description:'',minutes:45,mode:'exam',mc:[],tf:[],short:[],essay:[],draft:true,source:'Được biên tập cục bộ'};editingId=id;go('edit-detail')}
function saveEdit(){if(!editing)return;editing.draft=!document.getElementById('reviewedExam')?.checked;const errors=validateExam(editing);if(errors.length){notify('Chưa lưu: '+errors[0]);return}userEdits[editing.id]=copy(editing);store.set(K.custom,userEdits);hidden[editing.id]=!!editing.draft;store.set(K.hidden,hidden);editing=null;editorTab='manage';go('editor');notify('Đã lưu đề trên thiết bị. Để cả nhóm thấy cần cập nhật GitHub.')}
function validateExam(e){const errors=[];if(!String(e.title||'').trim())errors.push('Thiếu tên đề');if(!['mastery','exam'].includes(e.mode))errors.push('Chế độ đề không hợp lệ');const cnt=['mc','tf','short','essay'].reduce((s,k)=>s+(e[k]||[]).length,0);if(!cnt)errors.push('Chưa có câu hỏi');(e.mc||[]).forEach((q,i)=>{if(!q.q?.trim()||!Array.isArray(q.options)||q.options.length!==4||q.options.some(x=>!String(x).trim())||!/^[ABCD]$/.test(q.key||''))errors.push(`ABCD câu ${i+1} chưa đủ nội dung hoặc đáp án`)});(e.tf||[]).forEach((q,i)=>{if(!q.passage?.trim()||q.claims?.length!==4||q.claims.some(c=>!c.t?.trim()||typeof c.key!=='boolean'))errors.push(`Đúng/Sai câu ${i+1} chưa đủ 4 ý`)});(e.short||[]).forEach((q,i)=>{if(!q.q?.trim()||!Number.isFinite(Number(q.key)))errors.push(`Trả lời ngắn câu ${i+1} thiếu đáp số`)});(e.essay||[]).forEach((q,i)=>{if(!q.title?.trim()||!q.parts?.length||q.parts.some(p=>!p.q?.trim()||!Number.isFinite(Number(p.key))))errors.push(`Tự luận câu ${i+1} thiếu đáp số`)});return errors}
function showQuestionModal(type,index){if(!editing)return;const ex=editing[type]?.[index];if(!ex)return;const pField=(name,label,val,rows=0)=>`<div class="field"><label for="m-${name}">${label}</label>${rows?`<textarea id="m-${name}" rows="${rows}">${esc(val||'')}</textarea>`:`<input id="m-${name}" value="${esc(val??'')}">`}</div>`;
let inner='';if(type==='mc'){inner=pField('q','Nội dung câu hỏi',ex.q,3)+ex.options.map((o,i)=>pField('opt'+i,'Đáp án '+('ABCD'[i]),o)).join('')+`<div class="field"><label>Phương án đúng</label><select id="m-key">${'ABCD'.split('').map(x=>`<option value="${x}" ${ex.key===x?'selected':''}>${x}</option>`).join('')}</select></div>`+pField('explain','Giải thích',ex.explain||'',2)}
if(type==='tf')inner=pField('passage','Đoạn tư liệu',ex.passage,3)+ex.claims.map((c,i)=>pField('claim'+i,`Nhận định ${'abcd'[i]}`,c.t,2)+`<div class="field"><label>Đáp án nhận định ${'abcd'[i]}</label><select id="m-truth${i}"><option value="true" ${c.key?'selected':''}>Đúng</option><option value="false" ${!c.key?'selected':''}>Sai</option></select></div>`).join('');
if(type==='short')inner=pField('q','Câu hỏi',ex.q,3)+pField('key','Đáp số',ex.key)+pField('unit','Đơn vị',ex.unit||'')+pField('tol','Sai số cho phép',ex.tol??0.01);
if(type==='essay')inner=pField('title','Tên bài',ex.title)+pField('prompt','Đề bài',ex.prompt,4)+`<p class="muted small">Bài tự luận có hai ô đáp số. Có thể để trống ô thứ hai để chỉ dùng một đáp số.</p>`+[0,1].map(i=>pField('partq'+i,`Ý ${i+1} — nội dung`,ex.parts?.[i]?.q||'',2)+pField('partkey'+i,`Ý ${i+1} — đáp số`,ex.parts?.[i]?.key??'')+pField('partunit'+i,`Ý ${i+1} — đơn vị`,ex.parts?.[i]?.unit||'')).join('')+pField('solution','Lời giải tham khảo',ex.solution||'',3);
modalHost.innerHTML=`<div class="modal-layer" id="dialogLayer"><div class="modal" role="dialog" aria-modal="true"><div class="btn-row" style="justify-content:space-between"><h2>Sửa ${({mc:'câu ABCD',tf:'câu Đúng/Sai',short:'trả lời ngắn',essay:'tự luận'})[type]}</h2><button class="btn sm" data-action="close-modal">✕ Đóng</button></div>${inner}<div class="btn-row" style="margin-top:18px"><button class="btn primary" data-action="save-question" data-type="${type}" data-index="${index}">Lưu câu hỏi</button><button class="btn" data-action="close-modal">Hủy</button></div></div></div>`;}
function readModalQuestion(type,index){const g=k=>document.getElementById('m-'+k)?.value?.trim()??'';let next;
if(type==='mc')next={q:g('q'),options:[0,1,2,3].map(i=>g('opt'+i)),key:g('key')||document.getElementById('m-key')?.value,explain:g('explain')};
if(type==='tf')next={passage:g('passage'),claims:[0,1,2,3].map(i=>({t:g('claim'+i),key:document.getElementById('m-truth'+i)?.value==='true'}))};
if(type==='short')next={q:g('q'),key:numberValid(g('key')),unit:g('unit'),tol:Number(g('tol'))||.01};
if(type==='essay')next={title:g('title'),prompt:g('prompt'),parts:[0,1].filter(i=>g('partq'+i)).map(i=>({q:g('partq'+i),key:numberValid(g('partkey'+i)),unit:g('partunit'+i),tol:.01})),solution:g('solution')};
const temp=copy(editing);temp[type][index]=next;if(validateExam({...temp,mc:[...(type==='mc'?[next]:[])],tf:[...(type==='tf'?[next]:[])],short:[...(type==='short'?[next]:[])],essay:[...(type==='essay'?[next]:[])]}).some(x=>x.includes('câu 1'))){ /* validation below handles item directly */ }
if(type==='mc'&&(!next.q||next.options.some(v=>!v)))return notify('Chưa nhập đủ câu hỏi và bốn phương án.');if(type==='tf'&&(!next.passage||next.claims.some(v=>!v.t)))return notify('Cần đoạn tư liệu và đủ bốn nhận định.');if(type==='short'&&(!next.q||!Number.isFinite(next.key)))return notify('Cần câu hỏi và đáp số hợp lệ.');if(type==='essay'&&(!next.title||!next.prompt||!next.parts.length||next.parts.some(x=>!Number.isFinite(x.key))))return notify('Cần đề bài và đáp số hợp lệ.');
editing[type][index]=next;modalHost.innerHTML='';render();notify('Đã lưu thay đổi câu hỏi (chưa lưu đề).')}
function addQuestion(type){const ex={mc:{q:'',options:['','','',''],key:'A',explain:''},tf:{passage:'',claims:Array.from({length:4},()=>({t:'',key:true}))},short:{q:'',key:0,unit:'',tol:.01},essay:{title:'',prompt:'',parts:[{q:'',key:0,unit:'',tol:.01}],solution:''}}[type];editing[type].push(copy(ex));showQuestionModal(type,editing[type].length-1)}
function downloadFile(name,content,mime='application/json'){const b=new Blob([content],{type:mime+';charset=utf-8'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
function exportJSON(v,name){downloadFile(name,JSON.stringify(v,null,2))}
function importJSONFile(file){if(!file)return;const fr=new FileReader();fr.onload=()=>{try{const data=JSON.parse(String(fr.result)),list=Array.isArray(data)?data:Array.isArray(data.exams)?data.exams:[data];let accepted=0,rejected=[];list.forEach((item,i)=>{const errs=validateExam(item);if(errs.length){rejected.push(`${i+1}: ${errs[0]}`);return}let exam=copy(item);if(!exam.id)exam.id='LOCAL-'+Date.now().toString(36)+i;exam.id=String(exam.id).slice(0,80);exam.draft=true;exam.source='Nhập JSON cục bộ, chờ duyệt';userEdits[exam.id]=exam;hidden[exam.id]=true;accepted++});store.set(K.custom,userEdits);store.set(K.hidden,hidden);editorTab='manage';render();notify(`Đã nhập ${accepted} đề nháp. ${rejected.length?'Lỗi: '+rejected[0]:''}`)}catch(err){notify('Không đọc được JSON: '+err.message)}};fr.readAsText(file,'utf-8')}
function handleClick(e){const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action, id=b.dataset.id;
if(a==='home')go('home');
else if(a==='subject')go('catalog',{subject:b.dataset.subject});
else if(a==='choose-exam'){preparedOrder=null;go('prestart',{examId:id})}
else if(a==='start')start();
else if(a==='shuffle-before'){shuffleBeforeStart();}
else if(a==='resume')go('exam');
else if(a==='master-choice')answerMaster(b.dataset.choice,null);
else if(a==='master-tf')answerMaster(b.dataset.value==='true',Number(b.dataset.statement));
else if(a==='next-master'){const o=session.order[session.position];if(!masterStepDone(o))return;if(session.position===session.order.length-1)finish('submitted');else{session.position++;session.feedback='';persist();render();window.scrollTo(0,0)}}
else if(a==='exam-choice'){playHaoSound('tap');let o=session.order[session.position];session.answers[`mc-${o.i}`]=b.dataset.choice;persist();render()}
else if(a==='exam-tf'){playHaoSound('tap');let o=session.order[session.position];session.answers[`tf-${o.i}-${b.dataset.claim}`]=b.dataset.value==='true';persist();render()}
else if(a==='exam-next'||a==='exam-prev'){session.position=Math.max(0,Math.min(session.order.length-1,session.position+(a==='exam-next'?1:-1)));persist();render();window.scrollTo(0,0)}
else if(a==='go-section'){let i=session.order.findIndex(o=>o.section===b.dataset.section);if(i>=0){session.position=i;persist();render()}}
else if(a==='jump'){session.position=Number(b.dataset.index);persist();render()}
else if(a==='finish'){const ex=getExam(session.examId),unanswered=atoms(ex)-answered(ex);if(unanswered>0&&!confirm(`Em còn ${unanswered} lượt chưa trả lời. Vẫn nộp bài?`))return;finish('submitted')}
else if(a==='filter'){reviewFilter=b.dataset.filter;render()}
else if(a==='records')go('records');
else if(a==='show-record'){lastRecord=records.find(r=>r.id===id);reviewFilter='all';reviewSection='all';go('result')}
else if(a==='clear-records'){if(confirm('Xóa toàn bộ thành tích trên thiết bị này?')){records=[];store.set(K.records,[]);render()}}

}
document.body.addEventListener('click',handleClick);
document.body.addEventListener('input',e=>{if(e.target.matches('[data-input]')&&session?.stage==='running'){const k=e.target.dataset.input==='essay'?`essay-${e.target.dataset.index}-${e.target.dataset.part}`:`short-${e.target.dataset.index}`;session.answers[k]=e.target.value;persist();}if(e.target.matches('[data-editfield]')&&editing){const key=e.target.dataset.editfield;editing[key]=key==='minutes'?Math.max(0,Number(e.target.value)||0):e.target.value}});
document.body.addEventListener('change',e=>{if(e.target.id==='practiceCount'){preparedOrder=null;const wrap=document.getElementById('shuffleStatus');wrap?.classList.add('hidden')}if(e.target.id==='resultSection'){reviewSection=e.target.value;render()}if(e.target.id==='importInput')importJSONFile(e.target.files?.[0])});
document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));
document.getElementById('logoLink').addEventListener('click',e=>{e.preventDefault();go('home')});
const soundBtn=document.getElementById('soundBtn');
refreshSoundButton();
soundBtn?.addEventListener('click',()=>{
  soundEnabled=!soundEnabled;
  store.set(SOUND_KEY,soundEnabled);
  refreshSoundButton();
  if(soundEnabled)playHaoSound('correct');
});
const soundVolumeInput=document.getElementById('soundVolume');
soundVolumeInput?.addEventListener('input',e=>{
  soundVolume=Number(e.target.value);
  store.set(SOUND_VOLUME_KEY,soundVolume);
});
soundVolumeInput?.addEventListener('change',()=>playHaoSound('tap'));
document.getElementById('soundTest')?.addEventListener('click',()=>{
  if(!soundEnabled){soundEnabled=true;store.set(SOUND_KEY,true);refreshSoundButton();}
  playHaoSound('correct');
});
const themeBtn=document.getElementById('themeBtn');function applyTheme(mode){document.documentElement.dataset.theme=mode;themeBtn.textContent=mode==='dark'?'☀ Sáng':'☾ Tối';store.set(K.theme,mode)}applyTheme(store.get(K.theme,'light'));themeBtn.addEventListener('click',()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'));
setInterval(()=>{if(view!=='exam'||session?.stage!=='running')return;const el=document.getElementById('timeDisplay');if(!el)return;const remain=session.deadline?Math.ceil((session.deadline-Date.now())/1000):Math.floor((Date.now()-session.startedAt)/1000);if(session.deadline&&remain<=0){finish('timeout');return}el.textContent=clock(remain);el.classList.toggle('urgent',!!session.deadline&&remain<120)},1000);
if(session?.stage==='running'&&getExam(session.examId))view='exam';
render();
if(location.protocol!=='file:')fetch('data/exams.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(x=>{if(!x||!Array.isArray(x.exams)||!x.exams.length)throw Error('Invalid catalog');catalog=x;if(view!=='edit-detail')render()}).catch(()=>{});
})();

</script></body></html>
