<script id="fallback-data" type="application/json">{"schemaVersion": 2, "updatedAt": "2026-11-17", "exams": [{"id": "GDQP12-GKI-MASTERY", "pairGroupId": "GDQP12-GKI", "subject": "gdqp", "title": "GDQPAN 12 · Kiểm tra Giữa kì I (Đề 1 · Làm đúng qua câu + Học thuộc Tự luận)", "description": "Đề 1 (Chế độ Luyện từng câu): Xuất hiện từng câu một, làm đúng mới qua câu tiếp theo (12 câu ABCD + 4 câu Đúng/Sai từ đề chính thức) kèm phần Học thuộc 3 câu Tự luận chi tiết.", "source": "Đề kiểm tra Giữa kì I GDQPAN 12 & SGK Kết nối tri thức", "mode": "mastery", "minutes": 0, "active": true, "draft": false, "verified": true, "sectionPoints": {"mc": 3, "tf": 4, "short": 0, "essay": 0}, "mc": [{"q": "Câu 1. Tập đoàn nào đã phát động chiến tranh xâm lược Việt Nam vào ngày 30-4-1977?", "options": ["Tập đoàn Khmer Đỏ.", "Tập đoàn Pol Pot – Ieng Sary.", "Chính quyền Lon Nol.", "Lực lượng Mặt trận Đoàn kết dân tộc cứu nước Cam-pu-chia."], "key": "B", "explain": "Theo SGK Giáo dục quốc phòng và an ninh 12 (Bài 1, trang 5 – 6): Cuộc chiến tranh bảo vệ biên giới Tây Nam nhằm chống lại cuộc chiến tranh xâm lược do tập đoàn Pol Pot – Ieng Sary (Pôn Pốt – Iêng Xa-ry) gây ra; từ ngày 30/4/1977 chúng đẩy hoạt động chống phá trên đất liền lên một nấc thang mới, xâm phạm nhiều vùng lãnh thổ Việt Nam từ Hà Tiên đến Tây Ninh."}, {"q": "Câu 2. Cuộc chiến đấu bảo vệ biên giới phía Bắc của Tổ quốc đã diễn ra vào khoảng thời gian nào?", "options": ["Từ tháng 4 đến tháng 5 năm 1975.", "Từ tháng 12 năm 1978 đến tháng 1 năm 1979.", "Từ tháng 2 năm 1979 đến năm 1989.", "Từ tháng 3 năm 1988 đến năm 1989."], "key": "C", "explain": "Sáng ngày 17/2/1979, cuộc chiến đấu bảo vệ biên giới phía Bắc bắt đầu diễn ra dọc tuyến biên giới từ Móng Cái (Quảng Ninh) đến Phong Thổ (Lai Châu) và kéo dài trên một số điểm biên giới (như mặt trận Vị Xuyên - Hà Tuyên) đến năm 1989."}, {"q": "Câu 3. Tinh thần nào của nhân dân Việt Nam được khẳng định là nguồn sức mạnh to lớn, đập tan mọi âm mưu chống phá trong chiến tranh bảo vệ biên giới Tây Nam của Tổ quốc?", "options": ["Tinh thần độc lập, tự chủ và đoàn kết quốc tế trong sáng.", "Tinh thần cảnh giác và kiên quyết phòng ngự.", "Ý chí độc lập, tự chủ và tinh thần đại đoàn kết dân tộc.", "Ý chí quyết thắng và sức mạnh của bộ đội chủ lực."], "key": "A", "explain": "Theo SGK GDQPAN 12 (Bài 1, trang 6): Chiến thắng trong cuộc chiến tranh bảo vệ biên giới Tây Nam khẳng định đường lối độc lập, tự chủ đúng đắn của Đảng và tinh thần quốc tế trong sáng, thuỷ chung giữa nhân dân hai nước Việt Nam – Campuchia."}, {"q": "Câu 4. Vì sao đấu tranh bảo vệ chủ quyền biển, đảo Việt Nam trong giai đoạn cách mạng mới luôn được Đảng ta xác định là nhiệm vụ thường xuyên, lâu dài và đặc biệt quan trọng?", "options": ["Vì biển, đảo Việt Nam có nguồn tài nguyên phong phú và là cửa ngõ giao thương quốc tế quan trọng.", "Vì các thế lực thù địch đang tìm cách chia cắt và chiếm đoạt biển, đảo nước ta.", "Vì biển, đảo có vị trí chiến lược đặc biệt quan trọng trong sự nghiệp xây dựng và bảo vệ Tổ quốc.", "Vì việc bảo vệ chủ quyền biển, đảo là minh chứng cho tinh thần yêu nước và dân tộc của nhân dân."], "key": "C", "explain": "Biển, đảo Việt Nam có vị trí chiến lược đặc biệt quan trọng cả về kinh tế - xã hội, quốc phòng và an ninh trong sự nghiệp xây dựng và bảo vệ Tổ quốc."}, {"q": "Câu 5. Đối tượng tuyển sinh vào các trường Quân đội nhân dân phải có độ tuổi bao nhiêu nếu là quân nhân tại ngũ hoặc đã xuất ngũ và công dân hoàn thành nghĩa vụ tham gia Công an nhân dân?", "options": ["Không quá 20 tuổi.", "Không quá 22 tuổi.", "Không quá 23 tuổi.", "Không quá 24 tuổi."], "key": "C", "explain": "Theo SGK GDQPAN 12 (Bài 3, trang 23): Tiêu chuẩn về độ tuổi (tính đến năm dự tuyển): Thanh niên ngoài quân đội không quá 21 tuổi; quân nhân tại ngũ hoặc đã xuất ngũ và công dân hoàn thành nghĩa vụ tham gia công an nhân dân không quá 23 tuổi."}, {"q": "Câu 6. Lực lượng nào sau đây có chức năng quản lí nhà nước về an ninh, trật tự, an toàn xã hội?", "options": ["Bộ đội Biên phòng.", "Hải quân nhân dân.", "Công an nhân dân.", "Dân quân tự vệ."], "key": "C", "explain": "Theo SGK GDQPAN 12 (Bài 2, trang 16): Công an nhân dân (Bộ Công an) có chức năng tham mưu với Đảng, Nhà nước và thực hiện quản lí nhà nước về bảo vệ an ninh quốc gia, bảo đảm trật tự, an toàn xã hội."}, {"q": "Câu 7 (VD). Là học sinh trung học phổ thông, hành động nào sau đây thể hiện trách nhiệm trực tiếp và cụ thể nhất đối với sự nghiệp bảo vệ Tổ quốc hiện nay?", "options": ["Nghiên cứu sâu về các học thuyết quân sự của Việt Nam qua các thời kì.", "Liên hệ, tìm hiểu và đăng kí sơ tuyển vào các trường Quân đội, Công an.", "Tham gia các hoạt động thiện nguyện để giúp đỡ các gia đình quân nhân có hoàn cảnh khó khăn.", "Thường xuyên theo dõi tin tức về tình hình biển, đảo để cập nhật thông tin chính xác."], "key": "B", "explain": "Đối với học sinh lớp 12, việc chủ động tìm hiểu và đăng kí sơ tuyển vào các trường Quân đội, Công an (hoặc đăng kí nghĩa vụ quân sự khi đủ tuổi) là hành động trực tiếp, thiết thực gắn với nội dung định hướng nghề nghiệp quân sự, công an (Bài 3)."}, {"q": "Câu 8. Phương án nào sau đây điền đúng từ hoặc cụm từ còn thiếu vào chỗ trống: \"Thắng lợi của cuộc đấu tranh bảo vệ chủ quyền biển, đảo Việt Nam là kết quả của sự chỉ đạo sáng suốt của Đảng Cộng sản Việt Nam, sự nỗ lực và phát huy sức mạnh tổng hợp của cả hệ thống chính trị, trong đó, Quân đội nhân dân Việt Nam, đặc biệt là Hải quân nhân dân Việt Nam đã trở thành ................... trong bảo vệ chủ quyền biển, đảo.\"", "options": ["ngọn cờ đầu", "lực lượng nòng cốt", "công cụ sắc bén", "lực lượng chính"], "key": "B", "explain": "Quân đội nhân dân Việt Nam, đặc biệt là Quân chủng Hải quân nhân dân Việt Nam là lực lượng nòng cốt trong sự nghiệp bảo vệ chủ quyền biển, đảo của Tổ quốc."}, {"q": "Câu 9. Phương án nào sau đây điền đúng từ hoặc cụm từ còn thiếu vào chỗ trống: \"Hệ thống tổ chức của Công an nhân dân Việt Nam gồm có Bộ Công an; Công an cấp tỉnh; Công an cấp xã và ................... theo quy định của pháp luật.\"", "options": ["các phòng nghiệp vụ chuyên biệt.", "các đơn vị lực lượng thường trực khác.", "các cơ quan, đơn vị thuộc Công an nhân dân.", "các tổng cục, cục nghiệp vụ."], "key": "B", "explain": "Theo Luật Công an nhân dân và SGK Bài 2 (trang 16): Hệ thống tổ chức của Công an nhân dân gồm Bộ Công an, Công an tỉnh/thành phố, Công an huyện/quận, Công an xã/phường/thị trấn và các đơn vị/đồn, trạm độc lập bố trí tại địa bàn cần thiết theo quy định."}, {"q": "Câu 10. Phương án nào sau đây điền đúng từ hoặc cụm từ còn thiếu vào chỗ trống: \"Mối quan hệ phối hợp giữa Quân đội nhân dân và Công an nhân dân được thực hiện trên nguyên tắc đặt dưới sự lãnh đạo trực tiếp, tuyệt đối về mọi mặt của ...................., sự thống lĩnh của Chủ tịch nước, sự quản lí thống nhất của Chính phủ.\"", "options": ["Bộ Quốc phòng.", "Bộ Công an.", "Đảng Cộng sản Việt Nam.", "Quốc hội nước Cộng hoà xã hội chủ nghĩa Việt Nam."], "key": "C", "explain": "Nguyên tắc hiến định và xuyên suốt: Lực lượng vũ trang nhân dân (Quân đội nhân dân và Công an nhân dân) đặt dưới sự lãnh đạo tuyệt đối, trực tiếp về mọi mặt của Đảng Cộng sản Việt Nam, sự thống lĩnh của Chủ tịch nước và sự quản lí thống nhất của Chính phủ."}, {"q": "Câu 11. Phương án nào sau đây điền đúng từ hoặc cụm từ còn thiếu vào chỗ trống: \"Trong công tác tuyển sinh vào các trường Quân đội, quân nhân tại ngũ muốn dự tuyển thì cần có thêm điều kiện về thời gian phục vụ tại ngũ và kết quả xếp loại công tác trong những năm phục vụ tại ngũ theo quy định của ....................\"", "options": ["Bộ Giáo dục và Đào tạo.", "Bộ Công an.", "Bộ Tư pháp.", "Bộ Quốc phòng."], "key": "D", "explain": "Theo SGK GDQPAN 12 (Bài 3, trang 23): Các trường Quân đội thực hiện tuyển sinh quân sự theo quy định của Bộ Quốc phòng (hạ sĩ quan, binh sĩ phục vụ tại ngũ đủ 12 tháng trở lên tính đến tháng 4 năm tuyển sinh...)."}, {"q": "Câu 12 (VD). Phương án nào sau đây điền đúng từ hoặc cụm từ còn thiếu vào chỗ trống: \"Ngoài các tiêu chuẩn chung về độ tuổi, sức khỏe, văn hóa, thí sinh dự tuyển vào các trường Công an nhân dân cần phải có đủ tiêu chuẩn về phẩm chất chính trị, phẩm chất đạo đức, có khả năng giữ bình tĩnh, nhanh nhẹn, .................... và những phẩm chất khác theo yêu cầu của từng hệ lực lượng nghiệp vụ.\"", "options": ["khả năng chịu đựng áp lực cao.", "khả năng thích ứng nhanh.", "trung thành, tận tụy.", "có trí nhớ tốt, tư duy logic."], "key": "D", "explain": "Theo yêu cầu đặc thù tuyển sinh vào các trường Công an nhân dân: thí sinh cần có khả năng giữ bình tĩnh, nhanh nhẹn, có trí nhớ tốt, tư duy logic và những phẩm chất khác theo yêu cầu của từng hệ lực lượng nghiệp vụ."}], "tf": [{"passage": "Câu 13. Tình huống: Trong giờ thảo luận về Bài 1 (Bảo vệ Tổ quốc Việt Nam XHCN sau năm 1975), bạn Mai khẳng định rằng \"Âm mưu và thủ đoạn của các thế lực thù địch sau năm 1975 chủ yếu chỉ nhằm vào việc gây mất ổn định chính trị ở Việt Nam\". Dựa vào tình huống trên, em hãy cho biết các nhận định sau là đúng hay sai:", "claims": [{"t": "Các thế lực thù địch vẫn không từ bỏ âm mưu và thủ đoạn chống phá Việt Nam trên các lĩnh vực chính trị, kinh tế, văn hóa, xã hội, quốc phòng, an ninh.", "key": true}, {"t": "Mục tiêu chủ yếu của chiến lược \"diễn biến hòa bình\" mà các thế lực thù địch thực hiện nhằm xóa bỏ vai trò lãnh đạo của Đảng Cộng sản Việt Nam và lật đổ chế độ xã hội chủ nghĩa.", "key": true}, {"t": "Việt Nam thực hiện chiến tranh bảo vệ biên giới Tây Nam và cùng quân dân Cam-pu-chia chiến thắng chế độ diệt chủng là để đáp lại hành động gây chiến và bảo vệ độc lập dân tộc.", "key": true}, {"t": "Là học sinh, việc tập trung học tập, rèn luyện để trở thành công dân tốt đã là đủ, không cần thiết phải đấu tranh chống lại các luận điệu xuyên tạc lịch sử của kẻ thù.", "key": false}]}, {"passage": "Câu 14. Tình huống: Một tiểu đoàn trưởng Quân đội nhân dân và một trưởng công an cấp xã đang bàn bạc về kế hoạch phối hợp giữa hai lực lượng trong việc đảm bảo an ninh, trật tự địa phương. Dựa vào tình huống trên, em hãy cho biết các nhận định sau là đúng hay sai:", "claims": [{"t": "Quân đội nhân dân Việt Nam có chức năng chiến đấu, lao động sản xuất và công tác.", "key": true}, {"t": "Công an nhân dân Việt Nam có chức năng tham gia phòng, chống thiên tai, dịch bệnh, tìm kiếm, cứu hộ, cứu nạn.", "key": true}, {"t": "Mối quan hệ phối hợp giữa Quân đội nhân dân và Công an nhân dân được thực hiện trên nguyên tắc tự nguyện, dân chủ, bình đẳng, cùng có lợi.", "key": false}, {"t": "Để đảm bảo an ninh, trật tự, lực lượng Quân đội chỉ cần tập trung vào huấn luyện chiến đấu, còn việc nắm tình hình xã hội hoàn toàn thuộc về Công an.", "key": false}]}, {"passage": "Câu 15. Tình huống: Trong buổi tư vấn hướng nghiệp, một sĩ quan quân đội giải thích về vai trò và nhiệm vụ của Quân đội nhân dân Việt Nam trong tình hình mới. Dựa vào tình huống trên, em hãy cho biết các nhận định sau là đúng hay sai:", "claims": [{"t": "Tổ chức của Quân đội nhân dân Việt Nam gồm Bộ Quốc phòng; các cơ quan, đơn vị trực thuộc Bộ Quốc phòng; cơ quan quân sự địa phương.", "key": true}, {"t": "Một trong những nhiệm vụ của Quân đội nhân dân là xây dựng lực lượng vũ trang nhân dân vững mạnh về chính trị, tư tưởng và tổ chức.", "key": true}, {"t": "Quân đội nhân dân và Công an nhân dân có vai trò quan trọng như nhau trong việc tham mưu cho Đảng và Nhà nước về quốc phòng, an ninh.", "key": true}, {"t": "Trong thời bình, vai trò của Quân đội nhân dân chủ yếu là lao động sản xuất, còn nhiệm vụ chiến đấu chỉ là thứ yếu.", "key": false}]}, {"passage": "Câu 16. Tình huống: Trường THPT đang tổ chức tư vấn chuyên sâu về các ngành học trong khối trường Quân đội và Công an, trong đó có phần giải thích về tiêu chuẩn sơ tuyển. Dựa vào tình huống trên, em hãy cho biết các nhận định sau là đúng hay sai:", "claims": [{"t": "Tất cả thí sinh dự tuyển vào các trường Quân đội và Công an đều phải tham gia sơ tuyển.", "key": true}, {"t": "Các phương thức tuyển sinh vào trường Quân đội, Công an gồm: thi tuyển, xét tuyển và kết hợp giữa thi tuyển và xét tuyển.", "key": true}, {"t": "Yêu cầu thí sinh trúng tuyển vào trường Công an phải có phẩm chất đạo đức tốt nhằm đảm bảo tính chính trị và sự trung thành tuyệt đối của lực lượng Công an.", "key": true}, {"t": "Để đáp ứng yêu cầu sơ tuyển về sức khoẻ, thí sinh chỉ cần có chiều cao và cân nặng đạt chuẩn, không cần quan tâm đến các tiêu chuẩn khác như thị lực hoặc năng khiếu.", "key": false}]}], "short": [], "essay": [], "studyEssays": [{"title": "Câu 17 (1,0 điểm): Hãy giải thích vì sao cuộc chiến đấu bảo vệ biên giới phía Bắc của Tổ quốc là một cuộc chiến đấu tự vệ chính nghĩa?", "prompt": "Hãy trình bày lập luận giải thích vì sao cuộc chiến đấu bảo vệ biên giới phía Bắc của Tổ quốc (từ tháng 2/1979) là một cuộc chiến đấu tự vệ chính nghĩa của quân và dân Việt Nam.", "answerHtml": "<ul style=\"margin:0;padding-left:20px;line-height:1.65\">\n<li><strong>Nguyên nhân bắt nguồn từ hành động xâm phạm chủ quyền lãnh thổ Việt Nam:</strong> Sáng ngày 17/2/1979, chính quyền Trung Quốc huy động lực lượng lớn mở cuộc tiến công quy mô lớn dọc tuyến biên giới phía Bắc nước ta từ Móng Cái (Quảng Ninh) đến Phong Thổ (Lai Châu), gây tổn thất nặng nề về người và tài sản cho nhân dân ta (SGK trang 7–8).</li>\n<li><strong>Mục đích chiến đấu là bảo vệ độc lập, chủ quyền và toàn vẹn lãnh thổ:</strong> Trước hành động xâm lược đó, ngày 5/3/1979 Chủ tịch nước Tôn Đức Thắng kí Sắc lệnh Tổng động viên; quân và dân ta đứng lên chiến đấu hoàn toàn nhằm thực hiện <strong>quyền tự vệ chính đáng</strong> của một quốc gia độc lập, bảo vệ từng tấc đất thiêng liêng của Tổ quốc và tính mạng của nhân dân.</li>\n<li><strong>Thể hiện truyền thống nhân đạo, khát vọng hoà bình:</strong> Khi đối phương tuyên bố rút quân (5/3/1979), lực lượng vũ trang và nhân dân ta ở biên giới phía Bắc đã ngừng mọi hoạt động tiến công quân sự để đối phương rút toàn bộ lực lượng về nước (đến 18/3/1979), thể hiện thiện chí hoà bình, nhân đạo và mong muốn khôi phục quan hệ hữu nghị giữa nhân dân hai nước (SGK trang 8).</li>\n</ul>"}, {"title": "Câu 18 (1,0 điểm): Phân tích chức năng và nhiệm vụ của Quân đội nhân dân Việt Nam, từ đó làm rõ vì sao chức năng chiến đấu luôn là chức năng cơ bản, quan trọng nhất của Quân đội nhân dân trong mọi tình huống.", "prompt": "Phân tích 3 chức năng và nhiệm vụ của Quân đội nhân dân Việt Nam; giải thích vì sao chức năng \"Đội quân chiến đấu\" luôn là chức năng cơ bản, quan trọng nhất trong mọi tình huống.", "answerHtml": "<ul style=\"margin:0;padding-left:20px;line-height:1.65\">\n<li><strong>Ba chức năng của Quân đội nhân dân Việt Nam:</strong> Quân đội nhân dân Việt Nam có 3 chức năng cơ bản là <strong>đội quân chiến đấu</strong>, <strong>đội quân công tác</strong> và <strong>đội quân lao động sản xuất</strong>.</li>\n<li><strong>Nhiệm vụ chính của Quân đội nhân dân Việt Nam:</strong> Luôn sẵn sàng chiến đấu và chiến đấu bảo vệ vững chắc độc lập, chủ quyền, thống nhất, toàn vẹn lãnh thổ của Tổ quốc; bảo vệ Đảng, Nhà nước, nhân dân và chế độ XHCN; tham mưu công tác quân sự, quốc phòng; tuyên truyền vận động nhân dân và tham gia phát triển kinh tế – xã hội, cứu hộ cứu nạn (SGK Bài 2, trang 12–13).</li>\n<li><strong>Vì sao chức năng chiến đấu luôn là chức năng cơ bản, quan trọng nhất trong mọi tình huống:</strong>\n  <ul style=\"margin-top:6px;padding-left:20px\">\n    <li>Bản chất và mục đích ra đời cốt lõi của Quân đội là lực lượng vũ trang nòng cốt để <strong>đánh thắng mọi kẻ thù xâm lược</strong>, giữ vững độc lập, chủ quyền quốc gia.</li>\n    <li>Trong thời bình, các thế lực thù địch vẫn không ngừng chống phá bằng chiến lược \"diễn biến hoà bình\", bạo loạn lật đổ và xâm phạm chủ quyền biển, đảo; do đó Quân đội phải luôn lấy <strong>huấn luyện, sẵn sàng chiến đấu và chiến đấu thắng lợi</strong> làm nhiệm vụ trung tâm, thường xuyên hàng đầu để không bị động, bất ngờ trong mọi tình huống.</li>\n  </ul>\n</li>\n</ul>"}, {"title": "Câu 19 (1,0 điểm): Là học sinh lớp 12, em hãy trình bày những quyền lợi và nghĩa vụ mà em sẽ được hưởng khi trúng tuyển vào các trường Quân đội hoặc Công an nhân dân, đồng thời đề xuất hai hành động cụ thể mà em cần chuẩn bị ngay từ bây giờ để đáp ứng yêu cầu sơ tuyển.", "prompt": "Trình bày quyền lợi và nghĩa vụ của học viên khi trúng tuyển vào các trường Quân đội, Công an nhân dân (theo Bài 3 SGK trang 21–22) và nêu 2 hành động chuẩn bị cụ thể của bản thân ngay từ lớp 12.", "answerHtml": "<ul style=\"margin:0;padding-left:20px;line-height:1.65\">\n<li><strong>Quyền lợi của học viên khi trúng tuyển (SGK trang 21–22):</strong>\n  <ul style=\"margin-top:4px;padding-left:20px\">\n    <li>Được bảo đảm đầy đủ các chế độ, tiêu chuẩn về <strong>ăn, ở, mặc, phụ cấp hằng tháng, không phải đóng học phí</strong>; được trang bị đầy đủ cơ sở vật chất, đồ dùng phục vụ học tập.</li>\n    <li><strong>Thân nhân của học viên</strong> (bố mẹ đẻ, bố mẹ nuôi hợp pháp) nếu chưa có bảo hiểm y tế sẽ được nhà trường đăng kí mua bảo hiểm y tế ngay khi vào học; học viên được nghỉ cuối tuần, nghỉ lễ, nghỉ hè, nghỉ Tết và hưởng chế độ khen thưởng khi đạt thành tích xuất sắc, giỏi.</li>\n    <li>Khi tốt nghiệp được <strong>cấp văn bằng tốt nghiệp</strong> thuộc hệ thống văn bằng quốc gia; được Bộ Quốc phòng, Bộ Công an <strong>phong quân hàm sĩ quan và phân công công tác</strong>.</li>\n  </ul>\n</li>\n<li><strong>Nghĩa vụ của học viên (SGK trang 22):</strong> Phải nghiêm chỉnh chấp hành chủ trương, chính sách của Đảng, pháp luật của Nhà nước, kỉ luật của Quân đội, Công an và quy định của nhà trường; khi ra trường sẵn sàng nhận và hoàn thành nhiệm vụ theo sự phân công của Bộ Quốc phòng, Bộ Công an.</li>\n<li><strong>Hai hành động cụ thể cần chuẩn bị ngay từ bây giờ (lớp 12):</strong>\n  <ul style=\"margin-top:4px;padding-left:20px\">\n    <li><em>Hành động 1 (Về văn hoá &amp; phẩm chất chính trị, đạo đức):</em> Chăm chỉ học tập các môn văn hoá thuộc tổ hợp xét tuyển để đạt học lực từ khá, giỏi trở lên; chấp hành nghiêm nội quy nhà trường, pháp luật và giữ gìn lí lịch, đạo đức trong sáng.</li>\n    <li><em>Hành động 2 (Về thể lực, sức khoẻ &amp; thủ tục hồ sơ):</em> Rèn luyện thể dục thể thao hằng ngày, bảo vệ thị lực để đảm bảo tiêu chuẩn sức khoẻ, chiều cao, cân nặng; chủ động theo dõi thông báo và nộp hồ sơ đăng kí sơ tuyển đúng hạn tại Ban Tuyển sinh quân sự hoặc Công an cấp huyện/quận nơi thường trú.</li>\n  </ul>\n</li>\n</ul>"}]}, {"id": "GDQP12-GKI-EXAM", "pairGroupId": "GDQP12-GKI", "subject": "gdqp", "title": "GDQPAN 12 · Kiểm tra Giữa kì I (Đề 2 · Nộp chấm 1 lần + Học thuộc Tự luận)", "description": "Đề 2 (Chế độ Thi toàn bài 45 phút): Làm toàn bộ 12 câu ABCD (3,0đ) + 4 câu Đúng/Sai (4,0đ) rồi nộp chấm 1 lần, kèm tab Học thuộc & Đáp án chuẩn 3 câu Tự luận (Câu 17, 18, 19 - 3,0đ).", "source": "Đề kiểm tra Giữa kì I GDQPAN 12 & SGK Kết nối tri thức", "mode": "exam", "minutes": 45, "active": true, "draft": false, "verified": true, "sectionPoints": {"mc": 3, "tf": 4, "short": 0, "essay": 0}, "mc": [{"q": "Câu 1. Tập đoàn nào đã phát động chiến tranh xâm lược Việt Nam vào ngày 30-4-1977?", "options": ["Tập đoàn Khmer Đỏ.", "Tập đoàn Pol Pot – Ieng Sary.", "Chính quyền Lon Nol.", "Lực lượng Mặt trận Đoàn kết dân tộc cứu nước Cam-pu-chia."], "key": "B", "explain": "Theo SGK Giáo dục quốc phòng và an ninh 12 (Bài 1, trang 5 – 6): Cuộc chiến tranh bảo vệ biên giới Tây Nam nhằm chống lại cuộc chiến tranh xâm lược do tập đoàn Pol Pot – Ieng Sary (Pôn Pốt – Iêng Xa-ry) gây ra; từ ngày 30/4/1977 chúng đẩy hoạt động chống phá trên đất liền lên một nấc thang mới, xâm phạm nhiều vùng lãnh thổ Việt Nam từ Hà Tiên đến Tây Ninh."}, {"q": "Câu 2. Cuộc chiến đấu bảo vệ biên giới phía Bắc của Tổ quốc đã diễn ra vào khoảng thời gian nào?", "options": ["Từ tháng 4 đến tháng 5 năm 1975.", "Từ tháng 12 năm 1978 đến tháng 1 năm 1979.", "Từ tháng 2 năm 1979 đến năm 1989.", "Từ tháng 3 năm 1988 đến năm 1989."], "key": "C", "explain": "Sáng ngày 17/2/1979, cuộc chiến đấu bảo vệ biên giới phía Bắc bắt đầu diễn ra dọc tuyến biên giới từ Móng Cái (Quảng Ninh) đến Phong Thổ (Lai Châu) và kéo dài trên một số điểm biên giới (như mặt trận Vị Xuyên - Hà Tuyên) đến năm 1989."}, {"q": "Câu 3. Tinh thần nào của nhân dân Việt Nam được khẳng định là nguồn sức mạnh to lớn, đập tan mọi âm mưu chống phá trong chiến tranh bảo vệ biên giới Tây Nam của Tổ quốc?", "options": ["Tinh thần độc lập, tự chủ và đoàn kết quốc tế trong sáng.", "Tinh thần cảnh giác và kiên quyết phòng ngự.", "Ý chí độc lập, tự chủ và tinh thần đại đoàn kết dân tộc.", "Ý chí quyết thắng và sức mạnh của bộ đội chủ lực."], "key": "A", "explain": "Theo SGK GDQPAN 12 (Bài 1, trang 6): Chiến thắng trong cuộc chiến tranh bảo vệ biên giới Tây Nam khẳng định đường lối độc lập, tự chủ đúng đắn của Đảng và tinh thần quốc tế trong sáng, thuỷ chung giữa nhân dân hai nước Việt Nam – Campuchia."}, {"q": "Câu 4. Vì sao đấu tranh bảo vệ chủ quyền biển, đảo Việt Nam trong giai đoạn cách mạng mới luôn được Đảng ta xác định là nhiệm vụ thường xuyên, lâu dài và đặc biệt quan trọng?", "options": ["Vì biển, đảo Việt Nam có nguồn tài nguyên phong phú và là cửa ngõ giao thương quốc tế quan trọng.", "Vì các thế lực thù địch đang tìm cách chia cắt và chiếm đoạt biển, đảo nước ta.", "Vì biển, đảo có vị trí chiến lược đặc biệt quan trọng trong sự nghiệp xây dựng và bảo vệ Tổ quốc.", "Vì việc bảo vệ chủ quyền biển, đảo là minh chứng cho tinh thần yêu nước và dân tộc của nhân dân."], "key": "C", "explain": "Biển, đảo Việt Nam có vị trí chiến lược đặc biệt quan trọng cả về kinh tế - xã hội, quốc phòng và an ninh trong sự nghiệp xây dựng và bảo vệ Tổ quốc."}, {"q": "Câu 5. Đối tượng tuyển sinh vào các trường Quân đội nhân dân phải có độ tuổi bao nhiêu nếu là quân nhân tại ngũ hoặc đã xuất ngũ và công dân hoàn thành nghĩa vụ tham gia Công an nhân dân?", "options": ["Không quá 20 tuổi.", "Không quá 22 tuổi.", "Không quá 23 tuổi.", "Không quá 24 tuổi."], "key": "C", "explain": "Theo SGK GDQPAN 12 (Bài 3, trang 23): Tiêu chuẩn về độ tuổi (tính đến năm dự tuyển): Thanh niên ngoài quân đội không quá 21 tuổi; quân nhân tại ngũ hoặc đã xuất ngũ và công dân hoàn thành nghĩa vụ tham gia công an nhân dân không quá 23 tuổi."}, {"q": "Câu 6. Lực lượng nào sau đây có chức năng quản lí nhà nước về an ninh, trật tự, an toàn xã hội?", "options": ["Bộ đội Biên phòng.", "Hải quân nhân dân.", "Công an nhân dân.", "Dân quân tự vệ."], "key": "C", "explain": "Theo SGK GDQPAN 12 (Bài 2, trang 16): Công an nhân dân (Bộ Công an) có chức năng tham mưu với Đảng, Nhà nước và thực hiện quản lí nhà nước về bảo vệ an ninh quốc gia, bảo đảm trật tự, an toàn xã hội."}, {"q": "Câu 7 (VD). Là học sinh trung học phổ thông, hành động nào sau đây thể hiện trách nhiệm trực tiếp và cụ thể nhất đối với sự nghiệp bảo vệ Tổ quốc hiện nay?", "options": ["Nghiên cứu sâu về các học thuyết quân sự của Việt Nam qua các thời kì.", "Liên hệ, tìm hiểu và đăng kí sơ tuyển vào các trường Quân đội, Công an.", "Tham gia các hoạt động thiện nguyện để giúp đỡ các gia đình quân nhân có hoàn cảnh khó khăn.", "Thường xuyên theo dõi tin tức về tình hình biển, đảo để cập nhật thông tin chính xác."], "key": "B", "explain": "Đối với học sinh lớp 12, việc chủ động tìm hiểu và đăng kí sơ tuyển vào các trường Quân đội, Công an (hoặc đăng kí nghĩa vụ quân sự khi đủ tuổi) là hành động trực tiếp, thiết thực gắn với nội dung định hướng nghề nghiệp quân sự, công an (Bài 3)."}, {"q": "Câu 8. Phương án nào sau đây điền đúng từ hoặc cụm từ còn thiếu vào chỗ trống: \"Thắng lợi của cuộc đấu tranh bảo vệ chủ quyền biển, đảo Việt Nam là kết quả của sự chỉ đạo sáng suốt của Đảng Cộng sản Việt Nam, sự nỗ lực và phát huy sức mạnh tổng hợp của cả hệ thống chính trị, trong đó, Quân đội nhân dân Việt Nam, đặc biệt là Hải quân nhân dân Việt Nam đã trở thành ................... trong bảo vệ chủ quyền biển, đảo.\"", "options": ["ngọn cờ đầu", "lực lượng nòng cốt", "công cụ sắc bén", "lực lượng chính"], "key": "B", "explain": "Quân đội nhân dân Việt Nam, đặc biệt là Quân chủng Hải quân nhân dân Việt Nam là lực lượng nòng cốt trong sự nghiệp bảo vệ chủ quyền biển, đảo của Tổ quốc."}, {"q": "Câu 9. Phương án nào sau đây điền đúng từ hoặc cụm từ còn thiếu vào chỗ trống: \"Hệ thống tổ chức của Công an nhân dân Việt Nam gồm có Bộ Công an; Công an cấp tỉnh; Công an cấp xã và ................... theo quy định của pháp luật.\"", "options": ["các phòng nghiệp vụ chuyên biệt.", "các đơn vị lực lượng thường trực khác.", "các cơ quan, đơn vị thuộc Công an nhân dân.", "các tổng cục, cục nghiệp vụ."], "key": "B", "explain": "Theo Luật Công an nhân dân và SGK Bài 2 (trang 16): Hệ thống tổ chức của Công an nhân dân gồm Bộ Công an, Công an tỉnh/thành phố, Công an huyện/quận, Công an xã/phường/thị trấn và các đơn vị/đồn, trạm độc lập bố trí tại địa bàn cần thiết theo quy định."}, {"q": "Câu 10. Phương án nào sau đây điền đúng từ hoặc cụm từ còn thiếu vào chỗ trống: \"Mối quan hệ phối hợp giữa Quân đội nhân dân và Công an nhân dân được thực hiện trên nguyên tắc đặt dưới sự lãnh đạo trực tiếp, tuyệt đối về mọi mặt của ...................., sự thống lĩnh của Chủ tịch nước, sự quản lí thống nhất của Chính phủ.\"", "options": ["Bộ Quốc phòng.", "Bộ Công an.", "Đảng Cộng sản Việt Nam.", "Quốc hội nước Cộng hoà xã hội chủ nghĩa Việt Nam."], "key": "C", "explain": "Nguyên tắc hiến định và xuyên suốt: Lực lượng vũ trang nhân dân (Quân đội nhân dân và Công an nhân dân) đặt dưới sự lãnh đạo tuyệt đối, trực tiếp về mọi mặt của Đảng Cộng sản Việt Nam, sự thống lĩnh của Chủ tịch nước và sự quản lí thống nhất của Chính phủ."}, {"q": "Câu 11. Phương án nào sau đây điền đúng từ hoặc cụm từ còn thiếu vào chỗ trống: \"Trong công tác tuyển sinh vào các trường Quân đội, quân nhân tại ngũ muốn dự tuyển thì cần có thêm điều kiện về thời gian phục vụ tại ngũ và kết quả xếp loại công tác trong những năm phục vụ tại ngũ theo quy định của ....................\"", "options": ["Bộ Giáo dục và Đào tạo.", "Bộ Công an.", "Bộ Tư pháp.", "Bộ Quốc phòng."], "key": "D", "explain": "Theo SGK GDQPAN 12 (Bài 3, trang 23): Các trường Quân đội thực hiện tuyển sinh quân sự theo quy định của Bộ Quốc phòng (hạ sĩ quan, binh sĩ phục vụ tại ngũ đủ 12 tháng trở lên tính đến tháng 4 năm tuyển sinh...)."}, {"q": "Câu 12 (VD). Phương án nào sau đây điền đúng từ hoặc cụm từ còn thiếu vào chỗ trống: \"Ngoài các tiêu chuẩn chung về độ tuổi, sức khỏe, văn hóa, thí sinh dự tuyển vào các trường Công an nhân dân cần phải có đủ tiêu chuẩn về phẩm chất chính trị, phẩm chất đạo đức, có khả năng giữ bình tĩnh, nhanh nhẹn, .................... và những phẩm chất khác theo yêu cầu của từng hệ lực lượng nghiệp vụ.\"", "options": ["khả năng chịu đựng áp lực cao.", "khả năng thích ứng nhanh.", "trung thành, tận tụy.", "có trí nhớ tốt, tư duy logic."], "key": "D", "explain": "Theo yêu cầu đặc thù tuyển sinh vào các trường Công an nhân dân: thí sinh cần có khả năng giữ bình tĩnh, nhanh nhẹn, có trí nhớ tốt, tư duy logic và những phẩm chất khác theo yêu cầu của từng hệ lực lượng nghiệp vụ."}], "tf": [{"passage": "Câu 13. Tình huống: Trong giờ thảo luận về Bài 1 (Bảo vệ Tổ quốc Việt Nam XHCN sau năm 1975), bạn Mai khẳng định rằng \"Âm mưu và thủ đoạn của các thế lực thù địch sau năm 1975 chủ yếu chỉ nhằm vào việc gây mất ổn định chính trị ở Việt Nam\". Dựa vào tình huống trên, em hãy cho biết các nhận định sau là đúng hay sai:", "claims": [{"t": "Các thế lực thù địch vẫn không từ bỏ âm mưu và thủ đoạn chống phá Việt Nam trên các lĩnh vực chính trị, kinh tế, văn hóa, xã hội, quốc phòng, an ninh.", "key": true}, {"t": "Mục tiêu chủ yếu của chiến lược \"diễn biến hòa bình\" mà các thế lực thù địch thực hiện nhằm xóa bỏ vai trò lãnh đạo của Đảng Cộng sản Việt Nam và lật đổ chế độ xã hội chủ nghĩa.", "key": true}, {"t": "Việt Nam thực hiện chiến tranh bảo vệ biên giới Tây Nam và cùng quân dân Cam-pu-chia chiến thắng chế độ diệt chủng là để đáp lại hành động gây chiến và bảo vệ độc lập dân tộc.", "key": true}, {"t": "Là học sinh, việc tập trung học tập, rèn luyện để trở thành công dân tốt đã là đủ, không cần thiết phải đấu tranh chống lại các luận điệu xuyên tạc lịch sử của kẻ thù.", "key": false}]}, {"passage": "Câu 14. Tình huống: Một tiểu đoàn trưởng Quân đội nhân dân và một trưởng công an cấp xã đang bàn bạc về kế hoạch phối hợp giữa hai lực lượng trong việc đảm bảo an ninh, trật tự địa phương. Dựa vào tình huống trên, em hãy cho biết các nhận định sau là đúng hay sai:", "claims": [{"t": "Quân đội nhân dân Việt Nam có chức năng chiến đấu, lao động sản xuất và công tác.", "key": true}, {"t": "Công an nhân dân Việt Nam có chức năng tham gia phòng, chống thiên tai, dịch bệnh, tìm kiếm, cứu hộ, cứu nạn.", "key": true}, {"t": "Mối quan hệ phối hợp giữa Quân đội nhân dân và Công an nhân dân được thực hiện trên nguyên tắc tự nguyện, dân chủ, bình đẳng, cùng có lợi.", "key": false}, {"t": "Để đảm bảo an ninh, trật tự, lực lượng Quân đội chỉ cần tập trung vào huấn luyện chiến đấu, còn việc nắm tình hình xã hội hoàn toàn thuộc về Công an.", "key": false}]}, {"passage": "Câu 15. Tình huống: Trong buổi tư vấn hướng nghiệp, một sĩ quan quân đội giải thích về vai trò và nhiệm vụ của Quân đội nhân dân Việt Nam trong tình hình mới. Dựa vào tình huống trên, em hãy cho biết các nhận định sau là đúng hay sai:", "claims": [{"t": "Tổ chức của Quân đội nhân dân Việt Nam gồm Bộ Quốc phòng; các cơ quan, đơn vị trực thuộc Bộ Quốc phòng; cơ quan quân sự địa phương.", "key": true}, {"t": "Một trong những nhiệm vụ của Quân đội nhân dân là xây dựng lực lượng vũ trang nhân dân vững mạnh về chính trị, tư tưởng và tổ chức.", "key": true}, {"t": "Quân đội nhân dân và Công an nhân dân có vai trò quan trọng như nhau trong việc tham mưu cho Đảng và Nhà nước về quốc phòng, an ninh.", "key": true}, {"t": "Trong thời bình, vai trò của Quân đội nhân dân chủ yếu là lao động sản xuất, còn nhiệm vụ chiến đấu chỉ là thứ yếu.", "key": false}]}, {"passage": "Câu 16. Tình huống: Trường THPT đang tổ chức tư vấn chuyên sâu về các ngành học trong khối trường Quân đội và Công an, trong đó có phần giải thích về tiêu chuẩn sơ tuyển. Dựa vào tình huống trên, em hãy cho biết các nhận định sau là đúng hay sai:", "claims": [{"t": "Tất cả thí sinh dự tuyển vào các trường Quân đội và Công an đều phải tham gia sơ tuyển.", "key": true}, {"t": "Các phương thức tuyển sinh vào trường Quân đội, Công an gồm: thi tuyển, xét tuyển và kết hợp giữa thi tuyển và xét tuyển.", "key": true}, {"t": "Yêu cầu thí sinh trúng tuyển vào trường Công an phải có phẩm chất đạo đức tốt nhằm đảm bảo tính chính trị và sự trung thành tuyệt đối của lực lượng Công an.", "key": true}, {"t": "Để đáp ứng yêu cầu sơ tuyển về sức khoẻ, thí sinh chỉ cần có chiều cao và cân nặng đạt chuẩn, không cần quan tâm đến các tiêu chuẩn khác như thị lực hoặc năng khiếu.", "key": false}]}], "short": [], "essay": [], "studyEssays": [{"title": "Câu 17 (1,0 điểm): Hãy giải thích vì sao cuộc chiến đấu bảo vệ biên giới phía Bắc của Tổ quốc là một cuộc chiến đấu tự vệ chính nghĩa?", "prompt": "Hãy trình bày lập luận giải thích vì sao cuộc chiến đấu bảo vệ biên giới phía Bắc của Tổ quốc (từ tháng 2/1979) là một cuộc chiến đấu tự vệ chính nghĩa của quân và dân Việt Nam.", "answerHtml": "<ul style=\"margin:0;padding-left:20px;line-height:1.65\">\n<li><strong>Nguyên nhân bắt nguồn từ hành động xâm phạm chủ quyền lãnh thổ Việt Nam:</strong> Sáng ngày 17/2/1979, chính quyền Trung Quốc huy động lực lượng lớn mở cuộc tiến công quy mô lớn dọc tuyến biên giới phía Bắc nước ta từ Móng Cái (Quảng Ninh) đến Phong Thổ (Lai Châu), gây tổn thất nặng nề về người và tài sản cho nhân dân ta (SGK trang 7–8).</li>\n<li><strong>Mục đích chiến đấu là bảo vệ độc lập, chủ quyền và toàn vẹn lãnh thổ:</strong> Trước hành động xâm lược đó, ngày 5/3/1979 Chủ tịch nước Tôn Đức Thắng kí Sắc lệnh Tổng động viên; quân và dân ta đứng lên chiến đấu hoàn toàn nhằm thực hiện <strong>quyền tự vệ chính đáng</strong> của một quốc gia độc lập, bảo vệ từng tấc đất thiêng liêng của Tổ quốc và tính mạng của nhân dân.</li>\n<li><strong>Thể hiện truyền thống nhân đạo, khát vọng hoà bình:</strong> Khi đối phương tuyên bố rút quân (5/3/1979), lực lượng vũ trang và nhân dân ta ở biên giới phía Bắc đã ngừng mọi hoạt động tiến công quân sự để đối phương rút toàn bộ lực lượng về nước (đến 18/3/1979), thể hiện thiện chí hoà bình, nhân đạo và mong muốn khôi phục quan hệ hữu nghị giữa nhân dân hai nước (SGK trang 8).</li>\n</ul>"}, {"title": "Câu 18 (1,0 điểm): Phân tích chức năng và nhiệm vụ của Quân đội nhân dân Việt Nam, từ đó làm rõ vì sao chức năng chiến đấu luôn là chức năng cơ bản, quan trọng nhất của Quân đội nhân dân trong mọi tình huống.", "prompt": "Phân tích 3 chức năng và nhiệm vụ của Quân đội nhân dân Việt Nam; giải thích vì sao chức năng \"Đội quân chiến đấu\" luôn là chức năng cơ bản, quan trọng nhất trong mọi tình huống.", "answerHtml": "<ul style=\"margin:0;padding-left:20px;line-height:1.65\">\n<li><strong>Ba chức năng của Quân đội nhân dân Việt Nam:</strong> Quân đội nhân dân Việt Nam có 3 chức năng cơ bản là <strong>đội quân chiến đấu</strong>, <strong>đội quân công tác</strong> và <strong>đội quân lao động sản xuất</strong>.</li>\n<li><strong>Nhiệm vụ chính của Quân đội nhân dân Việt Nam:</strong> Luôn sẵn sàng chiến đấu và chiến đấu bảo vệ vững chắc độc lập, chủ quyền, thống nhất, toàn vẹn lãnh thổ của Tổ quốc; bảo vệ Đảng, Nhà nước, nhân dân và chế độ XHCN; tham mưu công tác quân sự, quốc phòng; tuyên truyền vận động nhân dân và tham gia phát triển kinh tế – xã hội, cứu hộ cứu nạn (SGK Bài 2, trang 12–13).</li>\n<li><strong>Vì sao chức năng chiến đấu luôn là chức năng cơ bản, quan trọng nhất trong mọi tình huống:</strong>\n  <ul style=\"margin-top:6px;padding-left:20px\">\n    <li>Bản chất và mục đích ra đời cốt lõi của Quân đội là lực lượng vũ trang nòng cốt để <strong>đánh thắng mọi kẻ thù xâm lược</strong>, giữ vững độc lập, chủ quyền quốc gia.</li>\n    <li>Trong thời bình, các thế lực thù địch vẫn không ngừng chống phá bằng chiến lược \"diễn biến hoà bình\", bạo loạn lật đổ và xâm phạm chủ quyền biển, đảo; do đó Quân đội phải luôn lấy <strong>huấn luyện, sẵn sàng chiến đấu và chiến đấu thắng lợi</strong> làm nhiệm vụ trung tâm, thường xuyên hàng đầu để không bị động, bất ngờ trong mọi tình huống.</li>\n  </ul>\n</li>\n</ul>"}, {"title": "Câu 19 (1,0 điểm): Là học sinh lớp 12, em hãy trình bày những quyền lợi và nghĩa vụ mà em sẽ được hưởng khi trúng tuyển vào các trường Quân đội hoặc Công an nhân dân, đồng thời đề xuất hai hành động cụ thể mà em cần chuẩn bị ngay từ bây giờ để đáp ứng yêu cầu sơ tuyển.", "prompt": "Trình bày quyền lợi và nghĩa vụ của học viên khi trúng tuyển vào các trường Quân đội, Công an nhân dân (theo Bài 3 SGK trang 21–22) và nêu 2 hành động chuẩn bị cụ thể của bản thân ngay từ lớp 12.", "answerHtml": "<ul style=\"margin:0;padding-left:20px;line-height:1.65\">\n<li><strong>Quyền lợi của học viên khi trúng tuyển (SGK trang 21–22):</strong>\n  <ul style=\"margin-top:4px;padding-left:20px\">\n    <li>Được bảo đảm đầy đủ các chế độ, tiêu chuẩn về <strong>ăn, ở, mặc, phụ cấp hằng tháng, không phải đóng học phí</strong>; được trang bị đầy đủ cơ sở vật chất, đồ dùng phục vụ học tập.</li>\n    <li><strong>Thân nhân của học viên</strong> (bố mẹ đẻ, bố mẹ nuôi hợp pháp) nếu chưa có bảo hiểm y tế sẽ được nhà trường đăng kí mua bảo hiểm y tế ngay khi vào học; học viên được nghỉ cuối tuần, nghỉ lễ, nghỉ hè, nghỉ Tết và hưởng chế độ khen thưởng khi đạt thành tích xuất sắc, giỏi.</li>\n    <li>Khi tốt nghiệp được <strong>cấp văn bằng tốt nghiệp</strong> thuộc hệ thống văn bằng quốc gia; được Bộ Quốc phòng, Bộ Công an <strong>phong quân hàm sĩ quan và phân công công tác</strong>.</li>\n  </ul>\n</li>\n<li><strong>Nghĩa vụ của học viên (SGK trang 22):</strong> Phải nghiêm chỉnh chấp hành chủ trương, chính sách của Đảng, pháp luật của Nhà nước, kỉ luật của Quân đội, Công an và quy định của nhà trường; khi ra trường sẵn sàng nhận và hoàn thành nhiệm vụ theo sự phân công của Bộ Quốc phòng, Bộ Công an.</li>\n<li><strong>Hai hành động cụ thể cần chuẩn bị ngay từ bây giờ (lớp 12):</strong>\n  <ul style=\"margin-top:4px;padding-left:20px\">\n    <li><em>Hành động 1 (Về văn hoá &amp; phẩm chất chính trị, đạo đức):</em> Chăm chỉ học tập các môn văn hoá thuộc tổ hợp xét tuyển để đạt học lực từ khá, giỏi trở lên; chấp hành nghiêm nội quy nhà trường, pháp luật và giữ gìn lí lịch, đạo đức trong sáng.</li>\n    <li><em>Hành động 2 (Về thể lực, sức khoẻ &amp; thủ tục hồ sơ):</em> Rèn luyện thể dục thể thao hằng ngày, bảo vệ thị lực để đảm bảo tiêu chuẩn sức khoẻ, chiều cao, cân nặng; chủ động theo dõi thông báo và nộp hồ sơ đăng kí sơ tuyển đúng hạn tại Ban Tuyển sinh quân sự hoặc Công an cấp huyện/quận nơi thường trú.</li>\n  </ul>\n</li>\n</ul>"}]}, {"id": "CD-VL12-BAI4-MASTERY", "pairGroupId": "CD-VL12-BAI4", "subject": "physics", "title": "Chuyên đề Vật lí 12 · Bài 4: Chỉnh lưu dòng điện xoay chiều (Đề 1 · Làm đúng qua câu)", "description": "Đề 1 (Chế độ Luyện từng câu): Xuất hiện từng câu một, làm đúng mới được chuyển sang câu tiếp theo. Biên soạn sát nội dung Bài 4: Diode bán dẫn & Mạch chỉnh lưu.", "source": "Tự động tạo cặp 2 đề từ Bài thuyết trình Bài 4", "mode": "mastery", "minutes": 0, "active": true, "draft": false, "verified": true, "sectionPoints": {"mc": 6, "tf": 4, "short": 0, "essay": 0}, "mc": [{"q": "Khi mắc Diode bán dẫn phân cực thuận vào mạch điện một chiều, dòng điện thuận chạy qua Diode theo chiều nào?", "options": ["Từ cực Anode (A) sang cực Cathode (K).", "Từ cực Cathode (K) sang cực Anode (A).", "Chạy qua lại tự do theo cả hai chiều.", "Không có dòng điện chạy qua ở cả hai chiều."], "key": "A", "explain": "Khi phân cực thuận (Anode nối cực dương, Cathode nối cực âm), Diode dẫn điện theo chiều từ Anode (A) sang Cathode (K)."}, {"q": "Trong bán dẫn loại p (nối với cực Anode của Diode), hạt tải điện cơ bản (đa số) là hạt nào?", "options": ["Lỗ trống mang điện tích dương (+).", "Electron tự do mang điện tích âm (-).", "Ion dương nằm cố định ở nút mạng.", "Photon không mang điện tích."], "key": "A", "explain": "Bán dẫn loại p (Positive) chứa mật độ cao các lỗ trống mang điện tích dương (+), còn bán dẫn loại n chứa hạt đa số là electron (-)."}, {"q": "Trên thân của một Diode bán dẫn thực tế, vòng sơn màu bạc hoặc xám ở một đầu dùng để đánh dấu cực nào?", "options": ["Cực Cathode (K).", "Cực Anode (A).", "Cực trung hòa điện.", "Điểm nối đất của mạch."], "key": "A", "explain": "Theo Hình 4.1 SGK, vòng bạc trên thân Diode thực tế tương ứng với vạch chắn ngang của kí hiệu mạch, đánh dấu cực Cathode (K)."}, {"q": "Điều gì xảy ra khi mắc Diode bán dẫn phân cực ngược (cực dương nguồn nối với K, cực âm nguồn nối với A) nối tiếp với bóng đèn?", "options": ["Dòng điện ngược cực nhỏ (I_ng ≈ 0), bóng đèn không sáng.", "Bóng đèn sáng rực rỡ hơn khi mắc phân cực thuận.", "Bóng đèn sáng nhấp nháy với tần số 50 Hz.", "Điện áp trên bóng đèn tăng gấp đôi điện áp nguồn."], "key": "A", "explain": "Khi phân cực ngược, vùng nghèo tại lớp chuyển tiếp p-n mở rộng ngăn dòng điện, cường độ dòng ngược xấp xỉ bằng 0 nên đèn tắt."}, {"q": "Đường đặc trưng Vôn - Ampe (I - U) của Diode bán dẫn có tính chất nào sau đây?", "options": ["Là đường cong phi tuyến và bất đối xứng giữa nhánh thuận với nhánh ngược.", "Là đường thẳng đi qua gốc tọa độ tuân theo định luật Ohm.", "Là đường parabol đối xứng qua trục tung.", "Là đường nằm ngang song song với trục điện áp U."], "key": "A", "explain": "Do tính dẫn điện một chiều, nhánh thuận tăng vọt theo hàm mũ khi U > U_mở (≈ 0,6 V với Diode Silic), còn nhánh ngược I_ng ≈ 0."}, {"q": "Trong thí nghiệm khảo sát đường đặc trưng I - U của Diode (Hình 4.4 và 4.5 SGK), điện trở R_0 = 10 Ω mắc nối tiếp với Diode có vai trò gì?", "options": ["Hạn chế cường độ dòng điện cực đại để bảo vệ Diode không bị cháy hỏng.", "Tăng hiệu điện thế của nguồn điện một chiều từ 7 V lên 14 V.", "Biến đổi dòng điện một chiều thành dòng điện xoay chiều.", "Làm phẳng độ gợn sóng của dòng điện xoay chiều."], "key": "A", "explain": "Khi phân cực thuận vượt ngưỡng 0,6 V, dòng qua Diode tăng rất nhanh nên cần mắc nối tiếp R_0 = 10 Ω để hạn dòng bảo vệ Diode."}, {"q": "Trong mạch chỉnh lưu nửa chu kì sử dụng 1 Diode bán dẫn, dạng điện áp đầu ra u_R trên tải tiêu thụ R có đặc điểm gì?", "options": ["Chỉ giữ lại các nửa chu kì dương, các nửa chu kì âm bị chặn (u_R = 0).", "Các nửa chu kì âm được lật ngược lên thành nửa chu kì dương liên tiếp.", "Giữ nguyên cả nửa chu kì dương và nửa chu kì âm như nguồn xoay chiều.", "Là điện áp một chiều phẳng tuyệt đối không có gợn sóng."], "key": "A", "explain": "Mạch chỉnh lưu 1 Diode chỉ cho dòng đi qua ở nửa chu kì dương và khóa hoàn toàn ở nửa chu kì âm nên dòng điện ra bị ngắt quãng."}, {"q": "Trong mạch cầu chỉnh lưu cả chu kì gồm 4 Diode (D_1, D_2, D_3, D_4), ở mỗi nửa chu kì của điện áp xoay chiều đầu vào có mấy Diode cùng dẫn điện?", "options": ["Có 2 Diode đối diện nhau cùng phân cực thuận và dẫn điện.", "Chỉ có duy nhất 1 Diode dẫn điện.", "Cả 4 Diode cùng dẫn điện đồng thời.", "Có 3 Diode dẫn điện và 1 Diode khóa."], "key": "A", "explain": "Nửa chu kì đầu cặp D_1 và D_3 phân cực thuận dẫn điện; nửa chu kì sau cặp D_2 và D_4 phân cực thuận dẫn điện."}, {"q": "Nếu điện áp xoay chiều đầu vào có tần số f = 50 Hz thì sau khi đi qua mạch cầu chỉnh lưu 4 Diode (chỉnh lưu cả chu kì), tần số nhấp nháy f' của xung một chiều đầu ra trên tải R là:", "options": ["100 Hz.", "50 Hz.", "25 Hz.", "200 Hz."], "key": "A", "explain": "Trong 1 chu kì của dòng xoay chiều đầu vào (T = 0,02 s), mạch cầu tạo ra 2 đỉnh xung dương giống nhau trên tải R nên f' = 2f = 100 Hz."}, {"q": "Để làm phẳng điện áp một chiều nhấp nháy ở đầu ra của mạch chỉnh lưu trong các bộ sạc điện thoại (Adapter), người ta mắc thêm linh kiện nào?", "options": ["Tụ điện có điện dung C lớn mắc song song với tải tiêu thụ R.", "Điện trở có giá trị rất lớn mắc nối tiếp với tải tiêu thụ R.", "Một bóng đèn sợi đốt mắc nối tiếp với nguồn xoay chiều.", "Một công tắc cơ học đóng ngắt bằng tay."], "key": "A", "explain": "Tụ điện C mắc song song với tải R sẽ nạp điện khi điện áp xung tăng lên đỉnh và phóng điện nuôi tải R khi điện áp xung giảm xuống."}], "tf": [{"passage": "Cho mạch chỉnh lưu dòng điện xoay chiều biến đổi điện áp xoay chiều u = U_0 cos(100πt) (V) thành điện áp một chiều cấp cho điện trở tải R. Xét tính đúng/sai của các nhận định sau:", "claims": [{"t": "Tần số của dòng điện xoay chiều đầu vào là f = 50 Hz.", "key": true}, {"t": "Nếu dùng mạch chỉnh lưu nửa chu kì (1 Diode), trong mỗi nửa chu kì âm dòng điện qua tải R có chiều ngược lại so với nửa chu kì dương.", "key": false}, {"t": "Nếu dùng mạch cầu 4 Diode (chỉnh lưu cả chu kì), dòng điện chạy qua tải R trong cả hai nửa chu kì luôn giữ nguyên một chiều duy nhất.", "key": true}, {"t": "Tần số xung một chiều nhấp nháy sau mạch cầu 4 Diode là f' = 100 Hz, gấp đôi tần số của mạch chỉnh lưu nửa chu kì.", "key": true}]}, {"passage": "Một nhóm học sinh tiến hành thí nghiệm khảo sát đường đặc trưng Vôn - Ampe của Diode bán dẫn Silic (điện áp mở khoảng 0,6 V) với nguồn một chiều U_v = 7 V, điện trở bảo vệ R_0 = 10 Ω và biến trở R.", "claims": [{"t": "Khi mắc phân cực thuận và điều chỉnh U_thuận < 0,4 V, cường độ dòng điện thuận qua Diode còn rất nhỏ.", "key": true}, {"t": "Khi U_thuận vượt qua ngưỡng 0,6 V - 0,7 V, cường độ dòng điện thuận I_th tăng vọt rất nhanh theo hàm mũ.", "key": true}, {"t": "Đường đặc trưng I - U của Diode bán dẫn là một đoạn thẳng tuyến tính tuân theo định luật Ohm ở mọi giá trị điện áp.", "key": false}, {"t": "Khi đảo chiều Diode sang mắc phân cực ngược từ 0 V đến -5 V, số chỉ của miliampe kế gần như bằng 0.", "key": true}]}], "short": [], "essay": []}, {"id": "CD-VL12-BAI4-EXAM", "pairGroupId": "CD-VL12-BAI4", "subject": "physics", "title": "Chuyên đề Vật lí 12 · Bài 4: Chỉnh lưu dòng điện xoay chiều (Đề 2 · Nộp chấm 1 lần)", "description": "Đề 2 (Chế độ Thi toàn bài): Hiển thị toàn bộ câu hỏi (ABCD, Đúng/Sai, Trả lời ngắn, Tự luận), làm xong nộp bài và chấm điểm 1 lần.", "source": "Tự động tạo cặp 2 đề từ Bài thuyết trình Bài 4", "mode": "exam", "minutes": 45, "active": true, "draft": false, "verified": true, "sectionPoints": {"mc": 3, "tf": 2, "short": 2, "essay": 3}, "mc": [{"q": "Khi mắc Diode bán dẫn phân cực thuận vào mạch điện một chiều, dòng điện thuận chạy qua Diode theo chiều nào?", "options": ["Từ cực Anode (A) sang cực Cathode (K).", "Từ cực Cathode (K) sang cực Anode (A).", "Chạy qua lại tự do theo cả hai chiều.", "Không có dòng điện chạy qua ở cả hai chiều."], "key": "A", "explain": "Khi phân cực thuận (Anode nối cực dương, Cathode nối cực âm), Diode dẫn điện theo chiều từ Anode (A) sang Cathode (K)."}, {"q": "Trong bán dẫn loại p (nối với cực Anode của Diode), hạt tải điện cơ bản (đa số) là hạt nào?", "options": ["Lỗ trống mang điện tích dương (+).", "Electron tự do mang điện tích âm (-).", "Ion dương nằm cố định ở nút mạng.", "Photon không mang điện tích."], "key": "A", "explain": "Bán dẫn loại p (Positive) chứa mật độ cao các lỗ trống mang điện tích dương (+), còn bán dẫn loại n chứa hạt đa số là electron (-)."}, {"q": "Trên thân của một Diode bán dẫn thực tế, vòng sơn màu bạc hoặc xám ở một đầu dùng để đánh dấu cực nào?", "options": ["Cực Cathode (K).", "Cực Anode (A).", "Cực trung hòa điện.", "Điểm nối đất của mạch."], "key": "A", "explain": "Theo Hình 4.1 SGK, vòng bạc trên thân Diode thực tế tương ứng với vạch chắn ngang của kí hiệu mạch, đánh dấu cực Cathode (K)."}, {"q": "Điều gì xảy ra khi mắc Diode bán dẫn phân cực ngược (cực dương nguồn nối với K, cực âm nguồn nối với A) nối tiếp với bóng đèn?", "options": ["Dòng điện ngược cực nhỏ (I_ng ≈ 0), bóng đèn không sáng.", "Bóng đèn sáng rực rỡ hơn khi mắc phân cực thuận.", "Bóng đèn sáng nhấp nháy với tần số 50 Hz.", "Điện áp trên bóng đèn tăng gấp đôi điện áp nguồn."], "key": "A", "explain": "Khi phân cực ngược, vùng nghèo tại lớp chuyển tiếp p-n mở rộng ngăn dòng điện, cường độ dòng ngược xấp xỉ bằng 0 nên đèn tắt."}, {"q": "Đường đặc trưng Vôn - Ampe (I - U) của Diode bán dẫn có tính chất nào sau đây?", "options": ["Là đường cong phi tuyến và bất đối xứng giữa nhánh thuận với nhánh ngược.", "Là đường thẳng đi qua gốc tọa độ tuân theo định luật Ohm.", "Là đường parabol đối xứng qua trục tung.", "Là đường nằm ngang song song với trục điện áp U."], "key": "A", "explain": "Do tính dẫn điện một chiều, nhánh thuận tăng vọt theo hàm mũ khi U > U_mở (≈ 0,6 V với Diode Silic), còn nhánh ngược I_ng ≈ 0."}, {"q": "Trong thí nghiệm khảo sát đường đặc trưng I - U của Diode (Hình 4.4 và 4.5 SGK), điện trở R_0 = 10 Ω mắc nối tiếp với Diode có vai trò gì?", "options": ["Hạn chế cường độ dòng điện cực đại để bảo vệ Diode không bị cháy hỏng.", "Tăng hiệu điện thế của nguồn điện một chiều từ 7 V lên 14 V.", "Biến đổi dòng điện một chiều thành dòng điện xoay chiều.", "Làm phẳng độ gợn sóng của dòng điện xoay chiều."], "key": "A", "explain": "Khi phân cực thuận vượt ngưỡng 0,6 V, dòng qua Diode tăng rất nhanh nên cần mắc nối tiếp R_0 = 10 Ω để hạn dòng bảo vệ Diode."}, {"q": "Trong mạch chỉnh lưu nửa chu kì sử dụng 1 Diode bán dẫn, dạng điện áp đầu ra u_R trên tải tiêu thụ R có đặc điểm gì?", "options": ["Chỉ giữ lại các nửa chu kì dương, các nửa chu kì âm bị chặn (u_R = 0).", "Các nửa chu kì âm được lật ngược lên thành nửa chu kì dương liên tiếp.", "Giữ nguyên cả nửa chu kì dương và nửa chu kì âm như nguồn xoay chiều.", "Là điện áp một chiều phẳng tuyệt đối không có gợn sóng."], "key": "A", "explain": "Mạch chỉnh lưu 1 Diode chỉ cho dòng đi qua ở nửa chu kì dương và khóa hoàn toàn ở nửa chu kì âm nên dòng điện ra bị ngắt quãng."}, {"q": "Trong mạch cầu chỉnh lưu cả chu kì gồm 4 Diode (D_1, D_2, D_3, D_4), ở mỗi nửa chu kì của điện áp xoay chiều đầu vào có mấy Diode cùng dẫn điện?", "options": ["Có 2 Diode đối diện nhau cùng phân cực thuận và dẫn điện.", "Chỉ có duy nhất 1 Diode dẫn điện.", "Cả 4 Diode cùng dẫn điện đồng thời.", "Có 3 Diode dẫn điện và 1 Diode khóa."], "key": "A", "explain": "Nửa chu kì đầu cặp D_1 và D_3 phân cực thuận dẫn điện; nửa chu kì sau cặp D_2 và D_4 phân cực thuận dẫn điện."}, {"q": "Nếu điện áp xoay chiều đầu vào có tần số f = 50 Hz thì sau khi đi qua mạch cầu chỉnh lưu 4 Diode (chỉnh lưu cả chu kì), tần số nhấp nháy f' của xung một chiều đầu ra trên tải R là:", "options": ["100 Hz.", "50 Hz.", "25 Hz.", "200 Hz."], "key": "A", "explain": "Trong 1 chu kì của dòng xoay chiều đầu vào (T = 0,02 s), mạch cầu tạo ra 2 đỉnh xung dương giống nhau trên tải R nên f' = 2f = 100 Hz."}, {"q": "Để làm phẳng điện áp một chiều nhấp nháy ở đầu ra của mạch chỉnh lưu trong các bộ sạc điện thoại (Adapter), người ta mắc thêm linh kiện nào?", "options": ["Tụ điện có điện dung C lớn mắc song song với tải tiêu thụ R.", "Điện trở có giá trị rất lớn mắc nối tiếp với tải tiêu thụ R.", "Một bóng đèn sợi đốt mắc nối tiếp với nguồn xoay chiều.", "Một công tắc cơ học đóng ngắt bằng tay."], "key": "A", "explain": "Tụ điện C mắc song song với tải R sẽ nạp điện khi điện áp xung tăng lên đỉnh và phóng điện nuôi tải R khi điện áp xung giảm xuống."}], "tf": [{"passage": "Cho mạch chỉnh lưu dòng điện xoay chiều biến đổi điện áp xoay chiều u = U_0 cos(100πt) (V) thành điện áp một chiều cấp cho điện trở tải R. Xét tính đúng/sai của các nhận định sau:", "claims": [{"t": "Tần số của dòng điện xoay chiều đầu vào là f = 50 Hz.", "key": true}, {"t": "Nếu dùng mạch chỉnh lưu nửa chu kì (1 Diode), trong mỗi nửa chu kì âm dòng điện qua tải R có chiều ngược lại so với nửa chu kì dương.", "key": false}, {"t": "Nếu dùng mạch cầu 4 Diode (chỉnh lưu cả chu kì), dòng điện chạy qua tải R trong cả hai nửa chu kì luôn giữ nguyên một chiều duy nhất.", "key": true}, {"t": "Tần số xung một chiều nhấp nháy sau mạch cầu 4 Diode là f' = 100 Hz, gấp đôi tần số của mạch chỉnh lưu nửa chu kì.", "key": true}]}, {"passage": "Một nhóm học sinh tiến hành thí nghiệm khảo sát đường đặc trưng Vôn - Ampe của Diode bán dẫn Silic (điện áp mở khoảng 0,6 V) với nguồn một chiều U_v = 7 V, điện trở bảo vệ R_0 = 10 Ω và biến trở R.", "claims": [{"t": "Khi mắc phân cực thuận và điều chỉnh U_thuận < 0,4 V, cường độ dòng điện thuận qua Diode còn rất nhỏ.", "key": true}, {"t": "Khi U_thuận vượt qua ngưỡng 0,6 V - 0,7 V, cường độ dòng điện thuận I_th tăng vọt rất nhanh theo hàm mũ.", "key": true}, {"t": "Đường đặc trưng I - U của Diode bán dẫn là một đoạn thẳng tuyến tính tuân theo định luật Ohm ở mọi giá trị điện áp.", "key": false}, {"t": "Khi đảo chiều Diode sang mắc phân cực ngược từ 0 V đến -5 V, số chỉ của miliampe kế gần như bằng 0.", "key": true}]}], "short": [{"q": "Đặt nguồn điện một chiều U = 6 V vào mạch gồm một Diode Silic (có điện áp ngưỡng khi dẫn là U_D = 0,6 V) mắc nối tiếp với điện trở bảo vệ R_0 = 27 Ω theo chiều phân cực thuận. Cường độ dòng điện I chạy trong mạch bằng bao nhiêu ampe (A)?", "key": 0.2, "unit": "A", "tol": 0.01, "hint": "U_R0 = U - U_D = 6 - 0,6 = 5,4 V => I = U_R0 / R_0 = 5,4 / 27 = 0,2 A."}, {"q": "Điện áp xoay chiều đưa vào mạch cầu chỉnh lưu 4 Diode có biểu thức u = 12√2 cos(100πt) (V). Trong thời gian 1 giây, có bao nhiêu đỉnh xung dương xuất hiện ở điện áp đầu ra trên tải R?", "key": 100, "unit": "đỉnh xung", "tol": 0.1, "hint": "Tần số nguồn f = 50 Hz. Qua mạch cầu cả chu kì, tần số xung đầu ra là f' = 2f = 100 Hz, tức 100 đỉnh xung dương trong 1 giây."}], "essay": [{"title": "Bài toán mạch Diode và chỉnh lưu cả chu kì", "prompt": "Một mạch điện một chiều gồm nguồn điện U = 7,0 V mắc nối tiếp với điện trở hạn dòng R_0 = 16 Ω và một Diode bán dẫn Silic đang phân cực thuận (điện áp rơi trên Diode khi dẫn là U_D = 0,6 V). Sau đó, người ta dùng 4 Diode cùng loại ghép thành mạch cầu chỉnh lưu điện áp xoay chiều có tần số f = 50 Hz.", "parts": [{"q": "Tính cường độ dòng điện thuận I chạy qua điện trở R_0 trong mạch một chiều (đơn vị A).", "key": 0.4, "unit": "A", "tol": 0.01, "points": 1.5}, {"q": "Tính chu kì lặp lại T' của điện áp một chiều nhấp nháy ở đầu ra mạch cầu 4 Diode (đơn vị giây).", "key": 0.01, "unit": "s", "tol": 0.001, "points": 1.5}], "solution": "1) Hiệu điện thế trên R_0: U_R0 = U - U_D = 7,0 - 0,6 = 6,4 V. Dòng điện thuận: I = 6,4 / 16 = 0,4 A.\n2) Tần số xung đầu ra mạch cầu: f' = 2f = 100 Hz => Chu kì lặp lại T' = 1 / f' = 1 / 100 = 0,01 s."}]}, {"id": "CD-VL12-BAI5-MASTERY", "pairGroupId": "CD-VL12-BAI5", "subject": "physics", "title": "Chuyên đề Vật lí 12 · Bài 5: Tia X (Đề 1 · Làm đúng qua câu)", "description": "Đề 1 (Chế độ Luyện từng câu): Xuất hiện từng câu một, làm đúng mới được chuyển sang câu tiếp theo. Biên soạn sát nội dung Bài 5: Tia X & Chẩn đoán hình ảnh.", "source": "Tự động tạo cặp 2 đề từ Bài thuyết trình Bài 5", "mode": "mastery", "minutes": 0, "active": true, "draft": false, "verified": true, "sectionPoints": {"mc": 6, "tf": 4, "short": 0, "essay": 0}, "mc": [{"q": "Phát biểu nào sau đây là đúng khi nói về bản chất và bước sóng của Tia X (Tia Rơn-ghen)?", "options": ["Là sóng điện từ có bước sóng cực ngắn từ 10^-11 m đến 10^-8 m.", "Là dòng hạt electron chuyển động với tốc độ gần bằng tốc độ ánh sáng.", "Là sóng cơ học siêu âm truyền được trong môi trường chân không.", "Là bức xạ mang điện tích âm nên bị lệch mạnh trong điện trường và từ trường."], "key": "A", "explain": "Tia X là sóng điện từ có bước sóng từ 10^-11 m đến 10^-8 m (0,01 nm đến 10 nm), không mang điện tích."}, {"q": "Trên thang sóng điện từ, vùng Tia X nằm ngay giữa hai vùng bức xạ nào?", "options": ["Tia tử ngoại (UV) và Tia Gamma (γ).", "Ánh sáng nhìn thấy và Tia tử ngoại (UV).", "Tia hồng ngoại (IR) và Ánh sáng nhìn thấy.", "Sóng vô tuyến và Tia hồng ngoại (IR)."], "key": "A", "explain": "Theo chiều bước sóng ngắn dần: Sóng vô tuyến -> Hồng ngoại -> Ánh sáng khả kiến -> Tử ngoại -> Tia X -> Tia Gamma."}, {"q": "Trong ống phát tia X (ống Coolidge), cơ chế chủ yếu tạo ra chùm tia X khi chùm electron có động năng lớn đập vào Anode kim loại nặng là:", "options": ["Bức xạ hãm (electron bị hãm phanh đột ngột trong điện trường hạt nhân nguyên tử Anode).", "Hiện tượng quang điện ngoài làm bứt electron khỏi bề mặt kim loại.", "Phản ứng nhiệt hạch tổng hợp hạt nhân nhẹ ở nhiệt độ cao.", "Sự phân rã phóng xạ tự nhiên của dây nung Vonfram."], "key": "A", "explain": "Electron xuyên sâu vào vỏ nguyên tử đối âm cực (Anode), bị trường hạt nhân (+Ze) hãm đột ngột và phát ra photon Tia X (ε = hf = W_đ1 - W_đ2)."}, {"q": "Vì sao đối âm cực (Anode) trong ống Coolidge thường được chế tạo bằng kim loại Vonfram (W, Z = 74) và phải có bộ phận làm mát?", "options": ["Vì Vonfram có nguyên tử lượng lớn (Z = 74) và nhiệt độ nóng chảy rất cao (3422 °C), còn ~99% động năng electron biến thành nhiệt.", "Vì Vonfram là kim loại nhẹ nhất và dễ bay hơi ở nhiệt độ phòng.", "Vì 100% động năng của chùm electron đều biến thành tia X làm lạnh Anode.", "Vì Vonfram không dẫn điện nên ngăn được dòng điện cao áp."], "key": "A", "explain": "Chỉ khoảng 1% động năng electron chuyển thành tia X, còn ~99% biến thành nhiệt làm nóng Anode nên cần kim loại Z lớn, khó nóng chảy như Vonfram."}, {"q": "Công thức xác định bước sóng ngắn nhất λ_min (giới hạn Duane - Hunt) của chùm tia X phát ra từ ống Coolidge hoạt động ở hiệu điện thế U_AK là:", "options": ["λ_min = (h.c) / (e.U_AK).", "λ_min = (e.U_AK) / (h.c).", "λ_min = h / (e.c.U_AK).", "λ_min = (h.c.U_AK) / e."], "key": "A", "explain": "Bảo toàn năng lượng cực đại: W_đmax = e.U_AK = ε_max = h.f_max = h.c / λ_min => λ_min = (h.c) / (e.U_AK)."}, {"q": "Để tạo ra chùm Tia X cứng hơn (có bước sóng ngắn hơn và khả năng đâm xuyên mạnh hơn) trong ống Coolidge, ta cần thực hiện điều chỉnh nào?", "options": ["Tăng hiệu điện thế cao áp U_AK đặt giữa Anode và Cathode.", "Giảm hiệu điện thế cao áp U_AK đặt giữa Anode và Cathode.", "Bơm thêm không khí vào trong ống thủy tinh.", "Thay đối âm cực Vonfram (Z = 74) bằng kim loại Nhôm (Z = 13)."], "key": "A", "explain": "Vì λ_min tỉ lệ nghịch với U_AK, khi tăng U_AK thì bước sóng λ_min giảm xuống, tần số tăng lên nên tia X cứng hơn và đâm xuyên mạnh hơn."}, {"q": "Trên tấm phim chụp X-quang âm bản truyền thống, vì sao hình ảnh của xương lại hiện lên có màu trắng sáng rõ nét hơn so với vùng mô mềm xung quanh?", "options": ["Vì xương chứa nhiều Canxi (Z = 20) hấp thụ mạnh tia X nên ít tia X truyền tới làm đen phim.", "Vì xương tự phát ra ánh sáng màu trắng khi gặp tia X.", "Vì mô mềm (Z ≈ 7) chặn đứng hoàn toàn 100% tia X.", "Vì xương cho 100% tia X đi qua làm khử hết muối bạc trên phim."], "key": "A", "explain": "Xương giàu Canxi (Z = 20) cản khoảng 80% tia X, chỉ ~20% tới phim nên vùng phim phía sau xương ít bị làm đen và hiện màu trắng sáng."}, {"q": "Vật liệu nào sau đây được sử dụng tiêu chuẩn để làm tường che chắn phòng chụp X-quang và áo bảo hộ cho nhân viên y tế?", "options": ["Kim loại Chì (Pb, Z = 82).", "Nhựa tổng hợp PVC trong suốt.", "Tấm gỗ ép mỏng hoặc bìa cứng.", "Tấm Nhôm mỏng (Al, Z = 13)."], "key": "A", "explain": "Chì (Pb) có số hiệu nguyên tử rất lớn (Z = 82) và khối lượng riêng lớn (11,3 g/cm^3), hấp thụ gần như 100% tia X."}], "tf": [{"passage": "Xét cấu tạo, nguyên lí hoạt động của ống phát tia X (ống Coolidge) và tính chất của chùm tia X phát ra. Đánh giá tính đúng/sai của các nhận định sau:", "claims": [{"t": "Bên trong ống Coolidge phải được hút chân không cao (áp suất cỡ 10^-6 mmHg) để electron không bị cản trở khi bay từ Cathode sang Anode.", "key": true}, {"t": "Tia X mang điện tích âm nên bị lệch phương truyền khi đi qua vùng có điện trường hoặc từ trường mạnh.", "key": false}, {"t": "Khi tăng hiệu điện thế U_AK lên gấp đôi thì bước sóng ngắn nhất λ_min của chùm tia X giảm đi một nửa.", "key": true}, {"t": "Tia X có tác dụng sinh lí hủy diệt tế bào nên được ứng dụng trong xạ trị ung thư nông, nhưng cần tuân thủ nghiêm ngặt quy tắc an toàn bức xạ.", "key": true}]}, {"passage": "Một ống phát tia X hoạt động ở hiệu điện thế cao áp U_AK. Bỏ qua động năng ban đầu của electron khi bứt ra khỏi Cathode. Cho h = 6,625.10^-34 J.s; c = 3.10^8 m/s; e = 1,6.10^-19 C.", "claims": [{"t": "Khi U_AK = 25 kV, động năng cực đại của electron khi đập vào Anode là W_đmax = 4,0.10^-15 J (tương ứng 25 keV).", "key": true}, {"t": "Khi U_AK = 25 kV, bước sóng ngắn nhất của tia X phát ra là λ_min ≈ 49,7 pm (4,97.10^-11 m).", "key": true}, {"t": "Khi tăng điện áp lên U_AK = 50 kV, bước sóng ngắn nhất λ_min tăng lên thành 99,4 pm.", "key": false}, {"t": "Ở điện áp U_AK = 50 kV, tần số cực đại của chùm tia X là f_max ≈ 1,21.10^19 Hz.", "key": true}]}], "short": [], "essay": []}, {"id": "CD-VL12-BAI5-EXAM", "pairGroupId": "CD-VL12-BAI5", "subject": "physics", "title": "Chuyên đề Vật lí 12 · Bài 5: Tia X (Đề 2 · Nộp chấm 1 lần)", "description": "Đề 2 (Chế độ Thi toàn bài): Hiển thị toàn bộ câu hỏi (ABCD, Đúng/Sai, Trả lời ngắn, Tự luận), làm xong nộp bài và chấm điểm 1 lần.", "source": "Tự động tạo cặp 2 đề từ Bài thuyết trình Bài 5", "mode": "exam", "minutes": 45, "active": true, "draft": false, "verified": true, "sectionPoints": {"mc": 3, "tf": 2, "short": 2, "essay": 3}, "mc": [{"q": "Phát biểu nào sau đây là đúng khi nói về bản chất và bước sóng của Tia X (Tia Rơn-ghen)?", "options": ["Là sóng điện từ có bước sóng cực ngắn từ 10^-11 m đến 10^-8 m.", "Là dòng hạt electron chuyển động với tốc độ gần bằng tốc độ ánh sáng.", "Là sóng cơ học siêu âm truyền được trong môi trường chân không.", "Là bức xạ mang điện tích âm nên bị lệch mạnh trong điện trường và từ trường."], "key": "A", "explain": "Tia X là sóng điện từ có bước sóng từ 10^-11 m đến 10^-8 m (0,01 nm đến 10 nm), không mang điện tích."}, {"q": "Trên thang sóng điện từ, vùng Tia X nằm ngay giữa hai vùng bức xạ nào?", "options": ["Tia tử ngoại (UV) và Tia Gamma (γ).", "Ánh sáng nhìn thấy và Tia tử ngoại (UV).", "Tia hồng ngoại (IR) và Ánh sáng nhìn thấy.", "Sóng vô tuyến và Tia hồng ngoại (IR)."], "key": "A", "explain": "Theo chiều bước sóng ngắn dần: Sóng vô tuyến -> Hồng ngoại -> Ánh sáng khả kiến -> Tử ngoại -> Tia X -> Tia Gamma."}, {"q": "Trong ống phát tia X (ống Coolidge), cơ chế chủ yếu tạo ra chùm tia X khi chùm electron có động năng lớn đập vào Anode kim loại nặng là:", "options": ["Bức xạ hãm (electron bị hãm phanh đột ngột trong điện trường hạt nhân nguyên tử Anode).", "Hiện tượng quang điện ngoài làm bứt electron khỏi bề mặt kim loại.", "Phản ứng nhiệt hạch tổng hợp hạt nhân nhẹ ở nhiệt độ cao.", "Sự phân rã phóng xạ tự nhiên của dây nung Vonfram."], "key": "A", "explain": "Electron xuyên sâu vào vỏ nguyên tử đối âm cực (Anode), bị trường hạt nhân (+Ze) hãm đột ngột và phát ra photon Tia X (ε = hf = W_đ1 - W_đ2)."}, {"q": "Vì sao đối âm cực (Anode) trong ống Coolidge thường được chế tạo bằng kim loại Vonfram (W, Z = 74) và phải có bộ phận làm mát?", "options": ["Vì Vonfram có nguyên tử lượng lớn (Z = 74) và nhiệt độ nóng chảy rất cao (3422 °C), còn ~99% động năng electron biến thành nhiệt.", "Vì Vonfram là kim loại nhẹ nhất và dễ bay hơi ở nhiệt độ phòng.", "Vì 100% động năng của chùm electron đều biến thành tia X làm lạnh Anode.", "Vì Vonfram không dẫn điện nên ngăn được dòng điện cao áp."], "key": "A", "explain": "Chỉ khoảng 1% động năng electron chuyển thành tia X, còn ~99% biến thành nhiệt làm nóng Anode nên cần kim loại Z lớn, khó nóng chảy như Vonfram."}, {"q": "Công thức xác định bước sóng ngắn nhất λ_min (giới hạn Duane - Hunt) của chùm tia X phát ra từ ống Coolidge hoạt động ở hiệu điện thế U_AK là:", "options": ["λ_min = (h.c) / (e.U_AK).", "λ_min = (e.U_AK) / (h.c).", "λ_min = h / (e.c.U_AK).", "λ_min = (h.c.U_AK) / e."], "key": "A", "explain": "Bảo toàn năng lượng cực đại: W_đmax = e.U_AK = ε_max = h.f_max = h.c / λ_min => λ_min = (h.c) / (e.U_AK)."}, {"q": "Để tạo ra chùm Tia X cứng hơn (có bước sóng ngắn hơn và khả năng đâm xuyên mạnh hơn) trong ống Coolidge, ta cần thực hiện điều chỉnh nào?", "options": ["Tăng hiệu điện thế cao áp U_AK đặt giữa Anode và Cathode.", "Giảm hiệu điện thế cao áp U_AK đặt giữa Anode và Cathode.", "Bơm thêm không khí vào trong ống thủy tinh.", "Thay đối âm cực Vonfram (Z = 74) bằng kim loại Nhôm (Z = 13)."], "key": "A", "explain": "Vì λ_min tỉ lệ nghịch với U_AK, khi tăng U_AK thì bước sóng λ_min giảm xuống, tần số tăng lên nên tia X cứng hơn và đâm xuyên mạnh hơn."}, {"q": "Trên tấm phim chụp X-quang âm bản truyền thống, vì sao hình ảnh của xương lại hiện lên có màu trắng sáng rõ nét hơn so với vùng mô mềm xung quanh?", "options": ["Vì xương chứa nhiều Canxi (Z = 20) hấp thụ mạnh tia X nên ít tia X truyền tới làm đen phim.", "Vì xương tự phát ra ánh sáng màu trắng khi gặp tia X.", "Vì mô mềm (Z ≈ 7) chặn đứng hoàn toàn 100% tia X.", "Vì xương cho 100% tia X đi qua làm khử hết muối bạc trên phim."], "key": "A", "explain": "Xương giàu Canxi (Z = 20) cản khoảng 80% tia X, chỉ ~20% tới phim nên vùng phim phía sau xương ít bị làm đen và hiện màu trắng sáng."}, {"q": "Vật liệu nào sau đây được sử dụng tiêu chuẩn để làm tường che chắn phòng chụp X-quang và áo bảo hộ cho nhân viên y tế?", "options": ["Kim loại Chì (Pb, Z = 82).", "Nhựa tổng hợp PVC trong suốt.", "Tấm gỗ ép mỏng hoặc bìa cứng.", "Tấm Nhôm mỏng (Al, Z = 13)."], "key": "A", "explain": "Chì (Pb) có số hiệu nguyên tử rất lớn (Z = 82) và khối lượng riêng lớn (11,3 g/cm^3), hấp thụ gần như 100% tia X."}], "tf": [{"passage": "Xét cấu tạo, nguyên lí hoạt động của ống phát tia X (ống Coolidge) và tính chất của chùm tia X phát ra. Đánh giá tính đúng/sai của các nhận định sau:", "claims": [{"t": "Bên trong ống Coolidge phải được hút chân không cao (áp suất cỡ 10^-6 mmHg) để electron không bị cản trở khi bay từ Cathode sang Anode.", "key": true}, {"t": "Tia X mang điện tích âm nên bị lệch phương truyền khi đi qua vùng có điện trường hoặc từ trường mạnh.", "key": false}, {"t": "Khi tăng hiệu điện thế U_AK lên gấp đôi thì bước sóng ngắn nhất λ_min của chùm tia X giảm đi một nửa.", "key": true}, {"t": "Tia X có tác dụng sinh lí hủy diệt tế bào nên được ứng dụng trong xạ trị ung thư nông, nhưng cần tuân thủ nghiêm ngặt quy tắc an toàn bức xạ.", "key": true}]}, {"passage": "Một ống phát tia X hoạt động ở hiệu điện thế cao áp U_AK. Bỏ qua động năng ban đầu của electron khi bứt ra khỏi Cathode. Cho h = 6,625.10^-34 J.s; c = 3.10^8 m/s; e = 1,6.10^-19 C.", "claims": [{"t": "Khi U_AK = 25 kV, động năng cực đại của electron khi đập vào Anode là W_đmax = 4,0.10^-15 J (tương ứng 25 keV).", "key": true}, {"t": "Khi U_AK = 25 kV, bước sóng ngắn nhất của tia X phát ra là λ_min ≈ 49,7 pm (4,97.10^-11 m).", "key": true}, {"t": "Khi tăng điện áp lên U_AK = 50 kV, bước sóng ngắn nhất λ_min tăng lên thành 99,4 pm.", "key": false}, {"t": "Ở điện áp U_AK = 50 kV, tần số cực đại của chùm tia X là f_max ≈ 1,21.10^19 Hz.", "key": true}]}], "short": [{"q": "Một ống Coolidge hoạt động ở hiệu điện thế U_AK = 25 kV. Biết h = 6,625.10^-34 J.s; c = 3.10^8 m/s; e = 1,6.10^-19 C. Bước sóng ngắn nhất λ_min của chùm tia X phát ra bằng bao nhiêu picômét (pm)? (Làm tròn đến 1 chữ số thập phân).", "key": 49.7, "unit": "pm", "tol": 0.2, "hint": "λ_min = (6,625.10^-34 * 3.10^8) / (1,6.10^-19 * 25000) ≈ 4,96875.10^-11 m = 49,7 pm."}, {"q": "Khi ống phát tia X hoạt động ở hiệu điện thế U_AK = 50 kV, bước sóng ngắn nhất của tia X phát ra bằng bao nhiêu picômét (pm)? (Làm tròn đến 1 chữ số thập phân).", "key": 24.8, "unit": "pm", "tol": 0.2, "hint": "λ_min = (6,625.10^-34 * 3.10^8) / (1,6.10^-19 * 50000) ≈ 2,484.10^-11 m = 24,8 pm."}], "essay": [{"title": "Bài toán tính bước sóng ngắn nhất và tần số cực đại của Tia X", "prompt": "Một ống phát tia X (ống Coolidge) hoạt động dưới hiệu điện thế cao áp U_AK = 80 kV. Bỏ qua động năng ban đầu của electron khi vừa bứt ra khỏi Cathode. Cho hằng số Planck h = 6,625.10^-34 J.s; tốc độ ánh sáng trong chân không c = 3.10^8 m/s; độ lớn điện tích nguyên tố e = 1,6.10^-19 C.", "parts": [{"q": "Tính bước sóng ngắn nhất λ_min của tia X phát ra theo đơn vị picômét (pm, làm tròn 1 chữ số thập phân).", "key": 15.5, "unit": "pm", "tol": 0.2, "points": 1.5}, {"q": "Tính tần số cực đại f_max của chùm tia X theo đơn vị 10^19 Hz (làm tròn 2 chữ số thập phân).", "key": 1.93, "unit": "×10¹⁹ Hz", "tol": 0.03, "points": 1.5}], "solution": "1) λ_min = (h.c)/(e.U_AK) = (6,625.10^-34 * 3.10^8) / (1,6.10^-19 * 80.10^3) ≈ 1,553.10^-11 m = 15,5 pm.\n2) f_max = c / λ_min = 3.10^8 / 1,553.10^-11 ≈ 1,93.10^19 Hz."}]}]}</script>

<script>
'use strict';
(()=>{
const root=document.getElementById('app');
const modalHost=document.getElementById('modalHost');
const toastHost=document.getElementById('toastHost');
const K={theme:'ot12-r7-theme',custom:'ot12-r7-exams',hidden:'ot12-r7-hidden',records:'ot12-r7-records',session:'ot12-r7-session'};
const store={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}},del:k=>{try{localStorage.removeItem(k)}catch{}}};

const SOUND_KEY='haoedu-feedback-sound-v1';
const SOUND_VOLUME_KEY='haoedu-feedback-volume-v1';
let soundEnabled=store.get(SOUND_KEY,true),soundVolume=Number(store.get(SOUND_VOLUME_KEY,65));
if(!Number.isFinite(soundVolume))soundVolume=65;
soundVolume=Math.max(0,Math.min(100,soundVolume));
let soundContext=null;
function soundCtx(){
  const C=window.AudioContext||window.webkitAudioContext;
  if(!C)return null;
  try{if(!soundContext)soundContext=new C();return soundContext;}catch{return null;}
}
function gentleTone(ctx,freq,delay,duration,level=0.055,shape='sine'){
  try{
    const at=ctx.currentTime+delay;
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type=shape;o.frequency.setValueAtTime(freq,at);
    const v=Math.max(0.0001,level*(soundVolume/100));
    g.gain.setValueAtTime(0.0001,at);
    g.gain.exponentialRampToValueAtTime(v,at+Math.min(.018,duration/3));
    g.gain.exponentialRampToValueAtTime(0.0001,at+duration);
    o.connect(g);g.connect(ctx.destination);
    o.start(at);o.stop(at+duration+.03);
  }catch(err){}
}
function emitSound(ctx,kind){
  if(kind==='tap'){gentleTone(ctx,620,0,.065,.035)}
  else if(kind==='correct'){
    gentleTone(ctx,600,0,.055,.027);
    gentleTone(ctx,784,.07,.17,.060);
    gentleTone(ctx,988,.19,.20,.052);
  }else if(kind==='wrong'){
    gentleTone(ctx,590,0,.055,.024);
    gentleTone(ctx,420,.065,.17,.055);
  }else if(kind==='celebrate'){
    [523.25,659.25,783.99,1046.5].forEach((f,i)=>gentleTone(ctx,f,i*.16,.26,.045,'sine'));
  }
}
function playHaoSound(kind='tap'){
  if(!soundEnabled||soundVolume<=0)return;
  const ctx=soundCtx();if(!ctx)return;
  if(ctx.state==='suspended'){
    ctx.resume().then(()=>emitSound(ctx,kind)).catch(()=>{});
  }else emitSound(ctx,kind);
}
function refreshSoundButton(){
  const b=document.getElementById('soundBtn');if(!b)return;
  b.textContent=soundEnabled?'🔊 Âm thanh':'🔇 Tắt tiếng';
  b.setAttribute('aria-pressed',String(soundEnabled));
  const sl=document.getElementById('soundVolume');if(sl){sl.value=String(soundVolume);sl.disabled=!soundEnabled;}
}

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sci=s=>esc(s).replace(/([A-Za-zΔλΩ])_([A-Za-z0-9À-ỹ]+)/g,'$1<sub>$2</sub>').replace(/\^(-?\d+)/g,'<sup>$1</sup>').replace(/\n/g,'<br>');
const cleanClaim=s=>String(s??'').replace(/^\s*[abcd]\s*[.)]\s*/i,'');
const fmt=n=>(Math.round(n*100)/100).toLocaleString('vi-VN',{maximumFractionDigits:2});
const clock=n=>`${String(Math.floor(Math.max(0,n)/60)).padStart(2,'0')}:${String(Math.floor(Math.max(0,n)%60)).padStart(2,'0')}`;
const date=s=>new Date(s).toLocaleString('vi-VN',{dateStyle:'short',timeStyle:'short'});
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
const shuffledDifferent=a=>{const b=shuffle(a);if(a.length>1&&b.every((v,i)=>v===a[i]))return [...b.slice(1),b[0]];return b};
const copy=x=>JSON.parse(JSON.stringify(x));
const identityOrder=n=>Array.from({length:n},(_,i)=>i);

const labels={gdqp:'GD Quốc phòng & An ninh',history:'Lịch sử',physics:'Vật lí',chemistry:'Hóa học',informatics:'Tin học',forestry:'Công nghệ Lâm nghiệp',math:'Toán',english:'Tiếng Anh',other:'Khác'};

  ['gdqp','GD Quốc phòng & An ninh','🛡️','Đề kiểm tra Giữa kì I (Đề 1 làm đúng qua câu & Đề 2 nộp chấm 1 lần) kèm lời giải chi tiết Tự luận để học thuộc.'],
  ['physics','Vật lí','⚛️','Làm bài có thời gian, công thức khoa học và phản hồi theo từng phần.'],
  ['history','Lịch sử','🏛️','Kiến thức trọng tâm, suy luận tư liệu và luyện đến khi đúng.'],
  ['chemistry','Hóa học','🧪','Đề Hóa 12 theo đặc tả, luyện kỹ năng và bài toán vận dụng.'],
  ['informatics','Tin học','💻','Đề tổng hợp Bài 1–6, đủ 45 ABCD và 12 câu Đúng/Sai.'],

function generateVisualOrder(ex){
  return {mc:Object.fromEntries((ex.mc||[]).map((q,i)=>[i,shuffledDifferent(identityOrder((q.options||[]).length))])),
          tf:Object.fromEntries((ex.tf||[]).map((q,i)=>[i,shuffledDifferent(identityOrder((q.claims||[]).length))]))};
}
function mcVisualOrder(i){const ex=getExam(session?.examId);const n=ex?.mc?.[i]?.options?.length||4;const p=session?.visuals?.mc?.[i];return Array.isArray(p)&&p.length===n&&new Set(p).size===n?p:identityOrder(n)}
function tfVisualOrder(i){const ex=getExam(session?.examId);const n=ex?.tf?.[i]?.claims?.length||4;const p=session?.visuals?.tf?.[i];return Array.isArray(p)&&p.length===n&&new Set(p).size===n?p:identityOrder(n)}
function visualMCLabel(originalLetter,i){if(originalLetter===undefined||originalLetter===null||originalLetter==='')return undefined;const origin='ABCD'.indexOf(originalLetter);const displayedIndex=mcVisualOrder(i).indexOf(origin);return displayedIndex<0?originalLetter:'ABCD'[displayedIndex]}

function notify(message){toastHost.innerHTML=`<div class="toast" role="status">${esc(message)}</div>`;clearTimeout(notify.timer);notify.timer=setTimeout(()=>toastHost.innerHTML='',3800)}

function render(){
  document.querySelectorAll('[data-go]').forEach(x=>x.classList.toggle('active',x.dataset.go===view || (view==='catalog'&&x.dataset.go==='home')));
  if(view==='home')homeView();
  else if(view==='catalog')catalogView();

  else if(view==='prestart')prestartView();
  else if(view==='exam')examView();
  else if(view==='result')resultView();
  else if(view==='records')recordsView();
  else homeView();
}

function makeOrder(e,count){
  const m=shuffledDifferent(Array.from({length:(e.mc||[]).length},(_,i)=>({section:'mc',i})));
  const t=shuffledDifferent(Array.from({length:(e.tf||[]).length},(_,i)=>({section:'tf',i})));
  const sh=shuffledDifferent(Array.from({length:(e.short||[]).length},(_,i)=>({section:'short',i})));
  if(count==='full')return [...m,...t,...sh];
  const n=Number(count)||20;
  return [...m,...t,...sh].slice(0,n);
}

function buildExamOrder(e){return ['mc','tf','short','essay'].flatMap(section=>(e[section]||[]).map((_,i)=>({section,i})))}

function shuffleBeforeStart(){
  if(shuffleBusy||view!=='prestart')return;
  const ex=getExam(chosenExamId),count=document.getElementById('practiceCount')?.value||'full';if(!ex)return;
  shuffleBusy=true;
  const wrap=document.getElementById('shuffleStatus'),bar=document.getElementById('shuffleBar'),message=document.getElementById('shuffleText');
  wrap?.classList.remove('hidden');if(bar)bar.style.width='100%';
  const order=isMastery(ex)?makeOrder(ex,count):['mc','tf','short','essay'].flatMap(section=>shuffledDifferent((ex[section]||[]).map((_,i)=>({section,i}))));
  preparedOrder={examId:ex.id,count,order,visuals:generateVisualOrder(ex)};
  shuffleBusy=false;
  if(message)message.textContent='✓ Đã xáo trộn '+order.length+' câu hỏi và các phương án.';
  playHaoSound('tap');
}

function start(){
  const e=getExam(chosenExamId);if(!e)return;
  const nickname=document.getElementById('nickname')?.value.trim()||'Người học';
  store.set('ot12-r7-nick',nickname);
  const now=Date.now();
  session={
    examId:e.id,nickname,startedAt:now,
    deadline:(!isMastery(e)&&e.minutes)?now+e.minutes*60000:null,
    stage:'running',mode:e.mode,position:0,answers:{},tries:{},done:{},feedback:'',
    order:preparedOrder&&preparedOrder.examId===e.id?copy(preparedOrder.order):(isMastery(e)?buildExamOrder(e).filter(x=>x.section!=='essay'):buildExamOrder(e)),
    visuals:preparedOrder&&preparedOrder.examId===e.id?copy(preparedOrder.visuals):{mc:{},tf:{}}
  };
  preparedOrder=null;persist();go('exam');
}

function persist(){store.set(K.session,session)}
function atoms(e){return session.order.reduce((n,o)=>n+(o.section==='tf'?4:o.section==='essay'?(e.essay[o.i]?.parts||[]).length:1),0)}
function answered(e){
  let count=0;
  for(const o of session.order){
    if(o.section==='tf'){for(let j=0;j<4;j++)if(session.answers[`tf-${o.i}-${j}`]!==undefined)count++}
    else if(o.section==='essay'){(e.essay[o.i]?.parts||[]).forEach((_,j)=>{if(session.answers[`essay-${o.i}-${j}`]?.trim?.())count++})}
    else if(o.section==='mc'){if(session.answers[`mc-${o.i}`]!==undefined)count++}
    else if(session.answers[`short-${o.i}`]?.trim?.())count++
  }
  return count;
}

  if(session.stage!=='running')return go('result');
  const total=atoms(e),done=isMastery(e)?Object.keys(session.done).length:answered(e);
  const timerText=session.deadline?clock((session.deadline-Date.now())/1000):clock((Date.now()-session.startedAt)/1000);
  root.innerHTML=`
  <div class="quiz-head">
    <div>

    </div>
    <div>

    </div>
  </div>
  <div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,100*done/Math.max(1,total))}%"></div></div>
  <div class="muted small" style="margin:7px 0 16px">${done}/${total} lượt lựa chọn ${isMastery(e)?'đã trả lời đúng':'đã hoàn thành'}</div>
  <div class="quiz-layout">
    <div class="quiz-main">
      <div class="panel">${isMastery(e)?masterQuestion(e):examQuestion(e)}</div>
      ${(e.studyEssays||[]).length?renderStudyEssayList(e.studyEssays, e.id):''}
