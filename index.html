.subject .emoji{display:grid;place-items:center;width:52px;height:52px;border-radius:15px;background:#edf2ff;font-size:28px}.subject:nth-child(2) .emoji{background:#edfaf5}.subject h2{font-size:1.32rem;margin:15px 0 5px}.subject p{color:var(--muted);line-height:1.6;margin:4px 0 16px}.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:750;background:#edf2fc;color:#214a9a}.btn.primary{background:var(--blue);color:white}.btn.green{background:#0d9477;color:white}.btn.outline{border:1px solid #d7dfef;background:#fff;color:#32415c}.btn.small{padding:8px 12px;font-size:13px}.btn:hover:not(:disabled){filter:brightness(.96)}.stack{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.section-head{display:flex;justify-content:space-between;align-items:center;margin:22px 0 12px;gap:10px}.section-head h2{margin:0;font-size:1.35rem}.desc,.muted{color:var(--muted);line-height:1.6}.mini{font-size:13px}.exam-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.pill{background:#edf4ff;color:#3156a3;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:800}.tag{display:inline-flex;background:#eff9f5;color:#0d7b62;border-radius:999px;padding:5px 11px;font-size:12px;font-weight:800}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:14px 0}.stat{background:#f7f9fd;border:1px solid #e7eefa;border-radius:13px;padding:12px;text-align:center}.stat strong{display:block;font-size:23px}.stat small{display:block;color:var(--muted);margin-top:2px}.form-row{display:flex;flex-direction:column;gap:6px;margin:14px 0}label strong,.label{font-weight:750}input[type=text],input[type=number],textarea{width:100%;border:1px solid #ced8e8;border-radius:12px;padding:12px;background:white;color:#18243b;outline:none}input:focus,textarea:focus{border-color:#6b8fe9;box-shadow:0 0 0 3px #3267e31a}textarea{min-height:110px;resize:vertical;line-height:1.6}.layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:20px}.sticky{position:sticky;top:20px;align-self:start}.timer{font-variant-numeric:tabular-nums;font-weight:900;font-size:1.8rem}.timer.warn{color:var(--red)}.track{background:#e7edf6;border-radius:100px;height:9px;overflow:hidden;margin:12px 0}.fill{background:linear-gradient(90deg,#4b78f1,#15a688);height:100%;width:0;transition:width .2s}.fill.danger{background:var(--red)}.navtabs{display:flex;gap:8px;overflow-x:auto;padding:3px 0 15px}.tab{background:#fff;border:1px solid #dce4f0;border-radius:11px;padding:11px 14px;color:#34435e;font-weight:750;white-space:nowrap}.tab.active{background:#233c68;border-color:#233c68;color:white}.question{border-top:1px solid #e6ecf5;padding:22px 0}.question:first-child{border-top:0;padding-top:8px}.qhead{font-weight:800;line-height:1.7;margin-bottom:12px}.option{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;margin:8px 0;border:1px solid #dce4ef;border-radius:11px;cursor:pointer;line-height:1.55}.option:has(input:checked){border-color:var(--blue);background:#f0f5ff}.option input{accent-color:var(--blue);margin-top:5px}.option b{flex-shrink:0}.passage{background:#f5f8fd;padding:16px;border-left:4px solid #7f9ee1;border-radius:10px;white-space:pre-line;line-height:1.75;margin:12px 0 18px}.claim{border-bottom:1px solid #e9edf5;padding:13px 0}.claim:last-child{border-bottom:0}.claim .stack{margin-top:8px}.claim .option{padding:8px 14px;margin:0}.number-input{max-width:200px}.results{display:grid;grid-template-columns:1fr 2fr;gap:20px;align-items:center}.score-bubble{border-radius:50%;border:12px solid #dcedff;width:170px;height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f7fbff}.score-bubble strong{font-size:3rem;color:#224cb4}.score-bubble span{color:var(--muted)}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;border-bottom:1px solid #e9eef6;padding:12px 10px;font-size:14px}.table th{background:#f8faff;color:#586982;font-size:12px;text-transform:uppercase;letter-spacing:.06em}.correct{color:#087d60;font-weight:800}.wrong{color:#be3f48;font-weight:800}.notice{background:#fff8e8;border-left:4px solid #e7ae3d;border-radius:11px;padding:14px 17px;color:#6c511c;line-height:1.6}.toast{position:fixed;bottom:25px;right:25px;background:#1b2d4c;color:white;padding:14px 19px;border-radius:12px;box-shadow:var(--shadow);z-index:99;max-width:380px}.hidden{display:none!important}.center{text-align:center}.history-group{margin-top:25px}.footer{text-align:center;color:var(--muted);font-size:13px;padding:25px}.big-name{font-size:1.7rem;margin:0 0 6px}#confetti{position:fixed;inset:0;pointer-events:none;z-index:101}.rankyou{background:#e8f9ee} .badge-local{background:#f2f3fc;color:#586987;border-radius:7px;font-size:12px;padding:4px 7px}#physics-panel{min-height:380px}.section-note{margin-top:10px;font-size:13px;color:#728095} .qfeedback{padding:12px;background:#f2f8ff;border-radius:10px;margin-top:9px;font-size:14px;line-height:1.6}button:focus-visible{outline:3px solid #83abff;outline-offset:2px}@media(max-width:850px){.layout{grid-template-columns:1fr}.sticky{position:static}.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:650px){header{padding:16px}.shell{padding:18px 12px 55px}.hero{padding:25px 22px}.cards,.exam-grid,.results{grid-template-columns:1fr}.card{padding:19px}.score-bubble{margin:0 auto}.stats{gap:8px}.stat strong{font-size:19px}.subject{min-height:0}.timer{font-size:1.4rem}}
</style></head><body><div id="app"></div><script>window.ONLINE_CONFIG={url:'',anonKey:''};window.QUIZ_DATA={"physics":[{"id":"VL1","title":"Đề 1 · Tư duy nhiệt học","desc":"Đề nâng cao: chuyển thể, nhiệt lượng, nội năng, thang nhiệt độ và bài toán công khí.","mc":[{"q":"Trong một chất rắn kết tinh ở nhiệt độ không đổi, mô tả nào phù hợp nhất về các hạt cấu tạo?","options":["Chuyển động hỗn loạn khắp thể tích bình.","Dao động quanh những vị trí cân bằng tương đối cố định.","Đứng yên hoàn toàn tại nút mạng.","Chỉ chuyển động tịnh tiến theo một chiều."],"key":"B"},{"q":"Khi nước tinh khiết đang sôi ở áp suất không đổi, nhiệt lượng cung cấp chủ yếu dùng để","options":["tăng nhiệt độ của nước.","tăng khối lượng riêng của nước.","thực hiện quá trình chuyển thể.","giảm nội năng của nước."],"key":"C"},{"q":"Trường hợp nào làm nội năng của vật tăng chủ yếu nhờ thực hiện công?","options":["Cốc nước nóng nguội trong phòng.","Thìa kim loại ấm lên trong trà nóng.","Không khí trong xi lanh bị nén nhanh.","Tảng băng tan trong nước ấm."],"key":"C"},{"q":"Với quy ước A là công do ngoại lực thực hiện lên hệ, Q là nhiệt lượng hệ nhận, định luật I là","options":["ΔU = A + Q.","ΔU = A − Q.","ΔU = Q − A.","ΔU = −A − Q."],"key":"A"},{"q":"Đơn vị SI của nhiệt dung riêng là","options":["J/kg.","J/(kg·K).","J/K.","J·kg/K."],"key":"B"},{"q":"Biểu thức nhiệt lượng làm nóng vật khối lượng m, nhiệt dung riêng c, tăng ΔT (không chuyển thể) là","options":["Q = mc/ΔT.","Q = mΔT/c.","Q = mcΔT.","Q = cΔT/m."],"key":"C"},{"q":"Nhiệt độ 27 °C tương ứng gần đúng với","options":["246 K.","273 K.","300 K.","327 K."],"key":"C"},{"q":"Mốc 0 K được gọi là","options":["nhiệt độ nước đá đang tan.","nhiệt độ không tuyệt đối.","nhiệt độ sôi của nước.","nhiệt độ phòng tiêu chuẩn."],"key":"B"},{"q":"Nhiệt nóng chảy riêng có đơn vị SI là","options":["J/(kg·K).","kg/J.","J/kg.","J/K."],"key":"C"},{"q":"Trong thí nghiệm xác định nhiệt hóa hơi riêng bằng phương pháp điện, đại lượng nào trực tiếp giúp tính năng lượng điện đã cấp?","options":["Hiệu điện thế, cường độ dòng điện và thời gian.","Chiều cao bình nước và đường kính dây.","Áp suất khí quyển và thể tích phòng.","Nhiệt độ phòng và diện tích mặt bàn."],"key":"A"},{"q":"Khi hai vật khác nhiệt độ tiếp xúc nhiệt với nhau (hệ cô lập), nhiệt tự truyền từ","options":["vật có khối lượng lớn sang vật nhỏ.","vật có nhiệt dung lớn sang vật bé.","vật lạnh sang vật nóng.","vật nóng sang vật lạnh."],"key":"D"},{"q":"Ở đồ thị nhiệt độ theo thời gian của băng đang nóng chảy ở áp suất không đổi, đoạn nằm ngang thể hiện","options":["băng tiếp tục thu nhiệt để chuyển thể.","nhiệt lượng thu vào bằng không.","nhiệt dung riêng của băng bằng không.","băng bị làm lạnh."],"key":"A"}],"tf":[{"passage":"Một khối khí nhận 550 J nhiệt lượng; ngoại lực nén khối khí và thực hiện công 150 J. Quy ước Q > 0 khi hệ nhận nhiệt, A > 0 khi hệ nhận công.","claims":[{"t":"Khối khí nhận nhiệt lượng Q = +550 J.","key":true},{"t":"Công A tác dụng lên khối khí có giá trị âm.","key":false},{"t":"Độ biến thiên nội năng của khối khí là +700 J.","key":true},{"t":"Nếu khối khí được cho giãn nở sinh công 150 J thay vì bị nén (Q vẫn 550 J), ΔU sẽ bằng 400 J.","key":true}]},{"passage":"Đun nóng 0,20 kg nước đá ở 0 °C bằng nguồn gia nhiệt đều. Bỏ qua thất thoát; λ = 3,34×10^5 J/kg; c_nước = 4200 J/(kg·K).","claims":[{"t":"Ở 0 °C, nước đá có thể nhận nhiệt mà chưa tăng nhiệt độ trong quá trình nóng chảy.","key":true},{"t":"Nhiệt lượng để làm tan hoàn toàn 0,20 kg nước đá là 33 400 J.","key":false},{"t":"Nhiệt lượng để đun 0,20 kg nước từ 0 °C đến 20 °C là 16 800 J.","key":true},{"t":"Khi cấp tổng cộng 83 600 J, nước sau khi tan hết đạt đúng 20 °C.","key":true}]}],"short":[{"q":"Một nhiệt kế chỉ 315 K. Nhiệt độ tương ứng gần đúng theo °C là bao nhiêu? (Dùng T = t + 273.)","key":42,"unit":"°C","tol":0.01,"hint":""},{"q":"Cần bao nhiêu kJ để tăng nhiệt độ 0,50 kg nước từ 20 °C lên 60 °C? c = 4200 J/(kg·K).","key":84,"unit":"kJ","tol":0.01,"hint":""},{"q":"Một hệ nhận Q = 260 J và thực hiện công 90 J lên môi trường. ΔU bằng bao nhiêu J?","key":170,"unit":"J","tol":0.01,"hint":""},{"q":"Nhiệt lượng 167 kJ đủ để làm tan bao nhiêu kg nước đá ở 0 °C? λ = 334 kJ/kg.","key":0.5,"unit":"kg","tol":0.001,"hint":""}],"essay":[{"title":"Bài toán 1 – Đun băng thành nước","prompt":"Một khối nước đá 0,30 kg ở −10 °C được đun bằng nguồn nhiệt 210 W, coi hiệu suất truyền nhiệt 100%. Biết c_đá = 2100 J/(kg·K), λ = 334 000 J/kg. Giả sử áp suất không đổi. Trình bày các giai đoạn và lập phương trình nhiệt lượng.","parts":[{"q":"Nhiệt lượng để đưa băng từ −10 °C lên 0 °C bằng bao nhiêu kJ?","key":6.3,"unit":"kJ","points":0.75,"tol":0.02},{"q":"Thời gian từ lúc bắt đầu đến khi tan hoàn toàn (giây)?","key":507.142857,"unit":"s","points":0.75,"tol":1}],"solution":"Q1 = m c_đá Δt = 6300 J; Q2 = mλ = 100200 J; t = (Q1 + Q2)/P = 507,14 s."},{"title":"Bài toán 2 – Nội năng và công của khí","prompt":"Một xilanh có pít-tông diện tích 50 cm². Khí bên trong đẩy pít-tông dịch chuyển 12 cm dưới áp suất không đổi 2,0×10^5 Pa. Trong quá trình này khí nhận Q = 500 J. Bỏ qua ma sát; hãy trình bày biểu thức công và định luật I.","parts":[{"q":"Công do khí thực hiện lên pít-tông (J)?","key":120,"unit":"J","points":0.75,"tol":0.1},{"q":"Độ biến thiên nội năng của khí (J)?","key":380,"unit":"J","points":0.75,"tol":0.1}],"solution":"ΔV = S·s = 0,005·0,12 = 0,0006 m³. Công do khí thực hiện W = pΔV = 120 J; ΔU = Q − W = 380 J."}]},{"id":"VL2","title":"Đề 2 · Vận dụng tổng hợp","desc":"Đề nâng cao: trao đổi nhiệt, chuyển thể, xử lí tình huống và cân bằng năng lượng.","mc":[{"q":"So với chất rắn, các phân tử trong chất khí thông thường","options":["luôn dao động quanh nút mạng cố định.","cách xa nhau hơn và chuyển động hỗn loạn.","không có thế năng tương tác.","không có động năng chuyển động nhiệt."],"key":"B"},{"q":"Sự bay hơi khác sự sôi ở đặc điểm nào?","options":["Bay hơi chỉ xảy ra tại một nhiệt độ xác định.","Bay hơi chỉ diễn ra trong lòng chất lỏng.","Bay hơi có thể xảy ra trên mặt thoáng ở nhiều nhiệt độ.","Bay hơi không làm thay đổi trạng thái chất."],"key":"C"},{"q":"Một vật nhận nhiệt nhưng nội năng vẫn giảm nếu","options":["vật đồng thời sinh công lớn hơn nhiệt lượng nhận.","vật đồng thời nhận công từ bên ngoài.","vật đặt trong bình cách nhiệt.","nhiệt độ vật luôn tăng."],"key":"A"},{"q":"Theo quy ước công A thực hiện lên khí, trong quá trình khí tự giãn nở đẩy pít-tông thì","options":["A luôn dương.","A bằng độ biến thiên nội năng.","A luôn bằng nhiệt lượng khí nhận.","A âm nếu khí thực hiện công ra ngoài."],"key":"D"},{"q":"Một độ tăng nhiệt độ 5 °C tương ứng với độ tăng theo Kelvin là","options":["278 K.","5 K.","268 K.","0,02 K."],"key":"B"},{"q":"Nước tinh khiết đông đặc ở 0 °C dưới áp suất chuẩn có nhiệt độ theo Kelvin gần bằng","options":["0 K.","100 K.","273 K.","373 K."],"key":"C"},{"q":"Trong quá trình ngưng tụ ở cùng nhiệt độ, hơi nước thường","options":["thu nhiệt nóng chảy.","thu nhiệt hóa hơi.","tỏa nhiệt ra môi trường.","không trao đổi năng lượng."],"key":"C"},{"q":"Nhiệt hóa hơi riêng L của chất lỏng được xác định bằng","options":["Q/m trong quá trình hóa hơi tại nhiệt độ sôi.","mcΔT trong quá trình hóa hơi.","m/Q trong quá trình ngưng tụ.","Q/(mΔT) trong quá trình đun nóng."],"key":"A"},{"q":"Đồ thị t–thời gian khi đun chất tinh khiết có đoạn nghiêng lên, đoạn nằm ngang, rồi lại nghiêng lên. Đoạn giữa thường là","options":["nhiệt độ môi trường giảm.","nhiệt độ chất tăng đều.","sự chuyển thể ở nhiệt độ không đổi.","khối lượng chất tăng."],"key":"C"},{"q":"Để xác định nhiệt dung riêng của nước bằng điện trở nung, đại lượng nào cần đo ngoài m và ΔT?","options":["Chiều dài dây dẫn.","Điện năng cung cấp trong thời gian nung.","Độ ẩm không khí.","Đường kính bình cách nhiệt."],"key":"B"},{"q":"Hai khối có cùng khối lượng và nhận cùng nhiệt lượng, không chuyển thể. Khối nào có nhiệt dung riêng lớn hơn sẽ","options":["tăng nhiệt độ ít hơn.","tăng nhiệt độ nhiều hơn.","có nhiệt độ cuối luôn cao hơn.","luôn chuyển sang thể khí."],"key":"A"},{"q":"Trong hệ nhiệt kế lý tưởng, 0 °C và 100 °C (áp suất chuẩn) được sử dụng làm mốc của thang","options":["Kelvin tuyệt đối.","Fahrenheit.","Celsius.","Réaumur trong mọi hệ thống SI."],"key":"C"}],"tf":[{"passage":"Một bình cách nhiệt chứa 0,25 kg nước ở 80 °C trộn với 0,35 kg nước ở 20 °C. Coi không có thất thoát và c của hai phần nước như nhau.","claims":[{"t":"Khi cân bằng, nhiệt độ cuối nằm giữa 20 °C và 80 °C.","key":true},{"t":"Nhiệt độ cân bằng bằng đúng 50 °C.","key":false},{"t":"Nhiệt độ cân bằng là 45 °C.","key":true},{"t":"Phần nước nóng tỏa nhiệt bằng phần nước lạnh thu nhiệt.","key":true}]},{"passage":"Một lượng nước 0,10 kg ở 100 °C được chuyển hoàn toàn thành hơi nước cũng ở 100 °C. L = 2,26×10^6 J/kg. Sau đó xét ngưng tụ cùng khối lượng hơi ở 100 °C.","claims":[{"t":"Nhiệt độ nước không đổi trong quá trình hóa hơi ở áp suất không đổi.","key":true},{"t":"Nhiệt lượng hóa hơi bằng 22,6 kJ.","key":false},{"t":"Nhiệt lượng hóa hơi bằng 226 kJ.","key":true},{"t":"Khi ngưng tụ toàn bộ, hơi tỏa ra khoảng 226 kJ nhiệt lượng.","key":true}]}],"short":[{"q":"Độ tăng nhiệt độ của một vật từ 285 K lên 318 K bằng bao nhiêu °C?","key":33,"unit":"°C","tol":0.01,"hint":""},{"q":"Khối lượng nước 0,40 kg được làm nóng từ 25 °C lên 50 °C. Tính nhiệt lượng cần (kJ), c = 4200 J/(kg·K).","key":42,"unit":"kJ","tol":0.01,"hint":""},{"q":"Một khối khí thực hiện công 180 J và nội năng tăng 75 J. Khí đã nhận bao nhiêu J nhiệt lượng?","key":255,"unit":"J","tol":0.01,"hint":""},{"q":"Đun bay hơi hoàn toàn 0,15 kg nước đang sôi. Tính nhiệt lượng hóa hơi (kJ), L = 2260 kJ/kg.","key":339,"unit":"kJ","tol":0.01,"hint":""}],"essay":[{"title":"Bài toán 1 – Trộn nước và nước đá","prompt":"Bình cách nhiệt chứa 0,40 kg nước ở 50 °C, thả vào 0,10 kg nước đá ở 0 °C. Cho c_nước = 4200 J/(kg·K), λ = 334 000 J/kg. Bỏ qua nhiệt dung bình. Chứng minh đá tan hết rồi tính nhiệt độ cân bằng.","parts":[{"q":"Nhiệt lượng cần để làm tan hết 0,10 kg đá (kJ)?","key":33.4,"unit":"kJ","points":0.75,"tol":0.02},{"q":"Nhiệt độ cân bằng sau khi tan hết (°C)?","key":24.095238,"unit":"°C","points":0.75,"tol":0.2}],"solution":"Nước nóng nếu hạ tới 0 °C có thể tỏa 84 kJ > 33,4 kJ nên đá tan hết. 0,4·4200·(50−t) = 33400 + 0,1·4200·t, suy ra t ≈ 24,10 °C."},{"title":"Bài toán 2 – Khí chuyển trạng thái","prompt":"Một khí nhận 720 J nhiệt lượng trong khi pít-tông bị khí đẩy đi 8 cm. Tiết diện pít-tông 75 cm², áp suất khí không đổi 1,5×10^5 Pa, bỏ qua ma sát. Trình bày cách đổi đơn vị và áp dụng định luật I.","parts":[{"q":"Công do khí thực hiện (J)?","key":90,"unit":"J","points":0.75,"tol":0.1},{"q":"Độ tăng nội năng khí (J)?","key":630,"unit":"J","points":0.75,"tol":0.1}],"solution":"S = 75 cm² = 0,0075 m², ΔV = 0,0075·0,08 = 0,0006 m³; W = pΔV = 90 J; ΔU = Q − W = 630 J."}]}],"history":{"mc":[{"q":"Nội dung nào sau đây là một trong những hoạt động nổi bật của Hiệp hội các quốc gia Đông Nam Á (ASEAN) trong giai đoạn 1967 – 1976?","options":["Phản đối Trật tự thế giới hai cực I-an-ta, ủng hộ xu thế đa cực.","Tập trung vào hợp tác trên lĩnh vực chính trị — an ninh.","Tích cực ủng hộ việc đấu tranh chống Mỹ xâm lược Việt Nam.","Tham gia vào giải quyết căng thẳng trên bán đảo Triều Tiên."],"key":"B"},{"q":"Tiêu diệt tận gốc chủ nghĩa phát xít Đức và chủ nghĩa quân phiệt Nhật Bản là một trong những nội dung của hội nghị nào?","options":["I-an-ta.","Pôt-xđam.","Tê-hê-ran.","Xan Phran-xi-xcô."],"key":"A"},{"q":"Một trong những thách thức về kinh tế mà Cộng đồng ASEAN phải đối mặt trong quá trình xây dựng và phát triển là","options":["sự đa dạng về chế độ chính trị.","những vấn đề lịch sử sâu xa.","chênh lệch trình độ phát triển.","sự xung đột lãnh thổ, biên giới."],"key":"C"},{"q":"Sự sụp đổ của chế độ xã hội chủ nghĩa ở Đông Âu và Liên Xô (1989 – 1991) đã tạo cho Mỹ lợi thế nào sau đây?","options":["Chi phối được các nước tư bản đồng minh đi theo Mỹ.","Tận dụng cơ hội để thiết lập trật tự giới đơn cực.","Đẩy mạnh việc triển khai chiến lược đa phương hoá.","Thực hiện thành công mục tiêu chiến lược toàn cầu."],"key":"B"},{"q":"Đâu không phải là một trong những trụ cột của Cộng đồng ASEAN?","options":["Cộng đồng Chính trị - An ninh.","Cộng đồng An ninh - Quốc phòng.","Cộng đồng Kinh tế.","Cộng đồng Văn hóa - Xã hội."],"key":"B"},{"q":"Đầu năm 1945, đâu là vấn đề cấp bách đặt ra cho các nước Đồng minh chống phát xít?","options":["Phân chia lại thuộc địa của các nước.","Tổ chức lại thế giới sau chiến tranh.","Thiết lập trật tự thế giới mới hai cực.","Phục hồi và phát triển kinh tế thế giới."],"key":"B"},{"q":"Nội dung nào sau đây không phải xu thế phát triển của thế giới sau Chiến tranh lạnh?","options":["Quốc tế hoá - toàn cầu hoá.","Đối thoại, hợp tác cùng phát triển.","Lấy phát triển kinh tế làm trung tâm.","Đa quốc gia, đa bản sắc văn hoá."],"key":"D"},{"q":"“Xây dựng một ASEAN lấy con người làm trung tâm và có trách nhiệm xã hội, nhằm xây dựng tình đoàn kết và thống nhất bền lâu giữa các quốc gia và dân tộc ASEAN bằng cách tạo dựng bản sắc chung, xây dựng một xã hội chia sẻ, đùm bọc, hoà thuận và rộng mở” là một trong những mục tiêu của","options":["Cộng đồng Kinh tế ASEAN.","Cộng đồng Văn hoá - Xã hội ASEAN.","Cộng đồng Hợp tác - Chia sẻ ASEAN.","Cộng đồng Chính trị - An ninh ASEAN."],"key":"B"},{"q":"Việt Nam gia nhập ASEAN vào thời gian nào sau đây?","options":["Năm 1995.","Năm 1996.","Năm 1997.","Năm 1998."],"key":"A"},{"q":"Năm 1997, hai quốc gia nào sau đây trở thành thành viên thứ 8,9 của ASEAN?","options":["Bru-nây và Việt Nam.","Thái Lan và Mi-an-ma.","Cam-pu-chia và Lào.","Lào và Mi-an-ma."],"key":"D"},{"q":"Những quyết định của Hội nghị Ianta trở thành khuôn khổ của trật tự thế giới mới","options":["Trật tự Vécxay - Oasinhtơn","Trật tự đa cực","Trật tự đơn cực","Trật tự 2 cực Ianta."],"key":"D"},{"q":"Sau khi thành lập, Cộng đồng ASEAN sẽ gặp phải một trong những thách thức nào sau đây trong quá trình hoạt động?","options":["Có khoảng cách địa lí giữa hai nhóm nước lục địa và hải đảo.","Nhiều nước vẫn chưa tha anh lạnh đã và đang tác động sâu sắc đến nhiều nước.","Xu thế toàn cầu hoá xuất hiện và có những bước phát triển mạnh mẽ.","Việc lập lại hoà bình ở Cam-pu-chia trở thành tâm điểm của khu vực."],"key":"B"},{"q":"Về hoạt động, Cộng đồng Văn hoá - Xã hội ASEAN không có nội dung nào sau đây?","options":["Thúc đẩy hoà bình, hợp tác khu vực.","Phúc lợi và bảo hiểm xã hội.","Bảo đảm môi trường bền vững.","Bảo đảm các quyền công bằng xã hội."],"key":"A"},{"q":"Từ đầu những năm 70 của thế kỉ XX, quan hệ Mỹ – Liên Xô chuyển dần sang hòa dịu, sau đó kết thúc Chiến tranh lạnh (1989) là do","options":["chịu nhiều tốn kém và bị suy giảm thế mạnh về nhiều mặt.","xu thế liên kết khu vực và toàn cầu hoá diễn ra mạnh mẽ.","quá trình mở rộng không ngừng của Liên minh châu Âu (EU).","trật tự nhất siêu, nhiều cường đang trong quá trình mở rộng."],"key":"A"},{"q":"“Xây dựng một môi trường hoà bình và an ninh cho phát triển ở khu vực Đông Nam Á” là một trong những mục tiêu của","options":["Cộng đồng Kinh tế - Tài chính ASEAN.","Cộng đồng Văn hoá - Xã hội ASEAN.","Cộng đồng Văn hoá - Thể thao ASEAN.","Cộng đồng Chính trị - An ninh ASEAN."],"key":"D"},{"q":"Một trật tự thế giới mà ở đó các nước lớn, các trung tâm kinh tế – tài chính lớn như Mỹ, Nhật Bản, Trung Quốc, Ấn Độ, Liên bang Nga, ... có vị thế đối với quan hệ quốc tế được gọi là trật tự","options":["đa cực, nhiều trung tâm.","đơn cực, nhất siêu.","đa phương hoá","tam cường, đa phương."],"key":"A"},{"q":"Quốc gia đứng đầu khối tư bản chủ nghĩa sau Chiến tranh thế giới thứ hai (1945) là","options":["Anh.","Pháp.","Mỹ.","Đức."],"key":"C"},{"q":"Nội dung nào sau đây là một trong những hoạt động nổi bật của Hiệp hội các quốc gia Đông Nam Á (ASEAN) trong giai đoạn 1976 – 1999?","options":["Phát triển số lượng thành viên, từ 5 nước lên 10 nước.","Hợp tác hiệu quả trong hoạt động chống chủ nghĩa khủng bố.","Bước đầu phát triển về cơ cấu tổ chức, nguyên tắc hoạt động.","Các nước tập trung hợp tác trên lĩnh vực chính trị — an ninh."],"key":"A"},{"q":"Năm 1999, quốc gia nào sau đây trở thành thành viên thứ 10 của ASEAN?","options":["Bru-nây.","Mi-an-ma.","Cam-pu-chia.","Lào."],"key":"C"},{"q":"Trong bối cảnh quốc tế đang diễn ra theo nhiều xu thế mới với những diễn biến phức tạp, chủ trương nhất quán của Đảng và Nhà nước Việt Nam là","options":["tham gia liên minh chính trị với Mỹ và các nước phương Tây.","chủ động kết nối các cường quốc để nâng tầm đối tác chiến lược.","hội nhập quốc tế để thu hút vốn đầu tư bên ngoài bằng mọi giá.","chủ động nắm bắt thời cơ, đi tắt đón đầu để vượt qua thách thức."],"key":"D"},{"q":"Một trong những cơ quan chính của Liên hợp quốc được quy định trong Hiến chương Liên hợp quốc (năm 1945) là","options":["Ngân hàng Thế giới.","Quỹ Nhi đồng Liên Hợp quốc.","Hội đồng Bảo an.","Tổ chức Thương mại Thế giới."],"key":"C"},{"q":"Ba nước Đông Dương và Mi-an-ma gia nhập ASEAN trong bối cảnh nào sau đây?","options":["Chủ nghĩa xã hội trở thành hệ thống thế giới.","Bán đảo Triều Tiên được thống nhất trở lại.","Xu thế toàn cầu hoá đang diễn ra mạnh mẽ.","Xu thế hoà hoãn Đông – Tây đang diễn ra."],"key":"C"},{"q":"Nội dung nào sau đây là một trong những trụ cột của Cộng đồng ASEAN?","options":["Cộng đồng Công nghệ ASEAN.","Cộng đồng Quốc phòng ASEAN.","Cộng đồng An ninh ASEAN.","Cộng đồng Kinh tế ASEAN."],"key":"D"},{"q":"Theo thoả thuận của các cường quốc tại Hội nghị I-an-ta (2-1945), địa bàn nào sau đây ở châu Âu sẽ thuộc phạm vi ảnh hưởng của Mỹ?","options":["Béc-lin.","Đông Đức.","Đông Âu.","Tây Âu."],"key":"D"},{"q":"Văn kiện Tầm nhìn ASEAN 2020 đề xuất ý tưởng xây dựng một Cộng đồng ASEAN không có đặc điểm nào sau đây?","options":["Tăng cường hợp tác giữa các nước trong tổ chức và bên ngoài, trọng tâm là hợp tác với EU.","Có nhận thức về các mối quan hệ lịch sử, gắn bó với nhau trong một bản sắc khu vực chung.","Xây dựng lực lượng quân đội khu vực để bảo vệ hoà bình chung cho việc phát triển lâu bền.","Tăng cường ảnh hưởng của Hiệp hội các quốc gia Đông Nam Á ở khu vực và liên khu vực."],"key":"A"},{"q":"Năm 1999, quốc gia nào sau đây được kết nạp, trở thành thành viên thứ 10 của Hiệp hội các quốc gia Đông Nam Á (ASEAN)?","options":["Bru-nây.","Mi-an-ma.","Cam-pu-chia.","Malaixia."],"key":"C"},{"q":"Nội dung nào sau đây là một trong những mục tiêu xây dựng Cộng đồng ASEAN?","options":["Thúc đẩy ASEAN mở rộng hợp tác với bên ngoài.","Tạo điều kiện để ASEAN tập trung hợp tác nội khối.","Đưa tốc độ tăng trưởng của ASEAN cao nhất thế giới.","Đưa ASEAN trở thành một tổ chức nhất thể hoá khu vực."],"key":"A"},{"q":"Quan hệ Mỹ - Liên Xô trong và sau Chiến tranh thế giới thứ hai đã chuyển biến từ","options":["đối đầu sang đối thoại.","đối đầu sang thoả hiệp.","đồng minh sang đối đầu.","đồng minh sang đối tác."],"key":"C"}],"tf":[{"passage":"Trong xu thế đa cực, nhiều trung tâm, Mỹ và Trung Quốc là hai cực có tầm ảnh hưởng lớn đến nền kinh tế thế giới: Mỹ vẫn duy trì vị trí cường quốc số 1 thế giới; từ năm 2010, Trung Quốc đã vượt qua Anh, Pháp, Đức, Nhật Bản để trở thành nền kinh tế thứ hai thể giới. Tuy nhiên, các nước lớn và trung tâm kinh tế, tài chính khác (Nhật Bản, Liên minh châu Âu, Liên bang Nga, Ấn Độ,...) cũng đang nỗ lực vươn lên mạnh mẽ; quốc gia nào cũng muốn khẳng định vị thế, vai trò của mình trong quan hệ quốc tế.","claims":[{"t":"a. Trong trật tự thế giới đa cực, nhiều trung tâm, Mỹ và Trung Quốc là những nước đang có vị thế, ảnh hưởng hàng đầu thế giới.","key":true},{"t":"b. Trật tự thế giới hai cực I-an-ta sụp đổ là nguyên nhân trực tiếp, tạo cơ hội cho Trung Quốc vươn lên trở thành nền kinh tế lớn thứ hai thế giới.","key":false},{"t":"c. Phát huy thành công sức mạnh nội lực là yếu tố quyết định để các nước khẳng định trong xu thế đa cực, nhiều trung tâm.","key":true},{"t":"d. Trong xu thế đa cực và xu thế toàn cầu hoá, các quốc gia có nhiều thời cơ lớn, nhưng lại cũng có không ít thách thức và rào cản.","key":true}]},{"passage":"“Vào thập niên 1980, mối quan hệ nồng ấm giữa Tổng thống Mỹ Ri-gân và nhà lãnh đạo Liên Xô Goóc-ba chớp đã giúp giảm dần tình trạng căng thẳng của CTL. Năm 1987, hai nhà lãnh đạo đã đồng ý huỷ bỏ tên lửa hạt nhân tầm trung. Năm 1989. Goóc-ba chấp cho phép các quốc gia XHCN ở Đông Âu bầu ra chính phủ dân chủ, và đến năm 1991, Liên Xô tan rã thành 15 nước cộng hoà độc lập. Ngày 12-3-1999 Hung-ga-ri, Ba Lan và Cộng hoà Séc gia nhập khối NATO”.\n(King Fisher, Bách khoa thư lịch sử (Nguyễn Đức Tĩnh và Ngô Minh Châu dịch), NXB Thế giới, Hà Nội, 2016, tr.437","claims":[{"t":"a. Trật tự thế giới hai cực I-an-ta bắt đầu bị xói mòn và sụp đổ trong thập niên 1980.","key":false},{"t":"b. Chiến tranh lạnh kết thúc và Trật tự thế giới hai cực I-an-ta sụp đổ bắt nguồn từ những nguyên nhân khác nhau, nhưng yếu tố Mỹ và Liên Xô vẫn là quyết định.","key":true},{"t":"c. Cuộc Chiến tranh lạnh đã kết thúc và Trật tự thế giới hai cực I-an-ta đã sụp đổ, nhưng nhiều di chứng của nó vẫn còn và vẫn đang tiếp diễn ở nhiều nơi trên thế giới.","key":true},{"t":"d. Việc Liên Xô tan rã (1991) đã chính thức chấm dứt cục diện hai cực, hai phe.","key":false}]},{"passage":"[Đối với việc thúc đẩy quá trình phi thực dân hoá trên thế giới, năm 1960] “Đại hội đồng Liên hợp quốc đã thông qua bản Tuyển ngôn về thủ tiêu hoàn toàn chủ nghĩa thực dân, trao trả độc lập cho các quốc gia và dân tộc thuộc địa... Như thế, Tuyên ngôn đã khẳng định các nước thực dân đã vi phạm nguyên tắc quan trọng nhất của luật pháp quốc tế; khẳng định rõ ràng cơ sở pháp lí quốc tế của cuộc đấu tranh giành độc lập của các dân tộc bị áp bức”.\n(Nguyễn Quốc Hùng, Nguyễn Hồng Quân, Liên hợp quốc và Lực lượng gìn giữ hoà bình Liên hợp quốc, NXB Chính trị quốc gia, Hà Nội, 2008, tr.46)","claims":[{"t":"a. Liên hợp quốc đóng vai trò quyết định vào quá trình giải trừ chủ nghĩa thực dân.","key":false},{"t":"b. Việt Nam trở thành biểu tượng thúc đẩy quá trình phi thực dân hoá trên thế giới.","key":true},{"t":"c. Mỹ và các nước phương Tây là những quốc gia dân chủ và tiên tiến, đi tiên phong trong việc ủng hộ thúc đẩy quá trình phi thực dân hoá trên thế giới.","key":false},{"t":"d. Cuộc đấu tranh xóa bỏ thuộc địa do các nước đế quốc lập ra trước Chiến tranh thế thứ hai ở châu Á, châu Phi và Mỹ La-tinh được gọi là quá trình phi thực dân hoá.","key":true}]},{"passage":"“Tháng 3-1947, Tổng thống Mỹ - Tơ-ru-man đã đọc diễn văn trước Quốc hội Mỹ, chính thức đưa ra chủ nghĩa Tơruman. Theo Tơ-ru-man thì các nước Đông Âu vừa mới bị cộng sản thôn tính và những đe dọa tương tự đang diễn ra trên nhiều nước khác ở châu Âu, ở I-ta-li-a, Pháp và cả nước Đức nữa. Vì vậy, Mỹ phải đứng ra đảm nhận sứ mệnh lãnh đạo thế giới tự do, phải giúp đỡ cho các dân tộc trên thế giới chống lại sự đe dọa của chủ nghĩa cộng sản, chống lại sự bành trướng của nước Nga, giúp đỡ bằng mọi biện pháp kinh tế, quân sự. Tổng thống Mỹ Tơ-ru-man đã phát động cuộc chiến tranh lạnh chống Liên Xô và các nước xã hội chủ nghĩa.”\n(Nguyễn Anh Thái, Lịch sử thế giới hiện đại (1917-1995), NXB Giáo dục, tr. 235).","claims":[{"t":"a) Chiến tranh lạnh là cuộc đối đầu trực tiếp giữa Mĩ và các nước trên thế giới.","key":false},{"t":"b) Thông điệp của Tổng thống Mỹ Tơ-ru-man tại Quốc hội Mỹ (1947) được xem là khởi đầu cho cuộc Chiến tranh lạnh.","key":true},{"t":"c) Trong thời kì Chiến tranh lạnh, các cuộc “chiến tranh ủy nhiệm” đã để lại hậu quả nặng nề đối với nhiều quốc gia.","key":true},{"t":"d) Cuộc chiến tranh xâm lược của Pháp và Mĩ ở Việt Nam (1945 – 1975) biến Việt Nam trở thành tâm điểm lớn nhất trong Chiến tranh lạnh.","key":false}]},{"passage":"“Trật tự thế giới mới này được hình thành như thế nào, còn tùy thuộc ở nhiều nhân tố: Sự phát triển về thực lực kinh tế, chính trị, quân sự của các cường quốc Mỹ, Nga, Trung Quốc, Anh, Pháp, Nhật Bản, Đức trong cuộc chạy đua về sức mạnh quốc gia tổng hợp... Sự lớn mạnh của lực lượng cách mạng thế giới (sự thành bại của công cuộc cải cách, đổi mới ở các nước xã hội chủ nghĩa,...); Sự phát triển của cách mạng khoa học – kĩ thuật sẽ còn tiếp tục tạo ra những “đột phá” và biến chuyển trên cục diện thế giới”.\n(Nguyễn Anh Thái (Chủ biên), Lịch sử thế giới hiện đại, NXB Giáo dục Việt Nam, Hà Nội, 2021, tr.424)","claims":[{"t":"a. Đoạn tư liệu là minh chứng cho xu thế đa cực, nhiều trung tâm trong quan hệ quốc tế trong thời gian diễn ra cuộc Chiến tranh lạnh.","key":false},{"t":"b. Trong quan hệ quốc tế, khái niệm đa cực chỉ trạng thái địa – chính trị toàn cầu với ba trung tâm quyền lực chi phối là Mỹ, Liên bang Nga và Trung Quốc.","key":false},{"t":"c. Khái niệm đa cực được dùng chủ yếu để chỉ trật tự thế giới sau Chiến tranh lạnh.","key":true},{"t":"d. Để có thể trở thành một cực trong xu thế đa cực, nhiều trung tâm, các nước phải có chiến lược xây dựng sức mạnh tổng hợp, trong đó sức mạnh kinh tế là trụ cột.","key":true}]},{"passage":"“Toàn bộ Đông Nam Á sẽ là một cộng đồng ASEAN, nhận thức được các mối liên hệ lịch sử của mình, hiểu rõ di sản văn hoá của mình và gắn bó với nhau bằng một bản sắc chung của khu vực”.\n(Nguồn: Cổng Thông tin ASEAN – Việt Nam)","claims":[{"t":"a. Đoạn tư liệu là một phần nội dung được đề cập trong văn kiện Tầm nhìn ASEAN 2020.","key":true},{"t":"b. Việc thành lập Cộng đồng ASEAN đã tăng cường sự hợp tác giữa các nước ASEAN, đưa tổ chức này phát triển lên một nấc thang mới.","key":true},{"t":"c. Cộng đồng ASEAN ra đời không có mối liên hệ với Hiệp hội các quốc gia Đông Nam Á.","key":false},{"t":"d. Sự ra đời của Cộng đồng ASEAN là một trong những biểu hiện của xu thế toàn cầu hoá.","key":true}]},{"passage":"Hiệp ước thân thiện và hợp tác (Hiệp ước Ba-li) được Hiệp hội các quốc gia Đông Nam Á (ASEAN) thông qua tại Ba-li (In-đô-nê-xi-a, tháng 2-1976), đã đặt khuôn khổ cho một nền hoà bình lâu dài ở khu vực, dựa trên cơ sở tôn trọng độc lập, chủ quyền của nhau; không can thiệp vào nội bộ của nhau; giải quyết các tranh chấp trong khu vực bằng biện pháp hoà bình; kêu gọi các nước hợp tác có hiệu quả trên các lĩnh vực nông – công nghiệp, thương mại,... vì lợi ích chung của các nước trong khu vực.","claims":[{"t":"a. Hiệp ước Ba-li (1976) đã xác định được những nguyên tắc cơ bản trong quan hệ giữa các nước trong khu vực Đông Nam Á.","key":true},{"t":"b. Hiệp ước Ba-li đã mở ra một bước phát triển mới của Hiệp hội các quốc gia Đông Nam Á (ASEAN).","key":true},{"t":"c. Nội dung cơ bản của Hiệp ước Ba-li được xây dựng trên nguyên tắc hoạt động của Liên hợp quốc, trong đó coi trọng vấn đề an ninh – chính trị của khu vực Đông Nam Á.","key":true},{"t":"d. Hiệp hội các quốc gia Đông Nam Á (ASEAN) thông qua Hiệp ước Ba-li (1976) với mục tiêu hàng đầu là kết nối và kết nạp các nước trong khu vực vào tổ chức ASEAN.","key":false}]},{"passage":"“Cộng đồng ASEAN sẽ được thành lập gồm ba trụ cột là hợp tác chính trị và an ninh, hợp tác kinh tế và hợp tác văn hoá - xã hội được gắn kết chặt chẽ và cùng tăng cường cho mục đích đảm bảo hoà bình, ổn định lâu dài và cùng thịnh vượng trong khu vực”.\n(Trích: Thỏa ước Ba-li II (2003), Nguồn: Bộ Ngoại giao)","claims":[{"t":"a. Theo nội dung tư liệu, Cộng đồng ASEAN ra đời và hoạt động dựa trên ba trụ cột nhằm tăng cường sự hợp tác, gắn kết giữa các nước trong khu vực.","key":true},{"t":"b. Trong ba trụ cột của Cộng đồng ASEAN, trụ cột về văn hoá – xã hội được các thành viên xác định là quan trọng nhất.","key":false},{"t":"c. Một trong những mục tiêu thành lập Cộng đồng ASEAN là hướng tới duy trì hoà bình ổn định của khu vực Đông Nam Á.","key":true},{"t":"d. Ba trụ cột của Cộng đồng ASEAN được thành lập phản ánh quy luật tất yếu của sự hợp tác giữa các nước trong xu thế hoà hoãn Đông – Tây.","key":false}]},{"passage":"Trong quá trình tìm kiếm sự hợp tác giữa các nước Đông Nam Á đã xuất hiện những tổ chức khu vực và kí các hiệp ước giữa các nước trong khu vực. Tháng 1-1959, Hiệp ước hữu nghị và kinh tế Đông Nam Á (SAFET) bao gồm Ma-lai-xi-a và Phi-lip-pin ra đời. Tháng 7-1961, Hội Đông Nam Á (ASA) gồm Ma-lai-xi-a, Phi-lip-pin và Thái Lan được thành lập. Tháng 8-1963, một tổ chức gồm Ma-lai-xi-a, Phi-lip-pin, In-đô-nê-xi-a (MAPHILINDO) được thành lập. Tuy nhiên, những tổ chức trên đây không tồn tại được lâu do sự bất đồng giữa các nước về vấn đề lãnh thổ và chủ quyền”.\n(Nguyễn Anh Thái (Chủ biên), Lịch sử thế giới hiện đại, NXB Giáo dục, Hà Nội, 1998, tr.358)","claims":[{"t":"a. Ma-lai-xi-a, Phi-lip-pin, Thái Lan, In-đô-nê-xi-a là những quốc gia sớm có ý tưởng về việc thành lập một tổ chức khu vực ở Đông Nam Á.","key":true},{"t":"b. Yếu tố quyết định để thành lập và mở rộng Hiệp hội các quốc gia Đông Nam Á (ASEAN) là các nước phải tôn trọng độc lập, chủ quyền và lãnh thổ của nhau.","key":true},{"t":"c. Các tổ chức tiền thân của Hiệp hội các quốc gia Đông Nam Á (ASEAN) không tồn tại lâu là do không thống nhất được giá cả và thị trường tiêu thụ hàng hoá.","key":false},{"t":"d. Trong bối cảnh khu vực và quốc tế có nhiều biến động, yêu cầu hợp tác để phát triển giữa các nước trong khu vực Đông Nam Á là yêu cầu tất yếu. cùng","key":true}]},{"passage":"“Thúc đẩy sự tăng trưởng kinh tế, tiến bộ xã hội và phát triển văn hoá trong khu vực thông qua những nỗ lực hợp tác chung trên tinh thần bình đẳng và hợp tác nhằm tăng cường cơ sở cho một cộng đồng các nước Đông Nam Á hoà bình và thịnh vượng.\nThúc đẩy hoà bình ổn định khu vực bằng việc tôn trọng pháp lí và nguyên tắc luật pháp trong quan hệ giữa các nước trong khu vực và tuân thủ các nguyên tắc của Hiến chương Liên hợp quốc.\nThúc đẩy sự cộng tác tích cực và giúp đỡ lẫn nhau trong các vấn đề cùng quan tâm trên các lĩnh vực kinh tế, xã hội, văn hoá, khoa học – kĩ thuật và hành chính”.\n(Nguyễn Anh Thái (Chủ biên), Lịch sử thế giới hiện đại, NXB Giáo dục, Hà Nội, 1998, tr.358)","claims":[{"t":"a. Hiệp hội các quốc gia Đông Nam Á (ASEAN) ra đời năm 1967 là một tổ chức liên thiết giữa  minh chính trị – kinh tế của khu vực, nằm trong Cộng đồng ASEAN.","key":false},{"t":"b. Nguyên tắc hoạt động của Hiệp hội các quốc gia Đông Nam Á (ASEAN) có những điểm tương đồng với nguyên tắc hoạt động của Liên hợp quốc.","key":true},{"t":"c. Một trong những mục đích thành lập của Hiệp hội các quốc gia Đông Nam Á (ASEAN) là duy trì hoà bình ổn định của khu vực.","key":true},{"t":"d. Ngay từ khi ra đời, Hiệp hội các quốc gia Đông Nam Á (ASEAN) đã hướng đến xây dựng một cộng đồng vì hoà bình và thịnh vượng.","key":true}]},{"passage":"“Trong lĩnh vực giáo dục và đào tạo, ASEAN khuyến khích phát triển giáo dục suốt đời, sử dụng công nghệ thông tin và truyền thông (ICT) như những phương tiện thúc đẩy nền giáo dục ASEAN và nâng cao nhận thức về ASEAN. Các dự án khác nhau dành cho các cấp học ở phổ thông và đại học cũng cần được thực hiện nhằm phát triển và nâng cao chất lượng nguồn nhân lực cho các nước thành viên, đặc biệt là nguồn nhân lực trẻ, khẳng định vai trò tiên phong của thanh niên trong việc tham gia xây dựng Cộng đồng ASEAN”.\n(Lương Ninh, Đông Nam Á Lịch sử từ nguyên thủy đến ngày nay, NXB Chính trị quốc gia, Hà Nội, 2015, tr.932)","claims":[{"t":"a. . Nguồn nhân lực trẻ đóng vai trò quyết định hàng đầu trong việc tham gia xây dựng Cộng đồng ASEAN.","key":false},{"t":"b. . ASEAN khuyến khích phát triển giáo dục suốt đời nhằm thúc đẩy nền giáo dục ASEAN và nâng cao nhận thức về ASEAN.","key":true},{"t":"c. . Phát triển và nâng cao chất lượng nguồn nhân lực, ngoài việc nâng cao thể chất, về thực chất là phát triển giáo dục, đào tạo.","key":true},{"t":"d. . Phương tiện thúc đẩy nền giáo dục ASEAN là sử dụng công nghệ thông tin và trí tuệ nhân tạo (AI).","key":false}]},{"passage":"“Trước kia, chế độ quân chủ tại Hy Lạp đã nhờ vào sự giúp đỡ của Anh, nhưng sau Chiến tranh thế giới thứ hai, kinh tế của nước Anh hoàn toàn suy kiệt, lo cho mình còn không xong, nên không thể giúp đỡ gì cho chế độ quân chủ ở Hy Lạp nữa.\nVào ngày 12-3-1947, Tổng thống Tơ-ru-man đã đọc một bài diễn văn tại lưỡng viện Quốc hội Mỹ, cho rằng Hy Lạp và Thổ Nhĩ Kỳ nếu bị rơi vào khối xã hội chủ nghĩa, thì cả Trung Đông cũng sẽ rơi theo... sẽ làm cho cả Tây Âu bị ảnh hưởng. Do vậy, ông thuyết phục Quốc hội Mỹ chi viện kinh tế và quân sự cho Hy Lạp và Thổ Nhĩ Kỳ với số tiền 400 triệu đô la. Li luận này về sau được gọi là “Học thuyết Tơ-ru-man””.\n(Vương Kính Chi, Lược sử nước Mỹ (Phong Đảo dịch), NXB Thành phố Hồ Chí Minh, Thành phố Hồ Chí Minh, 2000, tr.145)","claims":[{"t":"a. Chiến tranh lạnh là cuộc đối đầu gay gắt giữa Mỹ và Liên Xô, chỉ diễn ra ở châu Âu.","key":false},{"t":"b. Thông điệp của Tổng thống Mỹ Tơ-ru-man đọc trước Quốc hội Mỹ ngày 12-3-1947 Tin đã khởi đầu cuộc Chiến tranh lạnh chống lại Liên Xô và các nước Đông Âu.","key":true},{"t":"c. Nguồn gốc của sự đối đầu căng thẳng giữa Mỹ và Liên Xô xuất phát từ “vấn đề Hy Lạp và Thổ Nhĩ Kỳ” sau Chiến tranh thế giới thứ hai.","key":false},{"t":"d. Học thuyết Tơ-ru-man phản ánh chính sách đối ngoại của Mỹ sau Chiến tranh thế giới thứ hai, muốn đưa nước Mỹ trở thành bá chủ thế giới.","key":true}]},{"passage":"“Các nguyên tắc hoạt động của Liên hợp quốc bao gồm: Bình đẳng về chủ quyền quốc gia; Tôn trọng toàn vẹn lãnh thổ và độc lập chính trị quốc gia; Từ bỏ đe dọa bằng vũ lực hoặc sử dụng vũ lực trong quan hệ quốc tế; Không can thiệp vào công việc nội bộ các nước; Tôn trọng nghĩa vụ quốc tế và luật pháp quốc tế; Giải quyết các tranh chấp quốc tế bằng biện pháp hòa bình”.\n(Trích SGKLS lớp 12 trang 9 – Bộ KNTN, NXB GDVN năm 2024)","claims":[{"t":"a) Hòa bình là ưu tiên hàng đầu trong giải quyết mâu thuẫn giữa các nước.","key":true},{"t":"b) Cho phép các nước lớn được can thiệp vào các nước nhỏ.","key":false},{"t":"c) Theo nguyên tắc Liên Hợp Quốc, việc sử dụng vũ lực là cần thiết trong quan hệ quốc tế.","key":false},{"t":"d) Tất cả các nước thành viên của Liên hợp quốc phải tuân theo một thể chế nhà nước.","key":false}]},{"passage":"“Bài học của thời kì Chiến tranh lạnh đã chứng tỏ phương thức quan hệ quốc tế lấy đối đầu chính trị - quân sự là chủ yếu không còn phù hợp, phải chịu nhiều tổn thất hoặc thất bại như hai nước Xô – Mỹ và một bị thương, một bị mất. Trong khi đó, phương thức lấy hợp tác và cạnh tranh về kinh tế - chính trị là chính lại thu được nhiều tiến bộ, kết quả như các nước Đức, Nhật và NICs. Sự hưng thịnh hay suy vong của một quốc gia quyết định bởi sức mạnh tổng hợp của quốc gia đó, mà chủ yếu là thực lực kinh tế và khoa học – kĩ thuật”.\n(Vũ Dương Ninh (Chủ biên), Một số chuyên đề lịch sử thế giới, NXB Đại học Quốc gia, Hà Nội, 2001, tr.401)","claims":[{"t":"a. . Trong  thời kì chiến tranh lạnh, Xô – Mỹ lấy đối đầu về chính trị - quân sự là chủ yếu, Đức và Nhật Bản lấy hợp tác và cạnh tranh về kinh tế - chính trị là chủ yếu.","key":true},{"t":"b. . Trong thời kì chiến tranh lạnh và sau thời kì chiến tranh lạnh, nội dung của quan hệ quốc tế có sự điều chỉnh từ lấy yếu tố quân sự sang lấy yếu tố kinh tế là trọng tâm.","key":true},{"t":"c. . Một trong những bài học rút ra từ thời kì chiến tranh lạnh cho tất cả các quốc gia là không nên tập trung vào phát triển quân sự, quốc phòng đất nước.","key":false},{"t":"d. . Kinh tế và khoa học – kĩ thuật là hai yếu tố chủ yếu tạo nên sức mạnh tổng hợp của một quốc gia sau khi chiến tranh lạnh chấm dứt.","key":true}]},{"passage":"Ở Châu Á, chiến tranh Triều Tiên (1950 - 1953), chiến tranh xâm lược Việt Nam của thực dân Pháp (1945 - 1954) và chiến tranh xâm lược Việt Nam của đế quốc Mỹ (1954- 1975), là những cuộc chiến tranh cục bộ tiêu biểu. Ở khu vực Trung Đông, chiến tranh Trung Đông giữa I-xra-en và các nước Ả-rập bất đầu từ năm 1948 và kéo dài trong nhiều năm.\n(Sách giáo khoa Lịch sử 12 – KNTT – tr.15)","claims":[{"t":"a. . Chiến tranh Triều Tiên (1950 -1953) là cuộc chiến tranh cục bộ, có sự can thiệp của Mỹ và Liên Xô.","key":true},{"t":"b. . Chiến tranh xâm lược Việt Nam của thực dân Pháp (1945 - 1954) và của đế quốc Mỹ (1954- 1975) là sản phẩm của chiến tranh lạnh.","key":true},{"t":"c. . Chiến tranh Trung Đông giữa I-xra-en và các nước Ả-rập là cuộc xung đột tôn giáo lớn giữa đạo Thiên chúa với đạo Hồi.","key":false},{"t":"d. . Các cuộc chiến tranh Đông Dương (1945-1954), chiến tranh Triều Tiên(1950-1953) chứng tỏ Châu Á là tâm điểm đối đầu giữa 2 cực Xô - Mỹ.","key":true}]},{"passage":"Tháng 6-1941, tại Luân Đôn (Anh), các nước Đồng minh ra tuyên bố cam kết cùng hợp tác cả trong chiến tranh và hoà bình. Sự kiện này đã đặt cơ sở cho việc hướng tới thành lập Liên hợp quốc. Từ đó, các nước Đồng minh (vai trò lớn nhất thuộc về Liên Xô, Mỹ và Anh) đã tổ chức nhiều cuộc họp ở Tê-hê-ran (I-ran) và Mát-xcơ-va (Liên Xô) để sớm thành lập một tổ chức quốc tế, nhằm thực hiện việc duy trì hoà bình và an ninh thế giới.\nTại Hội nghị I-an-ta (2-1945), Liên Xô, Mỹ và Anh đã thống nhất thành lập tổ chức Liên hợp quốc. Ngày 24-10-1945, với sự phê chuẩn Hiến chương của các thành viên, tổ chức Liên hợp quốc chính thức được thành lập.","claims":[{"t":"a. Quá trình hình thành Liên hợp quốc kéo dài từ năm 1941 đến năm 1945, phù hợp tài với khát vọng được sống trong hoà bình của nhân dân thế giới.","key":true},{"t":"b. Cho đến nay, Liên hợp quốc vẫn là tổ chức liên kết quốc tế lớn nhất hành tinh, có nhiệm vụ hàng đầu là tập trung vào ổn định nền kinh tế toàn cầu.","key":false},{"t":"c. Liên Xô, Mỹ và Anh là những nước có vị thế hàng đầu trong việc đặt cơ sở và tích cực trong quá trình thành lập Liên hợp quốc.","key":true},{"t":"d. Việt Nam là một trong những quốc gia sớm gia nhập Liên hợp quốc, sau khi nước Việt Nam Dân chủ Cộng hoà ra đời (9-1945).","key":false}]},{"passage":"Từ đầu những năm 70 của thế kỉ XX, trên thế giới diễn ra nhiều cuộc gặp gỡ thương lượng của nguyên thủ quốc gia các nước và khu vực: Mỹ và Liên Xô, Mỹ với Trung Quốc, hai miền nước Đức, Đông Âu và Tây Âu,... Tháng 12-1989, trong một cuộc họp không chính thức tại đảo Man-ta (Địa Trung Hải), đại diện hai nhà lãnh đạo cấp cao của Liên Xô (Goóc-ba-chốp) và Mỹ (Bu-sơ) đã chính thức cùng tuyên bố chấm dứt Chiến tranh lạnh.\nSau Chiến tranh lạnh, Liên Xô, Mỹ và các nước đã thỏa thuận giải quyết cuộc xung đột ở nhiều nơi trên thế giới bằng giải pháp hoà bình: ở Áp-ga-ni-xtan, Cam-pu-chia, Tây Nam Phi, ... Nhiều tổ chức liên minh khu vực và châu lục được mở rộng, hoặc thay đổi tên gọi mới, kết nạp thêm thành viên và kết nối liên lục địa (ASEAN, EU, ASEM, APEC, ...).","claims":[{"t":"a. Mặc dù Chiến tranh lạnh vẫn tiếp diễn, nhưng từ đầu những năm 70 của thế kỉ XX, xu thế hoà hoãn Đông – Tây đã diễn ra.","key":false},{"t":"b. Xu thế hoà hoãn Đông – Tây chỉ được diễn ra, bàn luận và quyết định bởi các cuộc  gặp gỡ thương lượng giữa nguyên thủ quốc gia của hai nước Liên Xô và Mỹ.","key":false},{"t":"c. Trong xu thế hoà hoãn Đông – Tây, Việt Nam luôn ủng hộ và đã thành công trong việc kí Hiệp định Pa-ri (1973) và giải quyết “vấn đề Cam-pu-chia” (1991).","key":true},{"t":"d. Chiến tranh lạnh chấm dứt, sau đó là Trật tự thế giới hai cực I-an-ta sụp đổ đã mở ra  chiều hướng và những điều kiện giải quyết quan hệ quốc tế bằng giải pháp hoà bình.","key":true}]},{"passage":"“1. Duy trì hoà bình và an ninh quốc tế, và để đạt được mục đích đó, thi hành những biện pháp tập thể có hiệu quả để phòng ngừa và loại trừ các mối đe dọa hoà bình, cấm mọi hành vi xâm lược và phá hoại hoà bình khác; điều chỉnh hoặc giải quyết các vụ tranh chấp hoặc những tình thế có tính chất quốc tế có thể đưa đến sự phá hoại hoà bình, bằng phương pháp hoà bình theo đúng nguyên tắc của công lý và pháp luật quốc tế;\n2. Phát triển mối quan hệ hữu nghị giữa các dân tộc trên cơ sở tôn trọng nguyên tắc bình đẳng và tự quyết của các dân tộc và áp dụng những biện pháp phù hợp khác để củng cố hoà bình thế giới;\n3. Thực hiện sự hợp tác quốc tế trong việc giải quyết các vấn đề quốc tế về kinh tế, xã hội, văn hoá và nhân đạo và khuyến khích phát triển sự tôn trọng các quyền của con người và các tự do cơ bản cho tất cả mọi người không phân biệt chủng tộc, nam nữ, ngôn ngữ hoặc tôn giáo;\n4. Trở thành trung tâm phối hợp mọi hành động của các dân tộc, nhằm đạt được những mục đích chung nói trên.”\n(Trích: Điều 1, Hiến chương Liên hợp quốc, ngày 24-10-1945)","claims":[{"t":"a) Đoạn tư liệu trên đã phản ánh rõ các mục tiêu và nguyên tắc hoạt động của tổ chức Liên hợp quốc.","key":false},{"t":"b) Trong số các mục tiêu của Liên hợp quốc, duy trì hoà bình và an ninh quốc tế là mục tiêu hàng đầu, được các nước thành viên chú trọng.","key":true},{"t":"c) Mối quan hệ giữa các nước thành viên của Liên hợp quốc được xây dựng chủ yếu dựa trên nền tảng là quyền lợi quốc gia, quyền lợi dân tộc là trên hết.","key":false},{"t":"d) Ngày nay, Liên hợp quốc vẫn tiếp tục thực hiện mục tiêu giải quyết các vụ tranh chấp, xung đột quốc tế bằng biện pháp hoà bình.","key":true}]},{"passage":"“Mọi người sinh ra đều được tự do và bình đẳng về nhân quyền và các quyền. Mọi người đều được tạo hoá ban cho lí trí và lương tâm, và cần phải đối xử với nhau bằng tình anh em”.\n(Trích: Điều 1, Tuyên ngôn Quốc tế Nhân quyền của Liên hợp quốc)","claims":[{"t":"a. Tuyên ngôn Quốc tế Nhân quyền của Liên hợp quốc là tuyên ngôn về các quyền của con người nói chung, không có sự phân biệt nước lớn, nước nhỏ.","key":true},{"t":"b. Theo Điều 1 của Tuyên ngôn Quốc tế Nhân quyền, chỉ các dân tộc trên thế giới sau khi giành được độc lập mới có quyền tự do và bình đẳng.","key":false},{"t":"c. Tuyên ngôn Quốc tế Nhân quyền đã góp phần xây dựng một thế giới công bằng hơn, tạo cơ hội phát triển cho tất cả mọi người ở mọi quốc gia trên thế giới.","key":true},{"t":"d. Trong việc bảo đảm quyền con người, Liên hợp quốc chỉ tập trung bảo vệ quyền phụ nữ và trẻ em ở các nước đang chịu “di chứng” của chủ nghĩa thực dân.","key":false}]},{"passage":"“Không có nội dung nào trong Hiến chương này cho phép Liên hợp quốc can thiệp vào các vấn đề về thực chất thuộc quyền nội bộ của bất kì quốc gia nào hoặc yêu cầu các thành viên đưa những vấn đề đó ra giải quyết theo Hiến chương hiện tại...”.\n(Trích: Điều 2, Hiến chương Liên hợp quốc)","claims":[{"t":"a. Theo tư liệu, nguyên tắc hoạt động của Liên hợp quốc được thể hiện tại Điều 2 của Hiến chương Liên hợp quốc.","key":true},{"t":"b. Hiến chương Liên hợp quốc có nhiều nguyên tắc, trong đó nhấn mạnh việc không can thiệp vào công việc nội bộ của các quốc gia.","key":true},{"t":"c. Một nguyên tắc quan trọng trong quá trình hoạt động của Liên hợp quốc là nếu có tranh chấp quốc tế thì các bên phải giải quyết bằng biện pháp hoà bình.","key":true},{"t":"d. Liên hợp quốc quy định các nước thành viên phải tôn trọng toàn vẹn lãnh thổ và độc lập chính trị của 5 cường quốc (Liên Xô, Mỹ, Anh, Pháp và Trung Quốc).","key":false}]},{"passage":"“Xây dựng một cộng đồng dựa trên các giá trị và chuẩn mực chung; Tạo dựng một khu vực gắn kết, hoà bình và tự cường với trách nhiệm chung đối với an ninh toàn diện; Hướng tới một khu vực năng động và rộng mở với bên ngoài trong một thế giới ngày càng liên kết và tuỳ thuộc”.\n(Nguồn: Cổng Thông tin Việt Nam - ASEAN)","claims":[{"t":"a. Nội dung tư liệu ghi nhận một trong những hoạt động của Cộng đồng Chính trị - An ninh ASEAN.","key":true},{"t":"b. Kế hoạch xây dựng Cộng đồng ASEAN cho thấy sự phù hợp với bối cảnh toàn cầu hoá.","key":true},{"t":"c. Cộng đồng Chính trị - An ninh ASEAN giữ vai trò quyết định trong việc duy trì hoà bình, ổn định lâu dài của khu vực Đông Nam Á.","key":true},{"t":"d. Sự ra đời của Cộng đồng Chính trị - An ninh ASEAN là sáng kiến của ba nước Đông Dương.","key":false}]}]}};</script><script>'use strict';

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=s=>esc(s).replace(/\n/g,'<br>');
const niceTime=s=>{s=Math.max(0,Math.floor(s));return `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`};
const niceDate=s=>new Date(s).toLocaleString('vi-VN',{hour:'2-digit',minute:'2-digit',day:'2-digit',month:'2-digit',year:'numeric'});
const shuffle=arr=>{const a=[...arr];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a};
const parseNumeric=x=>{let s=String(x??'').trim().replace(/,/g,'.').replace(/\s+/g,''); if(!s)return NaN; if(!/^[+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:e[+-]?\d+)?$/i.test(s))return NaN;return Number(s)};
const within=(x,q)=>Number.isFinite(x)&&Math.abs(x-q.key)<=Math.max(q.tol??.01, Math.abs(q.key)*.00001);
function read(k,def){try{return JSON.parse(localStorage.getItem(k))??def}catch(e){return def}};
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function toast(text){document.querySelector('#toast')?.remove();const x=document.createElement('div');x.className='toast';x.id='toast';x.textContent=text;document.body.appendChild(x);setTimeout(()=>x.remove(),3500)};
let state=read(APPKEY,{page:'home'}),ticker=null, confettiFrame=null;
if(!['home','physics-list','physics-exam','physics-result','history-intro','history-run','history-result','leaderboard'].includes(state.page))state={page:'home'};
const allLocal=()=>read(HISTORYKEY,[]);
function persist(){save(APPKEY,state)}
function setPage(p){state.page=p;persist();render();window.scrollTo(0,0)}
const btn=(text,handler,cls='btn primary')=>`<button type="button" class="${cls}" data-action="${handler}">${text}</button>`;
function header(){return `<header><div class="brand">HỌC VIỆN <span>ÔN THI 12</span></div><div class="stack"><button data-action="home">Trang chủ</button><button data-action="leaderboard">Bảng xếp hạng</button></div></header>`}
function screen(body){root.innerHTML=header()+`<main class="shell">${body}</main><footer class="footer">Ôn thi cùng nhau · Học thật, hiểu sâu · Điểm số chỉ là một phần của hành trình</footer><canvas id="confetti"></canvas>`}
function home(){screen(`<section class="hero"><div class="eyebrow">NỀN TẢNG ÔN TẬP NHIỀU MÔN</div><h1>Chọn môn học.<br>Thử thách chính mình.</h1><p>Luyện đề theo ma trận, ghi nhận tiến bộ và cùng bạn bè chinh phục những cột mốc mới. Bắt đầu từ Lịch sử và Vật lí lớp 12.</p><div class="stack"><span class="tag">5 bài Lịch sử</span><span class="tag">2 đề Vật lí nâng cao</span><span class="tag">Tương thích điện thoại</span></div></section><div class="section-head"><h2>Chọn môn ôn tập</h2></div><div class="cards"><article class="card subject"><span class="emoji">🏛️</span><h2>Lịch sử 12</h2><p>128 câu ABCD và 21 câu Đúng/Sai, luyện chọn đúng mới được qua câu tiếp theo. Có xáo trộn đề trước khi bắt đầu.</p>${btn('Vào ôn Lịch sử','history-intro','btn green')}</article><article class="card subject"><span class="emoji">⚛️</span><h2>Vật lí 12</h2><p>2 đề Vật lí nhiệt mức nâng cao. Mỗi đề 45 phút, đủ bốn phần, nộp một lần rồi xem điểm và giải thích.</p>${btn('Chọn đề Vật lí','physics-list')}</article></div><div class="card"><div class="section-head"><h2>Thi đua & tiến bộ</h2><span class="badge-local">Lưu trên thiết bị</span></div><p class="muted">Nhập biệt danh để ghi thành tích. Bảng xếp hạng hiển thị các lượt làm trên trình duyệt hiện tại; muốn mọi người xem chung trên các thiết bị khác nhau cần kết nối dịch vụ lưu điểm trực tuyến.</p>${btn('Xem bảng xếp hạng','leaderboard','btn outline')}</div>`)}
function physicsList(){const resume=state.exam&&!state.exam.submitted;screen(`<div class="section-head"><div><div class="eyebrow" style="color:#2874bb">VẬT LÍ 12 · GIỮA KÌ I</div><h1 class="big-name">Đề luyện tư duy nhiệt học</h1><p class="muted">Theo ma trận trường: 40% nhận biết · 30% thông hiểu · 30% vận dụng (tương đối).</p></div>${btn('Trang chủ','home','btn outline')}</div><div class="notice">Mỗi đề: 12 câu ABCD (3đ) + 2 câu Đ/S (2đ) + 4 câu trả lời ngắn (2đ) + 2 bài tự luận (3đ). Tự luận được kiểm tra phần kết quả số; điểm hệ thống là <b>điểm tự động tham khảo</b>, chưa thay thế việc giáo viên chấm trình bày.</div><div class="exam-grid" style="margin-top:20px">${DATA.physics.map((e,i)=>`<article class="card"><span class="pill">ĐỀ ${i+1}</span><h2>${esc(e.title)}</h2><p class="muted">${esc(e.desc)}</p><div class="stats"><div class="stat"><strong>45</strong><small>phút</small></div><div class="stat"><strong>4</strong><small>phần</small></div><div class="stat"><strong>20</strong><small>câu</small></div><div class="stat"><strong>10</strong><small>điểm</small></div></div>${btn('Chuẩn bị làm đề','prepare-'+i)}</article>`).join('')}</div>${resume?`<div class="card"><p>Em có một đề đang làm, có thể tiếp tục tại câu đã chọn.</p>${btn('Tiếp tục bài đang làm','physics-exam','btn green')}</div>`:''}`)}
function examIntro(idx){const ex=DATA.physics[idx];if(!ex)return physicsList();screen(`<div class="card" style="max-width:700px;margin:auto"><span class="pill">CHUẨN BỊ THI</span><h1>${esc(ex.title)}</h1><p class="muted">${esc(ex.desc)}</p><div class="stats"><div class="stat"><strong>12</strong><small>ABCD</small></div><div class="stat"><strong>8</strong><small>ý Đ/S</small></div><div class="stat"><strong>4</strong><small>TL ngắn</small></div><div class="stat"><strong>2</strong><small>Tự luận</small></div></div><div class="form-row"><label class="label" for="nickname">Tên hiển thị / biệt danh (không cần tên thật)</label><input id="nickname" type="text" maxlength="24" autocomplete="nickname" placeholder="Ví dụ: Vật Lí 10 điểm" value="${esc(state.alias||'')}"></div><div class="notice">Thời gian làm bài <b>45 phút</b>. Chọn đáp án cho tất cả các phần rồi bấm Nộp bài một lần. Khi hết giờ, hệ thống tự nộp phần đã làm. Tự luận có phần ghi cách giải để giáo viên kiểm tra và các ô kết quả số để chấm tự động.</div><div class="stack" style="margin-top:20px">${btn('Bắt đầu 45 phút','start-physics-'+idx)}${btn('Quay lại','physics-list','btn outline')}</div></div>`)}
function startPhysics(idx){const nick=document.querySelector('#nickname')?.value.trim();if(!nick||nick.length<2){toast('Hãy nhập biệt danh từ 2 ký tự trước khi bắt đầu.');return};state.alias=nick;state.exam={idx,startedAt:Date.now(),deadline:Date.now()+45*60*1000,answers:{},submitted:false,tab:0,nick};setPage('physics-exam')}
function getE(){return DATA.physics[state.exam.idx]}
function elapsedSeconds(e){return Math.min(2700,Math.round((Date.now()-e.startedAt)/1000))}
function timeLeft(e){return Math.max(0,Math.ceil((e.deadline-Date.now())/1000))}
function countPhysics(e){const x=e.answers;let n=0;for(let i=0;i<12;i++)if(x['m'+i])n++;for(let i=0;i<2;i++)for(let j=0;j<4;j++)if(x[`t${i}_${j}`]!==undefined)n++;for(let i=0;i<4;i++)if(String(x['s'+i]??'').trim())n++;for(let i=0;i<2;i++) {if(String(x['essay'+i]??'').trim())n++;for(let j=0;j<2;j++)if(String(x[`e${i}_${j}`]??'').trim())n++}return n;}
function physicsExam(){const a=state.exam;if(!a||a.submitted)return physicsList();if(timeLeft(a)===0){submitPhysics(true);return}const e=getE();const tabs=['I · ABCD','II · Đúng/Sai','III · Trả lời ngắn','IV · Tự luận'];const tab=a.tab??0;let inner='';
if(tab===0)inner=e.mc.map((q,i)=>`<div class="question"><div class="qhead">Câu ${i+1}. ${esc(q.q)}</div>${q.options.map((v,j)=>`<label class="option"><input type="radio" name="m${i}" data-field="m${i}" value="${'ABCD'[j]}" ${a.answers['m'+i]==='ABCD'[j]?'checked':''}><b>${'ABCD'[j]}.</b><span>${esc(v)}</span></label>`).join('')}</div>`).join('');
if(tab===1)inner=e.tf.map((q,i)=>`<div class="question"><div class="qhead">Câu ${i+1}. Xét từng nhận định</div><div class="passage">${fmt(q.passage)}</div>${q.claims.map((c,j)=>`<div class="claim"><div><b>${'abcd'[j]})</b> ${esc(c.t)}</div><div class="stack">${['true','false'].map((v)=>`<label class="option"><input type="radio" name="t${i}_${j}" data-field="t${i}_${j}" value="${v}" ${a.answers[`t${i}_${j}`]===v?'checked':''}><span>${v==='true'?'Đúng':'Sai'}</span></label>`).join('')}</div></div>`).join('')}</div>`).join('');
if(tab===2)inner=e.short.map((q,i)=>`<div class="question"><div class="qhead">Câu ${i+1}. ${esc(q.q)}</div><div class="stack"><input type="text" class="number-input" data-field="s${i}" value="${esc(a.answers['s'+i]??'')}" inputmode="decimal" placeholder="Nhập kết quả số"><b>${esc(q.unit)}</b></div><p class="section-note">Chỉ nhập số, có thể dùng dấu phẩy hoặc dấu chấm thập phân.</p></div>`).join('');
if(tab===3)inner=e.essay.map((q,i)=>`<div class="question"><h3>Tự luận ${i+1} · ${esc(q.title)}</h3><div class="passage">${esc(q.prompt)}</div><label class="label">Trình bày các bước giải</label><textarea data-field="essay${i}" placeholder="Nêu công thức, đổi đơn vị, lập phương trình...">${esc(a.answers['essay'+i]??'')}</textarea>${q.parts.map((p,j)=>`<div class="form-row"><label class="label">${'ab'[j]}) ${esc(p.q)}</label><div class="stack"><input class="number-input" type="text" inputmode="decimal" placeholder="Kết quả số" data-field="e${i}_${j}" value="${esc(a.answers[`e${i}_${j}`]??'')}"><b>${esc(p.unit)}</b></div></div>`).join('')}</div>`).join('');
const left=timeLeft(a), percentage=Math.round((2700-left)/2700*100);screen(`<div class="section-head"><div><div class="eyebrow" style="color:#3366ac">ĐANG LÀM BÀI · ${esc(a.nick)}</div><h1 class="big-name">${esc(e.title)}</h1></div><span class="pill">45 PHÚT</span></div><div class="layout"><div><div class="navtabs">${tabs.map((s,i)=>`<button class="tab ${tab===i?'active':''}" data-action="exam-tab-${i}">${s}</button>`).join('')}</div><div class="card" id="physics-panel"><div class="section-head"><h2>${tabs[tab]}</h2><span class="pill">${tab===0?'3 điểm':tab===1?'2 điểm':tab===2?'2 điểm':'3 điểm'}</span></div>${inner}</div><div class="stack" style="justify-content:space-between"><button class="btn outline" data-action="exam-tab-${Math.max(0,tab-1)}" ${tab===0?'disabled':''}>← Phần trước</button><button class="btn primary" data-action="${tab===3?'submit-physics':'exam-tab-'+(tab+1)}">${tab===3?'Nộp bài →':'Phần tiếp →'}</button></div></div><aside class="card sticky"><div class="muted mini">THỜI GIAN CÒN LẠI</div><div class="timer ${left<300?'warn':''}" id="countdown">${niceTime(left)}</div><div class="track"><div id="timebar" class="fill ${left<300?'danger':''}" style="width:${percentage}%"></div></div><div class="section-head"><b>Tiến độ</b><b id="filledCount">${countPhysics(a)}/30</b></div><div class="track"><div id="answerbar" class="fill" style="width:${countPhysics(a)/30*100}%"></div></div><p class="muted mini">Làm đủ 12 câu ABCD, 8 ý đúng/sai, 4 câu trả lời ngắn, 4 kết quả tự luận và 2 bài trình bày.</p><button class="btn green" style="width:100%" data-action="submit-physics">Nộp bài thi</button><p class="section-note">Nộp xong mới chấm và xem giải thích. Đề sẽ tự nộp khi hết giờ.</p></aside></div>`);updateTimer()}
function updateTimer(){if(ticker)clearInterval(ticker);if(state.page!=='physics-exam')return;ticker=setInterval(()=>{if(state.page!=='physics-exam'){clearInterval(ticker);return}let e=state.exam;let left=timeLeft(e);let x=document.querySelector('#countdown');if(x){x.textContent=niceTime(left);x.classList.toggle('warn',left<300)}let b=document.querySelector('#timebar');if(b){b.style.width=(100-left/2700*100)+'%';b.classList.toggle('danger',left<300)}if(left===0){clearInterval(ticker);submitPhysics(true)}},1000)}
function scorePhysics(exam){const e=DATA.physics[exam.idx],a=exam.answers;let sect=[0,0,0,0],detail=[];
e.mc.forEach((q,i)=>{const right=a['m'+i]===q.key;if(right)sect[0]+=.25;detail.push({section:1,i:i+1,correct:right,expected:q.key,got:a['m'+i]||'—',text:q.q})});
e.tf.forEach((q,i)=>q.claims.forEach((c,j)=>{const val=a[`t${i}_${j}`],right=val===(c.key?'true':'false');if(right)sect[1]+=.25;detail.push({section:2,i:`${i+1}${'abcd'[j]}`,correct:right,expected:c.key?'Đúng':'Sai',got:val===undefined?'—':val==='true'?'Đúng':'Sai',text:c.t})}));
e.short.forEach((q,i)=>{const right=within(parseNumeric(a['s'+i]),q);if(right)sect[2]+=.5;detail.push({section:3,i:i+1,correct:right,expected:String(q.key)+' '+q.unit,got:a['s'+i]||'—',text:q.q})});
e.essay.forEach((q,i)=>q.parts.forEach((p,j)=>{const right=within(parseNumeric(a[`e${i}_${j}`]),p);if(right)sect[3]+=.75;detail.push({section:4,i:`${i+1}${'ab'[j]}`,correct:right,expected:String(p.key)+' '+p.unit,got:a[`e${i}_${j}`]||'—',text:p.q})}));
const total=Math.round(sect.reduce((x,y)=>x+y,0)*100)/100;return {total,sect,detail}}
function submitPhysics(forced=false){if(state.page!=='physics-exam')return;let a=state.exam;if(!a||a.submitted)return;const filled=countPhysics(a);if(!forced && filled<30 && !confirm(`Em còn ${30-filled} mục chưa nhập. Em có chắc muốn nộp bài không?`))return;if(!forced && !confirm('Nộp bài ngay? Sau khi nộp sẽ không sửa được đáp án.'))return;
const score=scorePhysics(a);a.submitted=true;a.duration=elapsedSeconds(a);a.finishedAt=Date.now();a.score=score;const record={id:cryptoRandom(),nick:a.nick,subject:'Vật lí',exam:'Đề '+(a.idx+1),examId:'VL'+(a.idx+1),score:score.total,duration:a.duration,at:new Date().toISOString(),provisional:true};save(HISTORYKEY,[record,...allLocal()].slice(0,100));persist();postOnline(record);setPage('physics-result');if(score.total>=9.995)setTimeout(celebrate,300)}
function cryptoRandom(){return 'r'+Date.now()+'-'+Math.floor(Math.random()*1e8)}
function physicsResult(){const a=state.exam;if(!a||!a.submitted)return physicsList();let s=a.score,e=getE();let misses=s.detail.filter(x=>!x.correct);screen(`<div class="hero"><div class="eyebrow">HOÀN THÀNH BÀI THI · ${esc(a.nick)}</div><h1>${s.total===10?'🌟 CHÚC MỪNG ĐIỂM 10!':'Đã có kết quả của em!'}</h1><p>${esc(e.title)} · ${niceTime(a.duration)} · Điểm tự động tham khảo</p></div><div class="card" style="margin-top:22px"><div class="results"><div class="score-bubble"><strong>${s.total.toFixed(2).replace(/\.00$/,'')}</strong><span>/ 10 điểm</span></div><div><h2>Phân tích từng phần</h2><div class="stats"><div class="stat"><strong>${s.sect[0].toFixed(2)}</strong><small>ABCD / 3</small></div><div class="stat"><strong>${s.sect[1].toFixed(2)}</strong><small>Đ/S / 2</small></div><div class="stat"><strong>${s.sect[2].toFixed(2)}</strong><small>TLN / 2</small></div><div class="stat"><strong>${s.sect[3].toFixed(2)}</strong><small>Tự luận / 3</small></div></div><p class="muted">Có ${misses.length} mục sai hoặc chưa trả lời trong các phần chấm bằng máy. Bảng dưới có thể xem lời giải để ôn lại.</p></div></div><div class="notice">Điểm phần tự luận chỉ kiểm tra <b>đáp số</b> theo mức sai số cho phép. Cách lập luận và lời giải viết tay chưa được máy đánh giá; giáo viên cần kiểm tra trước khi công nhận điểm chính thức, kể cả trường hợp hệ thống báo 10/10.</div><div class="stack" style="margin-top:20px">${btn('Xem xếp hạng','leaderboard')}${btn('Làm đề khác','physics-list','btn outline')}${btn('Về trang chủ','home','btn outline')}</div></div><div class="card" style="margin-top:18px"><div class="section-head"><h2>Đáp án & giải thích</h2><span class="pill">SAU KHI NỘP</span></div>${s.detail.map(d=>`<div class="question"><div class="qhead">Phần ${d.section} · Câu ${esc(d.i)} <span class="${d.correct?'correct':'wrong'}">${d.correct?'✓ Đúng':'✕ Chưa đúng'}</span></div><div class="muted mini">${esc(d.text)}</div><div class="qfeedback">Đáp án của em: <b>${esc(d.got)}</b> · Đáp án đúng: <b>${esc(d.expected)}</b></div></div>`).join('')}<h3>Hướng dẫn giải tự luận</h3>${e.essay.map((q,i)=>`<div class="passage"><b>${esc(q.title)}</b><br>${esc(q.solution)}<br><b>Phần em trình bày:</b><br>${fmt(a.answers['essay'+i]||'(Chưa trình bày)')}</div>`).join('')}</div>`)}
function historyIntro(){let r=state.hist&&!state.hist.finished?state.hist:null;screen(`<div class="hero"><div class="eyebrow">LỊCH SỬ 12 · NĂM BÀI</div><h1>Học đến khi đúng.<br>Ghi nhớ từng câu.</h1><p>128 câu ABCD và 21 nhóm Đúng/Sai. Chọn sai phải thử lại, chọn đúng mới chuyển câu. Trước khi bắt đầu em có thể xáo trộn thứ tự câu hỏi.</p></div><div class="card" style="margin-top:22px"><div class="section-head"><h2>Chuẩn bị luyện</h2><span class="pill">KHÔNG GIỚI HẠN GIỜ</span></div><div class="form-row"><label class="label" for="histnick">Biệt danh</label><input id="histnick" maxlength="24" value="${esc(state.alias||'')}" placeholder="Nhập biệt danh"></div><div class="stack"><button class="btn outline" data-action="shuffle-history">🔀 Xáo trộn thứ tự đề</button><button class="btn green" data-action="start-history">Bắt đầu ôn tập</button></div><div id="shuffle-message" class="section-note">Thứ tự câu sẽ được giữ cố định sau khi bắt đầu.</div>${r?`<div class="notice" style="margin-top:18px">Đang có bài Lịch sử chưa hoàn thành, đã qua ${r.mcPos+r.tfPos}/149 nhóm câu.${btn('Tiếp tục lượt cũ','history-run','btn outline')}</div>`:''}</div>`)}
function startHistory(){const name=document.querySelector('#histnick')?.value.trim();if(!name||name.length<2){toast('Hãy nhập biệt danh trước khi luyện.');return}if(state.hist&&!state.hist.finished&&!confirm('Bắt đầu lượt mới sẽ thay thế lượt Lịch sử đang làm. Tiếp tục?'))return;const mix=state.historyOrder || {mc:shuffle(Array.from({length:128},(_,i)=>i)),tf:shuffle(Array.from({length:21},(_,i)=>i))};state.alias=name;state.hist={nick:name,order:mix,mcPos:0,tfPos:0,tries:{},seen:{},firstRight:0,startedAt:Date.now(),finished:false};setPage('history-run')}
function historyCurrent(){const h=state.hist;if(h.mcPos<128)return {type:'mc',item:DATA.history.mc[h.order.mc[h.mcPos]],idx:h.order.mc[h.mcPos],pos:h.mcPos};if(h.tfPos<21)return {type:'tf',item:DATA.history.tf[h.order.tf[h.tfPos]],idx:h.order.tf[h.tfPos],pos:h.tfPos};return null}
function historyRun(){const h=state.hist;if(!h)return historyIntro();if(h.finished)return historyResult();const c=historyCurrent();if(!c){finishHistory();return}const part=c.type==='mc'?'I · ABCD':'II · Đúng/Sai';const currentIndex=c.type==='mc'?h.mcPos+1:h.tfPos+1;const prefix=c.type==='mc'?'m'+c.idx:'t'+c.idx;let inner='';if(c.type==='mc')inner=`<h2>Câu ${currentIndex} / 128</h2><div class="qhead">${esc(c.item.q)}</div>${c.item.options.map((o,j)=>`<button class="option" style="width:100%;text-align:left;background:white;color:#15233a" data-action="histpick-${'ABCD'[j]}" ${h.seen[prefix]?'disabled':''}><b>${'ABCD'[j]}.</b><span>${esc(o)}</span></button>`).join('')}`;
else {const cl=c.item.claims;inner=`<h2>Câu ${currentIndex} / 21</h2><div class="passage">${fmt(c.item.passage)}</div>${cl.map((x,j)=>{const p=prefix+'_'+j;return `<div class="claim"><p><b>${'abcd'[j]})</b> ${esc(x.t)}</p>${h.seen[p]?'<span class="correct">✓ Đã trả lời đúng</span>':`<div class="stack"><button class="btn small outline" data-action="histtf-${j}-true">Đúng</button><button class="btn small outline" data-action="histtf-${j}-false">Sai</button></div>`}</div>`}).join('')}`}
const canNext=c.type==='mc'?!!h.seen[prefix]:c.item.claims.every((_,j)=>h.seen[prefix+'_'+j]);screen(`<div class="section-head"><div><div class="eyebrow" style="color:#306db7">LỊCH SỬ · ${esc(h.nick)}</div><h1 class="big-name">${part}</h1></div><span class="pill">CHỌN ĐÚNG MỚI QUA</span></div><div class="layout"><div class="card">${inner}<div class="stack" style="margin-top:18px">${btn('Câu tiếp theo →','next-history','btn green')}<button class="btn outline" data-action="home">Về trang chủ (lưu tiến độ)</button></div><p id="histfeedback" class="section-note">${canNext?'Em đã hoàn thành câu này. Hãy chuyển sang câu tiếp theo.':'Chọn đáp án đúng để mở khóa câu tiếp theo.'}</p></div><aside class="card sticky"><div class="muted mini">TIẾN ĐỘ CHUNG</div><div class="timer">${h.mcPos+h.tfPos}/149</div><div class="track"><div class="fill" style="width:${100*(h.mcPos+h.tfPos)/149}%"></div></div><p class="muted mini">Đúng ở lần thử đầu: <b>${h.firstRight}</b> / 212 ý</p><p class="muted mini">Sai sẽ phải thử lại; tiến độ lưu tại trình duyệt này.</p></aside></div>`);const next=root.querySelector('[data-action="next-history"]');if(next)next.disabled=!canNext;}
function histPick(letter){const h=state.hist,c=historyCurrent();if(!h||!c||c.type!=='mc')return;let k='m'+c.idx;if(h.seen[k])return;let tries=h.tries[k]||0;if(c.item.key===letter){h.seen[k]=true;if(tries===0)h.firstRight++;persist();historyRun();toast('Chính xác! Có thể chuyển câu.')}else{h.tries[k]=tries+1;persist();toast('Chưa đúng, hãy chọn lại câu này.')}}
function histTF(j,val){const h=state.hist,c=historyCurrent();if(!h||!c||c.type!=='tf')return;const k='t'+c.idx+'_'+j;if(h.seen[k])return;let tries=h.tries[k]||0;if(c.item.claims[j].key===(val==='true')){h.seen[k]=true;if(tries===0)h.firstRight++;persist();historyRun();toast('Đúng rồi!')}else{h.tries[k]=tries+1;persist();toast('Chưa chính xác, hãy thử lại ý này.')}}
function nextHistory(){const h=state.hist,c=historyCurrent();if(!h||!c)return;const done=c.type==='mc'?h.seen['m'+c.idx]:c.item.claims.every((_,j)=>h.seen['t'+c.idx+'_'+j]);if(!done){toast('Em cần trả lời đúng trước khi chuyển câu.');return}if(c.type==='mc')h.mcPos++;else h.tfPos++;persist();if(h.mcPos===128&&h.tfPos===21)finishHistory();else historyRun()}
function finishHistory(){let h=state.hist;if(!h||h.finished)return;h.finished=true;h.duration=Math.round((Date.now()-h.startedAt)/1000);h.score=Math.round(h.firstRight/212*1000)/100;const r={id:cryptoRandom(),nick:h.nick,subject:'Lịch sử',exam:'Tổng hợp 5 bài',examId:'LS5',score:h.score,duration:h.duration,at:new Date().toISOString(),provisional:false};save(HISTORYKEY,[r,...allLocal()].slice(0,100));persist();postOnline(r);setPage('history-result');if(h.score>=9.995)setTimeout(celebrate,300)}
function historyResult(){const h=state.hist;if(!h?.finished)return historyIntro();screen(`<div class="hero"><div class="eyebrow">HOÀN THÀNH 5 BÀI LỊCH SỬ</div><h1>${h.score===10?'🌟 10 ĐIỂM! TUYỆT VỜI!':'Chúc mừng em đã hoàn thành!'}</h1><p>Đã luyện đủ 128 câu ABCD và 84 nhận định Đúng/Sai.</p></div><div class="card" style="margin-top:20px"><div class="results"><div class="score-bubble"><strong>${h.score.toFixed(2)}</strong><span>/ 10</span></div><div><h2>${esc(h.nick)}</h2><p>Đúng lần đầu <b>${h.firstRight}/212</b> lựa chọn.</p><p>Thời gian: <b>${niceTime(h.duration)}</b></p><p class="muted">Điểm phản ánh lần chọn đầu, dù em đã được luyện đến khi đúng.</p></div></div><div class="stack">${btn('Xem xếp hạng','leaderboard')}${btn('Luyện lượt khác','history-intro','btn outline')}${btn('Trang chủ','home','btn outline')}</div></div>`)}
async function postOnline(r){if(!ONLINE.url||!ONLINE.anonKey)return;try{let payload={nickname:r.nick,subject:r.subject,exam_id:r.examId,score:r.score,duration_seconds:r.duration,created_at:r.at};let resp=await fetch(ONLINE.url.replace(/\/$/,'')+'/rest/v1/attempts',{method:'POST',headers:{'apikey':ONLINE.anonKey,'Authorization':'Bearer '+ONLINE.anonKey,'Content-Type':'application/json','Prefer':'return=minimal'},body:JSON.stringify(payload)});if(!resp.ok)throw new Error(await resp.text())}catch(e){console.warn('Không đồng bộ được bảng xếp hạng',e)}}
async function getOnline(){if(!ONLINE.url||!ONLINE.anonKey)return [];try{let rsp=await fetch(ONLINE.url.replace(/\/$/,'')+'/rest/v1/attempts?select=nickname,subject,exam_id,score,duration_seconds,created_at&order=score.desc,duration_seconds.asc&limit=100',{headers:{apikey:ONLINE.anonKey,Authorization:'Bearer '+ONLINE.anonKey}});if(!rsp.ok)throw new Error('Network');return (await rsp.json()).map(r=>({nick:r.nickname,subject:r.subject,examId:r.exam_id,exam:r.exam_id==='LS5'?'Tổng hợp 5 bài':r.exam_id.replace('VL','Đề '),score:r.score,duration:r.duration_seconds,at:r.created_at,remote:true}))}catch(e){return []}}
function leaderboard(){const shared=Boolean(ONLINE.url&&ONLINE.anonKey);let local=allLocal();screen(`<div class="section-head"><div><div class="eyebrow" style="color:#2e73a7">HỘI BẠN CÙNG ÔN THI</div><h1 class="big-name">🏆 Bảng xếp hạng</h1><p class="muted">Thành tích theo điểm số cao nhất; hòa điểm thì xếp theo thời gian làm bài ngắn hơn.</p></div>${btn('Trang chủ','home','btn outline')}</div><div class="notice">${shared?'Đang bật kết nối lưu điểm trực tuyến. Thầy khuyên chỉ sử dụng biệt danh.':'<b>Chế độ hiện tại: xếp hạng trên thiết bị này.</b> Muốn điểm của mọi bạn cùng xuất hiện trên một bảng, chủ website cần kết nối Supabase theo file HƯỚNG_DẪN.md. Chia sẻ đường link website thôi chưa đồng bộ điểm giữa các điện thoại.'} Bảng xếp hạng mang tính khích lệ, không chống được việc sửa điểm bằng công cụ trình duyệt.</div><div class="card" style="margin-top:20px"><div class="stack"><button class="btn small" data-action="filter-all">Tất cả</button><button class="btn small outline" data-action="filter-VL1">Vật lí · Đề 1</button><button class="btn small outline" data-action="filter-VL2">Vật lí · Đề 2</button><button class="btn small outline" data-action="filter-LS5">Lịch sử · 5 bài</button></div><div id="leader-table" style="margin-top:18px"></div></div>`);state.rankFilter='all';paintBoard(local);if(shared)getOnline().then(rows=>{if(state.page==='leaderboard')paintBoard(rows.length?rows:allLocal(),rows.length?'online':'local')})}
let boardData=null;
function paintBoard(rows,src='local'){boardData=rows;const dom=document.querySelector('#leader-table');if(!dom)return;let filter=state.rankFilter||'all';let arr=rows.filter(r=>filter==='all'||r.examId===filter).sort((a,b)=>b.score-a.score||a.duration-b.duration).slice(0,50);dom.innerHTML=`<p class="muted mini">${src==='online'?'☁️ Kết quả được đồng bộ trực tuyến':'💻 Kết quả lưu trên trình duyệt này'} · ${arr.length} lượt</p>${arr.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Hạng</th><th>Biệt danh</th><th>Môn / đề</th><th>Điểm</th><th>Thời gian</th><th>Ngày</th></tr></thead><tbody>${arr.map((r,i)=>`<tr class="${i===0?'rankyou':''}"><td>${i===0?'🥇':i===1?'🥈':i===2?'🥉':'#'+(i+1)}</td><td><b>${esc(r.nick)}</b></td><td>${esc(r.subject)} · ${esc(r.exam)}</td><td><b>${Number(r.score).toFixed(2)}</b>${r.provisional?'*':''}</td><td>${niceTime(r.duration)}</td><td>${niceDate(r.at)}</td></tr>`).join('')}</tbody></table></div><p class="mini muted">* Vật lí: điểm tự động tham khảo; tự luận cần kiểm tra cách trình bày.</p>`:'<p class="center muted" style="padding:40px 0">Chưa có bài làm nào. Hãy hoàn thành một đề để xuất hiện trên bảng!</p>'}`}
function celebrate(){const canvas=document.querySelector('#confetti');if(!canvas)return;const ctx=canvas.getContext('2d');canvas.width=innerWidth;canvas.height=innerHeight;let pieces=Array.from({length:220},()=>({x:Math.random()*canvas.width,y:-Math.random()*canvas.height,vx:(Math.random()-.5)*4,vy:2+Math.random()*5,rot:Math.random()*6.28,sz:4+Math.random()*8,color:['#f4bf4d','#35c4b3','#e94c89','#7795ff','#a47bec'][Math.floor(Math.random()*5)]}));let start=performance.now();function frame(t){ctx.clearRect(0,0,canvas.width,canvas.height);pieces.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.rot+=.08;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.color;ctx.fillRect(-p.sz/2,-p.sz/2,p.sz,p.sz*.55);ctx.restore()});if(t-start<4400)confettiFrame=requestAnimationFrame(frame);else ctx.clearRect(0,0,canvas.width,canvas.height)}confettiFrame=requestAnimationFrame(frame);try{let ac=new (window.AudioContext||window.webkitAudioContext)();const notes=[523,659,784,1047,784,1047];notes.forEach((f,i)=>{const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=f;o.connect(g);g.connect(ac.destination);let at=ac.currentTime+i*.15;g.gain.setValueAtTime(.0001,at);g.gain.exponentialRampToValueAtTime(.085,at+.03);g.gain.exponentialRampToValueAtTime(.0001,at+.2);o.start(at);o.stop(at+.22)})}catch(e){} }
function render(){if(ticker)clearInterval(ticker);if(state.page==='home')home();else if(state.page==='physics-list')physicsList();else if(state.page==='physics-exam')physicsExam();else if(state.page==='physics-result')physicsResult();else if(state.page==='history-intro')historyIntro();else if(state.page==='history-run')historyRun();else if(state.page==='history-result')historyResult();else if(state.page==='leaderboard')leaderboard();else home()}
document.addEventListener('click',e=>{const el=e.target.closest('[data-action]');if(!el)return;const ac=el.dataset.action;if(ac==='home'||ac==='leaderboard'||ac==='physics-list'||ac==='history-intro'||ac==='physics-exam'||ac==='history-run'){setPage(ac);return}if(ac.startsWith('prepare-')){examIntro(Number(ac.split('-')[1]));return}if(ac.startsWith('start-physics-')){startPhysics(Number(ac.split('-')[2]));return}if(ac.startsWith('exam-tab-')){state.exam.tab=Number(ac.split('-')[2]);persist();physicsExam();return}if(ac==='submit-physics'){submitPhysics();return}if(ac==='shuffle-history'){state.historyOrder={mc:shuffle(Array.from({length:128},(_,i)=>i)),tf:shuffle(Array.from({length:21},(_,i)=>i))};persist();let x=document.querySelector('#shuffle-message');if(x)x.textContent='✓ Đã xáo trộn! Thứ tự mới sẽ dùng khi em bắt đầu.';toast('Đề Lịch sử đã được xáo trộn.');return}if(ac==='start-history'){startHistory();return}if(ac.startsWith('histpick-')){histPick(ac.slice(9));return}if(ac.startsWith('histtf-')){const parts=ac.split('-');histTF(Number(parts[1]),parts[2]);return}if(ac==='next-history'){nextHistory();return}if(ac.startsWith('filter-')){state.rankFilter=ac.slice(7);paintBoard(boardData||allLocal(),ONLINE.url&&ONLINE.anonKey?'online':'local');return}})
document.addEventListener('input',e=>{const field=e.target.dataset.field;if(field&&state.page==='physics-exam'){state.exam.answers[field]=e.target.value;persist();let n=countPhysics(state.exam);let x=document.querySelector('#filledCount');if(x)x.textContent=n+'/30';let b=document.querySelector('#answerbar');if(b)b.style.width=n/30*100+'%'}});
document.addEventListener('change',e=>{const field=e.target.dataset.field;if(field&&state.page==='physics-exam'){state.exam.answers[field]=e.target.value;persist();let n=countPhysics(state.exam);let x=document.querySelector('#filledCount');if(x)x.textContent=n+'/30';let b=document.querySelector('#answerbar');if(b)b.style.width=n/30*100+'%'}});
window.addEventListener('beforeunload',()=>persist());
render();
</script></body></html>
