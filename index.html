 U > U_mở (≈ 0,6 V với Diode Silic), còn nhánh ngược I_ng ≈ 0."},{"q":"Trong thí nghiệm khảo sát đường đặc trưng I - U của Diode (Hình 4.4 và 4.5 SGK), điện trở R_0 = 10 Ω mắc nối tiếp với Diode có vai trò gì?","options":["Hạn chế cường độ dòng điện cực đại để bảo vệ Diode không bị cháy hỏng.","Tăng hiệu điện thế của nguồn điện một chiều từ 7 V lên 14 V.","Biến đổi dòng điện một chiều thành dòng điện xoay chiều.","Làm phẳng độ gợn sóng của dòng điện xoay chiều."],"key":"A","explain":"Khi phân cực thuận vượt ngưỡng 0,6 V, dòng qua Diode tăng rất nhanh nên cần mắc nối tiếp R_0 = 10 Ω để hạn dòng bảo vệ Diode."},{"q":"Trong mạch chỉnh lưu nửa chu kì sử dụng 1 Diode bán dẫn, dạng điện áp đầu ra u_R trên tải tiêu thụ R có đặc điểm gì?","options":["Chỉ giữ lại các nửa chu kì dương, các nửa chu kì âm bị chặn (u_R = 0).","Các nửa chu kì âm được lật ngược lên thành nửa chu kì dương liên tiếp.","Giữ nguyên cả nửa chu kì dương và nửa chu kì âm như nguồn xoay chiều.","Là điện áp một chiều phẳng tuyệt đối không có gợn sóng."],"key":"A","explain":"Mạch chỉnh lưu 1 Diode chỉ cho dòng đi qua ở nửa chu kì dương và khóa hoàn toàn ở nửa chu kì âm nên dòng điện ra bị ngắt quãng."},{"q":"Trong mạch cầu chỉnh lưu cả chu kì gồm 4 Diode (D_1, D_2, D_3, D_4), ở mỗi nửa chu kì của điện áp xoay chiều đầu vào có mấy Diode cùng dẫn điện?","options":["Có 2 Diode đối diện nhau cùng phân cực thuận và dẫn điện.","Chỉ có duy nhất 1 Diode dẫn điện.","Cả 4 Diode cùng dẫn điện đồng thời.","Có 3 Diode dẫn điện và 1 Diode khóa."],"key":"A","explain":"Nửa chu kì đầu cặp D_1 và D_3 phân cực thuận dẫn điện; nửa chu kì sau cặp D_2 và D_4 phân cực thuận dẫn điện."},{"q":"Nếu điện áp xoay chiều đầu vào có tần số f = 50 Hz thì sau khi đi qua mạch cầu chỉnh lưu 4 Diode (chỉnh lưu cả chu kì), tần số nhấp nháy f' của xung một chiều đầu ra trên tải R là:","options":["100 Hz.","50 Hz.","25 Hz.","200 Hz."],"key":"A","explain":"Trong 1 chu kì của dòng xoay chiều đầu vào (T = 0,02 s), mạch cầu tạo ra 2 đỉnh xung dương giống nhau trên tải R nên f' = 2f = 100 Hz."},{"q":"Để làm phẳng điện áp một chiều nhấp nháy ở đầu ra của mạch chỉnh lưu trong các bộ sạc điện thoại (Adapter), người ta mắc thêm linh kiện nào?","options":["Tụ điện có điện dung C lớn mắc song song với tải tiêu thụ R.","Điện trở có giá trị rất lớn mắc nối tiếp với tải tiêu thụ R.","Một bóng đèn sợi đốt mắc nối tiếp với nguồn xoay chiều.","Một công tắc cơ học đóng ngắt bằng tay."],"key":"A","explain":"Tụ điện C mắc song song với tải R sẽ nạp điện khi điện áp xung tăng lên đỉnh và phóng điện nuôi tải R khi điện áp xung giảm xuống."}],"tf":[{"passage":"Cho mạch chỉnh lưu dòng điện xoay chiều biến đổi điện áp xoay chiều u = U_0 cos(100πt) (V) thành điện áp một chiều cấp cho điện trở tải R. Xét tính đúng/sai của các nhận định sau:","claims":[{"t":"Tần số của dòng điện xoay chiều đầu vào là f = 50 Hz.","key":true},{"t":"Nếu dùng mạch chỉnh lưu nửa chu kì (1 Diode), trong mỗi nửa chu kì âm dòng điện qua tải R có chiều ngược lại so với nửa chu kì dương.","key":false},{"t":"Nếu dùng mạch cầu 4 Diode (chỉnh lưu cả chu kì), dòng điện chạy qua tải R trong cả hai nửa chu kì luôn giữ nguyên một chiều duy nhất.","key":true},{"t":"Tần số xung một chiều nhấp nháy sau mạch cầu 4 Diode là f' = 100 Hz, gấp đôi tần số của mạch chỉnh lưu nửa chu kì.","key":true}]},{"passage":"Một nhóm học sinh tiến hành thí nghiệm khảo sát đường đặc trưng Vôn - Ampe của Diode bán dẫn Silic (điện áp mở khoảng 0,6 V) với nguồn một chiều U_v = 7 V, điện trở bảo vệ R_0 = 10 Ω và biến trở R.","claims":[{"t":"Khi mắc phân cực thuận và điều chỉnh U_thuận \u003c 0,4 V, cường độ dòng điện thuận qua Diode còn rất nhỏ.","key":true},{"t":"Khi U_thuận vượt qua ngưỡng 0,6 V - 0,7 V, cường độ dòng điện thuận I_th tăng vọt rất nhanh theo hàm mũ.","key":true},{"t":"Đường đặc trưng I - U của Diode bán dẫn là một đoạn thẳng tuyến tính tuân theo định luật Ohm ở mọi giá trị điện áp.","key":false},{"t":"Khi đảo chiều Diode sang mắc phân cực ngược từ 0 V đến -5 V, số chỉ của miliampe kế gần như bằng 0.","key":true}]}],"short":[{"q":"Đặt nguồn điện một chiều U = 6 V vào mạch gồm một Diode Silic (có điện áp ngưỡng khi dẫn là U_D = 0,6 V) mắc nối tiếp với điện trở bảo vệ R_0 = 27 Ω theo chiều phân cực thuận. Cường độ dòng điện I chạy trong mạch bằng bao nhiêu ampe (A)?","key":0.2,"unit":"A","tol":0.01,"hint":"U_R0 = U - U_D = 6 - 0,6 = 5,4 V => I = U_R0 / R_0 = 5,4 / 27 = 0,2 A."},{"q":"Điện áp xoay chiều đưa vào mạch cầu chỉnh lưu 4 Diode có biểu thức u = 12√2 cos(100πt) (V). Trong thời gian 1 giây, có bao nhiêu đỉnh xung dương xuất hiện ở điện áp đầu ra trên tải R?","key":100,"unit":"đỉnh xung","tol":0.1,"hint":"Tần số nguồn f = 50 Hz. Qua mạch cầu cả chu kì, tần số xung đầu ra là f' = 2f = 100 Hz, tức 100 đỉnh xung dương trong 1 giây."}],"essay":[{"title":"Bài toán mạch Diode và chỉnh lưu cả chu kì","prompt":"Một mạch điện một chiều gồm nguồn điện U = 7,0 V mắc nối tiếp với điện trở hạn dòng R_0 = 16 Ω và một Diode bán dẫn Silic đang phân cực thuận (điện áp rơi trên Diode khi dẫn là U_D = 0,6 V). Sau đó, người ta dùng 4 Diode cùng loại ghép thành mạch cầu chỉnh lưu điện áp xoay chiều có tần số f = 50 Hz.","parts":[{"q":"Tính cường độ dòng điện thuận I chạy qua điện trở R_0 trong mạch một chiều (đơn vị A).","key":0.4,"unit":"A","tol":0.01,"points":1.5},{"q":"Tính chu kì lặp lại T' của điện áp một chiều nhấp nháy ở đầu ra mạch cầu 4 Diode (đơn vị giây).","key":0.01,"unit":"s","tol":0.001,"points":1.5}],"solution":"1) Hiệu điện thế trên R_0: U_R0 = U - U_D = 7,0 - 0,6 = 6,4 V. Dòng điện thuận: I = 6,4 / 16 = 0,4 A.\n2) Tần số xung đầu ra mạch cầu: f' = 2f = 100 Hz => Chu kì lặp lại T' = 1 / f' = 1 / 100 = 0,01 s."}]},{"id":"CD-VL12-BAI5-MASTERY","pairGroupId":"CD-VL12-BAI5","subject":"physics","title":"Chuyên đề Vật lí 12 · Bài 5: Tia X (Đề 1 · Làm đúng qua câu)","description":"Đề 1 (Chế độ Luyện từng câu): Xuất hiện từng câu một, làm đúng mới được chuyển sang câu tiếp theo. Biên soạn sát nội dung Bài 5: Tia X & Chẩn đoán hình ảnh.","source":"Tự động tạo cặp 2 đề từ Bài thuyết trình Bài 5","mode":"mastery","minutes":0,"active":true,"draft":false,"verified":false,"sectionPoints":{"mc":6,"tf":4,"short":0,"essay":0},"mc":[{"q":"Phát biểu nào sau đây là đúng khi nói về bản chất và bước sóng của Tia X (Tia Rơn-ghen)?","options":["Là sóng điện từ có bước sóng cực ngắn từ 10^-11 m đến 10^-8 m.","Là dòng hạt electron chuyển động với tốc độ gần bằng tốc độ ánh sáng.","Là sóng cơ học siêu âm truyền được trong môi trường chân không.","Là bức xạ mang điện tích âm nên bị lệch mạnh trong điện trường và từ trường."],"key":"A","explain":"Tia X là sóng điện từ có bước sóng từ 10^-11 m đến 10^-8 m (0,01 nm đến 10 nm), không mang điện tích."},{"q":"Trên thang sóng điện từ, vùng Tia X nằm ngay giữa hai vùng bức xạ nào?","options":["Tia tử ngoại (UV) và Tia Gamma (γ).","Ánh sáng nhìn thấy và Tia tử ngoại (UV).","Tia hồng ngoại (IR) và Ánh sáng nhìn thấy.","Sóng vô tuyến và Tia hồng ngoại (IR)."],"key":"A","explain":"Theo chiều bước sóng ngắn dần: Sóng vô tuyến -> Hồng ngoại -> Ánh sáng khả kiến -> Tử ngoại -> Tia X -> Tia Gamma."},{"q":"Trong ống phát tia X (ống Coolidge), cơ chế chủ yếu tạo ra chùm tia X khi chùm electron có động năng lớn đập vào Anode kim loại nặng là:","options":["Bức xạ hãm (electron bị hãm phanh đột ngột trong điện trường hạt nhân nguyên tử Anode).","Hiện tượng quang điện ngoài làm bứt electron khỏi bề mặt kim loại.","Phản ứng nhiệt hạch tổng hợp hạt nhân nhẹ ở nhiệt độ cao.","Sự phân rã phóng xạ tự nhiên của dây nung Vonfram."],"key":"A","explain":"Electron xuyên sâu vào vỏ nguyên tử đối âm cực (Anode), bị trường hạt nhân (+Ze) hãm đột ngột và phát ra photon Tia X (ε = hf = W_đ1 - W_đ2)."},{"q":"Vì sao đối âm cực (Anode) trong ống Coolidge thường được chế tạo bằng kim loại Vonfram (W, Z = 74) và phải có bộ phận làm mát?","options":["Vì Vonfram có nguyên tử lượng lớn (Z = 74) và nhiệt độ nóng chảy rất cao (3422 °C), còn ~99% động năng electron biến thành nhiệt.","Vì Vonfram là kim loại nhẹ nhất và dễ bay hơi ở nhiệt độ phòng.","Vì 100% động năng của chùm electron đều biến thành tia X làm lạnh Anode.","Vì Vonfram không dẫn điện nên ngăn được dòng điện cao áp."],"key":"A","explain":"Chỉ khoảng 1% động năng electron chuyển thành tia X, còn ~99% biến thành nhiệt làm nóng Anode nên cần kim loại Z lớn, khó nóng chảy như Vonfram."},{"q":"Công thức xác định bước sóng ngắn nhất λ_min (giới hạn Duane - Hunt) của chùm tia X phát ra từ ống Coolidge hoạt động ở hiệu điện thế U_AK là:","options":["λ_min = (h.c) / (e.U_AK).","λ_min = (e.U_AK) / (h.c).","λ_min = h / (e.c.U_AK).","λ_min = (h.c.U_AK) / e."],"key":"A","explain":"Bảo toàn năng lượng cực đại: W_đmax = e.U_AK = ε_max = h.f_max = h.c / λ_min => λ_min = (h.c) / (e.U_AK)."},{"q":"Để tạo ra chùm Tia X cứng hơn (có bước sóng ngắn hơn và khả năng đâm xuyên mạnh hơn) trong ống Coolidge, ta cần thực hiện điều chỉnh nào?","options":["Tăng hiệu điện thế cao áp U_AK đặt giữa Anode và Cathode.","Giảm hiệu điện thế cao áp U_AK đặt giữa Anode và Cathode.","Bơm thêm không khí vào trong ống thủy tinh.","Thay đối âm cực Vonfram (Z = 74) bằng kim loại Nhôm (Z = 13)."],"key":"A","explain":"Vì λ_min tỉ lệ nghịch với U_AK, khi tăng U_AK thì bước sóng λ_min giảm xuống, tần số tăng lên nên tia X cứng hơn và đâm xuyên mạnh hơn."},{"q":"Trên tấm phim chụp X-quang âm bản truyền thống, vì sao hình ảnh của xương lại hiện lên có màu trắng sáng rõ nét hơn so với vùng mô mềm xung quanh?","options":["Vì xương chứa nhiều Canxi (Z = 20) hấp thụ mạnh tia X nên ít tia X truyền tới làm đen phim.","Vì xương tự phát ra ánh sáng màu trắng khi gặp tia X.","Vì mô mềm (Z ≈ 7) chặn đứng hoàn toàn 100% tia X.","Vì xương cho 100% tia X đi qua làm khử hết muối bạc trên phim."],"key":"A","explain":"Xương giàu Canxi (Z = 20) cản khoảng 80% tia X, chỉ ~20% tới phim nên vùng phim phía sau xương ít bị làm đen và hiện màu trắng sáng."},{"q":"Vật liệu nào sau đây được sử dụng tiêu chuẩn để làm tường che chắn phòng chụp X-quang và áo bảo hộ cho nhân viên y tế?","options":["Kim loại Chì (Pb, Z = 82).","Nhựa tổng hợp PVC trong suốt.","Tấm gỗ ép mỏng hoặc bìa cứng.","Tấm Nhôm mỏng (Al, Z = 13)."],"key":"A","explain":"Chì (Pb) có số hiệu nguyên tử rất lớn (Z = 82) và khối lượng riêng lớn (11,3 g/cm^3), hấp thụ gần như 100% tia X."}],"tf":[{"passage":"Xét cấu tạo, nguyên lí hoạt động của ống phát tia X (ống Coolidge) và tính chất của chùm tia X phát ra. Đánh giá tính đúng/sai của các nhận định sau:","claims":[{"t":"Bên trong ống Coolidge phải được hút chân không cao (áp suất cỡ 10^-6 mmHg) để electron không bị cản trở khi bay từ Cathode sang Anode.","key":true},{"t":"Tia X mang điện tích âm nên bị lệch phương truyền khi đi qua vùng có điện trường hoặc từ trường mạnh.","key":false},{"t":"Khi tăng hiệu điện thế U_AK lên gấp đôi thì bước sóng ngắn nhất λ_min của chùm tia X giảm đi một nửa.","key":true},{"t":"Tia X có tác dụng sinh lí hủy diệt tế bào nên được ứng dụng trong xạ trị ung thư nông, nhưng cần tuân thủ nghiêm ngặt quy tắc an toàn bức xạ.","key":true}]},{"passage":"Một ống phát tia X hoạt động ở hiệu điện thế cao áp U_AK. Bỏ qua động năng ban đầu của electron khi bứt ra khỏi Cathode. Cho h = 6,625.10^-34 J.s; c = 3.10^8 m/s; e = 1,6.10^-19 C.","claims":[{"t":"Khi U_AK = 25 kV, động năng cực đại của electron khi đập vào Anode là W_đmax = 4,0.10^-15 J (tương ứng 25 keV).","key":true},{"t":"Khi U_AK = 25 kV, bước sóng ngắn nhất của tia X phát ra là λ_min ≈ 49,7 pm (4,97.10^-11 m).","key":true},{"t":"Khi tăng điện áp lên U_AK = 50 kV, bước sóng ngắn nhất λ_min tăng lên thành 99,4 pm.","key":false},{"t":"Ở điện áp U_AK = 50 kV, tần số cực đại của chùm tia X là f_max ≈ 1,21.10^19 Hz.","key":true}]}],"short":[],"essay":[]},{"id":"CD-VL12-BAI5-EXAM","pairGroupId":"CD-VL12-BAI5","subject":"physics","title":"Chuyên đề Vật lí 12 · Bài 5: Tia X (Đề 2 · Nộp chấm 1 lần)","description":"Đề 2 (Chế độ Thi toàn bài): Hiển thị toàn bộ câu hỏi (ABCD, Đúng/Sai, Trả lời ngắn, Tự luận), làm xong nộp bài và chấm điểm 1 lần.","source":"Tự động tạo cặp 2 đề từ Bài thuyết trình Bài 5","mode":"exam","minutes":45,"active":true,"draft":false,"verified":false,"sectionPoints":{"mc":3,"tf":2,"short":2,"essay":3},"mc":[{"q":"Phát biểu nào sau đây là đúng khi nói về bản chất và bước sóng của Tia X (Tia Rơn-ghen)?","options":["Là sóng điện từ có bước sóng cực ngắn từ 10^-11 m đến 10^-8 m.","Là dòng hạt electron chuyển động với tốc độ gần bằng tốc độ ánh sáng.","Là sóng cơ học siêu âm truyền được trong môi trường chân không.","Là bức xạ mang điện tích âm nên bị lệch mạnh trong điện trường và từ trường."],"key":"A","explain":"Tia X là sóng điện từ có bước sóng từ 10^-11 m đến 10^-8 m (0,01 nm đến 10 nm), không mang điện tích."},{"q":"Trên thang sóng điện từ, vùng Tia X nằm ngay giữa hai vùng bức xạ nào?","options":["Tia tử ngoại (UV) và Tia Gamma (γ).","Ánh sáng nhìn thấy và Tia tử ngoại (UV).","Tia hồng ngoại (IR) và Ánh sáng nhìn thấy.","Sóng vô tuyến và Tia hồng ngoại (IR)."],"key":"A","explain":"Theo chiều bước sóng ngắn dần: Sóng vô tuyến -> Hồng ngoại -> Ánh sáng khả kiến -> Tử ngoại -> Tia X -> Tia Gamma."},{"q":"Trong ống phát tia X (ống Coolidge), cơ chế chủ yếu tạo ra chùm tia X khi chùm electron có động năng lớn đập vào Anode kim loại nặng là:","options":["Bức xạ hãm (electron bị hãm phanh đột ngột trong điện trường hạt nhân nguyên tử Anode).","Hiện tượng quang điện ngoài làm bứt electron khỏi bề mặt kim loại.","Phản ứng nhiệt hạch tổng hợp hạt nhân nhẹ ở nhiệt độ cao.","Sự phân rã phóng xạ tự nhiên của dây nung Vonfram."],"key":"A","explain":"Electron xuyên sâu vào vỏ nguyên tử đối âm cực (Anode), bị trường hạt nhân (+Ze) hãm đột ngột và phát ra photon Tia X (ε = hf = W_đ1 - W_đ2)."},{"q":"Vì sao đối âm cực (Anode) trong ống Coolidge thường được chế tạo bằng kim loại Vonfram (W, Z = 74) và phải có bộ phận làm mát?","options":["Vì Vonfram có nguyên tử lượng lớn (Z = 74) và nhiệt độ nóng chảy rất cao (3422 °C), còn ~99% động năng electron biến thành nhiệt.","Vì Vonfram là kim loại nhẹ nhất và dễ bay hơi ở nhiệt độ phòng.","Vì 100% động năng của chùm electron đều biến thành tia X làm lạnh Anode.","Vì Vonfram không dẫn điện nên ngăn được dòng điện cao áp."],"key":"A","explain":"Chỉ khoảng 1% động năng electron chuyển thành tia X, còn ~99% biến thành nhiệt làm nóng Anode nên cần kim loại Z lớn, khó nóng chảy như Vonfram."},{"q":"Công thức xác định bước sóng ngắn nhất λ_min (giới hạn Duane - Hunt) của chùm tia X phát ra từ ống Coolidge hoạt động ở hiệu điện thế U_AK là:","options":["λ_min = (h.c) / (e.U_AK).","λ_min = (e.U_AK) / (h.c).","λ_min = h / (e.c.U_AK).","λ_min = (h.c.U_AK) / e."],"key":"A","explain":"Bảo toàn năng lượng cực đại: W_đmax = e.U_AK = ε_max = h.f_max = h.c / λ_min => λ_min = (h.c) / (e.U_AK)."},{"q":"Để tạo ra chùm Tia X cứng hơn (có bước sóng ngắn hơn và khả năng đâm xuyên mạnh hơn) trong ống Coolidge, ta cần thực hiện điều chỉnh nào?","options":["Tăng hiệu điện thế cao áp U_AK đặt giữa Anode và Cathode.","Giảm hiệu điện thế cao áp U_AK đặt giữa Anode và Cathode.","Bơm thêm không khí vào trong ống thủy tinh.","Thay đối âm cực Vonfram (Z = 74) bằng kim loại Nhôm (Z = 13)."],"key":"A","explain":"Vì λ_min tỉ lệ nghịch với U_AK, khi tăng U_AK thì bước sóng λ_min giảm xuống, tần số tăng lên nên tia X cứng hơn và đâm xuyên mạnh hơn."},{"q":"Trên tấm phim chụp X-quang âm bản truyền thống, vì sao hình ảnh của xương lại hiện lên có màu trắng sáng rõ nét hơn so với vùng mô mềm xung quanh?","options":["Vì xương chứa nhiều Canxi (Z = 20) hấp thụ mạnh tia X nên ít tia X truyền tới làm đen phim.","Vì xương tự phát ra ánh sáng màu trắng khi gặp tia X.","Vì mô mềm (Z ≈ 7) chặn đứng hoàn toàn 100% tia X.","Vì xương cho 100% tia X đi qua làm khử hết muối bạc trên phim."],"key":"A","explain":"Xương giàu Canxi (Z = 20) cản khoảng 80% tia X, chỉ ~20% tới phim nên vùng phim phía sau xương ít bị làm đen và hiện màu trắng sáng."},{"q":"Vật liệu nào sau đây được sử dụng tiêu chuẩn để làm tường che chắn phòng chụp X-quang và áo bảo hộ cho nhân viên y tế?","options":["Kim loại Chì (Pb, Z = 82).","Nhựa tổng hợp PVC trong suốt.","Tấm gỗ ép mỏng hoặc bìa cứng.","Tấm Nhôm mỏng (Al, Z = 13)."],"key":"A","explain":"Chì (Pb) có số hiệu nguyên tử rất lớn (Z = 82) và khối lượng riêng lớn (11,3 g/cm^3), hấp thụ gần như 100% tia X."}],"tf":[{"passage":"Xét cấu tạo, nguyên lí hoạt động của ống phát tia X (ống Coolidge) và tính chất của chùm tia X phát ra. Đánh giá tính đúng/sai của các nhận định sau:","claims":[{"t":"Bên trong ống Coolidge phải được hút chân không cao (áp suất cỡ 10^-6 mmHg) để electron không bị cản trở khi bay từ Cathode sang Anode.","key":true},{"t":"Tia X mang điện tích âm nên bị lệch phương truyền khi đi qua vùng có điện trường hoặc từ trường mạnh.","key":false},{"t":"Khi tăng hiệu điện thế U_AK lên gấp đôi thì bước sóng ngắn nhất λ_min của chùm tia X giảm đi một nửa.","key":true},{"t":"Tia X có tác dụng sinh lí hủy diệt tế bào nên được ứng dụng trong xạ trị ung thư nông, nhưng cần tuân thủ nghiêm ngặt quy tắc an toàn bức xạ.","key":true}]},{"passage":"Một ống phát tia X hoạt động ở hiệu điện thế cao áp U_AK. Bỏ qua động năng ban đầu của electron khi bứt ra khỏi Cathode. Cho h = 6,625.10^-34 J.s; c = 3.10^8 m/s; e = 1,6.10^-19 C.","claims":[{"t":"Khi U_AK = 25 kV, động năng cực đại của electron khi đập vào Anode là W_đmax = 4,0.10^-15 J (tương ứng 25 keV).","key":true},{"t":"Khi U_AK = 25 kV, bước sóng ngắn nhất của tia X phát ra là λ_min ≈ 49,7 pm (4,97.10^-11 m).","key":true},{"t":"Khi tăng điện áp lên U_AK = 50 kV, bước sóng ngắn nhất λ_min tăng lên thành 99,4 pm.","key":false},{"t":"Ở điện áp U_AK = 50 kV, tần số cực đại của chùm tia X là f_max ≈ 1,21.10^19 Hz.","key":true}]}],"short":[{"q":"Một ống Coolidge hoạt động ở hiệu điện thế U_AK = 25 kV. Biết h = 6,625.10^-34 J.s; c = 3.10^8 m/s; e = 1,6.10^-19 C. Bước sóng ngắn nhất λ_min của chùm tia X phát ra bằng bao nhiêu picômét (pm)? (Làm tròn đến 1 chữ số thập phân).","key":49.7,"unit":"pm","tol":0.2,"hint":"λ_min = (6,625.10^-34 * 3.10^8) / (1,6.10^-19 * 25000) ≈ 4,96875.10^-11 m = 49,7 pm."},{"q":"Khi ống phát tia X hoạt động ở hiệu điện thế U_AK = 50 kV, bước sóng ngắn nhất của tia X phát ra bằng bao nhiêu picômét (pm)? (Làm tròn đến 1 chữ số thập phân).","key":24.8,"unit":"pm","tol":0.2,"hint":"λ_min = (6,625.10^-34 * 3.10^8) / (1,6.10^-19 * 50000) ≈ 2,484.10^-11 m = 24,8 pm."}],"essay":[{"title":"Bài toán tính bước sóng ngắn nhất và tần số cực đại của Tia X","prompt":"Một ống phát tia X (ống Coolidge) hoạt động dưới hiệu điện thế cao áp U_AK = 80 kV. Bỏ qua động năng ban đầu của electron khi vừa bứt ra khỏi Cathode. Cho hằng số Planck h = 6,625.10^-34 J.s; tốc độ ánh sáng trong chân không c = 3.10^8 m/s; độ lớn điện tích nguyên tố e = 1,6.10^-19 C.","parts":[{"q":"Tính bước sóng ngắn nhất λ_min của tia X phát ra theo đơn vị picômét (pm, làm tròn 1 chữ số thập phân).","key":15.5,"unit":"pm","tol":0.2,"points":1.5},{"q":"Tính tần số cực đại f_max của chùm tia X theo đơn vị 10^19 Hz (làm tròn 2 chữ số thập phân).","key":1.93,"unit":"×10¹⁹ Hz","tol":0.03,"points":1.5}],"solution":"1) λ_min = (h.c)/(e.U_AK) = (6,625.10^-34 * 3.10^8) / (1,6.10^-19 * 80.10^3) ≈ 1,553.10^-11 m = 15,5 pm.\n2) f_max = c / λ_min = 3.10^8 / 1,553.10^-11 ≈ 1,93.10^19 Hz."}]}]}</script>

<script>
'use strict';
(()=>{
const root=document.getElementById('app');
const modalHost=document.getElementById('modalHost');
const toastHost=document.getElementById('toastHost');
const K={theme:'ot12-r7-theme',custom:'ot12-r7-exams',hidden:'ot12-r7-hidden',records:'ot12-r7-records',session:'ot12-r7-session'};
const store={get:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}},del:k=>{try{localStorage.removeItem(k)}catch{}}};

const SOUND_KEY='haoedu-feedback-sound-v1';
const SOUND_VOLUME_KEY='haoedu-feedback-volume-v1';
let soundEnabled=store.get(SOUND_KEY,true),soundVolume=Number(store.get(SOUND_VOLUME_KEY,65));
if(!Number.isFinite(soundVolume))soundVolume=65;
soundVolume=Math.max(0,Math.min(100,soundVolume));
let soundContext=null;
function soundCtx(){
  const C=window.AudioContext||window.webkitAudioContext;
  if(!C)return null;
  try{if(!soundContext)soundContext=new C();return soundContext;}catch{return null;}
}
function gentleTone(ctx,freq,delay,duration,level=0.055,shape='sine'){
  try{
    const at=ctx.currentTime+delay;
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type=shape;o.frequency.setValueAtTime(freq,at);
    const v=Math.max(0.0001,level*(soundVolume/100));
    g.gain.setValueAtTime(0.0001,at);
    g.gain.exponentialRampToValueAtTime(v,at+Math.min(.018,duration/3));
    g.gain.exponentialRampToValueAtTime(0.0001,at+duration);
    o.connect(g);g.connect(ctx.destination);
    o.start(at);o.stop(at+duration+.03);
  }catch(err){}
}
function emitSound(ctx,kind){
  if(kind==='tap'){gentleTone(ctx,620,0,.065,.035)}
  else if(kind==='correct'){
    gentleTone(ctx,600,0,.055,.027);
    gentleTone(ctx,784,.07,.17,.060);
    gentleTone(ctx,988,.19,.20,.052);
  }else if(kind==='wrong'){
    gentleTone(ctx,590,0,.055,.024);
    gentleTone(ctx,420,.065,.17,.055);
  }else if(kind==='celebrate'){
    [523.25,659.25,783.99,1046.5].forEach((f,i)=>gentleTone(ctx,f,i*.16,.26,.045,'sine'));
  }
}
function playHaoSound(kind='tap'){
  if(!soundEnabled||soundVolume<=0)return;
  const ctx=soundCtx();if(!ctx)return;
  if(ctx.state==='suspended'){
    ctx.resume().then(()=>emitSound(ctx,kind)).catch(()=>{});
  }else emitSound(ctx,kind);
}
function refreshSoundButton(){
  const b=document.getElementById('soundBtn');if(!b)return;
  b.textContent=soundEnabled?'🔊 Âm thanh':'🔇 Tắt tiếng';
  b.setAttribute('aria-pressed',String(soundEnabled));
  const sl=document.getElementById('soundVolume');if(sl){sl.value=String(soundVolume);sl.disabled=!soundEnabled;}
}

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sci=s=>esc(s).replace(/([A-Za-zΔλΩ])_([A-Za-z0-9À-ỹ]+)/g,'$1<sub>$2</sub>').replace(/\^(-?\d+)/g,'<sup>$1</sup>').replace(/\n/g,'<br>');
const cleanClaim=s=>String(s??'').replace(/^\s*[abcd]\s*[.)]\s*/i,'');
const fmt=n=>(Math.round(n*100)/100).toLocaleString('vi-VN',{maximumFractionDigits:2});
const clock=n=>`${String(Math.floor(Math.max(0,n)/60)).padStart(2,'0')}:${String(Math.floor(Math.max(0,n)%60)).padStart(2,'0')}`;
const date=s=>new Date(s).toLocaleString('vi-VN',{dateStyle:'short',timeStyle:'short'});
const shuffle=a=>{const b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b};
const shuffledDifferent=a=>{const b=shuffle(a);if(a.length>1&&b.every((v,i)=>v===a[i]))return [...b.slice(1),b[0]];return b};
const copy=x=>JSON.parse(JSON.stringify(x));
const identityOrder=n=>Array.from({length:n},(_,i)=>i);

const labels={gdqp:'GD Quốc phòng & An ninh',history:'Lịch sử',physics:'Vật lí',chemistry:'Hóa học',informatics:'Tin học',forestry:'Công nghệ Lâm nghiệp',math:'Toán',english:'Tiếng Anh',other:'Khác'};
const SUBJECTS=[
  ['gdqp','GD Quốc phòng & An ninh','🛡️','Đề kiểm tra Giữa kì I (Đề 1 làm đúng qua câu & Đề 2 nộp chấm 1 lần) kèm lời giải chi tiết Tự luận để học thuộc.'],
  ['physics','Vật lí','⚛️','Làm bài có thời gian, công thức khoa học và phản hồi theo từng phần.'],
  ['history','Lịch sử','🏛️','Kiến thức trọng tâm, suy luận tư liệu và luyện đến khi đúng.'],
  ['chemistry','Hóa học','🧪','Đề Hóa 12 theo đặc tả, luyện kỹ năng và bài toán vận dụng.'],
  ['informatics','Tin học','💻','Đề tổng hợp Bài 1–6, đủ 45 ABCD và 12 câu Đúng/Sai.'],
  ['forestry','Công nghệ Lâm nghiệp','🌳','Thi thử sát ma trận và luyện câu hỏi thực tế về rừng.']
];

let presCatalog=JSON.parse(document.getElementById('fallback-presentations').textContent);

let view='home', chosenSubject='gdqp', chosenExamId=null, examModeFilter='all', lastRecord=null, reviewFilter='all', reviewSection='all', preparedOrder=null, shuffleBusy=false, studyEssayRevealed={};

const getAll=()=>catalog.exams||[];
const getExam=id=>getAll().find(e=>e.id===id);
const published=e=>e.active!==false && e.draft!==true;
const isMastery=e=>e.mode==='mastery';
const tally=e=>(e.mc||[]).length+' ABCD · '+(e.tf||[]).length+' Đ/S'+((e.short||[]).length?' · '+e.short.length+' trả lời ngắn':'')+((e.essay||[]).length?' · '+e.essay.length+' tự luận':'')+((e.studyEssays||[]).length?' · '+e.studyEssays.length+' câu tự luận học thuộc':'');

function generateVisualOrder(ex){
  return {mc:Object.fromEntries((ex.mc||[]).map((q,i)=>[i,shuffledDifferent(identityOrder((q.options||[]).length))])),
          tf:Object.fromEntries((ex.tf||[]).map((q,i)=>[i,shuffledDifferent(identityOrder((q.claims||[]).length))]))};
}
function mcVisualOrder(i){const ex=getExam(session?.examId);const n=ex?.mc?.[i]?.options?.length||4;const p=session?.visuals?.mc?.[i];return Array.isArray(p)&&p.length===n&&new Set(p).size===n?p:identityOrder(n)}
function tfVisualOrder(i){const ex=getExam(session?.examId);const n=ex?.tf?.[i]?.claims?.length||4;const p=session?.visuals?.tf?.[i];return Array.isArray(p)&&p.length===n&&new Set(p).size===n?p:identityOrder(n)}
function visualMCLabel(originalLetter,i){if(originalLetter===undefined||originalLetter===null||originalLetter==='')return undefined;const origin='ABCD'.indexOf(originalLetter);const displayedIndex=mcVisualOrder(i).indexOf(origin);return displayedIndex<0?originalLetter:'ABCD'[displayedIndex]}

function notify(message){toastHost.innerHTML=`<div class="toast" role="status">${esc(message)}</div>`;clearTimeout(notify.timer);notify.timer=setTimeout(()=>toastHost.innerHTML='',3800)}

function render(){
  document.querySelectorAll('[data-go]').forEach(x=>x.classList.toggle('active',x.dataset.go===view || (view==='catalog'&&x.dataset.go==='home')));
  if(view==='home')homeView();
  else if(view==='catalog')catalogView();
  else if(view==='presentations')presentationsView();
  else if(view==='study-essays')studyEssaysView();
  else if(view==='prestart')prestartView();
  else if(view==='exam')examView();
  else if(view==='result')resultView();
  else if(view==='records')recordsView();
  else homeView();
}

const go=(target,args={})=>{
  if(args.subject)chosenSubject=args.subject;
  if(args.examId)chosenExamId=args.examId;
  view=target;
  window.scrollTo(0,0);
  render();
};

  const presList=presCatalog.presentations||[];
  root.innerHTML=`
  <div class="hero">

      <div class="eyebrow">Học chắc kiến thức · Tư duy khoa học</div>

function makeOrder(e,count){
  const m=shuffledDifferent(Array.from({length:(e.mc||[]).length},(_,i)=>({section:'mc',i})));
  const t=shuffledDifferent(Array.from({length:(e.tf||[]).length},(_,i)=>({section:'tf',i})));
  const sh=shuffledDifferent(Array.from({length:(e.short||[]).length},(_,i)=>({section:'short',i})));
  if(count==='full')return [...m,...t,...sh];
  const n=Number(count)||20;
  return [...m,...t,...sh].slice(0,n);
}

function buildExamOrder(e){return ['mc','tf','short','essay'].flatMap(section=>(e[section]||[]).map((_,i)=>({section,i})))}

function shuffleBeforeStart(){
  if(shuffleBusy||view!=='prestart')return;
  const ex=getExam(chosenExamId),count=document.getElementById('practiceCount')?.value||'full';if(!ex)return;
  shuffleBusy=true;
  const wrap=document.getElementById('shuffleStatus'),bar=document.getElementById('shuffleBar'),message=document.getElementById('shuffleText');
  wrap?.classList.remove('hidden');if(bar)bar.style.width='100%';
  const order=isMastery(ex)?makeOrder(ex,count):['mc','tf','short','essay'].flatMap(section=>shuffledDifferent((ex[section]||[]).map((_,i)=>({section,i}))));
  preparedOrder={examId:ex.id,count,order,visuals:generateVisualOrder(ex)};
  shuffleBusy=false;
  if(message)message.textContent='✓ Đã xáo trộn '+order.length+' câu hỏi và các phương án.';
  playHaoSound('tap');
}

function start(){
  const e=getExam(chosenExamId);if(!e)return;
  const nickname=document.getElementById('nickname')?.value.trim()||'Người học';
  store.set('ot12-r7-nick',nickname);
  const now=Date.now();
  session={
    examId:e.id,nickname,startedAt:now,
    deadline:(!isMastery(e)&&e.minutes)?now+e.minutes*60000:null,
    stage:'running',mode:e.mode,position:0,answers:{},tries:{},done:{},feedback:'',
    order:preparedOrder&&preparedOrder.examId===e.id?copy(preparedOrder.order):(isMastery(e)?buildExamOrder(e).filter(x=>x.section!=='essay'):buildExamOrder(e)),
    visuals:preparedOrder&&preparedOrder.examId===e.id?copy(preparedOrder.visuals):{mc:{},tf:{}}
  };
  preparedOrder=null;persist();go('exam');
}

function persist(){store.set(K.session,session)}
function atoms(e){return session.order.reduce((n,o)=>n+(o.section==='tf'?4:o.section==='essay'?(e.essay[o.i]?.parts||[]).length:1),0)}
function answered(e){
  let count=0;
  for(const o of session.order){
    if(o.section==='tf'){for(let j=0;j<4;j++)if(session.answers[`tf-${o.i}-${j}`]!==undefined)count++}
    else if(o.section==='essay'){(e.essay[o.i]?.parts||[]).forEach((_,j)=>{if(session.answers[`essay-${o.i}-${j}`]?.trim?.())count++})}
    else if(o.section==='mc'){if(session.answers[`mc-${o.i}`]!==undefined)count++}
    else if(session.answers[`short-${o.i}`]?.trim?.())count++
  }
  return count;
}

function examView(){
  const e=getExam(session?.examId);if(!e){session=null;store.del(K.session);return go('home')}
  if(session.stage!=='running')return go('result');
  const total=atoms(e),done=isMastery(e)?Object.keys(session.done).length:answered(e);
  const timerText=session.deadline?clock((session.deadline-Date.now())/1000):clock((Date.now()-session.startedAt)/1000);
  root.innerHTML=`
  <div class="quiz-head">
    <div>
      <div class="eyebrow" style="color:var(--brand)">${esc(labels[e.subject]||'')}</div>
      <h2>${esc(e.title)}</h2>

    </div>
    <div>
      <div class="clock" id="timeDisplay">${timerText}</div>
      <div class="hint" style="text-align:center">${session.deadline?'Còn lại':'Đã học'}</div>
    </div>
  </div>
  <div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,100*done/Math.max(1,total))}%"></div></div>
  <div class="muted small" style="margin:7px 0 16px">${done}/${total} lượt lựa chọn ${isMastery(e)?'đã trả lời đúng':'đã hoàn thành'}</div>
  <div class="quiz-layout">
    <div class="quiz-main">
      <div class="panel">${isMastery(e)?masterQuestion(e):examQuestion(e)}</div>
      ${(e.studyEssays||[]).length?renderStudyEssayList(e.studyEssays, e.id):''}
    </div>
    ${isMastery(e)?`
    <aside class="panel quiz-side">
      <h3>Luyện tập tuần tự</h3>
      <p class="muted small">Mỗi câu phải trả lời đúng rồi mới tiếp tục.</p>
      <div class="notice">Câu <strong>${session.position+1} / ${session.order.length}</strong></div>
      <div style="margin-top:16px"><button class="btn secondary block" data-action="subject" data-subject="${esc(e.subject)}">← Thoát ra danh sách đề</button></div>
    </aside>`:`
    <aside class="panel quiz-side">
      <h3>Danh sách câu</h3>
      <p class="muted mini">Chọn số để chuyển câu. Các câu đã chọn có màu xanh.</p>
      <div class="question-index">${session.order.map((o,i)=>`<button class="number ${i===session.position?'active':''} ${stepAnswered(e,o)?'answered':''}" data-action="jump" data-index="${i}">${i+1}</button>`).join('')}</div>
      <div style="margin-top:20px"><button class="btn primary block" data-action="finish">Nộp bài</button></div>
    </aside>`}
  </div>`;
}

function stepAnswered(e,o){
  if(o.section==='tf')return (e.tf[o.i].claims||[]).every((_,j)=>session.answers[`tf-${o.i}-${j}`]!==undefined);
  if(o.section==='essay')return (e.essay[o.i].parts||[]).every((_,j)=>String(session.answers[`essay-${o.i}-${j}`]||'').trim());
  return !!(session.answers[`${o.section}-${o.i}`]!==undefined&&String(session.answers[`${o.section}-${o.i}`]).trim());
}

function masterQuestion(e){
  const o=session.order[session.position],q=e[o.section][o.i];
  const secLabel={mc:'ABCD',tf:'Đúng / Sai',short:'Trả lời ngắn'}[o.section]||'Câu hỏi';
  let body=`<div class="pill blue">Câu ${session.position+1}/${session.order.length} · ${secLabel}</div>`;
  if(o.section==='mc'){
    const key=`mc-${o.i}`,v=session.answers[key];
    body+=`<div class="qtitle" style="margin:14px 0">${sci(q.q)}</div>`+mcVisualOrder(o.i).map((originalJ,visibleJ)=>{
      const value='ABCD'[originalJ],option=q.options[originalJ],letter='ABCD'[visibleJ];
      return `<button class="choice ${v===value?'correct':''}" data-action="master-choice" data-choice="${value}" ${session.done[key]?'disabled':''}><span class="letter">${letter}</span><span class="txt">${sci(option)}</span><span>${v===value?'✓':''}</span></button>`;
    }).join('');
  }else if(o.section==='tf'){
    body+=`<div class="reading" style="margin-top:15px">${sci(q.passage)}</div>`+tfVisualOrder(o.i).map((j,visibleJ)=>{
      const c=q.claims[j],k=`tf-${o.i}-${j}`,v=session.answers[k];
      return `<div class="tf-claim"><p><b>${'abcd'[visibleJ]})</b> ${sci(cleanClaim(c.t))}</p><div class="tf-controls master-tf-controls"><div class="tf-choice-buttons"><button class="btn sm ${v===true?'primary':''}" data-action="master-tf" data-statement="${j}" data-value="true" ${session.done[k]?'disabled':''}>Đúng</button><button class="btn sm ${v===false?'primary':''}" data-action="master-tf" data-statement="${j}" data-value="false" ${session.done[k]?'disabled':''}>Sai</button></div><div class="tf-result-slot">${session.done[k]?`<span class="answer-status">✓ Chính xác</span>`:''}</div></div></div>`;
    }).join('');
  }else if(o.section==='short'){
    const k=`short-${o.i}`;
    body+=`<div class="qtitle" style="margin:14px 0">${sci(q.q)}</div><div class="field" style="margin-top:14px"><label>Nhập đáp số để kiểm tra ngay</label><div class="btn-row"><input class="ninput" id="masterShortInput" inputmode="decimal" value="${esc(session.answers[k]||'')}" ${session.done[k]?'disabled':''} placeholder="Nhập số..."><span class="nunit">${esc(q.unit||'')}</span><button class="btn sm primary" data-action="master-short-check" ${session.done[k]?'disabled':''}>Kiểm tra đáp số</button></div></div>`;
  }
  const complete=masterStepDone(o),last=session.position===session.order.length-1;
  body+=`${session.feedback?`<div class="feedback ${session.feedback.startsWith('Đúng')?'good':'bad'}">${sci(session.feedback)}</div>`:''}<div class="qfoot"><div class="muted small">Sai có thể thử lại. Chỉ tính điểm lần đầu.</div><button class="btn primary" data-action="next-master" ${complete?'':'disabled'}>${last?'Hoàn thành &amp; xem điểm':'Câu tiếp theo →'}</button></div>`;
  return body;
}

function masterStepDone(o){
  if(o.section==='mc')return !!session.done[`mc-${o.i}`];
  if(o.section==='short')return !!session.done[`short-${o.i}`];
  return (getExam(session.examId).tf[o.i].claims||[]).every((_,j)=>session.done[`tf-${o.i}-${j}`]);
}

function examQuestion(e){
  const o=session.order[session.position],q=e[o.section][o.i],n=session.position+1;
  const head=`<div class="pill blue">Câu ${n}/${session.order.length} · ${{mc:'Phần I · ABCD',tf:'Phần II · Đúng/Sai',short:'Phần III · Trả lời ngắn',essay:'Phần IV · Tự luận'}[o.section]}</div>`;
  let body='';
  if(o.section==='mc')body=`<div class="qtitle" style="margin:14px 0">${sci(q.q)}</div>`+mcVisualOrder(o.i).map((originalJ,visibleJ)=>{const v='ABCD'[originalJ],option=q.options[originalJ],letter='ABCD'[visibleJ];return `<button class="choice ${session.answers[`mc-${o.i}`]===v?'selected':''}" data-action="exam-choice" data-choice="${v}"><span class="letter">${letter}</span><span class="txt">${sci(option)}</span></button>`}).join('');
  if(o.section==='tf')body=`<div class="reading" style="margin-top:15px">${sci(q.passage)}</div>`+tfVisualOrder(o.i).map((j,visibleJ)=>{const c=q.claims[j];return `<div class="tf-claim"><p><b>${'abcd'[visibleJ]})</b> ${sci(cleanClaim(c.t))}</p><div class="tf-controls">${[true,false].map(v=>`<button class="btn sm ${session.answers[`tf-${o.i}-${j}`]===v?'primary':''}" data-action="exam-tf" data-claim="${j}" data-value="${v}">${v?'Đúng':'Sai'}</button>`).join('')}</div></div>`}).join('');
  if(o.section==='short')body=`<div class="qtitle" style="margin:14px 0">${sci(q.q)}</div><div class="field" style="margin-top:18px"><label>Đáp số (không cần đơn vị)</label><div><input class="ninput" inputmode="decimal" data-input="short" data-index="${o.i}" value="${esc(session.answers[`short-${o.i}`]||'')}" placeholder="Nhập kết quả số"><span class="nunit">${esc(q.unit||'')}</span></div></div>`;
  if(o.section==='essay')body=`<div class="qtitle" style="margin:14px 0">${sci(q.title||'Bài toán tự luận')}</div><div class="reading">${sci(q.prompt)}</div>${(q.parts||[]).map((p,j)=>`<div class="field" style="margin:15px 0"><label>${j+1}. ${sci(p.q)}</label><div><input class="ninput" inputmode="decimal" data-input="essay" data-index="${o.i}" data-part="${j}" value="${esc(session.answers[`essay-${o.i}-${j}`]||'')}" placeholder="Nhập đáp số"><span class="nunit">${esc(p.unit||'')}</span></div></div>`).join('')}`;
  return `<div class="section-tabs">${['mc','tf','short','essay'].filter(k=>(e[k]||[]).length).map(k=>`<button class="section-tab ${o.section===k?'active':''}" data-action="go-section" data-section="${k}">${{mc:'I · ABCD',tf:'II · Đúng/Sai',short:'III · Trả lời ngắn',essay:'IV · Tự luận'}[k]}</button>`).join('')}</div>${head}${body}<div class="qfoot"><button class="btn secondary" data-action="exam-prev" ${session.position===0?'disabled':''}>← Câu trước</button><button class="btn ${session.position===session.order.length-1?'primary':''}" data-action="exam-next" ${session.position===session.order.length-1?'disabled':''}>Câu tiếp →</button></div>`;
}

function numberValid(v){const s=String(v??'').trim().replace(',','.').replace(/\s+/g,'');if(!s)return NaN;return Number(s)}
function numberCorrect(got,key,tol){const n=numberValid(got),t=Number(key);return Number.isFinite(n)&&Number.isFinite(t)&&Math.abs(n-t)<=Math.max(Number(tol)||0.01,Math.abs(t)*1e-7)}

function answerMaster(value,claim){
  const e=getExam(session.examId),o=session.order[session.position];
  if(o.section==='short'){
    const k=`short-${o.i}`,q=e.short[o.i];
    if(session.done[k])return;
    const ok=numberCorrect(value,q.key,q.tol);
    session.tries[k]=(session.tries[k]||0)+1;
    session.answers[k]=value;
    playHaoSound(ok?'correct':'wrong');
    if(ok){session.done[k]=true;session.feedback='Đúng rồi! '+(q.hint||'Tiếp tục sang câu tiếp theo nhé.')}
    else{session.feedback='Chưa chính xác. Em tính lại rồi nhập lại đáp số nhé!'}
    persist();render();return;
  }
  const k=o.section==='mc'?`mc-${o.i}`:`tf-${o.i}-${claim}`;
  if(session.done[k])return;
  const correct=o.section==='mc'?e.mc[o.i].key===value:e.tf[o.i].claims[claim].key===value;
  session.tries[k]=(session.tries[k]||0)+1;
  playHaoSound(correct?'correct':'wrong');
  if(correct){
    session.done[k]=true;session.answers[k]=value;
    const exp=o.section==='mc'?(e.mc[o.i].explain||''):'';
    session.feedback='Đúng rồi! '+(exp?exp:'Tiếp tục nhé.');
  }else{
    session.feedback='Chưa đúng. Em chọn lại ở câu này.';
  }
  persist();render();
}

function scoreExam(e){
  const base=e.sectionPoints||{mc:3,tf:2,short:2,essay:3};
  const n={mc:(e.mc||[]).length,tf:(e.tf||[]).reduce((s,q)=>s+(q.claims||[]).length,0),short:(e.short||[]).length,essay:(e.essay||[]).reduce((s,q)=>s+(q.parts||[]).length,0)};
  const selected=Object.keys(base).filter(k=>n[k]>0),totalBase=selected.reduce((s,k)=>s+base[k],0);
  const per={};for(const k of selected)per[k]=10*base[k]/totalBase/n[k];
  let total=0,correct=0,detail=[],pointsBy={mc:0,tf:0,short:0,essay:0};
  function add(section,index,sub,title,got,key,yes,explain){
    const p=per[section]||0;if(yes){total+=p;correct++;pointsBy[section]+=p}
    detail.push({section,index,sub,title,got,key,correct:yes,points:p,explain:explain||''});
  }
  (e.mc||[]).forEach((q,i)=>{const raw=session.answers[`mc-${i}`];add('mc',i,null,q.q,visualMCLabel(raw,i),visualMCLabel(q.key,i),raw===q.key,q.explain||'')});
  (e.tf||[]).forEach((q,i)=>(q.claims||[]).forEach((c,j)=>add('tf',i,j,`${'abcd'[tfVisualOrder(i).indexOf(j)]}) ${cleanClaim(c.t)}`,session.answers[`tf-${i}-${j}`],c.key,session.answers[`tf-${i}-${j}`]===c.key,'')));
  (e.short||[]).forEach((q,i)=>add('short',i,null,q.q,session.answers[`short-${i}`],q.key,numberCorrect(session.answers[`short-${i}`],q.key,q.tol),q.hint||''));
  (e.essay||[]).forEach((q,i)=>(q.parts||[]).forEach((c,j)=>add('essay',i,j,q.title+' – '+c.q,session.answers[`essay-${i}-${j}`],c.key,numberCorrect(session.answers[`essay-${i}-${j}`],c.key,c.tol),q.solution||'')));
  return {score:Math.min(10,Math.max(0,Math.round(total*100)/100)),correct,total:detail.length,detail,pointsBy};
}

function scoreMaster(e){
  const details=[];
  session.order.forEach(o=>{
    if(o.section==='mc'){const q=e.mc[o.i],k=`mc-${o.i}`;details.push({section:'mc',title:q.q,got:visualMCLabel(session.answers[k],o.i),key:visualMCLabel(q.key,o.i),correct:(session.tries[k]||0)===1,explain:q.explain||'Điểm tính theo lần chọn đầu tiên.'})}
    else if(o.section==='short'){const q=e.short[o.i],k=`short-${o.i}`;details.push({section:'short',title:q.q,got:session.answers[k],key:q.key,correct:(session.tries[k]||0)===1,explain:q.hint||''})}
    else if(o.section==='tf'){const q=e.tf[o.i];q.claims.forEach((c,j)=>{const k=`tf-${o.i}-${j}`;details.push({section:'tf',title:`${'abcd'[tfVisualOrder(o.i).indexOf(j)]}) ${cleanClaim(c.t)}`,got:session.answers[k],key:c.key,correct:(session.tries[k]||0)===1,explain:'Điểm tính theo lần chọn đầu tiên.'})})}
  });
  const correct=details.filter(d=>d.correct).length;
  return {score:Math.round(1000*correct/Math.max(1,details.length))/100,correct,total:details.length,detail:details,pointsBy:{mc:0,tf:0,short:0,essay:0}};
}

function finish(reason='submitted'){
  const e=getExam(session?.examId);if(!e||session.stage!=='running')return;
  const result=isMastery(e)?scoreMaster(e):scoreExam(e);
  lastRecord={id:'result-'+Date.now().toString(36),examId:e.id,title:e.title,subject:e.subject,nickname:session.nickname,finishedAt:Date.now(),duration:Math.floor((Date.now()-session.startedAt)/1000),mode:e.mode,reason,...result};
  records.unshift(lastRecord);records=records.slice(0,150);store.set(K.records,records);
  session.stage='finished';persist();go('result');
  playHaoSound('celebrate');
}

function pretty(v){return v===undefined||v===''?'Chưa trả lời':typeof v==='boolean'?(v?'Đúng':'Sai'):esc(String(v))}

function resultView(){
  const r=lastRecord||records[0];if(!r)return go('records');
  const e=getExam(r.examId);
  const labelsSec={mc:'Phần I · ABCD',tf:'Phần II · Đúng/Sai',short:'Phần III · Trả lời ngắn',essay:'Phần IV · Tự luận'};
  const details=(r.detail||[]).filter(d=>(reviewFilter==='all'||(reviewFilter==='right'?d.correct:!d.correct)));
  root.innerHTML=`
  <div class="panel">
    <div class="result-top">
      <div class="eyebrow" style="color:var(--brand)">Hoàn thành bài luyện</div>
      <h1>${esc(r.title)}</h1>
      <div class="score-number">${fmt(r.score)}<span>/10</span></div>
      <p class="muted">${esc(r.nickname)} · ${r.correct}/${r.total} lượt đúng · ${clock(r.duration)}</p>
      <div class="btn-row" style="justify-content:center">
        <button class="btn primary" data-action="subject" data-subject="${esc(r.subject)}">Làm đề khác</button>
        <button class="btn secondary" data-action="records">Xem lịch sử điểm</button>
      </div>
    </div>
  </div>
  ${e&&(e.studyEssays||[]).length?renderStudyEssayList(e.studyEssays, e.id):''}
  <div class="section-head"><div><h2>Phân tích đáp án Trắc nghiệm</h2></div></div>
  <div class="panel">
    <div class="review-tools">
      <button class="btn sm ${reviewFilter==='all'?'primary':''}" data-action="filter" data-filter="all">Tất cả</button>
      <button class="btn sm ${reviewFilter==='right'?'primary':''}" data-action="filter" data-filter="right">Đúng</button>
      <button class="btn sm ${reviewFilter==='wrong'?'primary':''}" data-action="filter" data-filter="wrong">Sai</button>
    </div>
    ${details.map(d=>`<div class="review-item"><div class="btn-row"><span class="pill ${d.correct?'green':'warn'}">${d.correct?'✓ Đúng':'✗ Sai'}</span><span class="pill">${labelsSec[d.section]||d.section}</span></div><p style="margin:10px 0"><b>${sci(d.title)}</b></p><div class="small ${d.correct?'righttxt':'wrongtxt'}">Em chọn: <b>${pretty(d.got)}</b></div><div class="small righttxt">Đáp án: <b>${pretty(d.key)}</b></div>${d.explain?`<p class="muted small" style="margin:8px 0 0">${sci(d.explain)}</p>`:''}</div>`).join('')}
  </div>`;
}

function recordsView(){
  root.innerHTML=`
  <div class="subhero">
    <div><div class="eyebrow" style="color:var(--brand)">TIẾN BỘ MỖI NGÀY</div><h1>Thành tích học tập</h1></div>
    <button class="btn secondary" data-action="home">← Trang chủ</button>
  </div>
  <div class="panel">
    ${records.length?`<div class="tablewrap"><table><thead><tr><th>Hạng</th><th>Biệt danh</th><th>Đề</th><th>Điểm</th><th>Thời gian</th></tr></thead><tbody>${[...records].sort((a,b)=>b.score-a.score).slice(0,25).map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.nickname)}</td><td>${esc(r.title)}</td><td><b>${fmt(r.score)}</b></td><td>${clock(r.duration)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Chưa có bài hoàn thành.</div>'}
  </div>`;
}

document.body.addEventListener('click',e=>{
  const b=e.target.closest('[data-action]');if(!b)return;
  const a=b.dataset.action, id=b.dataset.id;
  if(a==='home')go('home');
  else if(a==='go-presentations')go('presentations');
  else if(a==='subject'){examModeFilter='all';go('catalog',{subject:b.dataset.subject})}
  else if(a==='filter-exam-mode'){examModeFilter=b.dataset.mode;render()}
  else if(a==='choose-exam'){preparedOrder=null;go('prestart',{examId:id})}
  else if(a==='view-study-essays'){go('study-essays',{examId:id})}
  else if(a==='toggle-study-essay'){
    const k=b.dataset.key;
    studyEssayRevealed[k]=studyEssayRevealed[k]===false?true:false;
    render();
  }
  else if(a==='toggle-all-study-essays'){
    const show=b.dataset.show==='true';
    const ex=getExam(chosenExamId||session?.examId||lastRecord?.examId);
    if(ex&&(ex.studyEssays||[]).length){
      ex.studyEssays.forEach((_,idx)=>{studyEssayRevealed[`${ex.id}-${idx}`]=show;});
      render();
    }
  }
  else if(a==='shuffle-before')shuffleBeforeStart();
  else if(a==='start')start();
  else if(a==='resume')go('exam');
  else if(a==='open-slide')openSlideModal(b.dataset.presId);
  else if(a==='close-modal'){modalHost.innerHTML=''}
  else if(a==='fullscreen-slide'){
    const wrap=document.getElementById('slideFrameWrap');
    if(wrap?.requestFullscreen)wrap.requestFullscreen().catch(()=>{});
  }
  else if(a==='master-choice')answerMaster(b.dataset.choice,null);
  else if(a==='master-tf')answerMaster(b.dataset.value==='true',Number(b.dataset.statement));
  else if(a==='master-short-check'){const val=document.getElementById('masterShortInput')?.value||'';answerMaster(val,null)}
  else if(a==='next-master'){
    const o=session.order[session.position];if(!masterStepDone(o))return;
    if(session.position===session.order.length-1)finish('submitted');
    else{session.position++;session.feedback='';persist();render();window.scrollTo(0,0)}
  }
  else if(a==='exam-choice'){playHaoSound('tap');let o=session.order[session.position];session.answers[`mc-${o.i}`]=b.dataset.choice;persist();render()}
  else if(a==='exam-tf'){playHaoSound('tap');let o=session.order[session.position];session.answers[`tf-${o.i}-${b.dataset.claim}`]=b.dataset.value==='true';persist();render()}
  else if(a==='exam-next'||a==='exam-prev'){session.position=Math.max(0,Math.min(session.order.length-1,session.position+(a==='exam-next'?1:-1)));persist();render();window.scrollTo(0,0)}
  else if(a==='go-section'){let i=session.order.findIndex(o=>o.section===b.dataset.section);if(i>=0){session.position=i;persist();render()}}
  else if(a==='jump'){session.position=Number(b.dataset.index);persist();render()}
  else if(a==='finish')finish('submitted');
  else if(a==='filter'){reviewFilter=b.dataset.filter;render()}
  else if(a==='records')go('records');
});

document.body.addEventListener('input',e=>{
  if(e.target.matches('[data-input]')&&session?.stage==='running'){
    const k=e.target.dataset.input==='essay'?`essay-${e.target.dataset.index}-${e.target.dataset.part}`:`short-${e.target.dataset.index}`;
    session.answers[k]=e.target.value;persist();
  }
});

document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));
document.getElementById('logoLink').addEventListener('click',e=>{e.preventDefault();go('home')});

const soundBtn=document.getElementById('soundBtn');
refreshSoundButton();
soundBtn?.addEventListener('click',()=>{
  soundEnabled=!soundEnabled;store.set(SOUND_KEY,soundEnabled);refreshSoundButton();
  if(soundEnabled)playHaoSound('correct');
});
document.getElementById('soundVolume')?.addEventListener('input',e=>{
  soundVolume=Number(e.target.value);store.set(SOUND_VOLUME_KEY,soundVolume);
});
document.getElementById('soundTest')?.addEventListener('click',()=>{
  if(!soundEnabled){soundEnabled=true;store.set(SOUND_KEY,true);refreshSoundButton();}
  playHaoSound('correct');
});
const themeBtn=document.getElementById('themeBtn');
function applyTheme(mode){document.documentElement.dataset.theme=mode;themeBtn.textContent=mode==='dark'?'☀️ Sáng':'🌙 Tối';store.set(K.theme,mode)}
applyTheme(store.get(K.theme,'light'));
themeBtn.addEventListener('click',()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'));

setInterval(()=>{
  if(view!=='exam'||session?.stage!=='running')return;
  const el=document.getElementById('timeDisplay');if(!el)return;
  const remain=session.deadline?Math.ceil((session.deadline-Date.now())/1000):Math.floor((Date.now()-session.startedAt)/1000);
  if(session.deadline&&remain<=0){finish('timeout');return}
  el.textContent=clock(remain);
  el.classList.toggle('urgent',!!session.deadline&&remain<120);
},1000);

render();
if(location.protocol!=='file:'){
  fetch('data/exams.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(x=>{
    if(x&&Array.isArray(x.exams)&&x.exams.length){
      const existingIds=new Set(x.exams.map(e=>e.id));
      const merged=[...x.exams,...(catalog.exams||[]).filter(e=>!existingIds.has(e.id))];
      catalog={...x,exams:merged};
      render();
    }
  }).catch(()=>{});
  fetch('data/presentations.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(x=>{
    if(x&&Array.isArray(x.presentations)&&x.presentations.length){presCatalog=x;render();}
  }).catch(()=>{});
}
})();
