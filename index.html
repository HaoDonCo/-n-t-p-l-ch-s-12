<script id="fallback-data" type="application/json">{"schemaVersion":2,"updatedAt":"2026-11-06","exams":[{"id":"SU-TONGHOP-1","subject":"history","title":"Tổng hợp Lịch sử 12 · Bài 1–5","description":"Ngân hàng từ đề cương 5 bài: 128 câu nhiều lựa chọn và 21 câu đúng/sai. Luyện đến khi đúng.","mode":"mastery","minutes":0,"mc":[{"q":"Nội dung nào sau đây là một trong những hoạt động nổi bật của Hiệp hội các quốc gia Đông Nam Á (ASEAN) trong giai đoạn 1967 – 1976?","options":["Phản đối Trật tự thế giới hai cực I-an-ta, ủng hộ xu thế đa cực.","Tập trung vào hợp tác trên lĩnh vực chính trị — an ninh.","Tích cực ủng hộ việc đấu tranh chống Mỹ xâm lược Việt Nam.","Tham gia vào giải quyết căng thẳng trên bán đảo Triều Tiên."],"key":"B"},{"q":"Tiêu diệt tận gốc chủ nghĩa phát xít Đức và chủ nghĩa quân phiệt Nhật Bản là một trong những nội dung của hội nghị nào?","options":["I-an-ta.","Pôt-xđam.","Tê-hê-ran.","Xan Phran-xi-xcô."],"key":"A"},{"q":"Một trong những thách thức về kinh tế mà Cộng đồng ASEAN phải đối mặt trong quá trình xây dựng và phát triển là","options":["sự đa dạng về chế độ chính trị.","những vấn đề lịch sử sâu xa.","chênh lệch trình độ phát triển.","sự xung đột lãnh thổ, biên giới."],"key":"C"},{"q":"Sự sụp đổ của chế độ xã hội chủ nghĩa ở Đông Âu và Liên Xô (1989 – 1991) đã tạo cho Mỹ lợi thế nào sau đây?","options":["Chi phối được các nước tư bản đồng minh đi theo Mỹ.","Tận dụng cơ hội để thiết lập trật tự giới đơn cực.","Đẩy mạnh việc triển khai chiến lược đa phương hoá.","Thực hiện thành công mục tiêu chiến lược toàn cầu."],"key":"B"},{"q":"Đâu không phải là một trong những trụ cột của Cộng đồng ASEAN?","options":["Cộng đồng Chính trị - An ninh.","Cộng đồng An ninh - Quốc phòng.","Cộng đồng Kinh tế.","Cộng đồng Văn hóa - Xã hội."],"key":"B"},{"q":"Đầu năm 1945, đâu là vấn đề cấp bách đặt ra cho các nước Đồng minh chống phát xít?","options":["Phân chia lại thuộc địa của các nước.","Tổ chức lại thế giới sau chiến tranh.","Thiết lập trật tự thế giới mới hai cực.","Phục hồi và phát triển kinh tế thế giới."],"key":"B"},{"q":"Nội dung nào sau đây không phải xu thế phát triển của thế giới sau Chiến tranh lạnh?","options":["Quốc tế hoá - toàn cầu hoá.","Đối thoại, hợp tác cùng phát triển.","Lấy phát triển kinh tế làm trung tâm.","Đa quốc gia, đa bản sắc văn hoá."],"key":"D"},{"q":"“Xây dựng một ASEAN lấy con người làm trung tâm và có trách nhiệm xã hội, nhằm xây dựng tình đoàn kết và thống nhất bền lâu giữa các quốc gia và dân tộc ASEAN bằng cách tạo dựng bản sắc chung, xây dựng một xã hội chia sẻ, đùm bọc, hoà thuận và rộng mở” là một trong những mục tiêu của","options":["Cộng đồng Kinh tế ASEAN.","Cộng đồng Văn hoá - Xã hội ASEAN.","Cộng đồng Hợp tác - Chia sẻ ASEAN.","Cộng đồng Chính trị - An ninh ASEAN."],"key":"B"},{"q":"Việt Nam gia nhập ASEAN vào thời gian nào sau đây?","options":["Năm 1995.","Năm 1996.","Năm 1997.","Năm 1998."],"key":"A"},{"q":"Năm 1997, hai quốc gia nào sau đây trở thành thành viên thứ 8,9 của ASEAN?","options":["Bru-nây và Việt Nam.","Thái Lan và Mi-an-ma.","Cam-pu-chia và Lào.","Lào và Mi-an-ma."],"key":"D"},{"q":"Những quyết định của Hội nghị Ianta trở thành khuôn khổ của trật tự thế giới mới","options":["Trật tự Vécxay - Oasinhtơn","Trật tự đa cực","Trật tự đơn cực","Trật tự 2 cực Ianta."],"key":"D"},{"q":"Sau khi thành lập, Cộng đồng ASEAN sẽ gặp phải một trong những thách thức nào sau đây trong quá trình hoạt động?","options":["Có khoảng cách địa lí giữa hai nhóm nước lục địa và hải đảo.","Nhiều nước vẫn chưa tham gia các diễn đàn lớn trên thế giới.","Chưa có chiến lược mở rộng quan hệ hợp tác ngoài khu vực.","Sự đa dạng chế độ chính trị và đường lối chiến lược ở mỗi nước."],"key":"D"},{"q":"Một trong những thành viên sáng lập Hiệp hội các quốc gia Đông Nam Á (ASEAN) là","options":["Mi-an-ma.","Lào.","Thái Lan.","Cam-pu-chia."],"key":"C"},{"q":"Trong giai đoạn từ năm 1945 đến đầu những năm 70 của thế kỉ XX, Trật tự thế giới hai cực I-an-ta có biểu hiện nào sau đây?","options":["Từ đối kháng chuyển sang đối đầu giữa hai hệ thống xã hội đối lập.","Xác lập và phát triển nhanh với sự đối đầu diễn ra trên nhiều lĩnh vực.","Phát triển mạnh và dẫn tới các cuộc chiến tranh cục bộ giữa Liên Xô – Mỹ.","Từ đối đầu căng thẳng chuyển sang hoà dịu và hoà hoãn Đông Tây."],"key":"B"},{"q":"Từ sau khi Chiến tranh lạnh kết thúc (1991), thế giới phát triển theo một trong những xu thế nào sau đây?","options":["Đa cực, nhiều trung tâm.","Thoả hiệp để ổn định toàn cầu.","Lấy chính trị làm nền tảng.","Hạn chế phổ biến vũ khí hạt nhân."],"key":"A"},{"q":"Những quyết định của Hội nghị I-an-ta cùng sự thoả thuận của Liên Xô, Mỹ và Anh ở Hội nghị Pốt-xđam (1945) đã trở thành khuôn khổ của một trật tự thế giới mới, vì","options":["các nước tham chiến được hưởng nhiều quyền lợi sau chiến tranh.","khép lại trật tự thế giới cũ và xác lập trật tự thế giới “hai cực” đối lập.","mở đầu quá trình giải thể chủ nghĩa thực dân mới ở các thuộc địa.","đã phân chia xong phạm vi ảnh hưởng giữa các nước thắng trận."],"key":"D"},{"q":"Nội dung nào sau đây là xu thế phát triển của thế giới sau Chiến tranh lạnh được nhân dân các nước hi vọng, mong muốn trở thành hiện thực?","options":["Đa cực, đa phe trong đối ngoại quốc tế.","Hoà bình, ổn định để cùng phát triển.","Liên kết và hội nhập giữa các nước lớn.","Phát triển kinh tế, quân sự là trung tâm."],"key":"B"},{"q":"ASEAN chính thức khẳng định ý tưởng thành lập Cộng đồng ASEAN tại Hội nghị nào sau đây?","options":["Hội nghị cấp cao ASEAN lần thứ 13 tại Xin-ga-po (2007).","Hội nghị cấp cao ASEAN lần thứ nhất tại In-đô-nê-xi-a (1976).","Hội nghị cấp cao ASEAN không chính thức ở Ma-lai-xi-a (1997).","Hội nghị cấp cao ASEAN lần thứ 16 tại Hà Nội (2010)."],"key":"C"},{"q":"Nhằm duy trì hoà bình và an ninh thế giới sau chiến tranh, Hội nghị I-an-ta (2-1945) có quyết định quan trọng nào sau đây?","options":["Thành lập Ban Thư kí Liên hợp quốc.","Thành lập tổ chức Liên hợp quốc.","Thành lập tổ chức Hội Quốc liên.","Duy trì và mở rộng Hội Quốc liên."],"key":"B"},{"q":"Kế hoạch Mác-san (1947) của Mỹ và Hội đồng tương trợ kinh tế (SEV) do Liên Xô và các nước Đông Âu thành lập (1949) là một trong những biểu hiện về sự đổi đầu của hai cực thế giới I-an-ta trên lĩnh vực","options":["quân sự.","văn hoá.","pháp lí.","kinh tế."],"key":"D"},{"q":"Nhân tố nào sau đây đóng vai trò quyết định để các cường quốc tham gia xác lập trật tự thế giới mới sau Chiến tranh lạnh?","options":["Sức mạnh tổng hợp của quốc gia, trong đó kinh tế vẫn là trụ cột.","Là 1 trong 5 cường quốc của Hội đồng Bảo an Liên hợp quốc.","Sự ra đời và ngày càng mở rộng của các tổ chức liên kết khu vực.","Sức mạnh quân sự của quốc gia với lực lượng quân sự hùng hậu."],"key":"A"},{"q":"Theo quyết định của các cường quốc tại Hội nghị I-an-ta (2-1945), vùng ảnh hưởng của Liên Xô ở châu Á sẽ là","options":["phía bắc vĩ tuyến 38 trên bán đảo Triều Tiên.","phía nam vĩ tuyến 38 trên bán đảo Triều Tiên.","khu vực Tây Á, Nam Á và Đông Nam Á.","khu vực Trung Đông và bán đảo Triều Tiên."],"key":"A"},{"q":"Bước sang thế kỉ XXI, xu thế chung của thế giới là","options":["hòa bình, hợp tác và phát triển.","hoà hoãn và hoà dịu trong quan hệ quốc tế","cùng tồn tại trong hoà bình, các bên cùng có lợi.","hoà nhập nhưng không hoà tan."],"key":"A"},{"q":"Từ cuối tháng 4 đến cuối tháng 6-1945, 50 nước họp tại Xan Phran-xi-xcô (Mỹ) thông qua nội dung nào sau đây?","options":["Hiệp định đình chiến ở Đông Dương.","Kết thúc chiến tranh Triều Tiên.","Xét xử tội phạm chiến tranh thế giới.","Hiến chương Liên hợp quốc."],"key":"D"},{"q":"Một trong những thách thức về kinh tế mà Cộng đồng ASEAN phải đối mặt trong quá trình xây dựng và phát triển là","options":["sự đa dạng về chế độ chính trị.","những vấn đề lịch sử sâu xa.","chênh lệch trình độ phát triển.","sự xung đột lãnh thổ, biên giới."],"key":"C"},{"q":"Ý tưởng về xây dựng Cộng đồng ASEAN được khởi nguồn từ khi","options":["các nước ASEAN kí kết Hiệp ước Ba-li (1976).","thành lập tổ chức ASEAN (1967) tại Thái Lan.","tổ chức ASE "C"},{"q":"Nội dung nào sau đây là bối cảnh lịch sử thành lập ASEAN?","options":["Xu thế khu vực hoá đã xuất hiện và ngày càng phát triển mạnh mẽ.","Nhiều nước Đông Nam Á đã vươn lên trở thành “con rồng” kinh tế.","Xu thế toàn cầu hoá đã xuất hiện và ngày càng phát triển mạnh mẽ.","Liên Xô và các nước đã tuyên bố chấm dứt cuộc Chiến tranh lạnh."],"key":"A"},{"q":"Xây dựng Cộng đồng ASEAN, định hướng cho sự phát triển trong tương lai của ASEAN là một trong những nội dung quan trọng của văn kiện nào sau đây?","options":["Tuyên bố Cua-la Lăm-pơ (1971).","Tuyên bố Băng Cốc (1967).","Hiến chương ASEAN (2007).","Tầm nhìn ASEAN 2020."],"key":"D"},{"q":"Cộng đồng Chính trị - An ninh ASEAN hoạt động dựa trên cơ sở nào sau đây?","options":["Đồng thuận xây dựng một khối phòng thủ chung.","Hạn chế sử dụng vũ lực trong cộng đồng.","Tôn trọng các nguyên tắc cơ bản của ASEAN.","Thực thi các quyết định dựa trên đa số tán thành."],"key":"C"},{"q":"“Toàn bộ Đông Nam Á sẽ là một cộng đồng ASEAN, nhận thức được các mối liên hệ lịch sử của mình, hiểu rõ di sản văn hoá của mình và gắn bó với nhau bằng một bản sắc chung của khu vực” là một trong những nội dung quan trọng của văn kiện nào sau đây?","options":["Tầm nhìn ASEAN 2020.","Hiệp ước Ba-li.","Tuyên bố về sự hoà hợp ASEAN.","Tuyên bố Băng Cốc."],"key":"A"},{"q":"Trong giai đoạn 1967 – 1976,ASEAN coi trọng vấn đề chính trị – an ninh vì một trong những lí do nào sau đây?","options":["Mỹ bắt đầu có những hành động can thiệp, dính líu vào Đông Dương.","Cuộc Chiến tranh lạnh đã và đang tác động sâu sắc đến nhiều nước.","Xu thế toàn cầu hoá xuất hiện và có những bước phát triển mạnh mẽ.","Việc lập lại hoà bình ở Cam-pu-chia trở thành tâm điểm của khu vực."],"key":"B"},{"q":"Về hoạt động, Cộng đồng Văn hoá - Xã hội ASEAN không có nội dung nào sau đây?","options":["Thúc đẩy hoà bình, hợp tác khu vực.","Phúc lợi và bảo hiểm xã hội.","Bảo đảm môi trường bền vững.","Bảo đảm các quyền công bằng xã hội."],"key":"A"},{"q":"Từ đầu những năm 70 của thế kỉ XX, quan hệ Mỹ – Liên Xô chuyển dần sang hòa dịu, sau đó kết thúc Chiến tranh lạnh (1989) là do","options":["chịu nhiều tốn kém và bị suy giảm thế mạnh về nhiều mặt.","xu thế liên kết khu vực và toàn cầu hoá diễn ra mạnh mẽ.","quá trình mở rộng không ngừng của Liên minh châu Âu (EU).","trật tự nhất siêu, nhiều cường đang trong quá trình mở rộng."],"key":"A"},{"q":"“Xây dựng một môi trường hoà bình và an ninh cho phát triển ở khu vực Đông Nam Á” là một trong những mục tiêu của","options":["Cộng đồng Kinh tế - Tài chính ASEAN.","Cộng đồng Văn hoá - Xã hội ASEAN.","Cộng đồng Văn hoá - Thể thao ASEAN.","Cộng đồng Chính trị - An ninh ASEAN."],"key":"D"},{"q":"Một trật tự thế giới mà ở đó các nước lớn, các trung tâm kinh tế – tài chính lớn như Mỹ, Nhật Bản, Trung Quốc, Ấn Độ, Liên bang Nga, ... có vị thế đối với quan hệ quốc tế được gọi là trật tự","options":["đa cực, nhiều trung tâm.","đơn cực, nhất siêu.","đa phương hoá","tam cường, đa phương."],"key":"A"},{"q":"Quốc gia đứng đầu khối tư bản chủ nghĩa sau Chiến tranh thế giới thứ hai (1945) là","options":["Anh.","Pháp.","Mỹ.","Đức."],"key":"C"},{"q":"Nội dung nào sau đây là một trong những hoạt động nổi bật của Hiệp hội các quốc gia Đông Nam Á (ASEAN) trong giai đoạn 1976 – 1999?","options":["Phát triển số lượng thành viên, từ 5 nước lên 10 nước.","Hợp tác hiệu quả trong hoạt động chống chủ nghĩa khủng bố.","Bước đầu phát triển về cơ cấu tổ chức, nguyên tắc hoạt động.","Các nước tập trung hợp tác trên lĩnh vực chính trị — an ninh."],"key":"A"},{"q":"Năm 1999, quốc gia nào sau đây trở thành thành viên thứ 10 của ASEAN?","options":["Bru-nây.","Mi-an-ma.","Cam-pu-chia.","Lào."],"key":"C"},{"q":"Trong bối cảnh quốc tế đang diễn ra theo nhiều xu thế mới với những diễn biến phức tạp, chủ trương nhất quán của Đảng và Nhà nước Việt Nam là","options":["tham gia liên minh chính trị với Mỹ và các nước phương Tây.","chủ động kết nối các cường quốc để nâng tầm đối tác chiến lược.","hội nhập quốc tế để thu hút vốn đầu tư bên ngoài bằng mọi giá.","chủ động nắm bắt thời cơ, đi tắt đón đầu để vượt qua thách thức."],"key":"D"},{"q":"Một trong những cơ quan chính của Liên hợp quốc được quy định trong Hiến chương Liên hợp quốc (năm 1945) là","options":["Ngân hàng Thế giới.","Quỹ Nhi đồng Liên Hợp quốc.","Hội đồng Bảo an.","Tổ chức Thương mại Thế giới."],"key":"C"},{"q":"Ba nước Đông Dương và Mi-an-ma gia nhập ASEAN trong bối cảnh nào sau đây?","options":["Chủ nghĩa xã hội trở thành hệ thống thế giới.","Bán đảo Triều Tiên được thống nhất trở lại.","Xu thế toàn cầu hoá đang diễn ra mạnh mẽ.","Xu thế hoà hoãn Đông – Tây đang diễn ra."],"key":"C"},{"q":"Nội dung nào sau đây là một trong những trụ cột của Cộng đồng ASEAN?","options":["Cộng đồng Công nghệ ASEAN.","Cộng đồng Quốc phòng ASEAN.","Cộng đồng An ninh ASEAN.","Cộng đồng Kinh tế ASEAN."],"key":"D"},{"q":"Theo thoả thuận của các cường quốc tại Hội nghị I-an-ta (2-1945), địa bàn nào sau đây ở châu Âu sẽ thuộc phạm vi ảnh hưởng của Mỹ?","options":["Béc-lin.","Đông Đức.","Đông Âu.","Tây Âu."],"key":"D"},{"q":"Văn kiện Tầm nhìn ASEAN 2020 đề xuất ý tưởng xây dựng một Cộng đồng ASEAN không có đặc điểm nào sau đây?","options":["Tăng cường hợp tác giữa các nước trong tổ chức và bên ngoài, trọng tâm là hợp tác với EU.","Có nhận thức về các mối quan hệ lịch sử, gắn bó với nhau trong một bản sắc khu vực chung.","Xây dựng lực lượng quân đội khu vực để bảo vệ hoà bình chung cho việc phát triển lâu bền.","Tăng cường ảnh hưởng của Hiệp hội các quốc gia Đông Nam Á ở khu vực và liên khu vực."],"key":"A"},{"q":"Năm 1999, quốc gia nào sau đây được kết nạp, trở thành thành viên thứ 10 của Hiệp hội các quốc gia Đông Nam Á (ASEAN)?","options":["Bru-nây.","Mi-an-ma.","Cam-pu-chia.","Malaixia."],"key":"C"},{"q":"Nội dung nào sau đây là một trong những mục tiêu xây dựng Cộng đồng ASEAN?","options":["Thúc đẩy ASEAN mở rộng hợp tác với bên ngoài.","Tạo điều kiện để ASEAN tập trung hợp tác nội khối.","Đưa tốc độ tăng trưởng của ASEAN cao nhất thế giới.","Đưa ASEAN trở thành một tổ chức nhất thể hoá khu vực."],"key":"A"},{"q":"Quan hệ Mỹ - Liên Xô trong và sau Chiến tranh thế giới thứ hai đã chuyển biến từ","options":["đối đầu sang đối thoại.","đối đầu sang thoả hiệp.","đồng minh sang đối đầu.","đồng minh sang đối tác."],"key":"C"}],"tf":[{"passage":"Trong xu thế đa cực, nhiều trung tâm, Mỹ và Trung Quốc là hai cực có tầm ảnh hưởng lớn đến nền kinh tế thế giới: Mỹ vẫn duy trì vị trí cường quốc số 1 thế giới; từ năm 2010, Trung Quốc đã vượt qua Anh, Pháp, Đức, Nhật Bản để trở thành nền kinh tế thứ hai thể giới. Tuy nhiên, các nước lớn và trung tâm kinh tế, tài chính khác (Nhật Bản, Liên minh châu Âu, Liên bang Nga, Ấn Độ,...) cũng đang nỗ lực vươn lên mạnh mẽ; quốc gia nào cũng muốn khẳng định vị thế, vai trò của mình trong quan hệ quốc tế.","claims":[{"t":"a. Trong trật tự thế giới đa cực, nhiều trung tâm, Mỹ và Trung Quốc là những nước đang có vị thế, ảnh hưởng hàng đầu thế giới.","key":true},{"t":"b. Trật tự thế giới hai cực I-an-ta sụp đổ là nguyên nhân trực tiếp, tạo cơ hội cho Trung Quốc vươn lên trở thành nền kinh tế lớn thứ hai thế giới.","key":false},{"t":"c. Phát huy thành công sức mạnh nội lực là yếu tố quyết định để các nước khẳng định trong xu thế đa cực, nhiều trung tâm.","key":true},{"t":"d. Trong xu thế đa cực và xu thế toàn cầu hoá, các quốc gia có nhiều thời cơ lớn, nhưng lại cũng có không ít thách thức và rào cản.","key":true}]},{"passage":"“Vào thập niên 1980, mối quan hệ nồng ấm giữa Tổng thống Mỹ Ri-gân và nhà lãnh đạo Liên Xô Goóc-ba chớp đã giúp giảm dần tình trạng căng thẳng của CTL. Năm 1987, hai nhà lãnh đạo đã đồng ý huỷ bỏ tên lửa hạt nhân tầm trung. Năm 1989. Goóc-ba chấp cho phép các quốc gia XHCN ở Đông Âu bầu ra chính phủ dân chủ, và đến năm 1991, Liên Xô tan rã thành 15 nước cộng hoà độc lập. Ngày 12-3-1999 Hung-ga-ri, Ba Lan và Cộng hoà Séc gia nhập khối NATO”.\n(King Fisher, Bách khoa thư lịch sử (Nguyễn Đức Tĩnh và Ngô Minh Châu dịch), NXB Thế giới, Hà Nội, 2016, tr.437","claims":[{"t":"a. Trật tự thế giới hai cực I-an-ta bắt đầu bị xói mòn và sụp đổ trong thập niên 1980.","key":false},{"t":"b. Chiến tranh lạnh kết thúc và Trật tự thế giới hai cực I-an-ta sụp đổ bắt nguồn từ những nguyên nhân khác nhau, nhưng yếu tố Mỹ và Liên Xô vẫn là quyết định.","key":true},{"t":"c. Cuộc Chiến tranh lạnh đã kết thúc và Trật tự thế giới hai cực I-an-ta đã sụp đổ, nhưng nhiều di chứng của nó vẫn còn và vẫn đang tiếp diễn ở nhiều nơi trên thế giới.","key":true},{"t":"d. Việc Liên Xô tan rã (1991) đã chính thức chấm dứt cục diện hai cực, hai phe.","key":false}]},{"passage":"[Đối với việc thúc đẩy quá trình phi thực dân hoá trên thế giới, năm 1960] “Đại hội đồng Liên hợp quốc đã thông qua bản Tuyển ngôn về thủ tiêu hoàn toàn chủ nghĩa thực dân, trao trả độc lập cho các quốc gia và dân tộc thuộc địa... Như thế, Tuyên ngôn đã khẳng định các nước thực dân đã vi phạm nguyên tắc quan trọng nhất của luật pháp quốc tế; khẳng định rõ ràng cơ sở pháp lí quốc tế của cuộc đấu tranh giành độc lập của các dân tộc bị áp bức”.\n(Nguyễn Quốc Hùng, Nguyễn Hồng Quân, Liên hợp quốc và Lực lượng gìn giữ hoà bình Liên hợp quốc, NXB Chính trị quốc gia, Hà Nội, 2008, tr.46)","claims":[{"t":"a. Liên hợp quốc đóng vai trò quyết định vào quá trình giải trừ chủ nghĩa thực dân.","key":false},{"t":"b. Việt Nam trở thành biểu tượng thúc đẩy quá trình phi thực dân hoá trên thế giới.","key":true},{"t":"c. Mỹ và các nước phương Tây là những quốc gia dân chủ và tiên tiến, đi tiên phong trong việc ủng hộ thúc đẩy quá trình phi thực dân hoá trên thế giới.","key":false},{"t":"d. Cuộc đấu tranh xóa bỏ thuộc địa do các nước đế quốc lập ra trước Chiến tranh thế thứ hai ở châu Á, châu Phi và Mỹ La-tinh được gọi là quá trình phi thực dân hoá.","key":true}]},{"passage":"“Tháng 3-1947, Tổng thống Mỹ - Tơ-ru-man đã đọc diễn văn trước Quốc hội Mỹ, chính thức đưa ra chủ nghĩa Tơruman. Theo Tơ-ru-man thì các nước Đông Âu vừa mới bị cộng sản thôn tính và những đe dọa tương tự đang diễn ra trên nhiều nước khác ở châu Âu, ở I-ta-li-a, Pháp và cả nước Đức nữa. Vì vậy, Mỹ phải đứng ra đảm nhận sứ mệnh lãnh đạo thế giới tự do, phải giúp đỡ cho các dân tộc trên thế giới chống lại sự đe dọa của chủ nghĩa cộng sản, chống lại sự bành trướng của nước Nga, giúp đỡ bằng mọi biện pháp kinh tế, quân sự. Tổng thống Mỹ Tơ-ru-man đã phát động cuộc chiến tranh lạnh chống Liên Xô và các nước xã hội chủ nghĩa.”\n(Nguyễn Anh Thái, Lịch sử thế giới hiện đại (1917-1995), NXB Giáo dục, tr. 235).","claims":[{"t":"a) Chiến tranh lạnh là cuộc đối đầu trực tiếp giữa Mĩ và các nước trên thế giới.","key":false},{"t":"b) Thông điệp của Tổng thống Mỹ Tơ-ru-man tại Quốc hội Mỹ (1947) được xem là khởi đầu cho cuộc Chiến tranh lạnh.","key":true},{"t":"c) Trong thời kì Chiến tranh lạnh, các cuộc “chiến tranh ủy nhiệm” đã để lại hậu quả nặng nề đối với nhiều quốc gia.","key":true},{"t":"d) Cuộc chiến tranh xâm lược của Pháp và Mĩ ở Việt Nam (1945 – 1975) biến Việt Nam trở thành tâm điểm lớn nhất trong Chiến tranh lạnh.","key":false}]},{"passage":"“Trật tự thế giới mới này được hình thành như thế nào, còn tùy thuộc ở nhiều nhân tố: Sự phát triển về thực lực kinh tế, chính trị, quân sự của các cường quốc Mỹ, Nga, Trung Quốc, Anh, Pháp, Nhật Bản, Đức trong cuộc chạy đua về sức mạnh quốc gia tổng hợp... Sự lớn mạnh của lực lượng cách mạng thế giới (sự thành bại của công cuộc cải cách, đổi mới ở các nước xã hội chủ nghĩa,...); Sự phát triển của cách mạng khoa học – kĩ thuật sẽ còn tiếp tục tạo ra những “đột phá” và biến chuyển trên cục diện thế giới”.\n(Nguyễn Anh Thái (Chủ biên), Lịch sử thế giới hiện đại, NXB Giáo dục Việt Nam, Hà Nội, 2021, tr.424)","claims":[{"t":"a. Đoạn tư liệu là minh chứng cho xu thế đa cực, nhiều trung tâm trong quan hệ quốc tế trong thời gian diễn ra cuộc Chiến tranh lạnh.","key":false},{"t":"b. Trong quan hệ quốc tế, khái niệm đa cực chỉ trạng thái địa – chính trị toàn cầu với ba trung tâm quyền lực chi phối là Mỹ, Liên bang Nga và Trung Quốc.","key":false},{"t":"c. Khái niệm đa cực được dùng chủ yếu để chỉ trật tự thế giới sau Chiến tranh lạnh.","key":true},{"t":"d. Để có thể trở thành một cực trong xu thế đa cực, nhiều trung tâm, các nước phải có chiến lược xây dựng sức mạnh tổng hợp, trong đó sức mạnh kinh tế là trụ cột.","key":true}]},{"passage":"“Toàn bộ Đông Nam Á sẽ là một cộng đồng ASEAN, nhận thức được các mối liên hệ lịch sử của mình, hiểu rõ di sản văn hoá của mình và gắn bó với nhau bằng một bản sắc chung của khu vực”.\n(Nguồn: Cổng Thông tin ASEAN – Việt Nam)","claims":[{"t":"a. Đoạn tư liệu là một phần nội dung được đề cập trong văn kiện Tầm nhìn ASEAN 2020.","key":true},{"t":"b. Việc thành lập Cộng đồng ASEAN đã tăng cường sự hợp tác giữa các nước ASEAN, đưa tổ chức này phát triển lên một nấc thang mới.","key":true},{"t":"c. Cộng đồng ASEAN ra đời không có mối liên hệ với Hiệp hội các quốc gia Đông Nam Á.","key":false},{"t":"d. Sự ra đời của Cộng đồng ASEAN là một trong những biểu hiện của xu thế toàn cầu hoá.","key":true}]},{"passage":"Hiệp ước thân thiện và hợp tác (Hiệp ước Ba-li) được Hiệp hội các quốc gia Đông Nam Á (ASEAN) thông qua tại Ba-li (In-đô-nê-xi-a, tháng 2-1976), đã đặt khuôn khổ cho một nền hoà bình lâu dài ở khu vực, dựa trên cơ sở tôn trọng độc lập, chủ quyền của nhau; không can thiệp vào nội bộ của nhau; giải quyết các tranh chấp trong khu vực bằng biện pháp hoà bình; kêu gọi các nước hợp tác có hiệu quả trên các lĩnh vực nông – công nghiệp, thương mại,... vì lợi ích chung của các nước trong khu vực.","claims":[{"t":"a. Hiệp ước Ba-li (1976) đã xác định được những nguyên tắc cơ bản trong quan hệ giữa các nước trong khu vực Đông Nam Á.","key":true},{"t":"b. Hiệp ước Ba-li đã mở ra một bước phát triển mới của Hiệp hội các quốc gia Đông Nam Á (ASEAN).","key":true},{"t":"c. Nội dung cơ bản của Hiệp ước Ba-li được xây dựng trên nguyên tắc hoạt động của Liên hợp quốc, trong đó coi trọng vấn đề an ninh – chính trị của khu vực Đông Nam Á.","key":true},{"t":"d. Hiệp hội các quốc gia Đông Nam Á (ASEAN) thông qua Hiệp ước Ba-li (1976) với mục tiêu hàng đầu là kết nối và kết nạp các nước trong khu vực vào tổ chức ASEAN.","key":false}]},{"passage":"“Cộng đồng ASEAN sẽ được thành lập gồm ba trụ cột là hợp tác chính trị và an ninh, hợp tác kinh tế và hợp tác văn hoá - xã hội được gắn kết chặt chẽ và cùng tăng cường cho mục đích đảm bảo hoà bình, ổn định lâu dài và cùng thịnh vượng trong khu vực”.\n(Trích: Thỏa ước Ba-li II (2003), Nguồn: Bộ Ngoại giao)","claims":[{"t":"a. Theo nội dung tư liệu, Cộng đồng ASEAN ra đời và hoạt động dựa trên ba trụ cột nhằm tăng cường sự hợp tác, gắn kết giữa các nước trong khu vực.","key":true},{"t":"b. Trong ba trụ cột của Cộng đồng ASEAN, trụ cột về văn hoá – xã hội được các thành viên xác định là quan trọng nhất.","key":false},{"t":"c. Một trong những mục tiêu thành lập Cộng đồng ASEAN là hướng tới duy trì hoà bình ổn định của khu vực Đông Nam Á.","key":true},{"t":"d. Ba trụ cột của Cộng đồng ASEAN được thành lập phản ánh quy luật tất yếu của sự hợp tác giữa các nước trong xu thế hoà hoãn Đông – Tây.","key":false}]},{"passage":"Trong quá trình tìm kiếm sự hợp tác giữa các nước Đông Nam Á đã xuất hiện những tổ chức khu vực và kí các hiệp ước giữa các nước trong khu vực. Tháng 1-1959, Hiệp ước hữu nghị và kinh tế Đông Nam Á (SAFET) bao gồm Ma-lai-xi-a và Phi-lip-pin ra đời. Tháng 7-1961, Hội Đông Nam Á (ASA) gồm Ma-lai-xi-a, Phi-lip-pin và Thái Lan được thành lập. Tháng 8-1963, một tổ chức gồm Ma-lai-xi-a, Phi-lip-pin, In-đô-nê-xi-a (MAPHILINDO) được thành lập. Tuy nhiên, những tổ chức trên đây không tồn tại được lâu do sự bất đồng giữa các nước về vấn đề lãnh thổ và chủ quyền”.\n(Nguyễn Anh Thái (Chủ biên), Lịch sử thế giới hiện đại, NXB Giáo dục, Hà Nội, 1998, tr.358)","claims":[{"t":"a. Ma-lai-xi-a, Phi-lip-pin, Thái Lan, In-đô-nê-xi-a là những quốc gia sớm có ý tưởng về việc thành lập một tổ chức khu vực ở Đông Nam Á.","key":true},{"t":"b. Yếu tố quyết định để thành lập và mở rộng Hiệp hội các quốc gia Đông Nam Á (ASEAN) là các nước phải tôn trọng độc lập, chủ quyền và lãnh thổ của nhau.","key":true},{"t":"c. Các tổ chức tiền thân của Hiệp hội các quốc gia Đông Nam Á (ASEAN) không tồn tại lâu là do không thống nhất được giá cả và thị trường tiêu thụ hàng hoá.","key":false},{"t":"d. Trong bối cảnh khu vực và quốc tế có nhiều biến động, yêu cầu hợp tác để phát triển giữa các nước trong khu vực Đông Nam Á là yêu cầu tất yếu. cùng","key":true}]},{"passage":"“Thúc đẩy sự tăng trưởng kinh tế, tiến bộ xã hội và phát triển văn hoá trong khu vực thông qua những nỗ lực hợp tác chung trên tinh thần bình đẳng và hợp tác nhằm tăng cường cơ sở cho một cộng đồng các nước Đông Nam Á hoà bình và thịnh vượng.\nThúc đẩy hoà bình ổn định khu vực bằng việc tôn trọng pháp lí và nguyên tắc luật pháp trong quan hệ giữa các nước trong khu vực và tuân thủ các nguyên tắc của Hiến chương Liên hợp quốc.\nThúc đẩy sự cộng tác tích cực và giúp đỡ lẫn nhau trong các vấn đề cùng quan tâm trên các lĩnh vực kinh tế, xã hội, văn hoá, khoa học – kĩ thuật và hành chính”.\n(Nguyễn Anh Thái (Chủ biên), Lịch sử thế giới hiện đại, NXB Giáo dục, Hà Nội, 1998, tr.358)","claims":[{"t":"a. Hiệp hội các quốc gia Đông Nam Á (ASEAN) ra đời năm 1967 là một tổ chức liên thiết giữa  minh chính trị – kinh tế của khu vực, nằm trong Cộng đồng ASEAN.","key":false},{"t":"b. Nguyên tắc hoạt động của Hiệp hội các quốc gia Đông Nam Á (ASEAN) có những điểm tương đồng với nguyên tắc hoạt động của Liên hợp quốc.","key":true},{"t":"c. Một trong những mục đích thành lập của Hiệp hội các quốc gia Đông Nam Á (ASEAN) là duy trì hoà bình ổn định của khu vực.","key":true},{"t":"d. Ngay từ khi ra đời, Hiệp hội các quốc gia Đông Nam Á (ASEAN) đã hướng đến xây dựng một cộng đồng vì hoà bình và thịnh vượng.","key":true}]},{"passage":"“Trong lĩnh vực giáo dục và đào tạo, ASEAN khuyến khích phát triển giáo dục suốt đời, sử dụng công nghệ thông tin và truyền thông (ICT) như những phương tiện thúc đẩy nền giáo dục ASEAN và nâng cao nhận thức về ASEAN. Các dự án khác nhau dành cho các cấp học ở phổ thông và đại học cũng cần được thực hiện nhằm phát triển và nâng cao chất lượng nguồn nhân lực cho các nước thành viên, đặc biệt là nguồn nhân lực trẻ, khẳng định vai trò tiên phong của thanh niên trong việc tham gia xây dựng Cộng đồng ASEAN”.\n(Lương Ninh, Đông Nam Á Lịch sử từ nguyên thủy đến ngày nay, NXB Chính trị quốc gia, Hà Nội, 2015, tr.932)","claims":[{"t":"a. . Nguồn nhân lực trẻ đóng vai trò quyết định hàng đầu trong việc tham gia xây dựng Cộng đồng ASEAN.","key":false},{"t":"b. . ASEAN khuyến khích phát triển giáo dục suốt đời nhằm thúc đẩy nền giáo dục ASEAN và nâng cao nhận thức về ASEAN.","key":true},{"t":"c. . Phát triển và nâng cao chất lượng nguồn nhân lực, ngoài việc nâng cao thể chất, về thực chất là phát triển giáo dục, đào tạo.","key":true},{"t":"d. . Phương tiện thúc đẩy nền giáo dục ASEAN là sử dụng công nghệ thông tin và trí tuệ nhân tạo (AI).","key":false}]},{"passage":"“Trước kia, chế độ quân chủ tại Hy Lạp đã nhờ vào sự giúp đỡ của Anh, nhưng sau Chiến tranh thế giới thứ hai, kinh tế của nước Anh hoàn toàn suy kiệt, lo cho mình còn không xong, nên không thể giúp đỡ gì cho chế độ quân chủ ở Hy Lạp nữa.\nVào ngày 12-3-1947, Tổng thống Tơ-ru-man đã đọc một bài diễn văn tại lưỡng viện Quốc hội Mỹ, cho rằng Hy Lạp và Thổ Nhĩ Kỳ nếu bị rơi vào khối xã hội chủ nghĩa, thì cả Trung Đông cũng sẽ rơi theo... sẽ làm cho cả Tây Âu bị ảnh hưởng. Do vậy, ông thuyết phục Quốc hội Mỹ chi viện kinh tế và quân sự cho Hy Lạp và Thổ Nhĩ Kỳ với số tiền 400 triệu đô la. Li luận này về sau được gọi là “Học thuyết Tơ-ru-man””.\n(Vương Kính Chi, Lược sử nước Mỹ (Phong Đảo dịch), NXB Thành phố Hồ Chí Minh, Thành phố Hồ Chí Minh, 2000, tr.145)","claims":[{"t":"a. Chiến tranh lạnh là cuộc đối đầu gay gắt giữa Mỹ và Liên Xô, chỉ diễn ra ở châu Âu.","key":false},{"t":"b. Thông điệp của Tổng thống Mỹ Tơ-ru-man đọc trước Quốc hội Mỹ ngày 12-3-1947 Tin đã khởi đầu cuộc Chiến tranh lạnh chống lại Liên Xô và các nước Đông Âu.","key":true},{"t":"c. Nguồn gốc của sự đối đầu căng thẳng giữa Mỹ và Liên Xô xuất phát từ “vấn đề Hy Lạp và Thổ Nhĩ Kỳ” sau Chiến tranh thế giới thứ hai.","key":false},{"t":"d. Học thuyết Tơ-ru-man phản ánh chính sách đối ngoại của Mỹ sau Chiến tranh thế giới thứ hai, muốn đưa nước Mỹ trở thành bá chủ thế giới.","key":true}]},{"passage":"“Các nguyên tắc hoạt động của Liên hợp quốc bao gồm: Bình đẳng về chủ quyền quốc gia; Tôn trọng toàn vẹn lãnh thổ và độc lập chính trị quốc gia; Từ bỏ đe dọa bằng vũ lực hoặc sử dụng vũ lực trong quan hệ quốc tế; Không can thiệp vào công việc nội bộ các nước; Tôn trọng nghĩa vụ quốc tế và luật pháp quốc tế; Giải quyết các tranh chấp quốc tế bằng biện pháp hòa bình”.\n(Trích SGKLS lớp 12 trang 9 – Bộ KNTN, NXB GDVN năm 2024)","claims":[{"t":"a) Hòa bình là ưu tiên hàng đầu trong giải quyết mâu thuẫn giữa các nước.","key":true},{"t":"b) Cho phép các nước lớn được can thiệp vào các nước nhỏ.","key":false},{"t":"c) Theo nguyên tắc Liên Hợp Quốc, việc sử dụng vũ lực là cần thiết trong quan hệ quốc tế.","key":false},{"t":"d) Tất cả các nước thành viên của Liên hợp quốc phải tuân theo một thể chế nhà nước.","key":false}]},{"passage":"“Bài học của thời kì Chiến tranh lạnh đã chứng tỏ phương thức quan hệ quốc tế lấy đối đầu chính trị - quân sự là chủ yếu không còn phù hợp, phải chịu nhiều tổn thất hoặc thất bại như hai nước Xô – Mỹ và một bị thương, một bị mất. Trong khi đó, phương thức lấy hợp tác và cạnh tranh về kinh tế - chính trị là chính lại thu được nhiều tiến bộ, kết quả như các nước Đức, Nhật và NICs. Sự hưng thịnh hay suy vong của một quốc gia quyết định bởi sức mạnh tổng hợp của quốc gia đó, mà chủ yếu là thực lực kinh tế và khoa học – kĩ thuật”.\n(Vũ Dương Ninh (Chủ biên), Một số chuyên đề lịch sử thế giới, NXB Đại học Quốc gia, Hà Nội, 2001, tr.401)","claims":[{"t":"a. . Trong  thời kì chiến tranh lạnh, Xô – Mỹ lấy đối đầu về chính trị - quân sự là chủ yếu, Đức và Nhật Bản lấy hợp tác và cạnh tranh về kinh tế - chính trị là chủ yếu.","key":true},{"t":"b. . Trong thời kì chiến tranh lạnh và sau thời kì chiến tranh lạnh, nội dung của quan hệ quốc tế có sự điều chỉnh từ lấy yếu tố quân sự sang lấy yếu tố kinh tế là trọng tâm.","key":true},{"t":"c. . Một trong những bài học rút ra từ thời kì chiến tranh lạnh cho tất cả các quốc gia là không nên tập trung vào phát triển quân sự, quốc phòng đất nước.","key":false},{"t":"d. . Kinh tế và khoa học – kĩ thuật là hai yếu tố chủ yếu tạo nên sức mạnh tổng hợp của một quốc gia sau khi chiến tranh lạnh chấm dứt.","key":true}]},{"passage":"Ở Châu Á, chiến tranh Triều Tiên (1950 - 1953), chiến tranh xâm lược Việt Nam của thực dân Pháp (1945 - 1954) và chiến tranh xâm lược Việt Nam của đế quốc Mỹ (1954- 1975), là những cuộc chiến tranh cục bộ tiêu biểu. Ở khu vực Trung Đông, chiến tranh Trung Đông giữa I-xra-en và các nước Ả-rập bất đầu từ năm 1948 và kéo dài trong nhiều năm.\n(Sách giáo khoa Lịch sử 12 – KNTT – tr.15)","claims":[{"t":"a. . Chiến tranh Triều Tiên (1950 -1953) là cuộc chiến tranh cục bộ, có sự can thiệp của Mỹ và Liên Xô.","key":true},{"t":"b. . Chiến tranh xâm lược Việt Nam của thực dân Pháp (1945 - 1954) và của đế quốc Mỹ (1954- 1975) là sản phẩm của chiến tranh lạnh.","key":true},{"t":"c. . Chiến tranh Trung Đông giữa I-xra-en và các nước Ả-rập là cuộc xung đột tôn giáo lớn giữa đạo Thiên chúa với đạo Hồi.","key":false},{"t":"d. . Các cuộc chiến tranh Đông Dương (1945-1954), chiến tranh Triều Tiên(1950-1953) chứng tỏ Châu Á là tâm điểm đối đầu giữa 2 cực Xô - Mỹ.","key":true}]},{"passage":"Tháng 6-1941, tại Luân Đôn (Anh), các nước Đồng minh ra tuyên bố cam kết cùng hợp tác cả trong chiến tranh và hoà bình. Sự kiện này đã đặt cơ sở cho việc hướng tới thành lập Liên hợp quốc. Từ đó, các nước Đồng minh (vai trò lớn nhất thuộc về Liên Xô, Mỹ và Anh) đã tổ chức nhiều cuộc họp ở Tê-hê-ran (I-ran) và Mát-xcơ-va (Liên Xô) để sớm thành lập một tổ chức quốc tế, nhằm thực hiện việc duy trì hoà bình và an ninh thế giới.\nTại Hội nghị I-an-ta (2-1945), Liên Xô, Mỹ và Anh đã thống nhất thành lập tổ chức Liên hợp quốc. Ngày 24-10-1945, với sự phê chuẩn Hiến chương của các thành viên, tổ chức Liên hợp quốc chính thức được thành lập.","claims":[{"t":"a. Quá trình hình thành Liên hợp quốc kéo dài từ năm 1941 đến năm 1945, phù hợp tài với khát vọng được sống trong hoà bình của nhân dân thế giới.","key":true},{"t":"b. Cho đến nay, Liên hợp quốc vẫn là tổ chức liên kết quốc tế lớn nhất hành tinh, có nhiệm vụ hàng đầu là tập trung vào ổn định nền kinh tế toàn cầu.","key":false},{"t":"c. Liên Xô, Mỹ và Anh là những nước có vị thế hàng đầu trong việc đặt cơ sở và tích cực trong quá trình thành lập Liên hợp quốc.","key":true},{"t":"d. Việt Nam là một trong những quốc gia sớm gia nhập Liên hợp quốc, sau khi nước Việt Nam Dân chủ Cộng hoà ra đời (9-1945).","key":false}]},{"passage":"Từ đầu những năm 70 của thế kỉ XX, trên thế giới diễn ra nhiều cuộc gặp gỡ thương lượng của nguyên thủ quốc gia các nước và khu vực: Mỹ và Liên Xô, Mỹ với Trung Quốc, hai miền nước Đức, Đông Âu và Tây Âu,... Tháng 12-1989, trong một cuộc họp không chính thức tại đảo Man-ta (Địa Trung Hải), đại diện hai nhà lãnh đạo cấp cao của Liên Xô (Goóc-ba-chốp) và Mỹ (Bu-sơ) đã chính thức cùng tuyên bố chấm dứt Chiến tranh lạnh.\nSau Chiến tranh lạnh, Liên Xô, Mỹ và các nước đã thỏa thuận giải quyết cuộc xung đột ở nhiều nơi trên thế giới bằng giải pháp hoà bình: ở Áp-ga-ni-xtan, Cam-pu-chia, Tây Nam Phi, ... Nhiều tổ chức liên minh khu vực và châu lục được mở rộng, hoặc thay đổi tên gọi mới, kết nạp thêm thành viên và kết nối liên lục địa (ASEAN, EU, ASEM, APEC, ...).","claims":[{"t":"a. Mặc dù Chiến tranh lạnh vẫn tiếp diễn, nhưng từ đầu những năm 70 của thế kỉ XX, xu thế hoà hoãn Đông – Tây đã diễn ra.","key":false},{"t":"b. Xu thế hoà hoãn Đông – Tây chỉ được diễn ra, bàn luận và quyết định bởi các cuộc  gặp gỡ thương lượng giữa nguyên thủ quốc gia của hai nước Liên Xô và Mỹ.","key":false},{"t":"c. Trong xu thế hoà hoãn Đông – Tây, Việt Nam luôn ủng hộ và đã thành công trong việc kí Hiệp định Pa-ri (1973) và giải quyết “vấn đề Cam-pu-chia” (1991).","key":true},{"t":"d. Chiến tranh lạnh chấm dứt, sau đó là Trật tự thế giới hai cực I-an-ta sụp đổ đã mở ra  chiều hướng và những điều kiện giải quyết quan hệ quốc tế bằng giải pháp hoà bình.","key":true}]},{"passage":"“1. Duy trì hoà bình và an ninh quốc tế, và để đạt được mục đích đó, thi hành những biện pháp tập thể có hiệu quả để phòng ngừa và loại trừ các mối đe dọa hoà bình, cấm mọi hành vi xâm lược và phá hoại hoà bình khác; điều chỉnh hoặc giải quyết các vụ tranh chấp hoặc những tình thế có tính chất quốc tế có thể đưa đến sự phá hoại hoà bình, bằng phương pháp hoà bình theo đúng nguyên tắc của công lý và pháp luật quốc tế;\n2. Phát triển mối quan hệ hữu nghị giữa các dân tộc trên cơ sở tôn trọng nguyên tắc bình đẳng và tự quyết của các dân tộc và áp dụng những biện pháp phù hợp khác để củng cố hoà bình thế giới;\n3. Thực hiện sự hợp tác quốc tế trong việc giải quyết các vấn đề quốc tế về kinh tế, xã hội, văn hoá và nhân đạo và khuyến khích phát triển sự tôn trọng các quyền của con người và các tự do cơ bản cho tất cả mọi người không phân biệt chủng tộc, nam nữ, ngôn ngữ hoặc tôn giáo;\n4. Trở thành trung tâm phối hợp mọi hành động của các dân tộc, nhằm đạt được những mục đích chung nói trên.”\n(Trích: Điều 1, Hiến chương Liên hợp quốc, ngày 24-10-1945)","claims":[{"t":"a) Đoạn tư liệu trên đã phản ánh rõ các mục tiêu và nguyên tắc hoạt động của tổ chức Liên hợp quốc.","key":false},{"t":"b) Trong số các mục tiêu của Liên hợp quốc, duy trì hoà bình và an ninh quốc tế là mục tiêu hàng đầu, được các nước thành viên chú trọng.","key":true},{"t":"c) Mối quan hệ giữa các nước thành viên của Liên hợp quốc được xây dựng chủ yếu dựa trên nền tảng là quyền lợi quốc gia, quyền lợi dân tộc là trên hết.","key":false},{"t":"d) Ngày nay, Liên hợp quốc vẫn tiếp tục thực hiện mục tiêu giải quyết các vụ tranh chấp, xung đột quốc tế bằng biện pháp hoà bình.","key":true}]},{"passage":"“Mọi người sinh ra đều được tự do và bình đẳng về nhân quyền và các quyền. Mọi người đều được tạo hoá ban cho lí trí và lương tâm, và cần phải đối xử với nhau bằng tình anh em”.\n(Trích: Điều 1, Tuyên ngôn Quốc tế Nhân quyền của Liên hợp quốc)","claims":[{"t":"a. Tuyên ngôn Quốc tế Nhân quyền của Liên hợp quốc là tuyên ngôn về các quyền của con người nói chung, không có sự phân biệt nước lớn, nước nhỏ.","key":true},{"t":"b. Theo Điều 1 của Tuyên ngôn Quốc tế Nhân quyền, chỉ các dân tộc trên thế giới sau khi giành được độc lập mới có quyền tự do và bình đẳng.","key":false},{"t":"c. Tuyên ngôn Quốc tế Nhân quyền đã góp phần xây dựng một thế giới công bằng hơn, tạo cơ hội phát triển cho tất cả mọi người ở mọi quốc gia trên thế giới.","key":true},{"t":"d. Trong việc bảo đảm quyền con người, Liên hợp quốc chỉ tập trung bảo vệ quyền phụ nữ và trẻ em ở các nước đang chịu “di chứng” của chủ nghĩa thực dân.","key":false}]},{"passage":"“Không có nội dung nào trong Hiến chương này cho phép Liên hợp quốc can thiệp vào các vấn đề về thực chất thuộc quyền nội bộ của bất kì quốc gia nào hoặc yêu cầu các thành viên đưa những vấn đề đó ra giải quyết theo Hiến chương hiện tại...”.\n(Trích: Điều 2, Hiến chương Liên hợp quốc)","claims":[{"t":"a. Theo tư liệu, nguyên tắc hoạt động của Liên hợp quốc được thể hiện tại Điều 2 của Hiến chương Liên hợp quốc.","key":true},{"t":"b. Hiến chương Liên hợp quốc có nhiều nguyên tắc, trong đó nhấn mạnh việc không can thiệp vào công việc nội bộ của các quốc gia.","key":true},{"t":"c. Một nguyên tắc quan trọng trong quá trình hoạt động của Liên hợp quốc là nếu có tranh chấp quốc tế thì các bên phải giải quyết bằng biện pháp hoà bình.","key":true},{"t":"d. Liên hợp quốc quy định các nước thành viên phải tôn trọng toàn vẹn lãnh thổ và độc lập chính trị của 5 cường quốc (Liên Xô, Mỹ, Anh, Pháp và Trung Quốc).","key":false}]},{"passage":"“Xây dựng một cộng đồng dựa trên các giá trị và chuẩn mực chung; Tạo dựng một khu vực gắn kết, hoà bình và tự cường với trách nhiệm chung đối với an ninh toàn diện; Hướng tới một khu vực năng động và rộng mở với bên ngoài trong một thế giới ngày càng liên kết và tuỳ thuộc”.\n(Nguồn: Cổng Thông tin Việt Nam - ASEAN)","claims":[{"t":"a. Nội dung tư liệu ghi nhận một trong những hoạt động của Cộng đồng Chính trị - An ninh ASEAN.","key":true},{"t":"b. Kế hoạch xây dựng Cộng đồng ASEAN cho thấy sự phù hợp với bối cảnh toàn cầu hoá.","key":true},{"t":"c. Cộng đồng Chính trị - An ninh ASEAN giữ vai trò quyết định trong việc duy trì hoà bình, ổn định lâu dài của khu vực Đông Nam Á.","key":true},{"t":"d. Sự ra đời của Cộng đồng Chính trị - An ninh ASEAN là sáng kiến của ba nước Đông Dương.","key":false}]}],"short":[],"essay":[],"verified":false,"source":"Đề cương người dùng cung cấp; một số đáp án có thể gây tranh luận."},{"id":"VL-1","title":"Đề 1 · Tư duy nhiệt học","desc":"Đề nâng cao: chuyển thể, nhiệt lượng, nội năng, thang nhiệt độ và bài toán công khí.","mc":[{"q":"Trong một chất rắn kết tinh ở nhiệt độ không đổi, mô tả nào phù hợp nhất về các hạt cấu tạo?","options":["Chuyển động hỗn loạn khắp thể tích bình.","Dao động quanh những vị trí cân bằng tương đối cố định.","Đứng yên hoàn toàn tại nút mạng.","Chỉ chuyển động tịnh tiến theo một chiều."],"key":"B"},{"q":"Khi nước tinh khiết đang sôi ở áp suất không đổi, nhiệt lượng cung cấp chủ yếu dùng để","options":["tăng nhiệt độ của nước.","tăng khối lượng riêng của nước.","thực hiện quá trình chuyển thể.","giảm nội năng của nước."],"key":"C"},{"q":"Trường hợp nào làm nội năng của vật tăng chủ yếu nhờ thực hiện công?","options":["Cốc nước nóng nguội trong phòng.","Thìa kim loại ấm lên trong trà nóng.","Không khí trong xi lanh bị nén nhanh.","Tảng băng tan trong nước ấm."],"key":"C"},{"q":"Với quy ước A là công do ngoại lực thực hiện lên hệ, Q là nhiệt lượng hệ nhận, định luật I là","options":["ΔU = A + Q.","ΔU = A − Q.","ΔU = Q − A.","ΔU = −A − Q."],"key":"A"},{"q":"Đơn vị SI của nhiệt dung riêng là","options":["J/kg.","J/(kg·K).","J/K.","J·kg/K."],"key":"B"},{"q":"Biểu thức nhiệt lượng làm nóng vật khối lượng m, nhiệt dung riêng c, tăng ΔT (không chuyển thể) là","options":["Q = mc/ΔT.","Q = mΔT/c.","Q = mcΔT.","Q = cΔT/m."],"key":"C"},{"q":"Nhiệt độ 27 °C tương ứng gần đúng với","options":["246 K.","273 K.","300 K.","327 K."],"key":"C"},{"q":"Mốc 0 K được gọi là","options":["nhiệt độ nước đá đang tan.","nhiệt độ không tuyệt đối.","nhiệt độ sôi của nước.","nhiệt độ phòng tiêu chuẩn."],"key":"B"},{"q":"Nhiệt nóng chảy riêng có đơn vị SI là","options":["J/(kg·K).","kg/J.","J/kg.","J/K."],"key":"C"},{"q":"Trong thí nghiệm xác định nhiệt hóa hơi riêng bằng phương pháp điện, đại lượng nào trực tiếp giúp tính năng lượng điện đã cấp?","options":["Hiệu điện thế, cường độ dòng điện và thời gian.","Chiều cao bình nước và đường kính dây.","Áp suất khí quyển và thể tích phòng.","Nhiệt độ phòng và diện tích mặt bàn."],"key":"A"},{"q":"Khi hai vật khác nhiệt độ tiếp xúc nhiệt với nhau (hệ cô lập), nhiệt tự truyền từ","options":["vật có khối lượng lớn sang vật nhỏ.","vật có nhiệt dung lớn sang vật bé.","vật lạnh sang vật nóng.","vật nóng sang vật lạnh."],"key":"D"},{"q":"Ở đồ thị nhiệt độ theo thời gian của băng đang nóng chảy ở áp suất không đổi, đoạn nằm ngang thể hiện","options":["băng tiếp tục thu nhiệt để chuyển thể.","nhiệt lượng thu vào bằng không.","nhiệt dung riêng của băng bằng không.","băng bị làm lạnh."],"key":"A"}],"tf":[{"passage":"Một khối khí nhận 550 J nhiệt lượng; ngoại lực nén khối khí và thực hiện công 150 J. Quy ước Q > 0 khi hệ nhận nhiệt, A > 0 khi hệ nhận công.","claims":[{"t":"Khối khí nhận nhiệt lượng Q = +550 J.","key":true},{"t":"Công A tác dụng lên khối khí có giá trị âm.","key":false},{"t":"Độ biến thiên nội năng của khối khí là +700 J.","key":true},{"t":"Nếu khối khí được cho giãn nở sinh công 150 J thay vì bị nén (Q vẫn 550 J), ΔU sẽ bằng 400 J.","key":true}]},{"passage":"Đun nóng 0,20 kg nước đá ở 0 °C bằng nguồn gia nhiệt đều. Bỏ qua thất thoát; λ = 3,34×10^5 J/kg; c_nước = 4200 J/(kg·K).","claims":[{"t":"Ở 0 °C, nước đá có t 0,12 = 0,0006 m³. Công do khí thực hiện W = pΔV = 120 J; ΔU = Q − W = 380 J."}],"subject":"physics","mode":"exam","minutes":45,"verified":false,"source":"Đề tham khảo biên soạn theo ma trận giữa kì I Vật lí 12, cần giáo viên rà soát đáp án trước khi dùng đánh giá chính thức."},{"id":"VL-2","title":"Đề 2 · Vận dụng tổng hợp","desc":"Đề nâng cao: trao đổi nhiệt, chuyển thể, xử lí tình huống và cân bằng năng lượng.","mc":[{"q":"So với chất rắn, các phân tử trong chất khí thông thường","options":["luôn dao động quanh nút mạng cố định.","cách xa nhau hơn và chuyển động hỗn loạn.","không có thế năng tương tác.","không có động năng chuyển động nhiệt."],"key":"B"},{"q":"Sự bay hơi khác sự sôi ở đặc điểm nào?","options":["Bay hơi chỉ xảy ra tại một nhiệt độ xác định.","Bay hơi chỉ diễn ra trong lòng chất lỏng.","Bay hơi có thể xảy ra trên mặt thoáng ở nhiều nhiệt độ.","Bay hơi không làm thay đổi trạng thái chất."],"key":"C"},{"q":"Một vật nhận nhiệt nhưng nội năng vẫn giảm nếu","options":["vật đồng thời sinh công lớn hơn nhiệt lượng nhận.","vật đồng thời nhận công từ bên ngoài.","vật đặt trong bình cách nhiệt.","nhiệt độ vật luôn tăng."],"key":"A"},{"q":"Theo quy ước công A thực hiện lên khí, trong quá trình khí tự giãn nở đẩy pít-tông thì","options":["A luôn dương.","A bằng độ biến thiên nội năng.","A luôn bằng nhiệt lượng khí nhận.","A âm nếu khí thực hiện công ra ngoài."],"key":"D"},{"q":"Một độ tăng nhiệt độ 5 °C tương ứng với độ tăng theo Kelvin là","options":["278 K.","5 K.","268 K.","0,02 K."],"key":"B"},{"q":"Nước tinh khiết đông đặc ở 0 °C dưới áp suất chuẩn có nhiệt độ theo Kelvin gần bằng","options":["0 K.","100 K.","273 K.","373 K."],"key":"C"},{"q":"Trong quá trình ngưng tụ ở cùng nhiệt độ, hơi nước thường","options":["thu nhiệt nóng chảy.","thu nhiệt hóa hơi.","tỏa nhiệt ra môi trường.","không trao đổi năng lượng."],"key":"C"},{"q":"Nhiệt hóa hơi riêng L của chất lỏng được xác định bằng","options":["Q/m trong quá trình hóa hơi tại nhiệt độ sôi.","mcΔT trong quá C?","key":33,"unit":"°C","tol":0.01,"hint":""},{"q":"Khối lượng nước 0,40 kg được làm nóng từ 25 °C lên 50 °C. Tính nhiệt lượng cần (kJ), c = 4200 J/(kg·K).","key":42,"unit":"kJ","tol":0.01,"hint":""},{"q":"Một khối khí thực hiện công 180 J và nội năng tăng 75 J. Khí đã nhận bao nhiêu J nhiệt lượng?","key":255,"unit":"J","tol":0.01,"hint":""},{"q":"Đun bay hơi hoàn toàn 0,15 kg nước đang sôi. Tính nhiệt lượng hóa hơi (kJ), L = 2260 kJ/kg.","key":339,"unit":"kJ","tol":0.01,"hint":""}],"essay":[{"title":"Bài toán 1 – Trộn nước và nước đá","prompt":"Bình cách nhiệt chứa 0,40 kg nước ở 50 °C, thả vào 0,10 kg nước đá ở 0 °C. Cho c_nước = 4200 J/(kg·K), λ = 334 000 J/kg. Bỏ qua nhiệt dung bình. Chứng minh đá tan hết rồi tính nhiệt độ cân bằng.","parts":[{"q":"Nhiệt lượng cần để làm tan hết 0,10 kg đá (kJ)?","key":33.4,"unit":"kJ","points":0.75,"tol":0.02},{"q":"Nhiệt độ cân bằng sau khi tan hết (°C)?","key":24.095238,"unit":"°C","points":0.75,"tol":0.2}],"solution":"Nước nóng nếu hạ tới 0 °C có thể tỏa 84 kJ > 33,4 kJ nên đá tan hết. 0,4·4200·(50−t) = 33400 + 0,1·4200·t, suy ra t ≈ 24,10 °C."},{"title":"Bài toán 2 – Khí chuyển trạng thái","prompt":"Một khí nhận 720 J nhiệt lượng trong khi pít-tông bị khí đẩy đi 8 cm. Tiết diện pít-tông 75 cm², áp suất khí không đổi 1,5×10^5 Pa, bỏ qua ma sát. Trình bày cách đổi đơn vị và áp dụng định luật I.","parts":[{"q":"Công do khí thực hiện (J)?","key":90,"unit":"J","points":0.75,"tol":0.1},{"q":"Độ tăng nội năng khí (J)?","key":630,"unit":"J","points":0.75,"tol":0.1}],"solution":"S = 75 cm² = 0,0075 m², ΔV = 0,0075·0,08 = 0,0006 m³; W = pΔV = 90 J; ΔU = Q − W = 630 J."}],"subject":"physics","mode":"exam","minutes":45,"verified":false,"source":"Đề tham khảo biên soạn theo ma trận giữa kì I Vật lí 12, cần giáo viên rà soát đáp án trước khi dùng đánh giá chính thức."}]}</script>
<script>'use strict';
(()=>{
const root=document.getElementById('app');

function prestart(){const e=getExam(chosenExamId);if(!e)return go('home');root.innerHTML=`<div class="subhero"><div><div class="eyebrow" style="color:var(--brand)">${esc(labels[e.subject]||'Đề thi')}</div><h1>${esc(e.title)}</h1><p>${esc(e.description||'')}</p></div><button class="btn secondary" data-action="subject" data-subject="${esc(e.subject)}">← Danh sách đề</button></div><div class="panel" style="max-width:730px"><h2>Chuẩn bị bắt đầu</h2><div class="statline" style="margin-bottom:22px"><span>◷ <strong>${e.minutes||'Tự chọn'} phút</strong></span><span>◉ ${esc(tally(e))}</span></div><div class="field"><label for="nickname">Biệt danh trên bảng thành tích</label><input id="nickname" maxlength="24" autocomplete="nickname" placeholder="Ví dụ: Thí sinh A" value="${esc(store.get('ot12-r7-nick',''))}"><div class="hint">Nên dùng biệt danh, không nhập thông tin cá nhân.</div></div>${isHistory(e)?`<div class="field" style="margin-top:18px"><label for="practiceCount">Số câu muốn luyện</label><select id="practiceCount"><option value="20">20 câu (16 ABCD + 4 Đ/S)</option><option value="50">50 câu (40 ABCD + 10 Đ/S)</option><option value="full">Toàn bộ ngân hàng câu hỏi</option></select></div><p class="notice" style="margin-top:18px">Câu sai được chọn lại đến khi đúng. Điểm tính theo <strong>lần trả lời đầu tiên</strong>, không cộng điểm khi chọn lại.</p>`:`<p class="notice" style="margin-top:18px">Em chọn đáp án cho cả bốn phần rồi nộp một lần. Hệ thống tự nộp khi hết <strong>${e.minutes||45} phút</strong>. Tự luận chỉ cần nhập đáp số.</p>`}<div class="btn-row" style="margin-top:20px"><button class="btn secondary" data-action="shuffle-before">⇄ Xáo trộn đề</button><button class="btn primary" data-action="start">Bắt đầu ${isHistory(e)?'luyện':'làm bài'} →</button><button class="btn secondary" data-action="subject" data-subject="${esc(e.subject)}">Quay lại</button></div><div id="shuffleStatus" class="hidden" style="margin-top:14px"><div class="progress-track"><div id="shuffle function makeOrder(e,count){const m=shuffle(Array.from({length:(e.mc||[]).length},(_,i)=>({section:'mc',i}))),t=shuffle(Array.from({length:(e.tf||[]).length},(_,i)=>({section:'tf',i})));if(count==='full')return [...m,...t];const n=Number(count);const tfN=Math.min(t.length,Math.round(n/5));return [...m.slice(0,n-tfN),...t.slice(0,tfN)];}
function start(){const e=getExam(chosenExamId);if(!e)return;const nickname=document.getElementById('nickname')?.value.trim()||'Người học';store.set('ot12-r7-nick',nickname);if(session&&session.stage==='running'&&!confirm('Em có bài chưa hoàn thành. Bắt đầu bài mới sẽ thay thế bài đó. Tiếp tục?'))return;const now=Date.now();session={examId:e.id,nickname,startedAt:now,deadline:e.minutes?now+e.minutes*60000:null,stage:'running',mode:e.mode,position:0,answers:{},tries:{},done:{},feedback:'',order:preparedOrder&&preparedOrder.examId===e.id&&preparedOrder.count===(document.getElementById('practiceCount')?.value||'exam')?copy(preparedOrder.order):(isHistory(e)?makeOrder(e,document.getElementById('practiceCount')?.value||'20'):buildExamOrder(e))};preparedOrder=null;persist();go('exam')}
function buildExamOrder(e){return ['mc','tf','short','essay'].flatMap(section=>(e[section]||[]).map((_,i)=>({section,i})))}
function persist(){store.set(K.session,session)}
function atoms(e){const order=session.order;return order.reduce((n,o)=>n+(o.section==='tf'?4:o.section==='essay'?(e.essay[o.i]?.parts||[]).length:1),0)}
function answered(e){let count=0;for(const o of session.order){if(o.section==='tf'){for(let j=0;j<4;j++)if(session.answers[`tf-${o.i}-${j}`]!==undefined)count++}else if(o.section==='essay'){(e.essay[o.i]?.parts||[]).forEach((_,j)=>{if(session.answers[`essay-${o.i}-${j}`]?.trim?.())count++})}else if(o.section==='mc'){if(session.answers[`mc-${o.i}`]!==undefined)count++}else if(session.answers[`short-${o.i}`]?.trim?.())count++}return count}
function examView(){const e=getExam(session?.examId);if(!e){session=null;store.del(K.session);return go('home')}if(session.stage!=='running')return go('result');if(session.deadline&&Date.now()>=session.deadline)return finish('timeout');const total=atoms(e),done=isHistory(e)?Object.keys(session.done).length:answered(e);const timerText=session.deadline?clock((session.deadline-Date.now())/1000):clock((Date.now()-session.startedAt)/1000);root.innerHTML=`<div class="quiz-head"><div><div class="eyebrow" style="color:var(--brand)">${esc(labels[e.subject]||'')}</div><h2>${esc(e.title)}</h2><div class="muted small">${esc(session.nickname)} · ${isHistory(e)?'Chọn đúng mới được qua câu':'Chọn hết đáp án rồi nộp một lần'}</div></div><div><div class="clock" id="timeDisplay" aria-live="off">${timerText}</div><div class="hint" style="text-align:center">${session.deadline?'Còn lại':'Đã học'}</div></div></div><div class="progress-track" aria-label="Tiến độ làm bài"><div class="progress-fill" style="width:${Math.min(100,100*done/Math.max(1,total))}%"></div></div><div class="muted small" style="margin:7px 0 16px">${done}/${total} lượt lựa chọn ${isHistory(e)?'đã trả lời đúng':'đã hoàn thành'}</div><div class="quiz-layout"><div class="quiz-main"><div class="panel">${isHistory(e)?masterQuestion(e):examQuestion(e)}</div></div>${isHistory(e)?`<aside class="panel quiz-side"><h3>Luyện tập tuần tự</h3><p class="muted small">Không có chọn câu nhanh. Mỗi câu phải trả lời đúng rồi mới tiếp tục.</p><div class="notice">${session.position+1}/${session.order.length} câu hỏi</div></aside>`:`<aside class="panel quiz-side"><h3>Danh sách câu</h3><p class="muted mini">Chọn số để chuyển câu. Các câu đã chọn có màu xanh.</p><div class="question-index">${session.order.map((o,i)=>`<button class="number ${i===session.position?'active':''} ${stepAnswered(e,o)?'answered':''}" data-action="jump" data-index="${i}" aria-label="Câu ${i+1}">${i+1}</button>`).join('')}</div><div style="margin-top:20px"><button class="btn primary block" data-action="finish">Nộp bài</button></div></aside>`}</div>`}
function stepAnswered(e,o){if(o.section==='tf')return (e.tf[o.i].claims||[]).every((_,j)=>session.answers[`tf-${o.i}-${j}`]!==undefined);if(o.section==='essay')return (e.essay[o.i].parts||[]).every((_,j)=>String(session.answers[`essay-${o.i}-${j}`]||'').trim());return !!(session.answers[`${o.section}-${o.i}`]!==undefined&&String(session.answers[`${o.section}-${o.i}`]).trim())}
function questionGraphic(text){const s=(text||'').toLowerCase();if(/đồ thị|nóng chảy|đông đặc/.test(s))return `<div class="qmedia"><svg viewBox="0 0 500 190" role="img" aria-label="Đồ thị nhiệt độ theo thời gian minh họa đoạn tăng và đoạn nằm ngang"><g stroke="currentColor" opacity=".65" stroke-width="1.6" fill="none"><path d="M60 15V151H470"/><path d="M60 145L190 70H315L440 18" stroke="#269d9b" stroke-width="4"/></g><g fill="currentColor" font-size="15"><text x="12" y="19">T (°C)</text><text x="370" y="179">Thời gian t</text><text x="213" y="58">Đổi thể</text></g></svg><div class="hint">Sơ đồ định tính — không dùng để đọc số liệu.</div></div>`;if(/pít.tông|xi lanh|khối khí/.test(s))return `<div class="qmedia"><svg viewBox="0 0 500 174" role="img" aria-label="Sơ đồ khối khí và pít-tông"><g stroke="currentColor" stroke-width="3" fill="none"><path d="M130 24V149H365V24"/><path d="M131 48H364" stroke="#258f98" stroke-width="11"/><path d="M250 10V47"/><path d="M250 10l-8 13m8-13l8 13"/></g><g fill="currentColor" font-size="17"><text x="206" y="108">Khối khí</text><text x="375" y="51">Pít-tông</text></g></svg><div class="hint">Sơ đồ nguyên lí, không theo tỉ lệ.</div></div>`;if(/trộn nước|cân bằng nhiệt|trao đổi nhiệt/.test(s))return `<div class="qmedia"><svg viewBox="0 0 500 118" role="img" aria-label="Sơ đồ truyền nhiệt"><rect x="30" y="22" width="165" height="70" rx="9" fill="#d8b578" opacity=".22" stroke="currentColor"/><rect x="307" y="22" width="160" height="70" rx="9" fill="#69b8dd" opacity=".22" stroke="currentColor"/><g fill="currentColor" font-size="16"><text x="54" y="63">Vật nóng</text><text x="330" y="63">Vật lạnh</text><text x="230" y="90">Q →</text></g><path d="M202 49h96m-12-10 12 10-12 10" stroke="#27968e" stroke-width="4" fill="none"/></svg><div class="hint">Năng lượng nhiệt truyền từ vật nóng sang vật lạnh.</div></div>`;return ''}
function masterQuestion(e){const o=session.order[session.position],q=e[o.section][o.i];let body=`<div class="pill blue">Câu ${session.position+1}/${session.order.length} · ${o.section==='mc'?'ABCD':'Đúng/Sai'}</div>`;
if(o.section==='mc'){const key=`mc-${o.i}`;const v=session.answers[key];body+=`<div class="qtitle" style="margin:14px 0">${sci(q.q)}</div>${questionGraphic(q.q)}${q.options.map((option,j)=>{const value='ABCD'[j];return `<button class="choice ${v===value?'correct':''}" data-action="master-choice" data-choice="${value}" ${session.done[key]?'disabled':''}><span class="letter">${value}</span><span class="txt">${sci(option)}</span>${v===value?'✓':''}</button>`}).join('')}`}else{body+=`<div class="reading" style="margin-top:15px">${sci(q.passage)}</div>`+(q.claims||[]).map((c,j)=>{const k=`tf-${o.i}-${j}`,v=session.answers[k];return `<div class="tf-claim"><p><b>${'abcd'[j]})</b> ${sci(c.t)}</p><div class="tf-controls"><button class="btn sm ${v===true?'primary':''}" data-action="master-tf" data-statement="${j}" data-value="true" ${session.done[k]?'disabled':''}>Đúng</button><button class="btn sm ${v===false?'primary':''}" data-action="master-tf" data-statement="${j}" data-value="false" ${session.done[k]?'disabled':''}>Sai</button>${session.done[k]?`<span class="pill green">✓ Chính xác</span>`:''}</div></div>`}).join('')}
const complete=masterStepDone(o),last=session.position===session.order.length-1;body+=`${session.feedback?`<div class="feedback ${session.feedback==='Đúng rồi! Tiếp tục nhé.'?'good':'bad'}">${esc(session.feedback)}</div>`:''}<div class="qfoot"><div class="muted small">Sai có thể thử lại. Chỉ tính điểm lần đầu.</div><button class="btn primary" data-action="next-master" ${complete?'':'disabled'}>${last?'Hoàn thành & xem điểm':'Câu tiếp theo →'}</button></div>`;return body}
function masterStepDone(o){return o.section==='mc'?!!session.done[`mc-${o.i}`]:(getExam(session.examId).tf[o.i].claims||[]).every((_,j)=>session.done[`tf-${o.i}-${j}`])}
function examQuestion(e){const o=session.order[session.position],q=e[o.section][o.i],n=session.position+1,head=`<div class="pill blue">Câu ${n}/${session.order.length} · ${({mc:'Phần I – ABCD',tf:'Phần II – Đúng/Sai',short:'Phần III – Trả lời ngắn',essay:'Phần IV – Tự luận'})[o.section]}</div>`;let body='';
if(o.section==='mc'){body=`<div class="qtitle" style="margin:14px 0">${sci(q.q)}</div>${questionGraphic(q.q)}${q.options.map((option,j)=>{const v='ABCD'[j];return `<button class="choice ${session.answers[`mc-${o.i}`]===v?'selected':''}" data-action="exam-choice" data-choice="${v}"><span class="letter">${v}</span><span class="txt">${sci(option)}</span></button>`}).join('')}`}
if(o.section==='tf'){body=`<div class="reading" style="margin-top:15px">${sci(q.passage)}</div>${(q.claims||[]).map((c,j)=>`<div class="tf-claim"><p><b>${'abcd'[j]})</b> ${sci(c.t)}</p><div class="tf-controls">${[true,false].map(v=>`<button class="btn sm ${session.answers[`tf-${o.i}-${j}`]===v?'primary':''}" data-action="exam-tf" data-claim="${j}" data-value="${v}">${v?'Đúng':'Sai'}</button>`).join('')}</div></div>`).join('')}`}
if(o.section==='short'){body=`<div class="qtitle" style="margin:14px 0">${sci(q.q)}</div>${questionGraphic(q.q)}<div class="field" style="margin-top:18px"><label>Đáp số (không cần đơn vị)</label><div><input class="ninput" inputmode="decimal" data-input="short" data-index="${o.i}" placeholder="Nhập kết quả số" value="${esc(session.answers[`short-${o.i}`]||'')}"><span class="nunit">${esc(q.unit||'')}</span></div><div class="hint">Có thể nhập dấu phẩy hoặc dấu chấm thập phân.</div></div>`}
if(o.section==='essay'){body=`<div class="qtitle" style="margin:14px 0">${sci(q.title||'Bài toán tự luận')}</div><div class="reading">${sci(q.prompt)}</div>${questionGraphic(q.prompt)}${(q.parts||[]).map((p,j)=>`<div class="field" style="margin:15px 0"><label>${j+1}. ${sci(p.q)}</label><div><input class="ninput" inputmode="decimal" data-input="essay" data-index="${o.i}" data-part="${j}" placeholder="Nhập đáp số" value="${esc(session.answers[`essay-${o.i}-${j}`]||'')}"><span class="nunit">${esc(p.unit||'')}</span></div></div>`).join('')}<div class="hint">Không cần nộp cách trình bày; hệ thống chỉ chấm kết quả số.</div>`}
return `<div class="section-tabs">${['mc','tf','short','essay'].filter(k=>(e[k]||[]).length).map((k,i)=>`<button class="section-tab ${o.section===k?'active':''}" data-action="go-section" data-section="${k}">${({mc:'I · ABCD',tf:'II · Đúng/Sai',short:'III · Trả lời ngắn',essay:'IV · Tự luận'})[k]}</button>`).join('')}</div>${head}${body}<div class="qfoot"><button class="btn secondary" data-action="exam-prev" ${session.position===0?'disabled':''}>← Câu trước</button><button class="btn ${session.position===session.order.length-1?'primary':''}" data-action="exam-next" ${session.position>=session.order.length-1?'disabled':''}>Câu tiếp →</button></div>`}
function answerMaster(value,claim){const e=getExam(session.examId),o=session.order[session.position],k=o.section==='mc'?`mc-${o.i}`:`tf-${o.i}-${claim}`;if(session.done[k])return;const correct=o.section==='mc'?e.mc[o.i].key===value:e.tf[o.i].claims[claim].key===value;session.tries[k]=(session.tries[k]||0)+1;if(correct){session.done[k]=true;session.answers[k]=value;session.feedback='Đúng rồi! Tiếp tục nhé.';}else{session.feedback='Chưa đúng. Em chọn lại ở câu này.';}persist();render()}
function numberValid(v){const s=String(v??'').trim().replace(',','.').replace(/\s+/g,'');if(!s)return NaN;const match=s.match(/^([+-]?(?:\d+(?:\.\d+)?|\.\d+))(?:[x×*]10\^?([+-]?\d+))?$/i);if(!match)return NaN;return Number(match[1])*(match[2]?10**Number(match[2]):1)}
function numberCorrect(got,key,tol){const n=numberValid(got),t=Number(key);return Number.isFinite(n)&&Number.isFinite(t)&&Math.abs(n-t)<=Math.max(Number(tol)||0.001,Math.abs(t)*1e-7)}
function scoreExam(e){const base={mc:3,tf:2,short:2,essay:3};const n={mc:(e.mc||[]).length,tf:(e.tf||[]).reduce((s,q)=>s+(q.claims||[]).length,0),short:(e.short||[]).length,essay:(e.essay||[]).reduce((s,q)=>s+(q.parts||[]).length,0)};const selected=Object.keys(base).filter(k=>n[k]>0),totalBase=selected.reduce((s,k)=>s+base[k],0);const per={};for(const k of selected)per[k]=10*base[k]/totalBase/n[k];let total=0,correct=0,detail=[],pointsBy={mc:0,tf:0,short:0,essay:0};
function add(section,index,sub,title,got,key,yes,explain){const p=per[section]||0;total+=p;if(yes){correct++;pointsBy[section]+=p}detail.push({section,index,sub,title,got,key,correct:yes,points:p,explain:explain||''})}
(e.mc||[]).forEach((q,i)=>add('mc',i,null,q.q,session.answers[`mc-${i}`],q.key,session.answers[`mc-${i}`]===q.key,q.explain||''));
(e.tf||[]).forEach((q,i)=>(q.claims||[]).forEach((c,j)=>add('tf',i,j,c.t,session.answers[`tf-${i}-${j}`],c.key,session.answers[`tf-${i}-${j}`]===c.key,c.explain||'')));
(e.short||[]).forEach((q,i)=>add('short',i,null,q.q,session.answers[`short-${i}`],q.key,numberCorrect(session.answers[`short-${i}`],q.key,q.tol),q.hint||''));
(e.essay||[]).forEach((q,i)=>(q.parts||[]).forEach((c,j)=>add('essay',i,j,q.title+' — '+c.q,session.answers[`essay-${i}-${j}`],c.key,numberCorrect(session.answers[`essay-${i}-${j}`],c.key,c.tol),q.solution||'')));
return {score:Math.round(total*100)/100,correct,total:detail.length,detail,pointsBy}}
function scoreMaster(e){const details=[];session.order.forEach(o=>{if(o.section==='mc'){const q=e.mc[o.i],k=`mc-${o.i}`;details.push({section:'mc',title:q.q,got:session.answers[k],key:q.key,correct:(session.tries[k]||0)===1,explain:'Điểm ghi nhận theo lần chọn đầu tiên.'})}else{const q=e.tf[o.i];q.claims.forEach((c,j)=>{const k=`tf-${o.i}-${j}`;details.push({section:'tf',title:c.t,got:session.answers[k],key:c.key,correct:(session.tries[k]||0)===1,explain:'Điểm ghi nhận theo lần chọn đầu tiên.'})})}});const correct=details.filter(d=>d.correct).length;return {score:Math.round(1000*correct/Math.max(1,details.length))/100,correct,total:details.length,detail:details,pointsBy:{mc:0,tf:0,short:0,essay:0}}}
function finish(reason='submitted'){const e=getExam(session?.examId);if(!e||session.stage!=='running')return;const result=isHistory(e)?scoreMaster(e):scoreExam(e);lastRecord={id:'result-'+Date.now().toString(36),examId:e.id,title:e.title,subject:e.subject,nickname:session.nickname,finishedAt:Date.now(),duration:Math.floor((Date.now()-session.startedAt)/1000),mode:e.mode,reason,...result};records.unshift(lastRecord);records=records.slice(0,150);store.set(K.records,records);session.stage='finished';persist();go('result');if(lastRecord.score>=9.999)celebrate()}

function celebrate(){const colors=['#23bba9','#f6b439','#d95980','#7baaff','#ffe08a'];for(let i=0;i<130;i++){let el=document.createElement('span');el.className='confetti';el.style.left=Math.random()*100+'vw';el.style.background=colors[i%colors.length];el.style.animationDuration=2+Math.random()*2+'s';el.style.animationDelay=Math.random()*.35+'s';el.style.setProperty('--dx',(Math.random()-.5)*180+'px');el.style.setProperty('--rot',Math.floor(Math.random()*1080)+'deg');document.body.appendChild(el);setTimeout(()=>el.remove(),4300)}try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;const ctx=new AC();[523,659,784,1046].forEach((freq,i)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.value=freq;g.gain.setValueAtTime(0,ctx.currentTime+i*.13);g.gain.linearRampToValueAtTime(.13,ctx.currentTime+i*.13+.03);g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+i*.13+.42);o.connect(g).connect(ctx.destination);o.start(ctx.currentTime+i*.13);o.stop(ctx.currentTime+i*.13+.45)});setTimeout(()=>ctx.close(),1800)}catch{}}

function validateExam(e){const errors=[];if(!String(e.title||'').trim())errors.push('Thiếu tên đề');if(!['mastery','exam'].includes(e.mode))errors.push('Chế độ đề không hợp lệ');const cnt=['mc','tf','short','essay'].reduce((s,k)=>s+(e[k]||[]).length,0);if(!cnt)errors.push('Chưa có câu hỏi');(e.mc||[]).forEach((q,i)=>{if(!q.q?.trim()||!Array.isArray(q.options)||q.options.length!==4||q.options.some(x=>!String(x).trim())||!'ABCD'.includes(q.key||''))errors.push(`ABCD câu ${i+1} chưa đủ nội dung hoặc đáp án`)});(e.tf||[]).forEach((q,i)=>{if(!q.passage?.trim()||q.claims?.length!==4||q.claims.some(c=>!c.t?.trim()||typeof c.key!=='boolean'))errors.push(`Đúng/Sai câu ${i+1} chưa đủ 4 ý`)});(e.short||[]).forEach((q,i)=>{if(!q.q?.trim()||!Number.isFinite(Number(q.key)))errors.push(`Trả lời ngắn câu ${i+1} thiếu đáp số`)});(e.essay||[]).forEach((q,i)=>{if(!q.title?.trim()||!q.parts?.length||q.parts.some(p=>!p.q?.trim()||!Number.isFinite(Number(p.key))))errors.push(`Tự luận câu ${i+1} thiếu đáp số`)});return errors}
function showQuestionModal(type,index){if(!editing)return;const ex=editing[type]?.[index];if(!ex)return;const pField=(name,label,val,rows=0)=>`<div class="field"><label for="m-${name}">${label}</label>${rows?`<textarea id="m-${name}" rows="${rows}">${esc(val||'')}</textarea>`:`<input id="m-${name}" value="${esc(val??'')}">`}</div>`;
let inner='';if(type==='mc'){inner=pField('q','Nội dung câu hỏi',ex.q,3)+ex.options.map((o,i)=>pField('opt'+i,'Đáp án '+('ABCD'[i]),o)).join('')+`<div class="field"><label>Phương án đúng</label><select id="m-key">${'ABCD'.split('').map(x=>`<option value="${x}" ${ex.key===x?'selected':''}>${x}</option>`).join('')}</select></div>`+pField('explain','Giải thích',ex.explain||'',2)}
if(type==='tf')inner=pField('passage','Đoạn tư liệu',ex.passage,3)+ex.claims.map((c,i)=>pField('claim'+i,`Nhận định ${'abcd'[i]}`,c.t,2)+`<div class="field"><label>Đáp án nhận định ${'abcd'[i]}</label><select id="m-truth${i}"><option value="true" ${c.key?'selected':''}>Đúng</option><option value="false" ${!c.key?'selected':''}>Sai</option></select></div>`).join('');
if(type==='short')inner=pField('q','Câu hỏi',ex.q,3)+pField('key','Đáp số',ex.key)+pField('unit','Đơn vị',ex.unit||'')+pField('tol','Sai số cho phép',ex.tol??0.01);
if(type==='essay')inner=pField('title','Tên bài',ex.title)+pField('prompt','Đề bài',ex.prompt,4)+`<p class="muted small">Bài tự luận có hai ô đáp số. Có thể để trống ô thứ hai để chỉ dùng một đáp số.</p>`+[0,1].map(i=>pField('partq'+i,`Ý ${i+1} — nội dung`,ex.parts?.[i]?.q||'',2)+pField('partkey'+i,`Ý ${i+1} — đáp số`,ex.parts?.[i]?.key??'')+pField('partunit'+i,`Ý ${i+1} — đơn vị`,ex.parts?.[i]?.unit||'')).join('')+pField('solution','Lời giải tham khảo',ex.solution||'',3);
modalHost.innerHTML=`<div class="modal-layer" id="dialogLayer"><div class="modal" role="dialog" aria-modal="true"><div class="btn-row" style="justify-content:space-between"><h2>Sửa ${({mc:'câu ABCD',tf:'câu Đúng/Sai',short:'trả lời ngắn',essay:'tự luận'})[type]}</h2><button class="btn sm" data-action="close-modal">✕ Đóng</button></div>${inner}<div class="btn-row" style="margin-top:18px"><button class="btn primary" data-action="save-question" data-type="${type}" data-index="${index}">Lưu câu hỏi</button><button class="btn" data-action="close-modal">Hủy</button></div></div></div>`;}
function readModalQuestion(type,index){const g=k=>document.getElementById('m-'+k)?.value?.trim()??'';let next;
if(type==='mc')next={q:g('q'),options:[0,1,2,3].map(i=>g('opt'+i)),key:g('key')||document.getElementById('m-key')?.value,explain:g('explain')};
if(type==='tf')next={passage:g('passage'),claims:[0,1,2,3].map(i=>({t:g('claim'+i),key:document.getElementById('m-truth'+i)?.value==='true'}))};
if(type==='short')next={q:g('q'),key:numberValid(g('key')),unit:g('unit'),tol:Number(g('tol'))||.01};
if(type==='essay')next={title:g('title'),prompt:g('prompt'),parts:[0,1].filter(i=>g('partq'+i)).map(i=>({q:g('partq'+i),key:numberValid(g('partkey'+i)),unit:g('partunit'+i),tol:.01})),solution:g('solution')};
const temp=copy(editing);temp[type][index]=next;if(validateExam({...temp,mc:[...(type==='mc'?[next]:[])],tf:[...(type==='tf'?[next]:[])],short:[...(type==='short'?[next]:[])],essay:[...(type==='essay'?[next]:[])]}).some(x=>x.includes('câu 1'))){ /* validation below handles item directly */ }
if(type==='mc'&&(!next.q||next.options.some(v=>!v)))return notify('Chưa nhập đủ câu hỏi và bốn phương án.');if(type==='tf'&&(!next.passage||next.claims.some(v=>!v.t)))return notify('Cần đoạn tư liệu và đủ bốn nhận định.');if(type==='short'&&(!next.q||!Number.isFinite(next.key)))return notify('Cần câu hỏi và đáp số hợp lệ.');if(type==='essay'&&(!next.title||!next.prompt||!next.parts.length||next.parts.some(x=>!Number.isFinite(x.key))))return notify('Cần đề bài và đáp số hợp lệ.');
editing[type][index]=next;modalHost.innerHTML='';render();notify('Đã lưu thay đổi câu hỏi (chưa lưu đề).')}
function addQuestion(type){const ex={mc:{q:'',options:['','','',''],key:'A',explain:''},tf:{passage:'',claims:Array.from({length:4},()=>({t:'',key:true}))},short:{q:'',key:0,unit:'',tol:.01},essay:{title:'',prompt:'',parts:[{q:'',key:0,unit:'',tol:.01}],solution:''}}[type];editing[type].push(copy(ex));showQuestionModal(type,editing[type].length-1)}
function downloadFile(name,content,mime='application/json'){const b=new Blob([content],{type:mime+';charset=utf-8'}),url=URL.createObjectURL(b),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
function exportJSON(v,name){downloadFile(name,JSON.stringify(v,null,2))}
function importJSONFile(file){if(!file)return;const fr=new FileReader();fr.onload=()=>{try{const data=JSON.parse(String(fr.result)),list=Array.isArray(data)?data:Array.isArray(data.exams)?data.exams:[data];let accepted=0,rejected=[];list.forEach((item,i)=>{const errs=validateExam(item);if(errs.length){rejected.push(`${i+1}: ${errs[0]}`);return}let exam=copy(item);if(!exam.id)exam.id='LOCAL-'+Date.now().toString(36)+i;exam.id=String(exam.id).slice(0,80);exam.draft=true;exam.source='Nhập JSON cục bộ, chờ duyệt';userEdits[exam.id]=exam;hidden[exam.id]=true;accepted++});store.set(K.custom,userEdits);store.set(K.hidden,hidden);editorTab='manage';render();notify(`Đã nhập ${accepted} đề nháp. ${rejected.length?'Lỗi: '+rejected[0]:''}`)}catch(err){notify('Không đọc được JSON: '+err.message)}};fr.readAsText(file,'utf-8')}
function handleClick(e){const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action, id=b.dataset.id;
if(a==='home')go('home');
else if(a==='subject')go('catalog',{subject:b.dataset.subject});
else if(a==='choose-exam'){preparedOrder=null;go('prestart',{examId:id})}
else if(a==='start')start();
else if(a==='shuffle-before'){const ex=getExam(chosenExamId),count=document.getElementById('practiceCount')?.value||'exam';if(!ex)return;let order=isHistory(ex)?makeOrder(ex,count):['mc','tf','short','essay'].flatMap(section=>shuffle((ex[section]||[]).map((_,i)=>({section,i}))));preparedOrder={examId:ex.id,count,order};let wrap=document.getElementById('shuffleStatus'),bar=document.getElementById('shuffleBar'),t=document.getElementById('shuffleText');wrap?.classList.remove('hidden');if(bar){bar.style.transition='none';bar.style.width='0%';requestAnimationFrame(()=>requestAnimationFrame(()=>{bar.style.transition='width .9s ease';bar.style.width='100%'}))}if(t){t.textContent='Đang xáo trộn các câu...';setTimeout(()=>{if(document.getElementById('shuffleText')===t)t.textContent='Đã xáo trộn xong · '+order.length+' câu sẵn sàng.'},950)}}
else if(a==='resume')go('exam');
else if(a==='master-choice')answerMaster(b.dataset.choice,null);
else if(a==='master-tf')answerMaster(b.dataset.value==='true',Number(b.dataset.statement));
else if(a==='next-master'){const o=session.order[session.position];if(!masterStepDone(o))return;if(session.position===session.order.length-1)finish('submitted');else{session.position++;session.feedback='';persist();render();window.scrollTo(0,0)}}
else if(a==='exam-choice'){let o=session.order[session.position];session.answers[`mc-${o.i}`]=b.dataset.choice;persist();render()}
else if(a==='exam-tf'){let o=session.order[session.position];session.answers[`tf-${o.i}-${b.dataset.claim}`]=b.dataset.value==='true';persist();render()}
else if(a==='exam-next'||a==='exam-prev'){session.position=Math.max(0,Math.min(session.order.length-1,session.position+(a==='exam-next'?1:-1)));persist();render();window.scrollTo(0,0)}
else if(a==='go-section'){let i=session.order.findIndex(o=>o.section===b.dataset.section);if(i>=0){session.position=i;persist();render()}}
else if(a==='jump'){session.position=Number(b.dataset.index);persist();render()}
else if(a==='finish'){const ex=getExam(session.examId),unanswered=atoms(ex)-answered(ex);if(unanswered>0&&!confirm(`Em còn ${unanswered} lượt chưa trả lời. Vẫn nộp bài?`))return;finish('submitted')}
else if(a==='filter'){reviewFilter=b.dataset.filter;render()}
else if(a==='records')go('records');
else if(a==='show-record'){lastRecord=records.find(r=>r.id===id);reviewFilter='all';reviewSection='all';go('result')}
else if(a==='clear-records'){if(confirm('Xóa toàn bộ thành tích trên thiết bị này?')){records=[];store.set(K.records,[]);render()}}
else if(a==='editor'){editorTab='manage';go('editor')}
else if(a==='editor-tab'){editorTab=b.dataset.tab;go('editor')}
else if(a==='create-exam')newExam();
else if(a==='edit-exam')beginEdit(id);
else if(a==='toggle-exam'){hidden[id]=!hidden[id];store.set(K.hidden,hidden);render();notify(hidden[id]?'Đã ẩn đề trên thiết bị.':'Đã hiện đề trên thiết bị.')}
else if(a==='delete-exam'){if(!confirm('Xóa đề khỏi danh sách trên thiết bị này?'))return;if(userEdits[id]&&!catalog.exams.some(x=>x.id===id))delete userEdits[id];else{delete userEdits[id];hidden[id]=true}store.set(K.custom,userEdits);store.set(K.hidden,hidden);render();notify('Đã loại đề khỏi danh sách tại máy này.')}
else if(a==='cancel-edit'){editing=null;go('editor')}
else if(a==='save-edit')saveEdit();
else if(a==='download-edit')exportJSON(editing,'de-'+editing.id+'.json');
else if(a==='add-question')addQuestion(b.dataset.type);
else if(a==='edit-question')showQuestionModal(b.dataset.type,Number(b.dataset.index));
else if(a==='remove-question'){if(!confirm('Xóa câu này?'))return;editing[b.dataset.type].splice(Number(b.dataset.index),1);render()}
else if(a==='close-modal')modalHost.innerHTML='';
else if(a==='save-question')readModalQuestion(b.dataset.type,Number(b.dataset.index));
else if(a==='import-click')document.getElementById('importInput')?.click();
else if(a==='export-all')exportJSON({schemaVersion:2,exams:getAll().filter(x=>!hidden[x.id])},'on-thi-12-de-da-duyet.json');
else if(a==='download-template')exportJSON({schemaVersion:2,exams:[exampleExam]},'mau-de-on-thi-12.json');
else if(a==='copy-request'){const s='Thầy hãy dựa vào tài liệu em gửi để soạn đề phù hợp ma trận, giải và kiểm tra đáp án từng câu, xuất dưới dạng JSON tương thích Học viện Ôn thi 12, rồi cập nhật vào file data/exams.json của repository GitHub HaoDonCo/-n-t-p-l-ch-s-12. Chỉ xuất bản sau khi em duyệt đề.';navigator.clipboard?.writeText(s).then(()=>notify('Đã sao chép yêu cầu gửi thầy.')).catch(()=>notify('Không sao chép được; hãy chọn văn bản thủ công.'))}
}
document.body.addEventListener('click',handleClick);
document.body.addEventListener('input',e=>{if(e.target.matches('[data-input]')&&session?.stage==='running'){const k=e.target.dataset.input==='essay'?`essay-${e.target.dataset.index}-${e.target.dataset.part}`:`short-${e.target.dataset.index}`;session.answers[k]=e.target.value;persist();}if(e.target.matches('[data-editfield]')&&editing){const key=e.target.dataset.editfield;editing[key]=key==='minutes'?Math.max(0,Number(e.target.value)||0):e.target.value}});
document.body.addEventListener('change',e=>{if(e.target.id==='resultSection'){reviewSection=e.target.value;render()}if(e.target.id==='importInput')importJSONFile(e.target.files?.[0])});
document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>{if(b.dataset.go==='editor')editorTab='manage';go(b.dataset.go)}));
document.getElementById('logoLink').addEventListener('click',e=>{e.preventDefault();go('home')});
const themeBtn=document.getElementById('themeBtn');function applyTheme(mode){document.documentElement.dataset.theme=mode;themeBtn.textContent=mode==='dark'?'☀ Sáng':'☾ Tối';store.set(K.theme,mode)}applyTheme(store.get(K.theme,'light'));themeBtn.addEventListener('click',()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'));
setInterval(()=>{if(view!=='exam'||session?.stage!=='running')return;const el=document.getElementById('timeDisplay');if(!el)return;const remain=session.deadline?Math.ceil((session.deadline-Date.now())/1000):Math.floor((Date.now()-session.startedAt)/1000);if(session.deadline&&remain<=0){finish('timeout');return}el.textContent=clock(remain);el.classList.toggle('urgent',!!session.deadline&&remain<120)},1000);
if(session?.stage==='running'&&getExam(session.examId))view='exam';
render();
if(location.protocol!=='file:')fetch('data/exams.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error(r.status);return r.json()}).then(x=>{if(!x||!Array.isArray(x.exams)||!x.exams.length)throw Error('Invalid catalog');catalog=x;if(view!=='edit-detail')render()}).catch(()=>{});
})();
</script></body></html>
