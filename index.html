    ${isMastery(e)?`
    <aside class="panel quiz-side">
      <h3>Luyện tập tuần tự</h3>
      <p class="muted small">Mỗi câu phải trả lời đúng rồi mới tiếp tục.</p>
      <div class="notice">Câu <strong>${session.position+1} / ${session.order.length}</strong></div>
      <div style="margin-top:16px"><button class="btn secondary block" data-action="subject" data-subject="${esc(e.subject)}">← Thoát ra danh sách đề</button></div>
    </aside>`:`
    <aside class="panel quiz-side">
      <h3>Danh sách câu</h3>
      <p class="muted mini">Chọn số để chuyển câu. Các câu đã chọn có màu xanh.</p>
      <div class="question-index">${session.order.map((o,i)=>`<button class="number ${i===session.position?'active':''} ${stepAnswered(e,o)?'answered':''}" data-action="jump" data-index="${i}">${i+1}</button>`).join('')}</div>
      <div style="margin-top:20px"><button class="btn primary block" data-action="finish">Nộp bài</button></div>
    </aside>`}
  </div>`;
}

function stepAnswered(e,o){
  if(o.section==='tf')return (e.tf[o.i].claims||[]).every((_,j)=>session.answers[`tf-${o.i}-${j}`]!==undefined);
  if(o.section==='essay')return (e.essay[o.i].parts||[]).every((_,j)=>String(session.answers[`essay-${o.i}-${j}`]||'').trim());
  return !!(session.answers[`${o.section}-${o.i}`]!==undefined&&String(session.answers[`${o.section}-${o.i}`]).trim());
}

function masterQuestion(e){
  const o=session.order[session.position],q=e[o.section][o.i];
  const secLabel={mc:'ABCD',tf:'Đúng / Sai',short:'Trả lời ngắn'}[o.section]||'Câu hỏi';
  let body=`<div class="pill blue">Câu ${session.position+1}/${session.order.length} · ${secLabel}</div>`;
  if(o.section==='mc'){
    const key=`mc-${o.i}`,v=session.answers[key];
    body+=`<div class="qtitle" style="margin:14px 0">${sci(q.q)}</div>`+mcVisualOrder(o.i).map((originalJ,visibleJ)=>{
      const value='ABCD'[originalJ],option=q.options[originalJ],letter='ABCD'[visibleJ];
      return `<button class="choice ${v===value?'correct':''}" data-action="master-choice" data-choice="${value}" ${session.done[key]?'disabled':''}><span class="letter">${letter}</span><span class="txt">${sci(option)}</span><span>${v===value?'✓':''}</span></button>`;
    }).join('');
  }else if(o.section==='tf'){
    body+=`<div class="reading" style="margin-top:15px">${sci(q.passage)}</div>`+tfVisualOrder(o.i).map((j,visibleJ)=>{
      const c=q.claims[j],k=`tf-${o.i}-${j}`,v=session.answers[k];
      return `<div class="tf-claim"><p><b>${'abcd'[visibleJ]})</b> ${sci(cleanClaim(c.t))}</p><div class="tf-controls master-tf-controls"><div class="tf-choice-buttons"><button class="btn sm ${v===true?'primary':''}" data-action="master-tf" data-statement="${j}" data-value="true" ${session.done[k]?'disabled':''}>Đúng</button><button class="btn sm ${v===false?'primary':''}" data-action="master-tf" data-statement="${j}" data-value="false" ${session.done[k]?'disabled':''}>Sai</button></div><div class="tf-result-slot">${session.done[k]?`<span class="answer-status">✓ Chính xác</span>`:''}</div></div></div>`;
    }).join('');
  }else if(o.section==='short'){
    const k=`short-${o.i}`;
    body+=`<div class="qtitle" style="margin:14px 0">${sci(q.q)}</div><div class="field" style="margin-top:14px"><label>Nhập đáp số để kiểm tra ngay</label><div class="btn-row"><input class="ninput" id="masterShortInput" inputmode="decimal" value="${esc(session.answers[k]||'')}" ${session.done[k]?'disabled':''} placeholder="Nhập số..."><span class="nunit">${esc(q.unit||'')}</span><button class="btn sm primary" data-action="master-short-check" ${session.done[k]?'disabled':''}>Kiểm tra đáp số</button></div></div>`;
  }
  const complete=masterStepDone(o),last=session.position===session.order.length-1;
  body+=`${session.feedback?`<div class="feedback ${session.feedback.startsWith('Đúng')?'good':'bad'}">${sci(session.feedback)}</div>`:''}<div class="qfoot"><div class="muted small">Sai có thể thử lại. Chỉ tính điểm lần đầu.</div><button class="btn primary" data-action="next-master" ${complete?'':'disabled'}>${last?'Hoàn thành &amp; xem điểm':'Câu tiếp theo →'}</button></div>`;
  return body;
}

function masterStepDone(o){
  if(o.section==='mc')return !!session.done[`mc-${o.i}`];
  if(o.section==='short')return !!session.done[`short-${o.i}`];
  return (getExam(session.examId).tf[o.i].claims||[]).every((_,j)=>session.done[`tf-${o.i}-${j}`]);
}

function examQuestion(e){
  const o=session.order[session.position],q=e[o.section][o.i],n=session.position+1;
  const head=`<div class="pill blue">Câu ${n}/${session.order.length} · ${{mc:'Phần I · ABCD',tf:'Phần II · Đúng/Sai',short:'Phần III · Trả lời ngắn',essay:'Phần IV · Tự luận'}[o.section]}</div>`;
  let body='';
  if(o.section==='mc')body=`<div class="qtitle" style="margin:14px 0">${sci(q.q)}</div>`+mcVisualOrder(o.i).map((originalJ,visibleJ)=>{const v='ABCD'[originalJ],option=q.options[originalJ],letter='ABCD'[visibleJ];return `<button class="choice ${session.answers[`mc-${o.i}`]===v?'selected':''}" data-action="exam-choice" data-choice="${v}"><span class="letter">${letter}</span><span class="txt">${sci(option)}</span></button>`}).join('');
  if(o.section==='tf')body=`<div class="reading" style="margin-top:15px">${sci(q.passage)}</div>`+tfVisualOrder(o.i).map((j,visibleJ)=>{const c=q.claims[j];return `<div class="tf-claim"><p><b>${'abcd'[visibleJ]})</b> ${sci(cleanClaim(c.t))}</p><div class="tf-controls">${[true,false].map(v=>`<button class="btn sm ${session.answers[`tf-${o.i}-${j}`]===v?'primary':''}" data-action="exam-tf" data-claim="${j}" data-value="${v}">${v?'Đúng':'Sai'}</button>`).join('')}</div></div>`}).join('');
  if(o.section==='short')body=`<div class="qtitle" style="margin:14px 0">${sci(q.q)}</div><div class="field" style="margin-top:18px"><label>Đáp số (không cần đơn vị)</label><div><input class="ninput" inputmode="decimal" data-input="short" data-index="${o.i}" value="${esc(session.answers[`short-${o.i}`]||'')}" placeholder="Nhập kết quả số"><span class="nunit">${esc(q.unit||'')}</span></div></div>`;
  if(o.section==='essay')body=`<div class="qtitle" style="margin:14px 0">${sci(q.title||'Bài toán tự luận')}</div><div class="reading">${sci(q.prompt)}</div>${(q.parts||[]).map((p,j)=>`<div class="field" style="margin:15px 0"><label>${j+1}. ${sci(p.q)}</label><div><input class="ninput" inputmode="decimal" data-input="essay" data-index="${o.i}" data-part="${j}" value="${esc(session.answers[`essay-${o.i}-${j}`]||'')}" placeholder="Nhập đáp số"><span class="nunit">${esc(p.unit||'')}</span></div></div>`).join('')}`;
  return `<div class="section-tabs">${['mc','tf','short','essay'].filter(k=>(e[k]||[]).length).map(k=>`<button class="section-tab ${o.section===k?'active':''}" data-action="go-section" data-section="${k}">${{mc:'I · ABCD',tf:'II · Đúng/Sai',short:'III · Trả lời ngắn',essay:'IV · Tự luận'}[k]}</button>`).join('')}</div>${head}${body}<div class="qfoot"><button class="btn secondary" data-action="exam-prev" ${session.position===0?'disabled':''}>← Câu trước</button><button class="btn ${session.position===session.order.length-1?'primary':''}" data-action="exam-next" ${session.position===session.order.length-1?'disabled':''}>Câu tiếp →</button></div>`;
}

function numberValid(v){const s=String(v??'').trim().replace(',','.').replace(/\s+/g,'');if(!s)return NaN;return Number(s)}
function numberCorrect(got,key,tol){const n=numberValid(got),t=Number(key);return Number.isFinite(n)&&Number.isFinite(t)&&Math.abs(n-t)<=Math.max(Number(tol)||0.01,Math.abs(t)*1e-7)}

function answerMaster(value,claim){
  const e=getExam(session.examId),o=session.order[session.position];
  if(o.section==='short'){
    const k=`short-${o.i}`,q=e.short[o.i];
    if(session.done[k])return;
    const ok=numberCorrect(value,q.key,q.tol);
    session.tries[k]=(session.tries[k]||0)+1;
    session.answers[k]=value;
    playHaoSound(ok?'correct':'wrong');
    if(ok){session.done[k]=true;session.feedback='Đúng rồi! '+(q.hint||'Tiếp tục sang câu tiếp theo nhé.')}
    else{session.feedback='Chưa chính xác. Em tính lại rồi nhập lại đáp số nhé!'}
    persist();render();return;
  }
  const k=o.section==='mc'?`mc-${o.i}`:`tf-${o.i}-${claim}`;
  if(session.done[k])return;
  const correct=o.section==='mc'?e.mc[o.i].key===value:e.tf[o.i].claims[claim].key===value;
  session.tries[k]=(session.tries[k]||0)+1;
  playHaoSound(correct?'correct':'wrong');
  if(correct){
    session.done[k]=true;session.answers[k]=value;
    const exp=o.section==='mc'?(e.mc[o.i].explain||''):'';
    session.feedback='Đúng rồi! '+(exp?exp:'Tiếp tục nhé.');
  }else{
    session.feedback='Chưa đúng. Em chọn lại ở câu này.';
  }
  persist();render();
}

function scoreExam(e){
  const base=e.sectionPoints||{mc:3,tf:2,short:2,essay:3};
  const n={mc:(e.mc||[]).length,tf:(e.tf||[]).reduce((s,q)=>s+(q.claims||[]).length,0),short:(e.short||[]).length,essay:(e.essay||[]).reduce((s,q)=>s+(q.parts||[]).length,0)};
  const selected=Object.keys(base).filter(k=>n[k]>0),totalBase=selected.reduce((s,k)=>s+base[k],0);
  const per={};for(const k of selected)per[k]=10*base[k]/totalBase/n[k];
  let total=0,correct=0,detail=[],pointsBy={mc:0,tf:0,short:0,essay:0};
  function add(section,index,sub,title,got,key,yes,explain){
    const p=per[section]||0;if(yes){total+=p;correct++;pointsBy[section]+=p}
    detail.push({section,index,sub,title,got,key,correct:yes,points:p,explain:explain||''});
  }
  (e.mc||[]).forEach((q,i)=>{const raw=session.answers[`mc-${i}`];add('mc',i,null,q.q,visualMCLabel(raw,i),visualMCLabel(q.key,i),raw===q.key,q.explain||'')});
  (e.tf||[]).forEach((q,i)=>(q.claims||[]).forEach((c,j)=>add('tf',i,j,`${'abcd'[tfVisualOrder(i).indexOf(j)]}) ${cleanClaim(c.t)}`,session.answers[`tf-${i}-${j}`],c.key,session.answers[`tf-${i}-${j}`]===c.key,'')));
  (e.short||[]).forEach((q,i)=>add('short',i,null,q.q,session.answers[`short-${i}`],q.key,numberCorrect(session.answers[`short-${i}`],q.key,q.tol),q.hint||''));
  (e.essay||[]).forEach((q,i)=>(q.parts||[]).forEach((c,j)=>add('essay',i,j,q.title+' – '+c.q,session.answers[`essay-${i}-${j}`],c.key,numberCorrect(session.answers[`essay-${i}-${j}`],c.key,c.tol),q.solution||'')));
  return {score:Math.min(10,Math.max(0,Math.round(total*100)/100)),correct,total:detail.length,detail,pointsBy};
}

function scoreMaster(e){
  const details=[];
  session.order.forEach(o=>{
    if(o.section==='mc'){const q=e.mc[o.i],k=`mc-${o.i}`;details.push({section:'mc',title:q.q,got:visualMCLabel(session.answers[k],o.i),key:visualMCLabel(q.key,o.i),correct:(session.tries[k]||0)===1,explain:q.explain||'Điểm tính theo lần chọn đầu tiên.'})}
    else if(o.section==='short'){const q=e.short[o.i],k=`short-${o.i}`;details.push({section:'short',title:q.q,got:session.answers[k],key:q.key,correct:(session.tries[k]||0)===1,explain:q.hint||''})}
    else if(o.section==='tf'){const q=e.tf[o.i];q.claims.forEach((c,j)=>{const k=`tf-${o.i}-${j}`;details.push({section:'tf',title:`${'abcd'[tfVisualOrder(o.i).indexOf(j)]}) ${cleanClaim(c.t)}`,got:session.answers[k],key:c.key,correct:(session.tries[k]||0)===1,explain:'Điểm tính theo lần chọn đầu tiên.'})})}
  });
  const correct=details.filter(d=>d.correct).length;
  return {score:Math.round(1000*correct/Math.max(1,details.length))/100,correct,total:details.length,detail:details,pointsBy:{mc:0,tf:0,short:0,essay:0}};
}

function finish(reason='submitted'){
  const e=getExam(session?.examId);if(!e||session.stage!=='running')return;
  const result=isMastery(e)?scoreMaster(e):scoreExam(e);
  lastRecord={id:'result-'+Date.now().toString(36),examId:e.id,title:e.title,subject:e.subject,nickname:session.nickname,finishedAt:Date.now(),duration:Math.floor((Date.now()-session.startedAt)/1000),mode:e.mode,reason,...result};
  records.unshift(lastRecord);records=records.slice(0,150);store.set(K.records,records);
  session.stage='finished';persist();go('result');
  playHaoSound('celebrate');
}

function pretty(v){return v===undefined||v===''?'Chưa trả lời':typeof v==='boolean'?(v?'Đúng':'Sai'):esc(String(v))}

function resultView(){
  const r=lastRecord||records[0];if(!r)return go('records');
  const e=getExam(r.examId);
  const labelsSec={mc:'Phần I · ABCD',tf:'Phần II · Đúng/Sai',short:'Phần III · Trả lời ngắn',essay:'Phần IV · Tự luận'};
  const details=(r.detail||[]).filter(d=>(reviewFilter==='all'||(reviewFilter==='right'?d.correct:!d.correct)));
  root.innerHTML=`
  <div class="panel">
    <div class="result-top">
      <div class="eyebrow" style="color:var(--brand)">Hoàn thành bài luyện</div>
      <h1>${esc(r.title)}</h1>
      <div class="score-number">${fmt(r.score)}<span>/10</span></div>
      <p class="muted">${esc(r.nickname)} · ${r.correct}/${r.total} lượt đúng · ${clock(r.duration)}</p>
      <div class="btn-row" style="justify-content:center">
        <button class="btn primary" data-action="subject" data-subject="${esc(r.subject)}">Làm đề khác</button>
        <button class="btn secondary" data-action="records">Xem lịch sử điểm</button>
      </div>
    </div>
  </div>
  ${e&&(e.studyEssays||[]).length?renderStudyEssayList(e.studyEssays, e.id):''}
  <div class="section-head"><div><h2>Phân tích đáp án Trắc nghiệm</h2></div></div>
  <div class="panel">
    <div class="review-tools">
      <button class="btn sm ${reviewFilter==='all'?'primary':''}" data-action="filter" data-filter="all">Tất cả</button>
      <button class="btn sm ${reviewFilter==='right'?'primary':''}" data-action="filter" data-filter="right">Đúng</button>
      <button class="btn sm ${reviewFilter==='wrong'?'primary':''}" data-action="filter" data-filter="wrong">Sai</button>
    </div>
    ${details.map(d=>`<div class="review-item"><div class="btn-row"><span class="pill ${d.correct?'green':'warn'}">${d.correct?'✓ Đúng':'✗ Sai'}</span><span class="pill">${labelsSec[d.section]||d.section}</span></div><p style="margin:10px 0"><b>${sci(d.title)}</b></p><div class="small ${d.correct?'righttxt':'wrongtxt'}">Em chọn: <b>${pretty(d.got)}</b></div><div class="small righttxt">Đáp án: <b>${pretty(d.key)}</b></div>${d.explain?`<p class="muted small" style="margin:8px 0 0">${sci(d.explain)}</p>`:''}</div>`).join('')}
  </div>`;
}

function recordsView(){
  root.innerHTML=`
  <div class="subhero">
    <div><div class="eyebrow" style="color:var(--brand)">TIẾN BỘ MỖI NGÀY</div><h1>Thành tích học tập</h1></div>
    <button class="btn secondary" data-action="home">← Trang chủ</button>
  </div>
  <div class="panel">
    ${records.length?`<div class="tablewrap"><table><thead><tr><th>Hạng</th><th>Biệt danh</th><th>Đề</th><th>Điểm</th><th>Thời gian</th></tr></thead><tbody>${[...records].sort((a,b)=>b.score-a.score).slice(0,25).map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.nickname)}</td><td>${esc(r.title)}</td><td><b>${fmt(r.score)}</b></td><td>${clock(r.duration)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">Chưa có bài hoàn thành.</div>'}
  </div>`;
}

document.body.addEventListener('click',e=>{
  const b=e.target.closest('[data-action]');if(!b)return;
  const a=b.dataset.action, id=b.dataset.id;
  if(a==='home')go('home');
  else if(a==='go-presentations')go('presentations');
  else if(a==='subject'){examModeFilter='all';go('catalog',{subject:b.dataset.subject})}
  else if(a==='filter-exam-mode'){examModeFilter=b.dataset.mode;render()}
  else if(a==='choose-exam'){preparedOrder=null;go('prestart',{examId:id})}
  else if(a==='view-study-essays'){go('study-essays',{examId:id})}
  else if(a==='toggle-study-essay'){
    const k=b.dataset.key;
    studyEssayRevealed[k]=studyEssayRevealed[k]===false?true:false;
    render();
  }
  else if(a==='toggle-all-study-essays'){
    const show=b.dataset.show==='true';
    const ex=getExam(chosenExamId||session?.examId||lastRecord?.examId);
    if(ex&&(ex.studyEssays||[]).length){
      ex.studyEssays.forEach((_,idx)=>{studyEssayRevealed[`${ex.id}-${idx}`]=show;});
      render();
    }
  }
  else if(a==='shuffle-before')shuffleBeforeStart();
  else if(a==='start')start();
  else if(a==='resume')go('exam');
  else if(a==='open-slide')openSlideModal(b.dataset.presId);
  else if(a==='close-modal'){modalHost.innerHTML=''}
  else if(a==='fullscreen-slide'){
    const wrap=document.getElementById('slideFrameWrap');
    if(wrap?.requestFullscreen)wrap.requestFullscreen().catch(()=>{});
  }
  else if(a==='master-choice')answerMaster(b.dataset.choice,null);
  else if(a==='master-tf')answerMaster(b.dataset.value==='true',Number(b.dataset.statement));
  else if(a==='master-short-check'){const val=document.getElementById('masterShortInput')?.value||'';answerMaster(val,null)}
  else if(a==='next-master'){
    const o=session.order[session.position];if(!masterStepDone(o))return;
    if(session.position===session.order.length-1)finish('submitted');
    else{session.position++;session.feedback='';persist();render();window.scrollTo(0,0)}
  }
  else if(a==='exam-choice'){playHaoSound('tap');let o=session.order[session.position];session.answers[`mc-${o.i}`]=b.dataset.choice;persist();render()}
  else if(a==='exam-tf'){playHaoSound('tap');let o=session.order[session.position];session.answers[`tf-${o.i}-${b.dataset.claim}`]=b.dataset.value==='true';persist();render()}
  else if(a==='exam-next'||a==='exam-prev'){session.position=Math.max(0,Math.min(session.order.length-1,session.position+(a==='exam-next'?1:-1)));persist();render();window.scrollTo(0,0)}
  else if(a==='go-section'){let i=session.order.findIndex(o=>o.section===b.dataset.section);if(i>=0){session.position=i;persist();render()}}
  else if(a==='jump'){session.position=Number(b.dataset.index);persist();render()}
  else if(a==='finish')finish('submitted');
  else if(a==='filter'){reviewFilter=b.dataset.filter;render()}
  else if(a==='records')go('records');
});

document.body.addEventListener('input',e=>{
  if(e.target.matches('[data-input]')&&session?.stage==='running'){
    const k=e.target.dataset.input==='essay'?`essay-${e.target.dataset.index}-${e.target.dataset.part}`:`short-${e.target.dataset.index}`;
    session.answers[k]=e.target.value;persist();
  }
});

document.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.go)));
document.getElementById('logoLink').addEventListener('click',e=>{e.preventDefault();go('home')});

const soundBtn=document.getElementById('soundBtn');
refreshSoundButton();
soundBtn?.addEventListener('click',()=>{
  soundEnabled=!soundEnabled;store.set(SOUND_KEY,soundEnabled);refreshSoundButton();
  if(soundEnabled)playHaoSound('correct');
});
document.getElementById('soundVolume')?.addEventListener('input',e=>{
  soundVolume=Number(e.target.value);store.set(SOUND_VOLUME_KEY,soundVolume);
});
document.getElementById('soundTest')?.addEventListener('click',()=>{
  if(!soundEnabled){soundEnabled=true;store.set(SOUND_KEY,true);refreshSoundButton();}
  playHaoSound('correct');
});
const themeBtn=document.getElementById('themeBtn');
function applyTheme(mode){document.documentElement.dataset.theme=mode;themeBtn.textContent=mode==='dark'?'☀️ Sáng':'🌙 Tối';store.set(K.theme,mode)}
applyTheme(store.get(K.theme,'light'));
themeBtn.addEventListener('click',()=>applyTheme(document.documentElement.dataset.theme==='dark'?'light':'dark'));

setInterval(()=>{
  if(view!=='exam'||session?.stage!=='running')return;
  const el=document.getElementById('timeDisplay');if(!el)return;
  const remain=session.deadline?Math.ceil((session.deadline-Date.now())/1000):Math.floor((Date.now()-session.startedAt)/1000);
  if(session.deadline&&remain<=0){finish('timeout');return}
  el.textContent=clock(remain);
  el.classList.toggle('urgent',!!session.deadline&&remain<120);
},1000);

render();
if(location.protocol!=='file:'){
  fetch('data/exams.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(x=>{
    if(x&&Array.isArray(x.exams)&&x.exams.length){
      const existingIds=new Set(x.exams.map(e=>e.id));
      const merged=[...x.exams,...(catalog.exams||[]).filter(e=>!existingIds.has(e.id))];
      catalog={...x,exams:merged};
      render();
    }
  }).catch(()=>{});
  fetch('data/presentations.json',{cache:'no-store'}).then(r=>r.ok?r.json():null).then(x=>{
    if(x&&Array.isArray(x.presentations)&&x.presentations.length){presCatalog=x;render();}
  }).catch(()=>{});
}
})();
